a funzione di domanda lega la quantit\xE0 che i consumatori **desiderano acquistare** ai fattori da cui dipende: prezzo del bene (Pn), prezzo degli altri beni (p1\u2026pn-1), reddito (Y) e altri elementi (E: ambiente, preferenze).","Desiderare non \xE8 comprare: con l\u2019anello da 100.000 \u20AC tutti esprimono una disponibilit\xE0 a pagare, ma nessuno lo compra davvero. Quanti anelli si vendono dipende anche dal prezzo in gioielleria, cio\xE8 dall\u2019offerta.","**Ceteris paribus**: si fa variare un fattore alla volta tenendo fermi tutti gli altri, perch\xE9 non si pu\xF2 misurare l\u2019effetto di tutto insieme."],tip:"Quando una domanda d\u2019esame dice \u201Ca parit\xE0 di altre condizioni\u201D, ti sta chiedendo di ragionare ceteris paribus."},{title:"La curva di domanda",points:["Rappresenta la relazione tra quantit\xE0 domandata e prezzo. Pu\xF2 essere lineare o curva, ma \xE8 **sempre discendente**: se il prezzo sale, la quantit\xE0 domandata di solito scende.","Eccezione apparente: chi compra un bene per **status** (l\u2019anello da 100.000 \u20AC) pu\xF2 volerlo proprio perch\xE9 costa tanto. Resta un consumatore razionale: soddisfa un suo bisogno.","**Inversione degli assi**: il prezzo (variabile indipendente) sta sull\u2019asse Y e la quantit\xE0 sull\u2019asse X. \xC8 una convenzione degli economisti."],example:"Biglietti per la finale: la curva non \xE8 lineare ma curvilinea, comunque discendente."}],exercises:[{id:"u1-1-1",type:"mc",topic:"Funzione di domanda",q:"La funzione di domanda mette in relazione i suoi fattori determinanti con\u2026",options:["la quantit\xE0 che i consumatori desiderano acquistare","la quantit\xE0 che le imprese hanno effettivamente venduto in un dato periodo","il profitto che le imprese ottengono vendendo a quel prezzo","la quantit\xE0 che le imprese sono disposte a produrre a ogni prezzo"],answer:0,explain:"Conta la quantit\xE0 che i consumatori desiderano acquistare. Quanto si compra davvero dipende anche dall\u2019offerta (esempio dell\u2019anello di diamanti)."},{id:"u1-1-2",type:"tf",topic:"Funzione di domanda",q:"Nell\u2019esempio dell\u2019anello di diamanti, la curva \u201Ca gradini\u201D misura quanti anelli sono stati effettivamente comprati in aula.",answer:!1,explain:"Nessuno l\u2019ha comprato: la curva misura le disponibilit\xE0 a pagare, cio\xE8 quanto si desidera acquistare a ogni prezzo."},{id:"u1-1-3",type:"mc",topic:"Ceteris paribus",q:"Cosa significa ragionare \u201Cceteris paribus\u201D?",options:["Far variare un fattore alla volta, tenendo fermi tutti gli altri","Considerare insieme tutti i fattori, perch\xE9 nella realt\xE0 cambiano contemporaneamente","Ignorare il prezzo del bene e guardare solo reddito e preferenze","Supporre che il mercato sia sempre in equilibrio di lungo periodo"],answer:0,explain:"Non si pu\xF2 verificare insieme l\u2019effetto di tutte le variabili, quindi se ne cambia una sola alla volta."},{id:"u1-1-4",type:"fill",topic:"Funzione di domanda",text:"La quantit\xE0 domandata dipende dal ___ del bene, dal prezzo degli ___ beni, dal ___ del consumatore (Y) e da altri elementi (E).",answers:["prezzo","altri","reddito"],extra:["costo","profitto","salario"],explain:"Sono i quattro gruppi di fattori della funzione di domanda: Pn, p1\u2026pn-1, Y ed E."},{id:"u1-1-5",type:"mc",topic:"Curva di domanda",q:"Perch\xE9 la curva di domanda \xE8 di norma discendente?",options:["Perch\xE9 all\u2019aumentare del prezzo diminuisce la quantit\xE0 domandata","Perch\xE9 all\u2019aumentare del prezzo i consumatori ne vogliono di pi\xF9 per status","Perch\xE9 i costi fissi delle imprese salgono quando sale il prezzo","Perch\xE9 il reddito dei consumatori diminuisce sempre nel tempo"],answer:0,explain:"Pi\xF9 il bene costa, meno consumatori sono disposti a comprarlo: relazione inversa tra prezzo e quantit\xE0."},{id:"u1-1-6",type:"tf",topic:"Inversione degli assi",q:"Nel grafico della domanda \xE8 il prezzo a determinare la quantit\xE0, anche se il prezzo \xE8 disegnato sull\u2019asse Y.",answer:!0,explain:"\xC8 il fenomeno dell\u2019inversione degli assi: convenzione adottata dagli economisti perch\xE9 rende pi\xF9 evidente il rapporto."},{id:"u1-1-7",type:"mc",topic:"Consumatore razionale",q:"Una persona compra l\u2019anello solo perch\xE9 costa 100.000 \u20AC, per mostrarlo. Secondo il corso \xE8\u2026",options:["un consumatore razionale: soddisfa un bisogno di status","un consumatore irrazionale","un caso che rende la domanda crescente in tutti i mercati","un errore di misura"],answer:0,explain:"Un bene \xE8 utile se soddisfa un bisogno, anche di status. Sono eccezioni rare: la domanda resta discendente."},{id:"u1-1-8",type:"tf",topic:"Consumatore razionale",q:"Chi compra una pelliccia o una Tesla per far vedere le proprie possibilit\xE0 economiche non \xE8 un consumatore razionale.",answer:!1,explain:"\xC8 razionale: il consumatore \xE8 razionale in funzione dei suoi bisogni e tutti i beni che soddisfano un bisogno sono utili."},{id:"u1-1-9",type:"match",topic:"Concetti base",q:"Abbina ogni concetto alla sua definizione",pairs:[["Ceteris paribus","Un fattore alla volta, gli altri fermi"],["Consumatore razionale","Non agisce mai contro il proprio interesse"],["Disponibilit\xE0 a pagare","Prezzo massimo che si accetta per un bene"],["Inversione degli assi","Il prezzo sta sull\u2019asse Y"]],explain:"Sono i quattro concetti di partenza della lezione 1."},{id:"u1-1-10",type:"mc",topic:"Curva di domanda",q:"La domanda di biglietti per la finale \xE8 curvilinea. Cosa resta vero?",options:["\xC8 comunque discendente","\xC8 verticale, perch\xE9 i tifosi vogliono il biglietto a ogni costo","Diventa crescente, perch\xE9 \xE8 un bene di status","Non \xE8 pi\xF9 una curva di domanda in senso economico"],answer:0,explain:"Le curve di domanda possono non essere lineari, ma restano discendenti."}]},{id:"u1l2",title:"Prezzi, reddito e gusti",icon:"\u{1F45F}",theory:[{title:"Il prezzo degli altri beni",points:["**Indipendenti**: nessun legame (scarpe e marmellata di fragole). Se cambia il prezzo dell\u2019uno, all\u2019altro non succede nulla.","**Complementari**: consumati insieme (scarpe e lacci). Se i lacci costano di pi\xF9, la domanda di scarpe diminuisce.","**Sostituti**: consumati in alternativa (Coca-Cola e Pepsi, scarpe e pantofole). Se le pantofole costano meno, compro meno scarpe."]},{title:"Reddito e curva di Engel",points:["La curva di Engel lega reddito e quantit\xE0 domandata a **prezzo fisso** (carne in scatola a 6 \u20AC).","0\u2013Y1: reddito insufficiente, non compro. Y1\u2013Y2: **bene normale**, pi\xF9 reddito = pi\xF9 quantit\xE0. Y2\u2013Y3: **saturazione**, la quantit\xE0 resta ferma. Oltre Y3: **bene inferiore**, vado al ristorante e compro meno scatolette.","Tutti i beni hanno questo andamento: anche una Ferrari pu\xF2 diventare un bene inferiore.","Conta anche **come \xE8 distribuito** il reddito: due paesi con lo stesso PIL possono avere domande di Tesla molto diverse."]},{title:"L\u2019elemento residuale E",points:["Variabili ambientali: a 8 \u20AC la domanda di ombrelli c\u2019\xE8 a Londra, non al Cairo.","Preferenze e mode: la domanda di cibi salutistici oggi \xE8 ampia, anni fa no."]}],exercises:[{id:"u1-2-1",type:"mc",topic:"Beni complementari",q:"Aumenta il prezzo dei lacci delle scarpe. Cosa succede alla domanda di scarpe?",options:["Diminuisce: sono beni complementari","Aumenta, perch\xE9 lacci e scarpe sono beni sostituti","Non cambia, perch\xE9 lacci e scarpe sono beni indipendenti","Aumenta, perch\xE9 lacci e scarpe sono beni complementari"],answer:0,explain:"Lacci e scarpe si consumano insieme: se uno costa di pi\xF9, si compra meno anche dell\u2019altro."},{id:"u1-2-2",type:"mc",topic:"Beni sostituti",q:"Diminuisce il prezzo delle pantofole. Cosa succede alla domanda di scarpe?",options:["Diminuisce, perch\xE9 sono beni sostituti","Aumenta, perch\xE9 scarpe e pantofole sono beni complementari","Non cambia, perch\xE9 sono beni del tutto indipendenti","Aumenta, perch\xE9 scarpe e pantofole sono beni sostituti"],answer:0,explain:"Le pantofole convenienti prendono il posto delle scarpe: beni sostituti, consumati in alternativa."},{id:"u1-2-3",type:"match",topic:"Relazioni tra beni",q:"Abbina ogni coppia di beni al tipo di relazione",pairs:[["Coca-Cola e Pepsi","Sostituti"],["Racchette e palline da tennis","Complementari"],["Scarpe e marmellata di fragole","Indipendenti"],["Auto a benzina e carburante","Complementari"]],explain:"Sostituti = in alternativa; complementari = insieme; indipendenti = nessun legame."},{id:"u1-2-4",type:"hotspot",topic:"Curva di Engel",scene:"engel",q:"Tocca il tratto della curva di Engel in cui la carne in scatola \xE8 un bene inferiore.",answer:"inf",explain:"Oltre Y3 la quantit\xE0 domandata diminuisce all\u2019aumentare del reddito: si va al ristorante. \xC8 il tratto del bene inferiore."},{id:"u1-2-5",type:"hotspot",topic:"Curva di Engel",scene:"engel",q:"Tocca il tratto di saturazione: pi\xF9 reddito, ma la quantit\xE0 non cambia.",answer:"sat",explain:"Tra Y2 e Y3 non compro pi\xF9 di 4 scatolette anche se guadagno di pi\xF9: effetto di saturazione."},{id:"u1-2-6",type:"mc",topic:"Curva di Engel",q:"Cosa rappresenta la curva di Engel?",options:["La relazione tra reddito e quantit\xE0 domandata, a prezzo costante","La relazione tra prezzo e quantit\xE0 offerta, a reddito costante","La relazione tra il costo di produzione e la quantit\xE0 prodotta","La relazione tra il prezzo di un bene e quello di un altro bene"],answer:0,explain:"Il prezzo \xE8 fisso (ceteris paribus) e si guarda come cambia la quantit\xE0 al variare del reddito."},{id:"u1-2-7",type:"tf",topic:"Curva di Engel",q:"Un bene di lusso come una Ferrari non pu\xF2 mai diventare un bene inferiore.",answer:!1,explain:"Secondo il corso tutti i beni seguono la curva di Engel: oltre un certo reddito anche una Ferrari pu\xF2 diventare inferiore."},{id:"u1-2-8",type:"mc",topic:"Distribuzione del reddito",q:"Due paesi hanno lo stesso PIL. Nel primo tutte le famiglie guadagnano circa 25.000 \u20AC, nel secondo ci sono pochi ricchissimi e molti poveri. Dove la domanda di Tesla \xE8 pi\xF9 presente?",options:["Nel secondo paese","Nel primo paese","\xC8 uguale, perch\xE9 il PIL \xE8 uguale","In nessuno dei due"],answer:0,explain:"Conta come il reddito \xE8 distribuito: la Tesla \xE8 costosa, quindi la comprano i pochi molto ricchi del secondo paese."},{id:"u1-2-9",type:"mc",topic:"Elemento residuale",q:"A parit\xE0 di prezzo gli ombrelli si vendono a Londra ma non al Cairo. Quale fattore della domanda spiega la differenza?",options:["L\u2019elemento residuale E (variabili ambientali)","Il reddito Y, perch\xE9 al Cairo si guadagna di meno","Il prezzo degli altri beni, come gli impermeabili","Il prezzo dell\u2019ombrello, che al Cairo \xE8 pi\xF9 alto"],answer:0,explain:"Il clima \xE8 una variabile ambientale, che rientra nell\u2019elemento residuale E insieme alle preferenze."},{id:"u1-2-10",type:"fill",topic:"Beni normali e inferiori",text:"Un bene \xE8 ___ se all\u2019aumentare del reddito aumenta la quantit\xE0 domandata; \xE8 ___ se la quantit\xE0 diminuisce.",answers:["normale","inferiore"],extra:["sostituto","complementare","rigido"],explain:"Bene normale nel tratto Y1\u2013Y2 della curva di Engel, bene inferiore oltre Y3."},{id:"u1-2-11",type:"order",topic:"Curva di Engel",q:"Metti in ordine i tratti della curva di Engel, dal reddito pi\xF9 basso al pi\xF9 alto",items:["Reddito insufficiente: non compro","Bene normale: compro sempre di pi\xF9","Saturazione: la quantit\xE0 resta ferma","Bene inferiore: compro di meno"],explain:"0\u2013Y1, Y1\u2013Y2, Y2\u2013Y3, oltre Y3."}]},{id:"u1l3",title:"L\u2019offerta",icon:"\u{1F3ED}",theory:[{title:"Funzione e curva di offerta",points:["La funzione di offerta indica la quantit\xE0 che le imprese **sono disposte a offrire** in rapporto al prezzo del bene (Pn), al prezzo dei fattori produttivi (F1\u2026Fm) e ad altri elementi (E).","Per i neoclassici l\u2019impresa \xE8 una **scatola chiusa** (black box) con un solo obiettivo: massimizzare il profitto.","La curva di offerta \xE8 crescente: pi\xF9 il prezzo sale, pi\xF9 si vuole vendere. Raramente parte dall\u2019origine a causa dei **costi fissi**; ci parte quando sono irrilevanti (imprese di pulizie)."]},{title:"Le altre determinanti dell\u2019offerta",points:["**Prezzo dei fattori produttivi**: se aumenta, offro di meno.","**Obiettivi dell\u2019impresa**: un\u2019impresa avversa al rischio offre meno di una propensa al rischio.","**Tecnologia**: una tecnologia pi\xF9 efficiente fa offrire di pi\xF9. Si adotta una tecnologia peggiore solo se lo impone lo Stato.","**Prezzo dei beni correlati**: auto e autocarri. Se sale il prezzo degli autocarri, la Rubini sposta operai l\xEC e offre meno auto.","**Aspettative**: panettoni, auto euro 7.","**Regolamentazione pubblica**: l\u2019amianto vietato per legge.","**Fattori particolari**: stagione, meteo locale (polizze anti-grandine in pianura padana)."]}],exercises:[{id:"u1-3-1",type:"mc",topic:"Funzione di offerta",q:"La funzione di offerta indica\u2026",options:["la quantit\xE0 che le imprese sono disposte a offrire a ogni prezzo","la quantit\xE0 che le imprese hanno effettivamente venduto a quel prezzo","la quantit\xE0 che i consumatori desiderano acquistare a ogni prezzo","il prezzo minimo che garantisce il massimo profitto all\u2019impresa"],answer:0,explain:"Come per la domanda, non si parla di quantit\xE0 vendute ma di quantit\xE0 che le imprese sono disposte a vendere."},{id:"u1-3-2",type:"mc",topic:"Curva di offerta",q:"Perch\xE9 la curva di offerta raramente parte dall\u2019origine degli assi?",options:["Per via dei costi fissi","Perch\xE9 la domanda \xE8 sempre positiva anche a prezzo zero","Perch\xE9 il prezzo di mercato non pu\xF2 mai scendere fino a zero","Perch\xE9 le imprese sono price-taker e non scelgono il prezzo"],answer:0,explain:"Con costi fissi rilevanti serve un prezzo minimo per iniziare a produrre. Le imprese di pulizie, con costi fissi irrilevanti, partono dall\u2019origine."},{id:"u1-3-3",type:"mc",topic:"Curva di offerta",q:"Quale impresa ha pi\xF9 probabilmente una curva di offerta che parte dall\u2019origine?",options:["Un\u2019impresa di pulizie","Un\u2019acciaieria","Una raffineria","Un produttore di aerei"],answer:0,explain:"Le imprese di pulizie hanno costi fissi irrilevanti."},{id:"u1-3-4",type:"match",topic:"Determinanti dell\u2019offerta",q:"Abbina ogni determinante dell\u2019offerta all\u2019esempio degli appunti",pairs:[["Beni correlati","Auto e autocarri della Rubini"],["Aspettative","Produrre gi\xE0 le auto euro 7"],["Regolamentazione pubblica","Divieto dell\u2019amianto"],["Fattori particolari","Polizza grandine in pianura padana"],["Obiettivi dell\u2019impresa","Imprenditore avverso al rischio"]],explain:"Sono gli esempi del docente per ciascuna determinante."},{id:"u1-3-5",type:"mc",topic:"Beni correlati",q:"La Rubini produce auto. Il prezzo degli autocarri sale e lei sposta 29 operai su 100 a produrli. Cosa succede alla quantit\xE0 offerta di auto nel breve periodo?",options:["Diminuisce","Aumenta","Non cambia","Raddoppia"],answer:0,explain:"Se sale il prezzo di un bene correlato, la quantit\xE0 offerta dell\u2019altro tende a scendere perch\xE9 le risorse vengono spostate."},{id:"u1-3-6",type:"shift",topic:"Spostamenti dell\u2019offerta",q:"Aumenta il prezzo dei fattori produttivi. Sposta la curva giusta.",moves:{O:"left"},explain:"Fattori pi\xF9 cari: a ogni prezzo si offre di meno, quindi l\u2019offerta si sposta a sinistra."},{id:"u1-3-7",type:"shift",topic:"Spostamenti dell\u2019offerta",q:"Arriva una nuova tecnologia pi\xF9 efficiente. Sposta la curva giusta.",moves:{O:"right"},explain:"Una tecnologia migliorativa fa offrire di pi\xF9 a ogni prezzo: offerta verso destra."},{id:"u1-3-8",type:"tf",topic:"Tecnologia",q:"Un\u2019impresa adotta una tecnologia peggiorativa solo quando le \xE8 imposta dallo Stato, ad esempio per sostenibilit\xE0.",answer:!0,explain:"\xC8 l\u2019unico caso citato negli appunti: tecnologia pi\xF9 costosa ma pi\xF9 sostenibile, imposta per legge."},{id:"u1-3-9",type:"tf",topic:"Teoria neoclassica",q:"Nella teoria neoclassica l\u2019impresa \xE8 considerata una \u201Cblack box\u201D che massimizza il profitto.",answer:!0,explain:"Per ora non si guarda dentro l\u2019impresa: interessa solo capire il meccanismo dei prezzi."},{id:"u1-3-10",type:"mc",topic:"Determinanti dell\u2019offerta",q:"Un\u2019assicurazione in pianura padana non vende mai la copertura contro la grandine. Quale determinante dell\u2019offerta \xE8 in gioco?",options:["Fattori particolari (meteo locale)","Tecnologia (calcolo del rischio)","Prezzo dei fattori produttivi","Aspettative sul futuro dell\u2019impresa"],answer:0,explain:"Il meteo locale \xE8 un fattore particolare: l\xEC grandina almeno una volta l\u2019anno, quindi non conviene."}]},{id:"u1l4",title:"L\u2019equilibrio di mercato",icon:"\u2696\uFE0F",theory:[{title:"Prezzo di equilibrio",points:["Il **mercato** \xE8 il luogo, non necessariamente fisico, in cui domanda e offerta si incontrano: l\u2019insieme di regole entro cui avvengono gli scambi.","Il **prezzo di equilibrio** \xE8 quello a cui la quantit\xE0 domandata \xE8 uguale alla quantit\xE0 offerta (quantit\xE0 di equilibrio).","La domanda di mercato si ottiene sommando le quantit\xE0 dei singoli: a 2 \u20AC Caterina vuole 4 gelati e Nicola 3, quindi 7.","Per i neoclassici l\u2019equilibrio \xE8 **stabile**: se il prezzo si allontana, le forze di mercato lo riportano l\xEC."]},{title:"Lungo la curva o della curva?",points:["Cambia **solo il prezzo** del bene: ci si muove **lungo** la curva.","Cambia **qualsiasi altra cosa** (reddito, prezzi di altri beni, preferenze, aspettative, costi\u2026): si **sposta tutta** la curva.","Libri, bene normale: se il reddito sale la domanda si sposta verso l\u2019esterno. In reddito insufficiente o in saturazione non si sposta nulla."],tip:"Non imparare a memoria: guarda il grafico e ragiona."}],exercises:[{id:"u1-4-1",type:"mc",topic:"Equilibrio",q:"Il prezzo di equilibrio \xE8 il prezzo al quale\u2026",options:["la quantit\xE0 domandata \xE8 uguale alla quantit\xE0 offerta","il profitto delle imprese raggiunge il suo massimo","il surplus del consumatore diventa pari a zero","tutti i consumatori interessati riescono a comprare il bene"],answer:0,explain:"Definizione degli appunti: quantit\xE0 domandata = quantit\xE0 offerta."},{id:"u1-4-2",type:"hotspot",topic:"Equilibrio",scene:"domanda-offerta",q:"Tocca il punto di equilibrio di mercato.",answer:"E",explain:"L\u2019equilibrio \xE8 l\u2019incrocio tra la curva di domanda e la curva di offerta."},{id:"u1-4-3",type:"tf",topic:"Mercato",q:"Il mercato \xE8 sempre un luogo fisico, come una piazza o un negozio.",answer:!1,explain:"\xC8 un luogo non necessariamente fisico: l\u2019insieme delle regole entro cui avvengono gli scambi."},{id:"u1-4-4",type:"num",topic:"Domanda di mercato",q:"A un prezzo di 2 \u20AC Caterina vuole 4 gelati e Nicola 3. Qual \xE8 la quantit\xE0 domandata dal mercato a quel prezzo?",answer:7,tol:0,unit:"gelati",explain:"La domanda di mercato \xE8 la somma orizzontale delle domande individuali: 4 + 3 = 7."},{id:"u1-4-5",type:"mc",topic:"Lungo la curva",q:"Il prezzo dei libri scende da 8 \u20AC a 7 \u20AC e se ne vendono 14 invece di 10. Sul grafico\u2026",options:["ci si muove lungo la curva di domanda","la curva di domanda si sposta a destra","la curva di offerta si sposta","la curva di domanda si sposta a sinistra"],answer:0,explain:"\xC8 cambiato solo il prezzo del bene: movimento lungo la curva."},{id:"u1-4-6",type:"shift",topic:"Spostamenti della domanda",q:"Il reddito dei consumatori aumenta e i libri sono un bene normale. Sposta la curva giusta.",moves:{D:"right"},explain:"A ogni prezzo si vogliono pi\xF9 libri: la domanda si sposta verso l\u2019esterno (destra)."},{id:"u1-4-7",type:"shift",topic:"Spostamenti della domanda",q:"Il reddito aumenta ma i consumatori sono nella fascia di saturazione per quel bene. Cosa fai con le curve?",moves:{},explain:"In saturazione (o con reddito insufficiente) la quantit\xE0 domandata non cambia: nessuna curva si sposta."},{id:"u1-4-8",type:"tf",topic:"Stabilit\xE0",q:"Secondo i neoclassici, se il prezzo sale sopra l\u2019equilibrio la quantit\xE0 domandata scende e il mercato tende a tornare all\u2019equilibrio.",answer:!0,explain:"Per questo l\u2019equilibrio \xE8 considerato stabile nel tempo, se non succede niente di particolare."},{id:"u1-4-9",type:"mc",topic:"Offerta di mercato",q:"Ivo ha un negozio di gelati, Gianni un furgoncino. Ivo ha pi\xF9 costi. Cosa ci si aspetta?",options:["A ogni prezzo Ivo offre meno gelati di Gianni","A ogni prezzo Ivo offre pi\xF9 gelati, perch\xE9 ha un negozio fisso","Offrono la stessa quantit\xE0, perch\xE9 il prezzo \xE8 uguale","Ivo esce subito dal mercato perch\xE9 non copre i costi"],answer:0,explain:"Con costi pi\xF9 alti si \xE8 disposti a offrire meno a parit\xE0 di prezzo."},{id:"u1-4-10",type:"mc",topic:"Spostamenti delle curve",q:"Quale di questi eventi sposta la curva di domanda di un bene invece di far muovere lungo la curva?",options:["Cambiano le preferenze dei consumatori","Il prezzo del bene scende","Il prezzo del bene sale","Nessuno: si muove sempre lungo la curva"],answer:0,explain:"Tutto ci\xF2 che non \xE8 il prezzo del bene stesso sposta l\u2019intera curva."}]},{id:"u1l5",title:"Le 4 leggi e gli shock",icon:"\u{1F30B}",theory:[{title:"Le 4 leggi della domanda e dell\u2019offerta",points:["1. **Aumento della domanda**: prezzo \u2191 e quantit\xE0 \u2191.","2. **Diminuzione della domanda**: prezzo \u2193 e quantit\xE0 \u2193.","3. **Aumento dell\u2019offerta**: prezzo \u2193 e quantit\xE0 \u2191.","4. **Diminuzione dell\u2019offerta**: prezzo \u2191 e quantit\xE0 \u2193."],tip:"Domanda: P e Q si muovono nella stessa direzione. Offerta: P e Q si muovono in direzioni opposte."},{title:"Shock simultanei",points:["**Terremoto in Giappone (1995), mercato del sak\xE8**: le fabbriche distrutte riducono l\u2019offerta (O1 \u2192 O2); i lutti e le visite alle famiglie aumentano la domanda (D1 \u2192 D2). Il prezzo sale di sicuro.","La quantit\xE0 dipende da quale forza prevale: se l\u2019offerta si contrae molto (O3) la quantit\xE0 diminuisce.","**COVID-19**: raro caso di shock contemporaneo di domanda (si sta in casa) e di offerta (imprese chiuse, mancano materie prime).","Quando le curve si spostano insieme non si pu\xF2 prevedere l\u2019esito: si misura dopo che il mercato si \xE8 assestato. Per questo nessuno aveva previsto la crisi del 2007."]}],exercises:[{id:"u1-5-1",type:"mc",topic:"Le 4 leggi",q:"Un aumento della domanda di un bene fa\u2026",options:["aumentare sia il prezzo sia la quantit\xE0 di equilibrio","aumentare il prezzo di equilibrio e diminuire la quantit\xE0 scambiata","diminuire il prezzo di equilibrio e aumentare la quantit\xE0 scambiata","diminuire sia il prezzo sia la quantit\xE0 di equilibrio"],answer:0,explain:"Prima legge: la domanda si sposta a destra e il nuovo equilibrio ha P e Q pi\xF9 alti."},{id:"u1-5-2",type:"mc",topic:"Le 4 leggi",q:"Una diminuzione dell\u2019offerta fa\u2026",options:["aumentare il prezzo e diminuire la quantit\xE0","diminuire prezzo e quantit\xE0","aumentare prezzo e quantit\xE0","diminuire il prezzo e aumentare la quantit\xE0"],answer:0,explain:"Quarta legge: offerta a sinistra, prezzo pi\xF9 alto e quantit\xE0 pi\xF9 bassa."},{id:"u1-5-3",type:"match",topic:"Le 4 leggi",q:"Abbina ogni variazione al suo effetto sull\u2019equilibrio",pairs:[["Domanda \u2191","P \u2191 e Q \u2191"],["Domanda \u2193","P \u2193 e Q \u2193"],["Offerta \u2191","P \u2193 e Q \u2191"],["Offerta \u2193","P \u2191 e Q \u2193"]],explain:"Con la domanda P e Q vanno insieme; con l\u2019offerta vanno in direzioni opposte."},{id:"u1-5-4",type:"shift",topic:"Shock simultanei",q:"Terremoto in Giappone: fabbriche di sak\xE8 distrutte e pi\xF9 visite alle famiglie in lutto. Sposta entrambe le curve.",moves:{O:"left",D:"right"},explain:"L\u2019offerta si contrae (sinistra) e la domanda aumenta (destra)."},{id:"u1-5-5",type:"mc",topic:"Shock simultanei",q:"Nel caso del sak\xE8 (offerta \u2193, domanda \u2191), cosa si pu\xF2 dire con certezza?",options:["Il prezzo sale; la quantit\xE0 dipende da quale spostamento prevale","Prezzo e quantit\xE0 aumentano, perch\xE9 prevale la domanda","La quantit\xE0 diminuisce sempre e il prezzo resta invariato","Il prezzo resta uguale perch\xE9 i due effetti si compensano"],answer:0,explain:"Entrambi gli spostamenti spingono il prezzo in su. Sulla quantit\xE0 le forze sono opposte: dipende da quale prevale (con O3 la quantit\xE0 cala)."},{id:"u1-5-6",type:"tf",topic:"Shock simultanei",q:"La pandemia di COVID-19 \xE8 stata uno dei pochi casi di shock contemporaneo di domanda e di offerta.",answer:!0,explain:"Domanda azzerata perch\xE9 si stava in casa, offerta ridotta per chiusure e carenza di materie prime."},{id:"u1-5-7",type:"fill",topic:"Le 4 leggi",text:"Un aumento dell\u2019offerta fa ___ il prezzo di equilibrio e ___ la quantit\xE0 scambiata.",answers:["diminuire","aumentare"],extra:["raddoppiare","azzerare"],explain:"Terza legge: offerta a destra, prezzo pi\xF9 basso, quantit\xE0 pi\xF9 alta."},{id:"u1-5-8",type:"shift",topic:"Spostamenti della domanda",q:"Diventano di moda i cibi salutistici. Sposta la curva del mercato dei cibi salutistici.",moves:{D:"right"},explain:"Cambiano le preferenze (elemento E): a ogni prezzo si domanda di pi\xF9."},{id:"u1-5-9",type:"shift",topic:"Beni complementari",q:"Aumenta il prezzo dei lacci. Sposta la curva del mercato delle scarpe.",moves:{D:"left"},explain:"Beni complementari: la domanda di scarpe diminuisce, quindi si sposta a sinistra."},{id:"u1-5-10",type:"mc",topic:"Previsioni",q:"Perch\xE9 quasi nessun economista aveva previsto la crisi del 2007?",options:["Perch\xE9 forze diverse spingevano in direzioni opposte","Perch\xE9 il modello neoclassico non era ancora stato formulato","Perch\xE9 in quegli anni i prezzi erano fissati per legge","Perch\xE9 la domanda di tutti i beni era perfettamente rigida"],answer:0,explain:"Quando pi\xF9 forze agiscono insieme non si pu\xF2 prevedere l\u2019esito: si misura solo dopo che il mercato si \xE8 assestato."},{id:"u1-5-11",type:"order",topic:"Metodo",q:"Metti in ordine i passaggi per analizzare uno shock",items:["Capire quale curva viene colpita","Stabilire la direzione dello spostamento","Trovare il nuovo punto di equilibrio","Confrontare prezzo e quantit\xE0 con quelli iniziali"],explain:"\xC8 il ragionamento \u201Cguarda il grafico e ragiona\u201D chiesto dal docente."}]}],open:[{id:"u1-o1",q:"Che differenza c\u2019\xE8 tra quantit\xE0 che i consumatori acquistano e quantit\xE0 che desiderano acquistare? Usa l\u2019esempio dell\u2019anello.",answer:"La funzione di domanda misura quanto i consumatori desiderano acquistare a ogni prezzo, cio\xE8 la loro disponibilit\xE0 a pagare. Nell\u2019esempio dell\u2019anello di diamanti da otto carati si costruisce una funzione a gradini: a 100.000 \u20AC lo comprerebbe una persona, a 50.000 \u20AC qualcuno in pi\xF9 e cos\xEC via. Nessuno per\xF2 lo compra davvero: la quantit\xE0 effettivamente acquistata dipende anche dall\u2019offerta, cio\xE8 dal prezzo in gioielleria. Domanda e offerta si devono confrontare.",keywords:["desiderano","disponibilit\xE0 a pagare","gradini","offerta","prezzo"]},{id:"u1-o2",q:"Cosa significa ceteris paribus e perch\xE9 lo usiamo?",answer:"Significa \u201Ca parit\xE0 di altre condizioni\u201D. Non \xE8 possibile verificare contemporaneamente l\u2019effetto sulla quantit\xE0 di tutte le variabili, quindi se ne fa variare una alla volta tenendo ferme le altre, per isolarne l\u2019effetto.",keywords:["parit\xE0","una alla volta","altre condizioni","effetto"]},{id:"u1-o3",q:"Descrivi la curva di Engel nei suoi quattro tratti.",answer:"La curva di Engel mostra la relazione tra reddito e quantit\xE0 domandata a prezzo fisso (carne in scatola a 6 \u20AC). Tra 0 e Y1 il reddito \xE8 insufficiente e non compro. Tra Y1 e Y2 pi\xF9 reddito significa pi\xF9 quantit\xE0: \xE8 un bene normale. Tra Y2 e Y3 c\u2019\xE8 saturazione: la quantit\xE0 resta ferma. Oltre Y3 la quantit\xE0 diminuisce perch\xE9 vado al ristorante: \xE8 un bene inferiore. Tutti i beni hanno questo andamento, anche una Ferrari.",keywords:["reddito","prezzo fisso","insufficiente","normale","saturazione","inferiore"]},{id:"u1-o4",q:"Spiega la differenza tra beni complementari, sostituti e indipendenti con un esempio per ciascuno.",answer:"Complementari: consumati insieme, come scarpe e lacci; se aumenta il prezzo dei lacci la domanda di scarpe diminuisce. Sostituti: consumati in alternativa, come Coca-Cola e Pepsi o scarpe e pantofole; se le pantofole costano meno compro meno scarpe. Indipendenti: nessun legame, come scarpe e marmellata di fragole; se cambia il prezzo dell\u2019una all\u2019altra non succede nulla.",keywords:["complementari","insieme","sostituti","alternativa","indipendenti"]},{id:"u1-o5",q:"Perch\xE9 conta la distribuzione del reddito e non solo il suo livello? Fai l\u2019esempio della Tesla.",answer:"Due paesi con lo stesso PIL possono avere domande diverse. Se tutte le famiglie guadagnano circa 25.000 \u20AC nessuno pu\xF2 permettersi una Tesla, quindi la domanda \xE8 bassa; se pochi sono molto ricchi e molti poveri, la domanda di Tesla esiste. Per la carne in scatola succede il contrario: nel paese diseguale le famiglie sono o sotto Y1 o sopra Y3, e la domanda quasi sparisce.",keywords:["PIL","distribuzione","Tesla","ricchi","carne in scatola"]},{id:"u1-o6",q:"Cos\u2019\xE8 l\u2019elemento residuale E della funzione di domanda?",answer:"Comprende variabili ambientali e preferenze dei consumatori. Esempio ambientale: a 8 \u20AC gli ombrelli si vendono a Londra ma non al Cairo. Esempio di preferenze: la domanda di cibi salutistici oggi \xE8 ampia, anni fa no; anche le mode cambiano la domanda di anno in anno.",keywords:["ambientali","preferenze","ombrelli","mode"]},{id:"u1-o7",q:"Elenca e spiega le determinanti dell\u2019offerta diverse dal prezzo del bene.",answer:"Prezzo dei fattori produttivi (se sale offro meno); obiettivi dell\u2019impresa (avversa o propensa al rischio); tecnologia (pi\xF9 efficiente = pi\xF9 offerta); prezzo dei beni correlati (auto e autocarri); aspettative (panettoni, euro 7); regolamentazione pubblica (amianto); fattori particolari come stagione e meteo locale.",keywords:["fattori produttivi","obiettivi","tecnologia","correlati","aspettative","regolamentazione"]},{id:"u1-o8",q:"Spiega cosa sono i beni correlati dal lato dell\u2019offerta con l\u2019esempio della Rubini.",answer:"Un bene correlato \xE8 un bene che l\u2019impresa pu\xF2 produrre insieme a un altro con la stessa tecnologia, come auto e autocarri. Se il prezzo degli autocarri sale, la Rubini sposta parte delle risorse (29 operai su 100) sugli autocarri per testare il mercato: l\u2019offerta di auto diminuisce. Se il prezzo resta alto nel lungo periodo apre una divisione apposita e l\u2019equilibrio si ristabilisce.",keywords:["correlato","auto","autocarri","risorse","diminuisce"]},{id:"u1-o9",q:"Cos\u2019\xE8 l\u2019equilibrio di mercato e perch\xE9 per i neoclassici \xE8 stabile?",answer:"\xC8 il punto in cui quantit\xE0 domandata e offerta coincidono, con il relativo prezzo di equilibrio. \xC8 stabile perch\xE9 ognuno compra e offre quanto desidera a quel prezzo; se il prezzo sale la quantit\xE0 domandata scende, se scende la domanda aumenta e le imprese alzano il prezzo: il mercato torna all\u2019equilibrio.",keywords:["domandata","offerta","uguale","stabile","torna"]},{id:"u1-o10",q:"Che differenza c\u2019\xE8 tra spostamento lungo la curva e spostamento della curva?",answer:"Se cambia solo il prezzo del bene, ceteris paribus, ci si muove lungo la curva (libri da 8 a 7 \u20AC, da 10 a 14 copie). Se cambia qualsiasi altra cosa (reddito, prezzo di altri beni, preferenze, aspettative) si sposta tutta la curva: con pi\xF9 reddito e un bene normale la domanda va verso l\u2019esterno.",keywords:["prezzo","lungo","sposta","reddito","altri fattori"]},{id:"u1-o11",q:"Enuncia le 4 leggi della domanda e dell\u2019offerta.",answer:"1) Un aumento della domanda fa aumentare prezzo e quantit\xE0 di equilibrio. 2) Una diminuzione della domanda li fa diminuire entrambi. 3) Un aumento dell\u2019offerta fa diminuire il prezzo e aumentare la quantit\xE0. 4) Una diminuzione dell\u2019offerta fa aumentare il prezzo e diminuire la quantit\xE0.",keywords:["aumento della domanda","diminuzione della domanda","aumento dell\u2019offerta","diminuzione dell\u2019offerta"]},{id:"u1-o12",q:"Analizza il caso del terremoto in Giappone sul mercato del sak\xE8.",answer:"Si parte dall\u2019equilibrio A (P1, Q1). Il terremoto distrugge le fabbriche: l\u2019offerta passa da O1 a O2. I lutti portano a visitare le famiglie e la domanda passa da D1 a D2. Il nuovo equilibrio B ha un prezzo pi\xF9 alto. L\u2019effetto sulla quantit\xE0 dipende dalla forza dei due spostamenti: se l\u2019offerta si contrae fino a O3 si arriva a C, con quantit\xE0 minore e prezzo ancora pi\xF9 alto. Con spostamenti simultanei non si pu\xF2 prevedere l\u2019esito, lo si misura a mercato assestato.",keywords:["offerta","domanda","prezzo pi\xF9 alto","quantit\xE0","dipende","simultane"]},{id:"u1-o13",q:"Perch\xE9 la curva di offerta raramente parte dall\u2019origine?",answer:"A causa dei costi fissi: sotto una certa soglia di prezzo non conviene nemmeno aprire l\u2019attivit\xE0. Parte dall\u2019origine solo quando i costi fissi sono irrilevanti, come nelle imprese di pulizie.",keywords:["costi fissi","soglia","pulizie"]},{id:"u1-o14",q:"Cos\u2019\xE8 l\u2019inversione degli assi?",answer:"Nel piano cartesiano x \xE8 la variabile indipendente e y la dipendente. Nella curva di domanda per\xF2 \xE8 il prezzo a determinare la quantit\xE0, anche se il prezzo sta sull\u2019asse y. \xC8 una convenzione adottata dagli economisti perch\xE9 rende pi\xF9 evidente il rapporto.",keywords:["prezzo","asse","quantit\xE0","convenzione"]},{id:"u1-o15",q:"Quando un consumatore \xE8 razionale? Comprare per status \xE8 irrazionale?",answer:"Il consumatore razionale non agisce contro il proprio interesse e sceglie in funzione dei suoi bisogni. Un bene \xE8 utile se soddisfa un bisogno, anche di status: chi compra una Tesla o una pelliccia per mostrare la propria ricchezza resta razionale. Questi comportamenti creano eccezioni alla domanda discendente, ma sono rari.",keywords:["bisogni","utile","status","razionale","eccezioni"]}],cards:[{id:"u1-c1",front:"Funzione di domanda",back:"Rapporto tra la quantit\xE0 che i consumatori desiderano acquistare e i fattori da cui dipende: Pn, p1\u2026pn-1, Y, E."},{id:"u1-c2",front:"Ceteris paribus",back:"A parit\xE0 di altre condizioni: si fa variare un fattore alla volta."},{id:"u1-c3",front:"Inversione degli assi",back:"Il prezzo (variabile indipendente) \xE8 disegnato sull\u2019asse Y; la quantit\xE0 sull\u2019asse X."},{id:"u1-c4",front:"Beni complementari",back:"Consumati insieme (scarpe e lacci). Elasticit\xE0 incrociata negativa."},{id:"u1-c5",front:"Beni sostituti",back:"Consumati in alternativa (Coca e Pepsi). Elasticit\xE0 incrociata positiva."},{id:"u1-c6",front:"Beni indipendenti",back:"Nessun legame (scarpe e marmellata). Elasticit\xE0 incrociata nulla."},{id:"u1-c7",front:"Curva di Engel",back:"Relazione tra reddito e quantit\xE0 domandata a prezzo fisso: insufficiente, normale, saturazione, inferiore."},{id:"u1-c8",front:"Bene normale",back:"La quantit\xE0 domandata aumenta all\u2019aumentare del reddito."},{id:"u1-c9",front:"Bene inferiore",back:"La quantit\xE0 domandata diminuisce all\u2019aumentare del reddito."},{id:"u1-c10",front:"Elemento residuale E",back:"Variabili ambientali (ombrelli Londra/Cairo) e preferenze (cibi salutistici, mode)."},{id:"u1-c11",front:"Funzione di offerta",back:"Quantit\xE0 che le imprese sono disposte a offrire rispetto a Pn, prezzo dei fattori F1\u2026Fm e altri elementi E."},{id:"u1-c12",front:"Bene correlato (offerta)",back:"Bene che l\u2019impresa pu\xF2 produrre insieme a un altro con la stessa tecnologia (auto e autocarri)."},{id:"u1-c13",front:"Prezzo di equilibrio",back:"Prezzo al quale quantit\xE0 domandata = quantit\xE0 offerta."},{id:"u1-c14",front:"Mercato",back:"Luogo, non necessariamente fisico, in cui si incontrano domanda e offerta; insieme di regole degli scambi."},{id:"u1-c15",front:"Spostamento lungo la curva",back:"Avviene quando cambia solo il prezzo del bene."},{id:"u1-c16",front:"Spostamento della curva",back:"Avviene quando cambia qualsiasi fattore diverso dal prezzo del bene."},{id:"u1-c17",front:"Aumento della domanda",back:"P \u2191 e Q \u2191"},{id:"u1-c18",front:"Aumento dell\u2019offerta",back:"P \u2193 e Q \u2191"},{id:"u1-c19",front:"Shock simultaneo (sak\xE8)",back:"Offerta \u2193 e domanda \u2191: prezzo sicuramente \u2191, quantit\xE0 incerta."},{id:"u1-c20",front:"Black box",back:"Per i neoclassici l\u2019impresa \xE8 una scatola chiusa che massimizza il profitto."}]},y0=zz;var bz={id:"u2",n:2,title:"Surplus ed elasticit\xE0",subtitle:"Quanto reagiscono le quantit\xE0 ai prezzi",color:"#FFA826",colorDark:"#D9860B",lessons:[{id:"u2l1",title:"Surplus e benessere",icon:"\u{1F60A}",theory:[{title:"Surplus del consumatore",points:["La curva di domanda esprime, per ogni quantit\xE0, la **disponibilit\xE0 massima a pagare**. Chi compra paga il prezzo di mercato, cio\xE8 meno o quanto avrebbe pagato.","**Surplus del consumatore** = disponibilit\xE0 a pagare \u2212 prezzo pagato. Graficamente \xE8 l\u2019area **sopra il prezzo di equilibrio P\\* e sotto la curva di domanda**.","Libro a 30 $: Claudia era disposta a pagare 35 (surplus 5), Brad 45 (15), Aleisha 59 (29). Totale 5 + 15 + 29 = 49. Darren ed Edwina non comprano.","Se il prezzo sale il surplus del consumatore diminuisce, se scende aumenta. \xC8 una grandezza soggettiva: in Emilia-Romagna e in Sicilia le funzioni sono diverse."]},{title:"Surplus del produttore e benessere sociale",points:["Sulla curva di offerta c\u2019\xE8 il **prezzo minimo** a cui l\u2019impresa vende ogni quantit\xE0. Se vende a P\\*, pi\xF9 alto, guadagna la differenza.","**Surplus del produttore**: area **sotto il prezzo e sopra la curva di offerta**.","Prezzo pi\xF9 alto: meno surplus del consumatore, pi\xF9 surplus del produttore (e viceversa).","Per i neoclassici non c\u2019\xE8 motivo di preferire l\u2019uno o l\u2019altro: conta il **benessere sociale complessivo**, cio\xE8 la somma dei due surplus."]}],exercises:[{id:"u2-1-1",type:"mc",topic:"Surplus del consumatore",q:"Il surplus del consumatore \xE8\u2026",options:["la differenza tra disponibilit\xE0 massima a pagare e prezzo pagato","la differenza tra il prezzo pagato e il costo marginale dell\u2019impresa","il ricavo totale che le imprese ottengono dalle vendite","la quantit\xE0 domandata in eccesso rispetto a quella offerta"],answer:0,explain:"\xC8 quello che \u201Cavanza\u201D al consumatore che paga meno di quanto era disposto a pagare."},{id:"u2-1-2",type:"hotspot",topic:"Surplus del consumatore",scene:"surplus",q:"Tocca l\u2019area del surplus del consumatore.",answer:"cs",explain:"\xC8 l\u2019area sopra il prezzo di equilibrio P* e sotto la curva di domanda."},{id:"u2-1-3",type:"hotspot",topic:"Surplus del produttore",scene:"surplus",q:"Tocca l\u2019area del surplus del produttore.",answer:"ps",explain:"\xC8 l\u2019area sotto il prezzo di equilibrio P* e sopra la curva di offerta."},{id:"u2-1-4",type:"num",topic:"Surplus del consumatore",q:"Un libro costa 30 $. Claudia era disposta a pagare 35 $, Brad 45 $ e Aleisha 59 $. Qual \xE8 il surplus totale dei consumatori?",answer:49,tol:0,unit:"$",explain:"(35 \u2212 30) + (45 \u2212 30) + (59 \u2212 30) = 5 + 15 + 29 = 49 $."},{id:"u2-1-5",type:"mc",topic:"Surplus del consumatore",q:"Nel mercato del libro, chi ha il surplus maggiore?",options:["Aleisha, perch\xE9 era disposta a pagare di pi\xF9","Claudia, perch\xE9 ha comprato il libro per prima","Darren, perch\xE9 non ha speso nulla e ha risparmiato tutto","Hanno lo stesso surplus, perch\xE9 pagano lo stesso prezzo"],answer:0,explain:"A parit\xE0 di prezzo, il surplus \xE8 pi\xF9 alto per chi ha la disponibilit\xE0 a pagare pi\xF9 alta."},{id:"u2-1-6",type:"tf",topic:"Surplus del consumatore",q:"Se il prezzo di equilibrio aumenta, il surplus del consumatore aumenta.",answer:!1,explain:"Diminuisce: meno consumatori accedono al bene e chi compra paga di pi\xF9. Il triangolo si rimpicciolisce."},{id:"u2-1-7",type:"mc",topic:"Benessere sociale",q:"Cosa vogliono massimizzare i neoclassici?",options:["La somma di surplus del consumatore e del produttore","Il surplus del consumatore, la parte pi\xF9 debole del mercato","Il surplus del produttore, perch\xE9 le imprese creano ricchezza","Il prezzo di equilibrio, perch\xE9 remunera meglio le imprese"],answer:0,explain:"Non c\u2019\xE8 motivo di preferire una parte: conta il benessere sociale complessivo."},{id:"u2-1-8",type:"fill",topic:"Surplus",text:"Pi\xF9 il prezzo \xE8 alto, pi\xF9 si riduce il surplus del ___ e aumenta il surplus del ___.",answers:["consumatore","produttore"],extra:["mercato","monopolista"],explain:"Il prezzo sposta benessere da una parte all\u2019altra del mercato."},{id:"u2-1-9",type:"tf",topic:"Surplus",q:"Il surplus \xE8 una grandezza soggettiva: lo stesso libro pu\xF2 generare surplus diversi in Emilia-Romagna e in Sicilia.",answer:!0,explain:"Dipende dalle disponibilit\xE0 a pagare dei consumatori di quel mercato."}]},{id:"u2l2",title:"Elasticit\xE0 al prezzo",icon:"\u{1FA80}",theory:[{title:"Cos\u2019\xE8 l\u2019elasticit\xE0 \u03B7",points:["L\u2019elasticit\xE0 della domanda al prezzo (**\u03B7**, eta) misura quanto \xE8 sensibile la quantit\xE0 domandata alle variazioni del prezzo, ceteris paribus.","Usare \u0394Q/\u0394P non va bene: dipende dall\u2019unit\xE0 di misura (stadio \u22128000 biglietti per 1 \u20AC, latte \u2212100 litri per 1 \u20AC) e non permette confronti.","Si usa il rapporto tra **variazioni percentuali**: \u03B7 = (\u0394Q/Q) / (\u0394P/P). Esce un numero puro.","\u03B7 ha **sempre segno negativo**: prezzo e quantit\xE0 vanno in direzioni opposte. Spesso si confronta il valore assoluto."]},{title:"Come varia lungo la curva",points:["|\u03B7| = 0: la quantit\xE0 non cambia. Tra 0 e 1: **anelastica** (rigida). = 1: **unitaria**. > 1: **elastica**. = \u221E: perfettamente elastica.","Anche su una retta l\u2019elasticit\xE0 **cambia** da punto a punto: la pendenza \xE8 costante, ma viene moltiplicata per P/Q, che cambia.","Su una domanda lineare il tratto **elastico** \xE8 quello dei **prezzi alti**, il punto medio ha elasticit\xE0 unitaria, il tratto **rigido** \xE8 quello dei **prezzi bassi**."]},{title:"Due metodi di calcolo",points:["**Metodo semplice**: variazione % = (valore finale \u2212 iniziale) / valore iniziale.","**Punto medio**: variazione % = (finale \u2212 iniziale) / media dei due valori. \xC8 pi\xF9 preciso per variazioni ampie.","Sono corretti entrambi ma **non vanno mescolati**: stesso metodo per numeratore e denominatore."],example:"P da 10 a 12, Q da 100 a 80. Semplice: \u221220% / +20% = \u22121. Punto medio: (\u221220/90) / (2/11) = \u22120,222 / 0,182 \u2248 \u22121,22."}],exercises:[{id:"u2-2-1",type:"mc",topic:"Definizione di elasticit\xE0",q:"Perch\xE9 l\u2019elasticit\xE0 si calcola con le variazioni percentuali e non con \u0394Q/\u0394P?",options:["Perch\xE9 \u0394Q/\u0394P dipende dall\u2019unit\xE0 di misura e non permette confronti tra settori","Perch\xE9 le variazioni percentuali sono sempre positive e pi\xF9 facili da leggere","Perch\xE9 il rapporto \u0394Q/\u0394P vale sempre zero su una curva lineare","Perch\xE9 cos\xEC l\u2019elasticit\xE0 resta costante in ogni punto della curva"],answer:0,explain:"Stadio \u22128000 e latte \u2212100 non sono confrontabili: con le percentuali si ottiene un numero puro."},{id:"u2-2-2",type:"tf",topic:"Segno dell\u2019elasticit\xE0",q:"L\u2019elasticit\xE0 della domanda al prezzo ha sempre segno negativo.",answer:!0,explain:"Prezzo e quantit\xE0 domandata si muovono in direzioni opposte, quindi il rapporto \xE8 negativo."},{id:"u2-2-3",type:"match",topic:"Classi di elasticit\xE0",q:"Abbina il valore di |\u03B7| al tipo di domanda",pairs:[["|\u03B7| = 0","Perfettamente rigida"],["0 < |\u03B7| < 1","Anelastica"],["|\u03B7| = 1","Elasticit\xE0 unitaria"],["|\u03B7| > 1","Elastica"],["|\u03B7| = \u221E","Perfettamente elastica"]],explain:"Elastica significa che la quantit\xE0 varia pi\xF9 che proporzionalmente rispetto al prezzo."},{id:"u2-2-4",type:"num",topic:"Calcolo elasticit\xE0",q:"Il prezzo sale da 10 \u20AC a 12 \u20AC e la quantit\xE0 scende da 100 a 80. Calcola \u03B7 con il metodo semplice (con il segno).",answer:-1,tol:.01,explain:"\u0394Q% = (80 \u2212 100)/100 = \u221220%. \u0394P% = (12 \u2212 10)/10 = +20%. \u03B7 = \u221220% / 20% = \u22121."},{id:"u2-2-5",type:"num",topic:"Calcolo elasticit\xE0",q:"Stessi dati: P da 10 a 12, Q da 100 a 80. Calcola \u03B7 con il metodo del punto medio (due decimali, con il segno).",answer:-1.22,tol:.02,explain:"\u0394Q% = \u221220 / 90 = \u22120,222. \u0394P% = 2 / 11 = 0,182. \u03B7 = \u22120,222 / 0,182 \u2248 \u22121,22."},{id:"u2-2-6",type:"hotspot",topic:"Elasticit\xE0 lungo la retta",scene:"elasticita-lineare",q:"Su questa domanda lineare, tocca il tratto elastico.",answer:"elastic",explain:"Il tratto elastico \xE8 quello dei prezzi alti (in alto a sinistra): l\xEC un euro in pi\xF9 pesa tanto in percentuale sulla quantit\xE0.",profNote:"In un passaggio gli appunti dicono \u201Cpi\xF9 i prezzi sono bassi pi\xF9 la curva \xE8 elastica\u201D: \xE8 il contrario. Su una retta discendente l\u2019elasticit\xE0 \xE8 alta ai prezzi alti e bassa ai prezzi bassi, come gli appunti stessi dicono poco prima (bene di lusso pi\xF9 sensibile nelle fasce di prezzo alte)."},{id:"u2-2-7",type:"hotspot",topic:"Elasticit\xE0 lungo la retta",scene:"elasticita-lineare",q:"Tocca il punto con elasticit\xE0 unitaria.",answer:"unit",explain:"Su una domanda lineare l\u2019elasticit\xE0 \xE8 unitaria nel punto medio."},{id:"u2-2-8",type:"tf",topic:"Elasticit\xE0 lungo la retta",q:"Se la curva di domanda \xE8 una retta, l\u2019elasticit\xE0 \xE8 uguale in tutti i suoi punti.",answer:!1,explain:"La pendenza \xE8 costante ma l\u2019elasticit\xE0 no: la formula moltiplica la pendenza per P/Q, che cambia lungo la curva."},{id:"u2-2-9",type:"mc",topic:"Metodi di calcolo",q:"Quale affermazione sui due metodi di calcolo \xE8 corretta?",options:["Sono entrambi corretti ma non si mescolano: stesso metodo per numeratore e denominatore","Si usa il metodo semplice al numeratore e il punto medio al denominatore","Solo il metodo semplice \xE8 corretto, il punto medio \xE8 un\u2019approssimazione","Il punto medio \xE8 meno preciso quando le variazioni sono ampie"],answer:0,explain:"Il punto medio \xE8 pi\xF9 preciso quando le variazioni sono ampie, ma va usato per entrambe le variazioni."},{id:"u2-2-10",type:"mc",topic:"Bene necessario",q:"Il pane raddoppia di prezzo ma lo compro lo stesso. La mia domanda di pane \xE8\u2026",options:["rigida (anelastica)","elastica","perfettamente elastica","unitaria"],answer:0,explain:"I beni necessari tendono ad avere domanda rigida; i beni di lusso domanda elastica."}]},{id:"u2l3",title:"Casi estremi e determinanti",icon:"\u{1F9F2}",theory:[{title:"Casi eccezionali",points:["**Perfettamente elastica**: curva **orizzontale**, \u03B7 = \u221E ovunque. A 4 \u20AC ognuno compra quanto vuole; appena sopra non si compra nulla.","**Perfettamente rigida**: curva **verticale**, \u03B7 = 0 ovunque. Il tossicodipendente vuole la sua dose qualunque sia il prezzo.","**Elasticit\xE0 unitaria**: curva a forma di **iperbole equilatera**, \u03B7 = 1 ovunque (P \xD7 Q costante)."]},{title:"Da cosa dipende l\u2019elasticit\xE0",points:["**Gusti e preferenze**: un bene considerato \u201Cfrivolo\u201D ha domanda elastica, uno \u201Cnecessario\u201D rigida. Non dipende dalla natura del bene ma dal giudizio del consumatore (l\u2019abito da sera).","**Possibilit\xE0 di sostituzione**: se aumenta la Coca-Cola compro la Pepsi (elastica); il caff\xE8 \xE8 difficile da sostituire (rigida).","**Ampiezza del mercato**: la domanda di una marca di sigarette (Camel) \xE8 pi\xF9 elastica della domanda di sigarette in generale.","**Periodo di riferimento**: nel breve periodo la domanda \xE8 pi\xF9 rigida. Metano: subito non vendo l\u2019auto, nel lungo periodo la cambio. La domanda di lungo periodo \xE8 pi\xF9 elastica."]}],exercises:[{id:"u2-3-1",type:"mc",topic:"Casi estremi",q:"Una curva di domanda verticale ha elasticit\xE0\u2026",options:["sempre uguale a 0","sempre uguale a \u221E","sempre uguale a 1","variabile lungo la curva"],answer:0,explain:"Qualunque sia il prezzo la quantit\xE0 \xE8 la stessa: perfettamente rigida, \u03B7 = 0."},{id:"u2-3-2",type:"mc",topic:"Casi estremi",q:"Una curva di domanda orizzontale ha elasticit\xE0\u2026",options:["sempre infinita","sempre nulla","sempre unitaria","negativa e minore di 1"],answer:0,explain:"Perfettamente elastica: a quel prezzo si compra qualsiasi quantit\xE0, appena sopra nulla."},{id:"u2-3-3",type:"mc",topic:"Casi estremi",q:"Quale forma ha una curva di domanda con elasticit\xE0 unitaria in ogni punto?",options:["Un\u2019iperbole equilatera","Una retta orizzontale","Una retta verticale","Una retta discendente qualsiasi"],answer:0,explain:"Sull\u2019iperbole equilatera P \xD7 Q \xE8 costante: le variazioni percentuali di prezzo e quantit\xE0 si compensano.",profNote:"Gli appunti dicono \u201Cse il prezzo aumenta di 20 la quantit\xE0 diminuisce di 20\u201D: vale in percentuale (circa +20% di prezzo, circa \u221220% di quantit\xE0), non in unit\xE0 assolute."},{id:"u2-3-4",type:"match",topic:"Casi estremi",q:"Abbina ogni caso al suo esempio",pairs:[["Domanda perfettamente rigida","Dose del tossicodipendente"],["Domanda perfettamente elastica","A 4 \u20AC compro quanto voglio, sopra nulla"],["Domanda elastica","Coca-Cola, sostituibile con Pepsi"],["Domanda rigida","Caff\xE8 per chi lo beve ogni giorno"]],explain:"Pi\xF9 il bene \xE8 sostituibile, pi\xF9 la domanda \xE8 elastica."},{id:"u2-3-5",type:"mc",topic:"Determinanti",q:"Perch\xE9 la domanda di Camel \xE8 pi\xF9 elastica della domanda di sigarette in generale?",options:["Perch\xE9 per una marca ci sono pi\xF9 sostituti: se le Camel aumentano fumo Marlboro","Perch\xE9 le Camel sono un bene inferiore e calano con il reddito","Perch\xE9 il mercato delle Camel \xE8 pi\xF9 ampio di quello delle sigarette","Perch\xE9 chi fuma Camel ha un reddito pi\xF9 alto della media"],answer:0,explain:"Ampiezza del mercato: pi\xF9 il mercato \xE8 ristretto, pi\xF9 sostituti ci sono, pi\xF9 la domanda \xE8 elastica."},{id:"u2-3-6",type:"tf",topic:"Determinanti",q:"Se un bene \xE8 frivolo o necessario dipende dalla natura del bene, non dal giudizio del consumatore.",answer:!1,explain:"Dipende dalle considerazioni del consumatore: lo stesso abito da sera pu\xF2 essere frivolo o necessario a seconda dell\u2019occasione."},{id:"u2-3-7",type:"mc",topic:"Periodo di riferimento",q:"Il metano aumenta di prezzo e resta alto per anni. Cosa succede alla domanda di metano?",options:["Nel breve \xE8 rigida, nel lungo diventa pi\xF9 elastica perch\xE9 si passa ad altre auto","\xC8 elastica nel breve periodo e diventa rigida nel lungo periodo","Resta perfettamente rigida, perch\xE9 il metano \xE8 un bene necessario","Diventa subito perfettamente elastica e la quantit\xE0 crolla a zero"],answer:0,explain:"Nel breve non vendo subito l\u2019auto a metano; nel lungo la cambio e salto su una nuova curva. La domanda di lungo periodo \xE8 pi\xF9 orizzontale."},{id:"u2-3-8",type:"fill",topic:"Determinanti",text:"Nel ___ periodo la domanda tende a essere pi\xF9 rigida che nel ___ periodo, soprattutto per i beni usati insieme a beni durevoli.",answers:["breve","lungo"],extra:["lunghissimo","medio"],explain:"Esempio auto e benzina o metano: servono tempo e nuovi acquisti per adattarsi."},{id:"u2-3-9",type:"order",topic:"Classi di elasticit\xE0",q:"Ordina le domande dalla meno elastica alla pi\xF9 elastica",items:["Perfettamente rigida (\u03B7 = 0)","Anelastica (0 < |\u03B7| < 1)","Unitaria (|\u03B7| = 1)","Elastica (|\u03B7| > 1)","Perfettamente elastica (\u03B7 = \u221E)"],explain:"La scala va da 0 a infinito in valore assoluto."}]},{id:"u2l4",title:"Elasticit\xE0 e ricavo",icon:"\u{1F4B6}",theory:[{title:"Il ricavo dipende dall\u2019elasticit\xE0",points:["Il ricavo totale delle imprese \xE8 la spesa dei consumatori: **R = P \xD7 Q**.","**Domanda anelastica**: un aumento del prezzo fa scendere la quantit\xE0 meno che proporzionalmente, quindi il **ricavo aumenta**. Da 1 \u20AC (Q = 100) a 3 \u20AC (Q = 80): da 100 \u20AC a 240 \u20AC.","**Domanda elastica**: un aumento del prezzo fa scendere la quantit\xE0 pi\xF9 che proporzionalmente, quindi il **ricavo diminuisce**. Da 4 \u20AC (Q = 50) a 5 \u20AC (Q = 20): da 200 \u20AC a 100 \u20AC.","Un produttore preferisce una domanda **rigida**: pu\xF2 alzare il prezzo senza perdere troppe vendite."]},{title:"Il caso della metropolitana di New York",points:["Dicembre 1995: il biglietto passa da 1,25 $ a 1,50 $ (+25 centesimi). I passeggeri calano del 4,3%.","\u0394P% = 0,25 / 1,25 = 20%. \u03B7 = \u22124,3% / 20% = **\u22120,215**: domanda rigida.","Il fatturato della Transit Authority **aumenta**: la metro si prende comunque.","La stima \xE8 inaffidabile perch\xE9 \xE8 di **breve periodo**: nel lungo periodo ci si organizza diversamente e la quantit\xE0 pu\xF2 calare molto di pi\xF9."]}],exercises:[{id:"u2-4-1",type:"mc",topic:"Elasticit\xE0 e ricavo",q:"Con una domanda anelastica, un aumento del prezzo\u2026",options:["fa aumentare il ricavo totale","fa diminuire il ricavo totale","lascia il ricavo invariato","azzera la quantit\xE0 venduta"],answer:0,explain:"La quantit\xE0 scende meno che proporzionalmente rispetto al prezzo: P \xD7 Q cresce."},{id:"u2-4-2",type:"num",topic:"Elasticit\xE0 e ricavo",q:"Tratto anelastico: il prezzo sale da 1 \u20AC (Q = 100) a 3 \u20AC (Q = 80). Qual \xE8 il nuovo ricavo totale?",answer:240,tol:0,unit:"\u20AC",explain:"R = 3 \xD7 80 = 240 \u20AC, contro i 100 \u20AC iniziali (1 \xD7 100)."},{id:"u2-4-3",type:"num",topic:"Elasticit\xE0 e ricavo",q:"Tratto elastico: il prezzo sale da 4 \u20AC (Q = 50) a 5 \u20AC (Q = 20). Di quanti euro cambia il ricavo? (scrivi il segno)",answer:-100,tol:0,unit:"\u20AC",explain:"Prima 4 \xD7 50 = 200 \u20AC, dopo 5 \xD7 20 = 100 \u20AC: il ricavo scende di 100 \u20AC."},{id:"u2-4-4",type:"num",topic:"Metro di New York",q:"Metro di New York: il biglietto passa da 1,25 $ a 1,50 $ e i passeggeri calano del 4,3%. Calcola \u03B7 (con il segno, tre decimali).",answer:-.215,tol:.003,explain:"\u0394P% = (1,50 \u2212 1,25) / 1,25 = 0,20. \u03B7 = \u22124,3% / 20% = \u22120,215."},{id:"u2-4-5",type:"mc",topic:"Metro di New York",q:"Con \u03B7 = \u22120,215, cosa succede al fatturato della Transit Authority dopo l\u2019aumento?",options:["Aumenta, perch\xE9 la domanda \xE8 rigida","Diminuisce, perch\xE9 la domanda \xE8 elastica","Resta uguale","Non si pu\xF2 dire"],answer:0,explain:"La quantit\xE0 cala in modo meno che proporzionale: la metro si deve prendere comunque."},{id:"u2-4-6",type:"mc",topic:"Metro di New York",q:"Perch\xE9 la stima dell\u2019elasticit\xE0 della metro \xE8 inaffidabile?",options:["\xC8 una stima di breve periodo: nel lungo ci si organizza e la domanda diventa pi\xF9 elastica","Perch\xE9 il campione di passeggeri osservato \xE8 troppo piccolo","Perch\xE9 un aumento di 25 centesimi \xE8 troppo piccolo per misurarla","Perch\xE9 la domanda di trasporti \xE8 perfettamente rigida per definizione"],answer:0,explain:"Nel lungo periodo si possono trovare alternative e la quantit\xE0 domandata potrebbe calare molto di pi\xF9."},{id:"u2-4-7",type:"tf",topic:"Elasticit\xE0 e ricavo",q:"Un produttore preferisce trovarsi davanti a una domanda elastica.",answer:!1,explain:"Preferisce una domanda rigida: alzando il prezzo la quantit\xE0 non cala molto e i ricavi aumentano."},{id:"u2-4-8",type:"fill",topic:"Elasticit\xE0 e ricavo",text:"Con domanda elastica un aumento del prezzo fa diminuire la quantit\xE0 ___ che proporzionalmente e il ricavo totale ___.",answers:["pi\xF9","diminuisce"],extra:["meno","aumenta"],explain:"I consumatori sono molto sensibili: quell\u2019euro in pi\xF9 li fa rinunciare."},{id:"u2-4-9",type:"mc",topic:"Elasticit\xE0 e ricavo",scenario:"Gestisci una piccola libreria. La domanda dei tuoi libri \xE8 nel tratto elastico della curva.",q:"Per aumentare il ricavo cosa ti conviene fare?",options:["Abbassare il prezzo","Alzare il prezzo","Lasciare il prezzo invariato","Ridurre l\u2019offerta"],answer:0,explain:"Nel tratto elastico una riduzione di prezzo fa aumentare la quantit\xE0 pi\xF9 che proporzionalmente: il ricavo sale."}]},{id:"u2l5",title:"Reddito, incrociata, offerta",icon:"\u{1F500}",theory:[{title:"Elasticit\xE0 al reddito",points:["Rapporto tra variazione % della quantit\xE0 e variazione % del reddito.","Qui **il segno conta**: positiva = **bene normale** (Y1\u2013Y2), zero = reddito insufficiente o saturazione, negativa = **bene inferiore** (oltre Y3).","Beni di lusso: molto elastici al reddito. Beni necessari (cibo, vestiario, carburante): rigidi."]},{title:"Elasticit\xE0 incrociata",points:["Variazione % della quantit\xE0 di un bene / variazione % del prezzo di **un altro** bene. Va da \u2212\u221E a +\u221E.","**Zero**: beni indipendenti. **Negativa**: complementari (racchette e palline). **Positiva**: sostituti (Pepsi e Coca-Cola)."]},{title:"Elasticit\xE0 dell\u2019offerta \u03B5",points:["\u03B5 = variazione % della quantit\xE0 offerta / variazione % del prezzo. \xC8 **sempre positiva**.","\u03B5 = 0: offerta verticale. \u03B5 = \u221E: orizzontale. \u03B5 = 1: retta che parte dall\u2019origine (nessun costo fisso).","L\u2019offerta di **breve periodo \xE8 pi\xF9 rigida** di quella di lungo. Petrolio: se la domanda sale, nel breve si sfoga sui prezzi; nel lungo sulle quantit\xE0.","Mascherine durante il COVID: prima prezzi alle stelle, poi altri hanno convertito la produzione (la Martini ha prodotto disinfettante) e i prezzi sono scesi.","San Valentino: aumentano di pi\xF9 i prezzi dei **fiori**, perch\xE9 non si possono produrre in anticipo n\xE9 stoccare; i cioccolatini s\xEC."]}],exercises:[{id:"u2-5-1",type:"mc",topic:"Elasticit\xE0 al reddito",q:"Un\u2019elasticit\xE0 al reddito negativa indica\u2026",options:["un bene inferiore","un bene normale","un bene di lusso","beni complementari"],answer:0,explain:"All\u2019aumentare del reddito la quantit\xE0 diminuisce: tratto oltre Y3 della curva di Engel."},{id:"u2-5-2",type:"tf",topic:"Elasticit\xE0 al reddito",q:"Per l\u2019elasticit\xE0 al reddito, come per quella al prezzo, si guarda solo il valore assoluto.",answer:!1,explain:"Il segno \xE8 fondamentale: dice se il bene \xE8 normale o inferiore e in che tratto della curva di Engel ci troviamo."},{id:"u2-5-3",type:"num",topic:"Elasticit\xE0 incrociata",q:"Il prezzo della Pepsi aumenta del 10% e la quantit\xE0 domandata di Coca-Cola aumenta del 5%. Calcola l\u2019elasticit\xE0 incrociata.",answer:.5,tol:.01,explain:"+5% / +10% = +0,5. Positiva: sono beni sostituti."},{id:"u2-5-4",type:"match",topic:"Elasticit\xE0 incrociata",q:"Abbina il segno dell\u2019elasticit\xE0 incrociata al tipo di beni",pairs:[["Positiva","Sostituti"],["Negativa","Complementari"],["Zero","Indipendenti"]],explain:"Sostituti: se uno costa di pi\xF9 si compra l\u2019altro. Complementari: si comprano meno entrambi."},{id:"u2-5-5",type:"mc",topic:"Elasticit\xE0 dell\u2019offerta",q:"L\u2019elasticit\xE0 dell\u2019offerta al prezzo \u03B5 \xE8\u2026",options:["sempre positiva, perch\xE9 l\u2019offerta \xE8 crescente","sempre negativa, come quella della domanda","sempre uguale a 1, qualunque sia la curva","positiva solo nel lungo periodo, nulla nel breve"],answer:0,explain:"Prezzo e quantit\xE0 offerta si muovono nella stessa direzione."},{id:"u2-5-6",type:"mc",topic:"Offerta di breve periodo",q:"La domanda di petrolio aumenta all\u2019improvviso. Nel breve periodo\u2026",options:["il prezzo aumenta molto e la quantit\xE0 poco, perch\xE9 l\u2019offerta \xE8 rigida","la quantit\xE0 aumenta molto e il prezzo poco, perch\xE9 l\u2019offerta \xE8 elastica","non cambia nulla, perch\xE9 il prezzo del petrolio \xE8 fissato dall\u2019OPEC","il prezzo scende, perch\xE9 i produttori vendono di pi\xF9"],answer:0,explain:"Non si possono aprire nuovi giacimenti dall\u2019oggi al domani: la pressione si sfoga sui prezzi. Nel lungo periodo si scarica di pi\xF9 sulle quantit\xE0."},{id:"u2-5-7",type:"mc",topic:"San Valentino",q:"A San Valentino aumentano i prezzi di fiori e cioccolatini. Quali aumentano di pi\xF9?",options:["I fiori, perch\xE9 la loro offerta \xE8 rigida: non si possono stoccare","I cioccolatini, perch\xE9 a San Valentino sono pi\xF9 richiesti","Aumentano allo stesso modo, perch\xE9 la domanda cresce uguale","Nessuno dei due: i negozi fanno sconti per vendere di pi\xF9"],answer:0,explain:"Le rose non si coltivano a ottobre per San Valentino: marciscono. I cioccolatini si producono durante l\u2019anno e si mettono in magazzino."},{id:"u2-5-8",type:"mc",topic:"Beni correlati e offerta",q:"Durante il COVID la Martini inizia a produrre disinfettante. Che effetto ha questo sul mercato?",options:["La quantit\xE0 offerta aumenta e i prezzi scendono","I prezzi salgono ancora, perch\xE9 cresce la concorrenza","La domanda di disinfettante crolla per l\u2019eccesso di offerta","Nessun effetto, perch\xE9 la Martini non \xE8 un produttore del settore"],answer:0,explain:"Aveva materia prima (alcol) e conoscenze per un bene correlato: l\u2019offerta \xE8 cresciuta e i prezzi si sono abbassati."},{id:"u2-5-9",type:"tf",topic:"Elasticit\xE0 al reddito",q:"I beni necessari come pane, acqua e latte tendono a essere rigidi rispetto al reddito.",answer:!0,explain:"Li compro anche con reddito basso: la quantit\xE0 reagisce poco alle variazioni di reddito."},{id:"u2-5-10",type:"fill",topic:"Elasticit\xE0 dell\u2019offerta",text:"Un\u2019offerta lineare che parte dall\u2019origine degli assi ha elasticit\xE0 \u03B5 = ___ in ogni punto, perch\xE9 l\u2019impresa non ha costi ___.",answers:["1","fissi"],extra:["0","variabili","\u221E"],explain:"\xC8 il caso di offerta isoelastica unitaria citato negli appunti.",profNote:"Gli appunti scrivono \u201C\u03B5 = 1: curva di offerta lineare\u201D: serve precisare che deve partire dall\u2019origine. Una retta di offerta che non passa per l\u2019origine non ha elasticit\xE0 unitaria."}]},{id:"u2l6",title:"Casi d\u2019esame",icon:"\u{1F9EA}",theory:[{title:"Sigarette: sensibilizzare o tassare?",points:["Team A: campagna di sensibilizzazione, la **curva di domanda si sposta a sinistra** (da 20 a 10 sigarette al giorno a 2 \u20AC).","Team B: un\u2019imposta alza il prezzo da 2 \u20AC a 4 \u20AC, **movimento lungo la curva** (da 20 a 12).","A sembra pi\xF9 efficace ma \xE8 ipotetico: chi fuma non legge i pacchetti e l\u2019effetto si riduce nel lungo periodo. B \xE8 pi\xF9 realistico, ma la curva dovrebbe essere pi\xF9 verticale: \xE8 un bene che crea dipendenza."]},{title:"Mucca pazza e droga",points:["**Mucca pazza**: il solo annuncio fa crollare la domanda di carne bovina. L\u2019offerta \xE8 rigida nel breve, quindi il prezzo scende molto. Carne suina e pollo (sostituti) salgono di prezzo. Nel lungo periodo gli allevatori si riconvertono.","**Sindaco di Ferrara e droga**: arrestare gli spacciatori riduce l\u2019offerta; con domanda rigida la quantit\xE0 cala poco e il **prezzo sale molto**, e servono pi\xF9 soldi per una dose: rischio di pi\xF9 scippi.","Le campagne di rieducazione agiscono sulla domanda: la quantit\xE0 cala di pi\xF9, ma il prezzo crolla e gli spacciatori cercano nuovi clienti."]},{title:"L\u2019esercizio di Giuseppe",points:["Domanda di libri di Giuseppe. Prezzo 8, 10, 12, 14, 16 \u20AC.","Reddito 10.000 \u20AC: Q = 40, 32, 24, 16, 8. Reddito 12.000 \u20AC: Q = 50, 45, 30, 20, 12.","Si chiede l\u2019elasticit\xE0 al prezzo (da 8 a 10 \u20AC) per i due redditi e l\u2019elasticit\xE0 al reddito a 12 \u20AC e a 16 \u20AC. Il punto chiave \xE8 il ceteris paribus: una variabile alla volta."]}],exercises:[{id:"u2-6-1",type:"mc",topic:"Sigarette",scenario:"Sei il Ministro della Salute. Troppi ricoveri per tumore ai polmoni. Hai fondi per una sola politica: campagna shock (sposta la domanda) o imposta sul pacchetto (alza il prezzo).",q:"Quale osservazione degli appunti fa preferire l\u2019imposta?",options:["L\u2019effetto della campagna \xE8 ipotetico e svanisce nel tempo","L\u2019imposta sposta la curva di domanda di sigarette verso sinistra","La domanda di sigarette \xE8 perfettamente elastica al prezzo","La campagna di sensibilizzazione fa salire il prezzo dei pacchetti"],answer:0,explain:"La previsione del team A \xE8 un\u2019ipotesi; l\u2019imposta agisce davvero sul prezzo, anche se la domanda \xE8 rigida per via della dipendenza."},{id:"u2-6-2",type:"mc",topic:"Sigarette",q:"L\u2019imposta che porta il pacchetto da 2 \u20AC a 4 \u20AC provoca\u2026",options:["un movimento lungo la curva di domanda","uno spostamento a sinistra della domanda","uno spostamento a destra dell\u2019offerta","nessun effetto sulla quantit\xE0"],answer:0,explain:"Cambia il prezzo: ci si muove lungo la stessa curva, da 20 a 12 sigarette al giorno."},{id:"u2-6-3",type:"shift",topic:"Mucca pazza",q:"Viene annunciato il rischio \u201Cmucca pazza\u201D. Sposta la curva del mercato della carne bovina.",moves:{D:"left"},explain:"Crolla la domanda; l\u2019offerta nel breve non pu\xF2 cambiare, quindi il prezzo scende molto."},{id:"u2-6-4",type:"mc",topic:"Mucca pazza",q:"Cosa succede ai prezzi di carne suina e pollo durante la mucca pazza?",options:["Salgono, perch\xE9 la domanda di sostituti aumenta e l\u2019offerta \xE8 rigida nel breve","Scendono anche loro, come la carne bovina, per paura del contagio","Restano uguali, perch\xE9 sono mercati indipendenti dalla carne bovina","Crollano, perch\xE9 i consumatori smettono di mangiare carne"],answer:0,explain:"Pi\xF9 domanda per i sostituti, ma non si possono allevare pi\xF9 maiali o polli dall\u2019oggi al domani."},{id:"u2-6-5",type:"mc",topic:"Droga e criminalit\xE0",scenario:"Sei il sindaco di Ferrara. Il questore segnala scippi da parte di tossicodipendenti che cercano soldi per la dose. La domanda di droga \xE8 molto rigida.",q:"Perch\xE9 arrestare gli spacciatori non \xE8 la soluzione ottimale?",options:["Con domanda rigida il prezzo sale e servono pi\xF9 soldi per la dose","Perch\xE9 la domanda di droga \xE8 molto elastica e cala da sola","Perch\xE9 il prezzo della droga scende e attira nuovi consumatori","Perch\xE9 la quantit\xE0 scambiata aumenta invece di diminuire"],answer:0,explain:"La quantit\xE0 cala poco e il prezzo sale tanto: la criminalit\xE0 per procurarsi denaro pu\xF2 aumentare."},{id:"u2-6-6",type:"mc",topic:"Droga e criminalit\xE0",q:"Qual \xE8 il rischio delle campagne di rieducazione che agiscono solo sulla domanda?",options:["Il prezzo crolla e gli spacciatori cercano nuovi consumatori","Il prezzo sale troppo e aumentano gli scippi","La quantit\xE0 scambiata aumenta subito dopo la campagna","Nessun rischio: agire sulla domanda \xE8 sempre la scelta migliore"],answer:0,explain:"Chi \xE8 gi\xE0 dipendente non cambia, il prezzo scende molto e l\u2019offerta spinge per creare nuova domanda."},{id:"u2-6-7",type:"num",topic:"Esercizio di Giuseppe",q:"Giuseppe, reddito 10.000 \u20AC: il prezzo passa da 8 a 10 \u20AC e la quantit\xE0 da 40 a 32. Elasticit\xE0 con metodo semplice (con il segno)?",answer:-.8,tol:.01,explain:"\u0394Q% = (32 \u2212 40)/40 = \u221220%. \u0394P% = (10 \u2212 8)/8 = +25%. \u03B7 = \u22120,20 / 0,25 = \u22120,8."},{id:"u2-6-8",type:"num",topic:"Esercizio di Giuseppe",q:"Stessi dati (Q da 40 a 32, P da 8 a 10). Elasticit\xE0 con il punto medio (con il segno)?",answer:-1,tol:.01,explain:"\u0394Q% = \u22128 / 36 = \u22120,222. \u0394P% = 2 / 9 = 0,222. \u03B7 = \u22121."},{id:"u2-6-9",type:"num",topic:"Esercizio di Giuseppe",q:"Giuseppe, reddito 12.000 \u20AC: P da 8 a 10 \u20AC, Q da 50 a 45. Elasticit\xE0 con metodo semplice (con il segno)?",answer:-.4,tol:.01,explain:"\u0394Q% = \u22125/50 = \u221210%. \u0394P% = 25%. \u03B7 = \u22120,10 / 0,25 = \u22120,4. Con pi\xF9 reddito la domanda di Giuseppe \xE8 pi\xF9 rigida in quel tratto."},{id:"u2-6-10",type:"num",topic:"Esercizio di Giuseppe",q:"A prezzo 12 \u20AC il reddito passa da 10.000 a 12.000 \u20AC e la quantit\xE0 da 24 a 30. Elasticit\xE0 al reddito con metodo semplice?",answer:1.25,tol:.01,explain:"\u0394Q% = 6/24 = 25%. \u0394Y% = 2.000/10.000 = 20%. Elasticit\xE0 = 1,25: positiva, bene normale."},{id:"u2-6-11",type:"num",topic:"Esercizio di Giuseppe",q:"A prezzo 16 \u20AC il reddito passa da 10.000 a 12.000 \u20AC e la quantit\xE0 da 8 a 12. Elasticit\xE0 al reddito con metodo semplice?",answer:2.5,tol:.01,explain:"\u0394Q% = 4/8 = 50%. \u0394Y% = 20%. Elasticit\xE0 = 2,5: bene normale, molto sensibile al reddito a quel prezzo."},{id:"u2-6-12",type:"tf",topic:"Esercizio di Giuseppe",q:"Nell\u2019esercizio di Giuseppe, per calcolare l\u2019elasticit\xE0 al prezzo bisogna tenere fermo il reddito (e viceversa).",answer:!0,explain:"\xC8 il messaggio dell\u2019esercizio: ceteris paribus, una variabile alla volta."}]}],open:[{id:"u2-o1",q:"Definisci surplus del consumatore e del produttore e spiega come si rappresentano.",answer:"Il surplus del consumatore \xE8 la differenza tra la disponibilit\xE0 massima a pagare e il prezzo pagato; graficamente \xE8 l\u2019area sopra il prezzo di equilibrio e sotto la curva di domanda. Il surplus del produttore \xE8 la differenza tra il prezzo incassato e il prezzo minimo a cui l\u2019impresa avrebbe venduto; \xE8 l\u2019area sotto il prezzo e sopra la curva di offerta. La loro somma \xE8 il benessere sociale complessivo, che per i neoclassici va massimizzato.",keywords:["disponibilit\xE0 a pagare","sopra il prezzo","sotto la curva di domanda","curva di offerta","benessere"]},{id:"u2-o2",q:"Cos\u2019\xE8 l\u2019elasticit\xE0 della domanda al prezzo e perch\xE9 si usano le variazioni percentuali?",answer:"\xC8 la sensibilit\xE0 della quantit\xE0 domandata alle variazioni del prezzo, ceteris paribus, indicata con \u03B7. Si calcola come variazione percentuale della quantit\xE0 diviso variazione percentuale del prezzo. Il semplice rapporto \u0394Q/\u0394P dipende dall\u2019unit\xE0 di misura (stadio \u22128000, latte \u2212100) e non permette confronti; con le percentuali si ottiene un numero puro. \xC8 sempre negativa.",keywords:["sensibilit\xE0","percentual","unit\xE0 di misura","numero puro","negativ"]},{id:"u2-o3",q:"Perch\xE9 l\u2019elasticit\xE0 cambia lungo una curva di domanda lineare?",answer:"Perch\xE9 l\u2019elasticit\xE0 non \xE8 la pendenza: la formula equivale a (\u0394Q/\u0394P) \xD7 (P/Q). La pendenza \xE8 costante, ma il rapporto P/Q cambia spostandosi lungo la curva. Ai prezzi alti la domanda \xE8 elastica, nel punto medio unitaria, ai prezzi bassi rigida.",keywords:["pendenza","P/Q","prezzi alti","punto medio","rigid"]},{id:"u2-o4",q:"Descrivi i tre casi estremi di elasticit\xE0 della domanda.",answer:"Perfettamente elastica: curva orizzontale, \u03B7 infinita; a quel prezzo si compra quanto si vuole, appena sopra nulla. Perfettamente rigida: curva verticale, \u03B7 = 0; la quantit\xE0 non cambia mai, come la dose del tossicodipendente. Elasticit\xE0 unitaria: curva a iperbole equilatera, \u03B7 = 1 in ogni punto.",keywords:["orizzontale","infinit","verticale","zero","iperbole"]},{id:"u2-o5",q:"Quali sono le determinanti dell\u2019elasticit\xE0 della domanda?",answer:"Gusti e preferenze (beni frivoli elastici, necessari rigidi, secondo il giudizio del consumatore); possibilit\xE0 di sostituzione (Coca e Pepsi elastiche, caff\xE8 rigido); ampiezza del mercato (una marca di sigarette \xE8 pi\xF9 elastica delle sigarette in generale); periodo di riferimento (nel breve la domanda \xE8 pi\xF9 rigida, come per il metano).",keywords:["gusti","sostitu","ampiezza","periodo","breve"]},{id:"u2-o6",q:"Spiega la relazione tra elasticit\xE0 e ricavo totale.",answer:"Il ricavo \xE8 P \xD7 Q. Con domanda anelastica, se il prezzo sale la quantit\xE0 scende meno che proporzionalmente e il ricavo aumenta (da 1 \u20AC e 100 unit\xE0 a 3 \u20AC e 80 unit\xE0: da 100 a 240 \u20AC). Con domanda elastica la quantit\xE0 scende pi\xF9 che proporzionalmente e il ricavo diminuisce (da 4 \u20AC e 50 a 5 \u20AC e 20: da 200 a 100 \u20AC). Il produttore preferisce una domanda rigida.",keywords:["ricavo","anelastic","aumenta","elastic","diminuisce","rigida"]},{id:"u2-o7",q:"Risolvi e commenta il caso della metropolitana di New York.",answer:"Il biglietto passa da 1,25 a 1,50 $ (+20%) e i passeggeri calano del 4,3%. \u03B7 = \u22124,3 / 20 = \u22120,215: domanda rigida. Il fatturato aumenta perch\xE9 la quantit\xE0 cala meno che proporzionalmente. La stima \xE8 inaffidabile perch\xE9 \xE8 di breve periodo: nel lungo ci si organizza diversamente e la quantit\xE0 pu\xF2 scendere molto di pi\xF9.",keywords:["20%","0,215","rigid","fatturato","breve periodo"]},{id:"u2-o8",q:"Elasticit\xE0 al reddito: come si calcola e cosa dice il segno?",answer:"\xC8 la variazione percentuale della quantit\xE0 domandata diviso la variazione percentuale del reddito. Il segno \xE8 fondamentale: positiva = bene normale (Y1\u2013Y2), zero = reddito insufficiente o saturazione, negativa = bene inferiore (oltre Y3). I beni di lusso sono molto elastici al reddito, quelli necessari rigidi.",keywords:["reddito","segno","normale","inferiore","lusso"]},{id:"u2-o9",q:"Cos\u2019\xE8 l\u2019elasticit\xE0 incrociata e come si usa?",answer:"\xC8 la variazione percentuale della quantit\xE0 di un bene diviso la variazione percentuale del prezzo di un altro bene; va da \u2212\u221E a +\u221E. Zero: beni indipendenti; negativa: complementari (racchette e palline); positiva: sostituti (Coca e Pepsi). L\u2019antitrust la usa per capire se due prodotti stanno nello stesso mercato.",keywords:["altro bene","indipendenti","complementari","sostituti","mercato"]},{id:"u2-o10",q:"Elasticit\xE0 dell\u2019offerta e assorbimento degli shock: spiega con il petrolio.",answer:"L\u2019elasticit\xE0 dell\u2019offerta \u03B5 \xE8 sempre positiva. L\u2019offerta di breve periodo \xE8 pi\xF9 rigida di quella di lungo: se la domanda di petrolio aumenta, nel breve si possono solo sfruttare al massimo i giacimenti esistenti, quindi il nuovo equilibrio si riflette pi\xF9 sui prezzi che sulle quantit\xE0. Nel lungo l\u2019offerta \xE8 pi\xF9 orizzontale e l\u2019aumento si scarica pi\xF9 sulle quantit\xE0.",keywords:["positiva","breve","rigid","prezzi","lungo","quantit\xE0"]},{id:"u2-o11",q:"A San Valentino aumentano di pi\xF9 i prezzi dei fiori o dei cioccolatini? Perch\xE9?",answer:"Dei fiori: la loro quantit\xE0 offerta \xE8 limitata perch\xE9 non si possono coltivare in anticipo n\xE9 tenere in magazzino (le rose marciscono). L\u2019offerta \xE8 rigida e l\u2019aumento di domanda si scarica sul prezzo. I cioccolatini invece si producono durante l\u2019anno e si stoccano.",keywords:["fiori","rigid","magazzino","cioccolatini","scorta"]},{id:"u2-o12",q:"Sigarette: confronta la campagna di sensibilizzazione e l\u2019imposta.",answer:"La campagna sposta la curva di domanda a sinistra (a 2 \u20AC da 20 a 10 sigarette): sembra pi\xF9 efficace ma \xE8 un\u2019ipotesi e nel lungo periodo l\u2019effetto cala perch\xE9 chi fuma non legge i pacchetti. L\u2019imposta porta il prezzo a 4 \u20AC e fa muovere lungo la curva (da 20 a 12): \xE8 pi\xF9 realistica, anche se la domanda dovrebbe essere ancora pi\xF9 rigida perch\xE9 c\u2019\xE8 dipendenza.",keywords:["sposta","sinistra","ipotetic","lungo la curva","prezzo","dipendenza"]},{id:"u2-o13",q:"Analizza il caso della mucca pazza.",answer:"L\u2019annuncio del possibile contagio fa crollare la domanda di carne bovina. Nel breve gli allevatori non possono cambiare produzione (offerta rigida), quindi il prezzo scende moltissimo. Per i sostituti, carne suina e pollo, la domanda aumenta ma l\u2019offerta \xE8 rigida: i prezzi salgono. Nel lungo periodo gli allevatori si riconvertono e il mercato si riequilibra.",keywords:["domanda","crolla","offerta rigida","prezzo","sostituti","lungo"]},{id:"u2-o14",q:"Sindaco di Ferrara: agire sull\u2019offerta o sulla domanda di droga?",answer:"Arrestare gli spacciatori riduce l\u2019offerta: con domanda rigida la quantit\xE0 cala poco e il prezzo sale molto, quindi i tossicodipendenti hanno bisogno di pi\xF9 soldi e la criminalit\xE0 pu\xF2 aumentare. Le campagne di rieducazione agiscono sulla domanda e fanno calare di pi\xF9 la quantit\xE0, ma chi \xE8 gi\xE0 dipendente non cambia, il prezzo crolla e gli spacciatori cercano nuovi consumatori.",keywords:["offerta","rigida","prezzo sale","criminalit\xE0","domanda","prezzo scende"]},{id:"u2-o15",q:"Risolvi l\u2019esercizio di Giuseppe (elasticit\xE0 al prezzo da 8 a 10 \u20AC con reddito 10.000 e 12.000).",answer:"Reddito 10.000: Q da 40 a 32, quindi \u221220% contro +25% di prezzo: \u03B7 = \u22120,8 (punto medio: \u22128/36 diviso 2/9 = \u22121). Reddito 12.000: Q da 50 a 45, \u221210% contro +25%: \u03B7 = \u22120,4 (punto medio \u2248 \u22120,47). L\u2019elasticit\xE0 al reddito a 12 \u20AC \xE8 25%/20% = 1,25, a 16 \u20AC \xE8 50%/20% = 2,5: bene normale. Si cambia una variabile alla volta, ceteris paribus.",keywords:["0,8","0,4","1,25","2,5","ceteris paribus"]}],cards:[{id:"u2-c1",front:"Surplus del consumatore",back:"Disponibilit\xE0 a pagare \u2212 prezzo. Area sopra P* e sotto la domanda."},{id:"u2-c2",front:"Surplus del produttore",back:"Prezzo \u2212 prezzo minimo a cui si vende. Area sotto P* e sopra l\u2019offerta."},{id:"u2-c3",front:"Benessere sociale (neoclassici)",back:"Somma di surplus del consumatore e del produttore."},{id:"u2-c4",front:"Elasticit\xE0 al prezzo \u03B7",back:"\u03B7 = (\u0394Q/Q) / (\u0394P/P). Sempre negativa."},{id:"u2-c5",front:"Domanda anelastica",back:"0 < |\u03B7| < 1: Q varia meno che proporzionalmente. Se P \u2191, ricavo \u2191."},{id:"u2-c6",front:"Domanda elastica",back:"|\u03B7| > 1: Q varia pi\xF9 che proporzionalmente. Se P \u2191, ricavo \u2193."},{id:"u2-c7",front:"Domanda perfettamente rigida",back:"Verticale, \u03B7 = 0 (dose del tossicodipendente)."},{id:"u2-c8",front:"Domanda perfettamente elastica",back:"Orizzontale, \u03B7 = \u221E."},{id:"u2-c9",front:"Elasticit\xE0 unitaria costante",back:"Iperbole equilatera: P \xD7 Q costante."},{id:"u2-c10",front:"Metodo del punto medio",back:"Variazione % = (finale \u2212 iniziale) / media dei due valori."},{id:"u2-c11",front:"Determinanti dell\u2019elasticit\xE0",back:"Gusti, possibilit\xE0 di sostituzione, ampiezza del mercato, periodo di riferimento."},{id:"u2-c12",front:"Elasticit\xE0 al reddito",back:"\u0394Q% / \u0394Y%. Positiva = normale, negativa = inferiore."},{id:"u2-c13",front:"Elasticit\xE0 incrociata",back:"\u0394Q1% / \u0394P2%. + sostituti, \u2212 complementari, 0 indipendenti."},{id:"u2-c14",front:"Elasticit\xE0 dell\u2019offerta \u03B5",back:"\u0394Qs% / \u0394P%. Sempre positiva; pi\xF9 rigida nel breve periodo."},{id:"u2-c15",front:"Metro di New York",back:"1,25 \u2192 1,50 $ (+20%), passeggeri \u22124,3%: \u03B7 = \u22120,215, ricavo \u2191."},{id:"u2-c16",front:"San Valentino",back:"Salgono di pi\xF9 i prezzi dei fiori: offerta rigida, non si stoccano."},{id:"u2-c17",front:"Mucca pazza",back:"Domanda bovina crolla, prezzo \u2193; prezzi di suino e pollo \u2191."},{id:"u2-c18",front:"Droga: arrestare spacciatori",back:"Offerta \u2193 con domanda rigida: prezzo \u2191 molto, rischio pi\xF9 criminalit
