Cosa significa il principio \u201Cuna testa, un voto\u201D?",options:["Ogni socio vota alla pari, qualunque sia il suo capitale","Vota solo il presidente, eletto dai soci fondatori","Si vota in base al capitale versato da ciascun socio","Votano solo i manager, che rappresentano i soci"],answer:0,explain:"\xC8 il controllo democratico da parte dei soci."},{id:"u6-5-3",type:"num",topic:"Cooperativa",q:"In Italia, quale percentuale degli utili ogni cooperativa versa a un fondo per nuove cooperative o cooperative in difficolt\xE0?",answer:3,tol:0,unit:"%",explain:"\xC8 la mutualit\xE0 verso l\u2019esterno."},{id:"u6-5-4",type:"mc",topic:"Ristorni",q:"Come vengono redistribuiti gli utili in una cooperativa?",options:["Come ristorni, proporzionali all\u2019intensit\xE0 dello scambio mutualistico","Come dividendi, proporzionali al capitale versato","Interamente al presidente e al consiglio di amministrazione","Non vengono mai redistribuiti ai soci"],answer:0,explain:"Ad esempio incrementi salariali o prezzi pi\xF9 convenienti."},{id:"u6-5-5",type:"match",topic:"Tipi di cooperative",q:"Abbina ogni tipo di cooperativa al paese d\u2019origine",pairs:[["Produzione e lavoro","Francia"],["Consumo (Rochdale)","Regno Unito"],["Credito","Germania"],["Agricola","Danimarca"]],explain:"Le cooperative nascono quasi contemporaneamente in diversi luoghi d\u2019Europa."},{id:"u6-5-6",type:"mc",topic:"Tipi di cooperative",q:"La Coop vende anche ai non soci, a condizioni meno favorevoli. \xC8 una cooperativa\u2026",options:["mista","pura","spuria","sociale"],answer:0,explain:"Pure: solo soci. Miste: anche non soci."},{id:"u6-5-7",type:"mc",topic:"Effetti sul mercato",q:"Che effetto hanno le cooperative di consumo sul mercato?",options:["Calmierano i prezzi e impediscono monopoli nella distribuzione","Aumentano la concentrazione del mercato della distribuzione","Creano monopsoni nei confronti dei fornitori agricoli","Alzano i prezzi per remunerare i soci"],answer:0,explain:"Le cooperative di lavoro e agricole invece aiutano a superare i monopsoni."},{id:"u6-5-8",type:"mc",topic:"Limiti",q:"Qual \xE8 un problema concreto del modello cooperativo?",options:["La sotto-capitalizzazione: i soci partecipano al capitale solo quanto basta","L\u2019eccesso di dividendi distribuiti ai soci","La troppa disuguaglianza salariale tra soci e dirigenti","I troppi licenziamenti durante le crisi"],answer:0,explain:"Il capitale non \xE8 remunerato, quindi \xE8 difficile raccogliere risorse. Rimedi: riserve e credito bancario."},{id:"u6-5-9",type:"tf",topic:"Limiti",q:"La teoria degli effetti \u201Cperversi\u201D dal lato dell\u2019offerta nelle cooperative di produzione trova ampio riscontro nella realt\xE0.",answer:!1,explain:"Ha poca corrispondenza: la domanda di lavoro nelle cooperative \xE8 pi\xF9 rigida."},{id:"u6-5-10",type:"mc",topic:"Cooperative spurie",q:"Cosa sono le cooperative spurie?",options:["Cooperative solo sulla carta, gestite come imprese private","Cooperative miste, che servono anche i non soci","Cooperative fallite e poi trasformate in societ\xE0 private","Cooperative sociali che offrono servizi socio-sanitari"],answer:0,explain:"Bisogna farci attenzione perch\xE9 tradiscono i principi cooperativi."},{id:"u6-5-11",type:"tf",topic:"Cooperativa",q:"Nelle crisi le cooperative tendono a licenziare meno: \u201Clavorare meno, lavorare tutti\u201D.",answer:!0,explain:"\xC8 una delle caratteristiche distintive del modello."}]},{id:"u6l6",title:"Impresa sociale e multinazionale",icon:"\u{1F30D}",theory:[{title:"L\u2019impresa sociale (no profit)",points:["Unisce natura **imprenditoriale** (volontaria, autonoma, innovativa, propensa al rischio) e **finalit\xE0 sociale**. Conta la finalit\xE0, non il profitto.","Opera nei settori di pubblica utilit\xE0, a **prezzi inferiori** al mercato, con lavoro in parte volontario e salari pi\xF9 bassi compensati da una forte motivazione etica. Deve comunque rispettare l\u2019**equilibrio economico-finanziario**; spesso finanziata da contributi volontari; decisioni democratiche; meno conflitto principale-agente.","Nasce per tre motivi: **1.** settori dove il consumatore fatica a valutare la qualit\xE0 (sanit\xE0, istruzione): il non-profit segnala fiducia; **2.** fallimenti di mercato con **domanda eterogenea** a cui lo Stato, che offre servizi standard, risponde male; **3.** settori non coperti dal **welfare** o con troppa burocrazia (assistenza domiciliare agli anziani).","Esempi: ONG, volontariato, cooperative sociali (ibride), fondazioni bancarie, associazioni di promozione sociale. Manca ancora un modo condiviso di misurare l\u2019**impatto sociale**."]},{title:"L\u2019impresa multinazionale",points:["Possiede e controlla attivit\xE0 in **pi\xF9 paesi**: casa madre pi\xF9 affiliate e sussidiarie. Si spiega con la teoria dell\u2019**internalizzazione** (dai costi di transazione): integra a monte e a valle dove il buy costa pi\xF9 del make.","Integrazione **operativa** (forniture da pi\xF9 paesi gestite internamente, produzione dove costa meno) e dei **flussi di conoscenza** (si compra direttamente il centro di R&S perch\xE9 \xE8 difficile dare un prezzo alla conoscenza).","Vantaggi: coordinamento, **discriminazione di prezzo** tra paesi, meno negoziazioni e incertezze, scambi interni non tassati come quelli tra imprese, adattamento ai mercati locali.","Svantaggi: costi di coordinamento (distanza fisica e culturale), **liability of foreignness** (non conoscere leggi, lingua, cultura), minore flessibilit\xE0 e resilienza.","**Greenfield**: nuovo stabilimento all\u2019estero. **Brownfield**: acquisto di un\u2019impresa esistente. Interesse durevole sopra il **10%** dei voti (sotto \xE8 speculativo); sopra il **50%** sussidiaria; al **100%** posseduta totalmente.","Tendenze: meno investimenti diretti, pi\xF9 accordi **non-equity** e catene globali del valore; **fabbrica globale** (la casa madre tiene gli asset intangibili); investimenti pi\xF9 volatili; pi\xF9 multinazionali dai paesi emergenti (Cina)."]}],exercises:[{id:"u6-6-1",type:"mc",topic:"Impresa sociale",q:"Cosa rende peculiare l\u2019impresa sociale rispetto alle altre?",options:["La finalit\xE0 sociale, non il profitto","Il controllo diretto dello Stato sulla sua gestione","La quotazione in borsa per raccogliere donazioni","L\u2019assenza di qualsiasi vincolo di bilancio"],answer:0,explain:"Deve comunque mantenere l\u2019equilibrio economico-finanziario."},{id:"u6-6-2",type:"match",topic:"Impresa sociale",q:"Abbina ogni motivo di nascita delle imprese sociali all\u2019esempio",pairs:[["Qualit\xE0 difficile da valutare","Sanit\xE0 e istruzione"],["Domanda eterogenea mal servita dallo Stato","Servizi personalizzati a livello locale"],["Settori non coperti dal welfare","Assistenza domiciliare agli anziani"]],explain:"Non orientate al profitto, non hanno interesse a ridurre la qualit\xE0 per guadagnare di pi\xF9."},{id:"u6-6-3",type:"tf",topic:"Impresa sociale",q:"Esiste un metodo consolidato e condiviso per misurare l\u2019impatto sociale delle imprese sociali.",answer:!1,explain:"Non si possono usare i parametri delle imprese for profit e non c\u2019\xE8 ancora consenso sulle valutazioni d\u2019impatto."},{id:"u6-6-4",type:"mc",topic:"Multinazionale",q:"Da quale teoria deriva la spiegazione dell\u2019impresa multinazionale?",options:["Dalla teoria dei costi di transazione (internalizzazione)","Dalla teoria neoclassica dei prezzi","Dal paradigma struttura-comportamenti-performance","Dalle teorie comportamentali di Cyert e March"],answer:0,explain:"Integra a monte e a valle dove comprare sul mercato costa pi\xF9 che produrre internamente."},{id:"u6-6-5",type:"mc",topic:"Liability of foreignness",q:"Un\u2019impresa di Tokyo apre una fabbrica a Bangkok e deve imparare leggi, lingua e usi locali. Questo costo si chiama\u2026",options:["liability of foreignness","costo opportunit\xE0 dell\u2019investimento estero","rent seeking verso il governo thailandese","azzardo morale dei manager locali"],answer:0,explain:"\xC8 un costo aggiuntivo rispetto alle imprese locali."},{id:"u6-6-6",type:"match",topic:"Investimento",q:"Abbina ogni soglia di partecipazione al suo significato",pairs:[["Meno del 10%","Interesse speculativo"],["Pi\xF9 del 10%","Interesse durevole"],["Pi\xF9 del 50%","Sussidiaria"],["100%","Posseduta totalmente"]],explain:"Valgono per gli investimenti brownfield."},{id:"u6-6-7",type:"mc",topic:"Investimento",q:"Un\u2019impresa diventa multinazionale costruendo da zero uno stabilimento all\u2019estero. \xC8 un investimento\u2026",options:["greenfield","brownfield","non-equity","speculativo"],answer:0,explain:"Brownfield invece \xE8 l\u2019acquisto di un\u2019impresa gi\xE0 esistente."},{id:"u6-6-8",type:"mc",topic:"Multinazionale",q:"Quale di questi \xE8 un vantaggio della multinazionale?",options:["Pu\xF2 discriminare i prezzi tra paesi diversi","Non ha costi di coordinamento tra le filiali","\xC8 pi\xF9 flessibile e resiliente agli shock","Conosce gi\xE0 leggi, lingua e culture locali"],answer:0,explain:"Altri vantaggi: coordinamento, meno negoziazioni, scambi interni non tassati, adattamento ai mercati locali."},{id:"u6-6-9",type:"mc",topic:"Tendenze",q:"Cos\u2019\xE8 la \u201Cfabbrica globale\u201D?",options:["La casa madre tiene solo gli asset intangibili","Una fabbrica con dipendenti di tutti i paesi del mondo","Un monopolio mondiale protetto da brevetti","Una cooperativa internazionale di produttori"],answer:0,explain:"\xC8 una delle tendenze recenti, insieme agli accordi non-equity e alle catene globali del valore."},{id:"u6-6-10",type:"tf",topic:"Tendenze",q:"Negli ultimi decenni l\u2019investimento diretto estero \xE8 aumentato a scapito degli accordi non-equity.",answer:!1,explain:"\xC8 il contrario: diminuisce l\u2019investimento diretto estero a favore di accordi non-equity e catene globali del valore."}]}],open:[{id:"u6-o1",q:"Cos\u2019\xE8 la teoria della variet\xE0 dei capitalismi e perch\xE9 \xE8 importante?",answer:"Mostra che il caso americano non \xE8 l\u2019unica traiettoria di sviluppo. Tra mercato e impresa verticalmente integrata ci sono molte sfumature, e in ogni sistema economico coesistono diverse forme di impresa con intensit\xE0 diverse: in Italia contano molto PMI e lavoratori in proprio, in Cina le imprese di Stato. Si studiano gruppi di imprese (Zaibatsu, Keiretsu, Chaebol), forme di impresa (pubblica, cooperativa, sociale, multinazionale) e sistemi di imprese.",keywords:["americano","traiettoria","coesistono","intensit\xE0","gruppi di imprese"]},{id:"u6-o2",q:"Descrivi gli Zaibatsu: origine, struttura e ruolo.",answer:"Ricchezza prodotta da potenti famiglie. Nascono con la Rivoluzione Meiji del 1868, quando l\u2019imperatore modernizza il paese alleandosi con le famiglie ricche. Sono grandi gruppi a struttura piramidale: la famiglia possiede una holding che controlla sussidiarie in molti settori, quindi propriet\xE0 e controllo coincidono. Lo Stato crea domanda (anche bellica) e li rende campioni dell\u2019export e del catching-up. Big Four: Mitsubishi, Mitsui, Sumitomo, Yasuda; nel 1944 le loro banche controllavano il 75% dei prestiti.",keywords:["famiglie","Meiji","piramidale","holding","Stato","catching-up","Big Four"]},{id:"u6-o3",q:"In cosa gli Zaibatsu differiscono dalla grande impresa statunitense?",answer:"Controllo familiare invece di azionariato diffuso; management nominato dalla famiglia per capacit\xE0 e lealt\xE0; strategie legate agli interessi nazionali; acquisti e vendite centralizzati in compagnie affiliate con prezzi interni pi\xF9 bassi; credito solo dalla banca del gruppo, con cessioni azionarie solo in casi eccezionali.",keywords:["familiare","lealt\xE0","interessi nazionali","centralizzat","banca del gruppo"]},{id:"u6-o4",q:"Come si passa dagli Zaibatsu ai Keiretsu?",answer:"Dopo la Seconda guerra mondiale il Giappone \xE8 a sovranit\xE0 limitata e il piano McArthur prevede lo smantellamento degli Zaibatsu: su 83 ne vengono smantellati solo 19, poi trasformati in Keiretsu. Le banche non vengono toccate. Con la Guerra fredda il Giappone diventa alleato strategico degli USA e deve prosperare. Il Keiretsu, rete senza testa, \xE8 un gruppo collegato a una banca con azionariato incrociato: sparisce il ruolo della famiglia.",keywords:["McArthur","83","19","banche","Guerra fredda","rete senza testa"]},{id:"u6-o5",q:"Distingui Keiretsu orizzontali e verticali.",answer:"Gli orizzontali (Big Six: Mitsui, Mitsubishi, Sumitomo, Fuyo, Sanwa, Dai Ichi Kangyo) riuniscono imprese di settori diversi, indipendenti ma cooperative, legate da incroci azionari con la banca, che \xE8 il finanziatore centrale. I verticali (Toyota, Nissan, Honda, Hitachi, Toshiba, Sony) integrano l\u2019intera filiera di un settore: i fornitori di secondo e terzo livello lavorano in esclusiva per la casa madre, che \xE8 monopsonista e scarica i costi sui fornitori pi\xF9 piccoli.",keywords:["orizzontali","settori diversi","banca","verticali","filiera","monopsonista"]},{id:"u6-o6",q:"Quali sono pregi e difetti del caso giapponese?",answer:"Propriet\xE0 e controllo incrociati riducono i conflitti tra management e azionisti, grazie alla centralit\xE0 della banca. Le grandi dimensioni danno flessibilit\xE0 produttiva tramite una galassia di PMI, ma anche fragilit\xE0 e rigidit\xE0 per la complessit\xE0 interna. L\u2019economia dipende da pochi gruppi, c\u2019\xE8 scarsa mobilit\xE0 sociale e nascono poche nuove imprese. Lo stretto legame con lo Stato aiuta il coordinamento per il catching-up ma favorisce corruzione e scambio di consenso.",keywords:["incrociat","flessibilit\xE0","fragilit\xE0","mobilit\xE0 sociale","Stato","corruzione"]},{id:"u6-o7",q:"Descrivi i Chaebol coreani.",answer:"Ricchezza prodotta da una famiglia: gruppi di imprese formalmente indipendenti, senza holding, controllati amministrativamente e finanziariamente da una famiglia legata allo Stato. Si sviluppano dopo la guerra di Corea con il programma di industrializzazione del governo Park. Lo Stato li sostiene ma monitora le performance e lega i sussidi agli obiettivi. Propriet\xE0 e controllo ai familiari, management scelto per lealt\xE0, successione da padre in figlio: decisioni rapide ma potere concentrato. Oggi sono campioni dell\u2019export e vendono l\u201984,3% della produzione.",keywords:["una famiglia","senza holding","Park","monitora","lealt\xE0","padre in figlio","84,3"]},{id:"u6-o8",q:"Cos\u2019\xE8 l\u2019impresa pubblica e come si garantisce che sia efficiente?",answer:"\xC8 posseduta o controllata da autorit\xE0 di governo: impresa pubblica (soggetta al diritto pubblico) o societ\xE0 a controllo pubblico (gestione privatistica con quote statali). Persegue l\u2019interesse pubblico: politiche industriali, beni pubblici, monopoli naturali, industrie strategiche; il profitto \xE8 solo un vincolo. Entrano in conflitto interessi del manager, buona gestione e interesse pubblico, e manca un proprietario interessato all\u2019efficienza. Si usano la competizione tra imprese pubbliche e la sostituibilit\xE0 dei manager.",keywords:["governo","diritto pubblico","interesse pubblico","vincolo","competizione","sostitui"]},{id:"u6-o9",q:"Illustra i principi dell\u2019impresa cooperativa.",answer:"Scopo mutualistico: dare ai soci beni, servizi o lavoro a condizioni migliori del mercato, senza fini di lucro. Adesione libera e volontaria con quote capitale; controllo democratico \u201Cuna testa, un voto\u201D; si remunera il lavoro e non il capitale; i soci sono co-imprenditori e i manager dipendono da loro; mutualit\xE0 anche verso l\u2019esterno (3% degli utili a un fondo); niente dividendi ma ristorni proporzionali allo scambio mutualistico.",keywords:["mutualistico","volontaria","una testa","lavoro","3%","ristorni"]},{id:"u6-o10",q:"Quali tipi di cooperative esistono?",answer:"Per missione: produzione e lavoro (Francia), consumo (Regno Unito, Rochdale), credito (Germania), edilizia (case ai soci a prezzo di costo), agricola (Danimarca), sociale (servizi socio-sanitari, educativi, di inserimento). Per destinatari: pure, se lavorano solo per i soci; miste, se servono anche i non soci a condizioni meno favorevoli, come la Coop.",keywords:["lavoro","consumo","credito","agricola","sociale","pure","miste"]},{id:"u6-o11",q:"Quali effetti e limiti ha il modello cooperativo?",answer:"Effetti: controllo ai soci; meno disuguaglianze salariali; il lavoro come autorealizzazione; meno licenziamenti negli shock. Le cooperative di consumo calmierano i prezzi e frenano i monopoli della distribuzione; quelle di lavoro e agricole superano i monopsoni. Limiti: la teoria degli effetti perversi sull\u2019offerta ha poco riscontro; il problema reale \xE8 la sotto-capitalizzazione e lo scarso interesse a investire, risolvibile con riserve e credito bancario. Attenzione alle cooperative spurie.",keywords:["disuguaglianze","licenziamenti","calmier","monopsoni","sotto-capitalizzazione","spurie"]},{id:"u6-o12",q:"Cos\u2019\xE8 l\u2019impresa sociale e perch\xE9 nasce?",answer:"Unisce natura imprenditoriale e finalit\xE0 sociale: fornisce un servizio a favore della comunit\xE0, non per il profitto, a prezzi inferiori al mercato, con lavoro in parte volontario, rispettando l\u2019equilibrio economico-finanziario. Nasce dove il consumatore fatica a valutare la qualit\xE0 (sanit\xE0, istruzione), dove la domanda \xE8 eterogenea e lo Stato offre servizi standard, e dove il welfare non arriva o \xE8 troppo burocratico. Non c\u2019\xE8 ancora una misura condivisa del suo impatto sociale.",keywords:["imprenditoriale","sociale","volontario","qualit\xE0","eterogenea","welfare"]},{id:"u6-o13",q:"Cos\u2019\xE8 un\u2019impresa multinazionale e perch\xE9 nasce?",answer:"\xC8 un\u2019impresa che possiede e controlla attivit\xE0 in pi\xF9 paesi, con casa madre, affiliate e sussidiarie. Si spiega con la teoria dell\u2019internalizzazione derivata dai costi di transazione: integra attivit\xE0 a monte e a valle dove il buy costa pi\xF9 del make. L\u2019integrazione pu\xF2 essere operativa (forniture internazionali gestite internamente, produzione dove costa meno) o dei flussi di conoscenza (si integra la R&S perch\xE9 \xE8 difficile dare un prezzo alla conoscenza).",keywords:["pi\xF9 paesi","internalizzazione","costi di transazione","operativa","conoscenza"]},{id:"u6-o14",q:"Vantaggi, svantaggi e tipi di investimento della multinazionale.",answer:"Vantaggi: coordinamento delle fasi, discriminazione di prezzo tra paesi, meno negoziazioni e incertezze, scambi interni non tassati come quelli tra imprese, adattamento ai mercati locali. Svantaggi: costi di coordinamento per distanza fisica e culturale, liability of foreignness, minore flessibilit\xE0 e resilienza. Greenfield: nuovi stabilimenti all\u2019estero; brownfield: acquisto di imprese esistenti, con interesse durevole sopra il 10%, sussidiaria sopra il 50%, possesso totale al 100%.",keywords:["discriminazione","liability of foreignness","greenfield","brownfield","10%","50%"]},{id:"u6-o15",q:"Quali sono le tendenze recenti delle multinazionali?",answer:"Dopo la crescita dal secondo dopoguerra, diminuisce l\u2019investimento diretto estero a favore di accordi non-equity e catene globali del valore. Nasce la fabbrica globale: la casa madre lascia la produzione e tiene gli asset intangibili come la R&S, coordinando informazioni e consumatori. L\u2019investimento diventa pi\xF9 volatile, da strumento di sviluppo a strumento di sfruttamento locale, e crescono le multinazionali dei paesi emergenti come la Cina.",keywords:["non-equity","catene globali","fabbrica globale","intangibili","volatile","emergenti"]}],cards:[{id:"u6-c1",front:"Zaibatsu",back:"\u201CRicchezza di potenti famiglie\u201D: gruppo piramidale famiglia \u2192 holding \u2192 sussidiarie, legato allo Stato."},{id:"u6-c2",front:"Rivoluzione Meiji",back:"1868: l\u2019imperatore modernizza il Giappone alleandosi con le famiglie ricche."},{id:"u6-c3",front:"Big Four",back:"Mitsubishi, Mitsui, Sumitomo, Yasuda."},{id:"u6-c4",front:"Piano McArthur",back:"Su 83 Zaibatsu, solo 19 smantellati (poi Keiretsu); banche intatte."},{id:"u6-c5",front:"Keiretsu",back:"\u201CRete senza testa\u201D: gruppo guidato da una banca, con azionariato incrociato."},{id:"u6-c6",front:"Keiretsu orizzontale",back:"Settori diversi intorno a una banca (Big Six)."},{id:"u6-c7",front:"Keiretsu verticale",back:"Intera filiera (Toyota): casa madre monopsonista, fornitori in esclusiva."},{id:"u6-c8",front:"Chaebol",back:"\u201CRicchezza di una famiglia\u201D: imprese indipendenti senza holding, controllate da una famiglia; 84,3% della produzione."},{id:"u6-c9",front:"Governo Park",back:"Industrializzazione coreana tramite conglomerati, con monitoraggio delle performance."},{id:"u6-c10",front:"Impresa pubblica: obiettivo",back:"Interesse pubblico; il profitto \xE8 un vincolo, non un obiettivo."},{id:"u6-c11",front:"Impresa pubblica: 3 interessi",back:"Del manager, della buona gestione, pubblico."},{id:"u6-c12",front:"Cooperativa",back:"Scopo mutualistico, una testa un voto, ristorni invece di dividendi."},{id:"u6-c13",front:"Ristorno",back:"Utile restituito al socio in proporzione allo scambio mutualistico."},{id:"u6-c14",front:"Cooperativa mista",back:"Serve anche i non soci, a condizioni meno favorevoli (Coop)."},{id:"u6-c15",front:"Cooperativa spuria",back:"Formalmente cooperativa, gestita come un\u2019impresa privata."},{id:"u6-c16",front:"Impresa sociale: 3 motivi",back:"Qualit\xE0 difficile da valutare; domanda eterogenea; settori non coperti dal welfare."},{id:"u6-c17",front:"Liability of foreignness",back:"Costo extra di una multinazionale rispetto alle imprese locali (leggi, lingua, cultura)."},{id:"u6-c18",front:"Greenfield / Brownfield",back:"Nuovo stabilimento all\u2019estero / acquisto di impresa esistente."},{id:"u6-c19",front:"Soglie di partecipazione",back:"> 10% interesse durevole; > 50% sussidiaria; 100% posseduta."},{id:"u6-c20",front:"Fabbrica globale",back:"La casa madre tiene gli asset intangibili e coordina, lascia la produzione."}]},k0=Cz;var Sz={id:"u7",n:7,title:"Sistemi di imprese",subtitle:"Distretti, reti e catene globali",color:"#65A30D",colorDark:"#4D7C0F",lessons:[{id:"u7l1",title:"Fiducia e reputazione",icon:"\u{1F4AC}",theory:[{title:"Cosa sono i sistemi di imprese",points:["Imprese **indipendenti** (formalmente e sostanzialmente) che scambiano sul mercato, ma traggono vantaggio da una **prossimit\xE0** reciproca, geografica o relazionale, che rende il rapporto diverso da un semplice contratto.","Sono una risposta ai **costi di transazione** alternativa all\u2019integrazione verticale. Ricorda: mercato = scambi liberi, incertezza, contratti imperfetti; impresa = gerarchia, certezza."]},{title:"Fiducia e reputazione",points:["**Fiducia**: aspettativa che la controparte si comporti correttamente.","**Reputazione**: insieme di informazioni trasmissibili sulla storia di comportamento corretto di un operatore.","I costi di transazione crescono con incertezza, specificit\xE0 e frequenza. Con **transazioni ripetute** e rapporti stabili circolano informazioni sulle capacit\xE0 tecniche e morali: pi\xF9 fiducia, meno asimmetrie (meno selezione avversa), senza bisogno di integrarsi.","Nessuno ha incentivo all\u2019**opportunismo**, perch\xE9 rovinerebbe la propria reputazione.","Le forme di organizzazione stanno su un **continuo**: da rapporti basati su fiducia e reputazione a rapporti gerarchici (verso Zaibatsu e Keiretsu)."]}],exercises:[{id:"u7-1-1",type:"mc",topic:"Sistemi di imprese",q:"Cosa caratterizza un sistema di imprese?",options:["Imprese indipendenti che sfruttano una prossimit\xE0 reciproca","Un\u2019unica grande impresa verticalmente integrata","Imprese controllate da una holding familiare","Imprese pubbliche coordinate da un piano dello Stato"],answer:0,explain:"La prossimit\xE0 rende la relazione diversa da un semplice contratto di scambio."},{id:"u7-1-2",type:"match",topic:"Fiducia e reputazione",q:"Abbina ogni concetto alla definizione",pairs:[["Fiducia","Aspettativa di comportamento corretto della controparte"],["Reputazione","Informazioni trasmissibili sulla storia di comportamento corretto"]],explain:"Insieme abbassano i costi di transazione senza integrazione."},{id:"u7-1-3",type:"mc",topic:"Fiducia e reputazione",q:"Perch\xE9 in un sistema di imprese l\u2019operatore non ha incentivo all\u2019opportunismo?",options:["Perch\xE9 rovinerebbe la propria reputazione nei rapporti ripetuti","Perch\xE9 l\u2019opportunismo tra imprese \xE8 vietato per legge","Perch\xE9 le imprese appartengono tutte alla stessa famiglia","Perch\xE9 nei sistemi di imprese non esistono contratti"],answer:0,explain:"In scambi ripetuti le informazioni circolano e il comportamento scorretto viene scoperto."},{id:"u7-1-4",type:"tf",topic:"Costi di transazione",q:"I sistemi di imprese sono una modalit\xE0 alternativa all\u2019integrazione verticale per rispondere ai costi di transazione.",answer:!0,explain:"Provano a ridurre i problemi del mercato senza la gerarchia dell\u2019impresa."},{id:"u7-1-5",type:"fill",topic:"Fiducia e reputazione",text:"Con transazioni ___ e rapporti stabili aumenta la fiducia e diminuiscono le asimmetrie informative, come la selezione ___.",answers:["ripetute","avversa"],extra:["occasionali","naturale"],explain:"Gli scambi avvengono su basi fiduciarie."},{id:"u7-1-6",type:"mc",topic:"Continuo organizzativo",q:"Su un continuo tra relazioni basate sulla fiducia e relazioni gerarchiche, dove stanno Zaibatsu e Keiretsu?",options:["Verso il polo gerarchico","Verso il polo di fiducia e reputazione","Esattamente al centro","Fuori dal continuo: sono mercati puri"],answer:0,explain:"Alcuni sistemi puntano alla gerarchia, altri a reputazione e fiducia."},{id:"u7-1-7",type:"match",topic:"Mercato e impresa",q:"Abbina",pairs:[["Mercato","Scambi liberi, incertezza, contratti imperfetti"],["Impresa","Gerarchia e certezza"],["Sistema di imprese","Indipendenza pi\xF9 prossimit\xE0"]],explain:"I sistemi di imprese sono modalit\xE0 intermedie."},{id:"u7-1-8",type:"tf",topic:"Costi di transazione",q:"Per la teoria dei costi di transazione, incertezza, specificit\xE0 e frequenza degli scambi fanno aumentare i costi di transazione.",answer:!0,explain:"Ma con transazioni ripetute, fiducia e reputazione possono abbassarli senza integrare le imprese."},{id:"u7-1-9",type:"mc",topic:"Fiducia e reputazione",q:"In un sistema di imprese con rapporti stabili, cosa circola pi\xF9 facilmente?",options:["Informazioni sulle capacit\xE0 tecniche e morali degli operatori","Ordini gerarchici della casa madre","Quote azionarie incrociate tra le imprese","Sussidi pubblici destinati al territorio"],answer:0,explain:"Cos\xEC si crea un\u2019aspettativa positiva (fiducia) e gli scambi avvengono su basi fiduciarie."}]},{id:"u7l2",title:"Cluster e distretti",icon:"\u{1F4CD}",theory:[{title:"Cluster",points:["Luoghi geograficamente circoscritti con produzione specializzata e vantaggi legati alla **prossimit\xE0 geografica**. Esempi: Silicon Valley, distretti italiani, citt\xE0 specializzate del Guangdong.","Non ci sono solo imprese ma anche altri attori: scuole, universit\xE0, agenzie di sviluppo, centri di innovazione, associazioni di categoria.","**Cluster**: insieme di imprese e attivit\xE0 complementari specializzate in uno o pi\xF9 beni collegati (anche nella filiera), localizzate in un\u2019area. Il luogo \xE8 **spazio fisico**: non conta quale posto.","Si valuta con la **performance economica**, l\u2019internazionalizzazione, la competitivit\xE0."]},{title:"Distretto industriale",points:["**Becattini (1989)**: \u201Centit\xE0 socio-territoriale caratterizzata dalla compresenza attiva, in un\u2019area circoscritta, naturalisticamente e storicamente determinata, di una **comunit\xE0 di persone** e di una **popolazione di imprese**\u201D.","Il luogo \xE8 un **fatto sociale**: la storia conta. A Prato alcuni imprenditori rilevano i macchinari di una grande impresa tessile in crisi e aprono piccole fabbriche: nasce il distretto.","Di solito un\u2019impresa media e una miriade di PMI indipendenti e specializzate che si dividono il lavoro.","Radicamento sociale: contatti personali anche fuori dal lavoro, molta fiducia.","Si valuta con la performance economica **e** lo **sviluppo umano**."]}],exercises:[{id:"u7-2-1",type:"mc",topic:"Distretto industriale",q:"Chi ha definito il distretto industriale come \u201Centit\xE0 socio-territoriale\u201D con una comunit\xE0 di persone e una popolazione di imprese?",options:["Becattini (1989)","Coase (1937)","Chandler (1965)","Cyert e March (1963)"],answer:0,explain:"\xC8 la definizione classica dei distretti italiani."},{id:"u7-2-2",type:"match",topic:"Cluster e distretti",q:"Abbina ogni caratteristica a cluster o distretto",pairs:[["Luogo come spazio fisico","Cluster"],["Luogo come fatto sociale e storico","Distretto"],["Valutato con la sola performance economica","Cluster"],["Valutato anche con lo sviluppo umano","Distretto"]],explain:"Il distretto ha in pi\xF9 la dimensione sociale e storica."},{id:"u7-2-3",type:"tf",topic:"Cluster",q:"In un cluster ci sono solo imprese, nessun altro attore.",answer:!1,explain:"Ci sono anche universit\xE0, scuole, agenzie di sviluppo, centri di innovazione, associazioni di categoria."},{id:"u7-2-4",type:"mc",topic:"Distretto industriale",q:"Come nasce il distretto di Prato secondo gli appunti?",options:["Dai macchinari di una grande impresa tessile in crisi","Per decisione del governo, che pianifica la specializzazione tessile","Grazie a una multinazionale estera che apre una fabbrica","Per la presenza di un\u2019universit\xE0 specializzata nel tessile"],answer:0,explain:"Esempio di come la storia del luogo conti nella nascita del distretto."},{id:"u7-2-5",type:"mc",topic:"Cluster",q:"Quale di questi \xE8 un esempio di cluster citato negli appunti?",options:["Silicon Valley (California)","Toyota","OPEC","Coop"],answer:0,explain:"Altri esempi: distretti italiani e citt\xE0 specializzate del Guangdong."},{id:"u7-2-6",type:"mc",topic:"Distretto industriale",q:"Qual \xE8 la struttura tipica delle imprese di un distretto?",options:["Un\u2019impresa media e tante PMI specializzate","Una sola grande impresa verticalmente integrata","Solo imprese pubbliche coordinate dal comune","Multinazionali estere con stabilimenti nell\u2019area"],answer:0,explain:"Le piccole imprese si dividono il lavoro e sono altamente specializzate."},{id:"u7-2-7",type:"fill",topic:"Distretto industriale",text:"Nel distretto convivono una comunit\xE0 di ___ e una popolazione di ___.",answers:["persone","imprese"],extra:["banche","lavoratori stranieri"],explain:"Definizione di Becattini."},{id:"u7-2-8",type:"tf",topic:"Distretto industriale",q:"Nel distretto industriale le relazioni tra le persone restano confinate al luogo di lavoro.",answer:!1,explain:"Il distretto \xE8 radicato socialmente: i rapporti continuano nella vita quotidiana e la fiducia \xE8 alta."},{id:"u7-2-9",type:"mc",topic:"Cluster",q:"Come si giudica il successo di un cluster?",options:["Con performance economica, internazionalizzazione e competitivit\xE0","Solo con lo sviluppo umano della comunit\xE0 locale","Con il numero di abitanti dell\u2019area","Con la quota di imprese pubbliche presenti"],answer:0,explain:"Per il distretto invece si guarda anche allo sviluppo umano, oltre alla performance economica."}]},{id:"u7l3",title:"Efficienza collettiva",icon:"\u2699\uFE0F",theory:[{title:"Economie esterne",points:["**Efficienza collettiva**: guadagni di efficienza a cui le imprese accedono insieme grazie alla prossimit\xE0. Viene da **economie esterne** e **azione collettiva**.","Economie esterne: risparmi sui costi di cui godono le imprese nel cluster rispetto a quelle fuori. Origini: **A.** mercato del lavoro specializzato (i lavoratori vanno dove c\u2019\xE8 domanda per le loro competenze; nascono scuole); **B.** accesso locale agli input (fornitori vicini); **C.** flussi di conoscenza tecnica e di mercato (le innovazioni del vicino circolano in fretta).","Tipologie: **pecuniarie** (risparmi di costo, ad esempio grandi acquisti che abbassano il prezzo di un input) e **tecnologiche** (conoscenza condivisa, ad esempio un lavoratore che cambia impresa portando competenze).","Per i neoclassici sono **fallimenti di mercato**: le tecnologiche porterebbero a sotto-investire in formazione (perch\xE9 formare chi poi se ne va?). Nei sistemi di imprese spiegano invece i **rendimenti crescenti**."]},{title:"Azione collettiva",points:["Forme di azione congiunta che le imprese scelgono **volontariamente**.","**Verticale**: imprese a monte e a valle della stessa filiera (partecipazione congiunta a fiere e iniziative).","**Orizzontale**: imprese che fanno lo stesso bene (macchinario costoso condiviso, acquisti congiunti, formazione, R&S insieme).","**Multilaterale**: attori del territorio, non solo imprese, che offrono servizi specializzati (analisi di mercato, consulenza, finanza, marketing, export)."]}],exercises:[{id:"u7-3-1",type:"mc",topic:"Efficienza collettiva",q:"Da quali due elementi deriva l\u2019efficienza collettiva?",options:["Economie esterne e azione collettiva","Economie di scala e barriere all\u2019entrata","Fiducia e gerarchia","Brevetti e licenze condivise"],answer:0,explain:"Sono i guadagni di efficienza legati alla prossimit\xE0 geografica."},{id:"u7-3-2",type:"order",topic:"Economie esterne",q:"Metti in ordine le origini delle economie esterne come negli appunti",items:["Mercato del lavoro specializzato","Accesso locale agli input produttivi","Accesso ai flussi di conoscenza"],explain:"A, B e C degli appunti."},{id:"u7-3-3",type:"match",topic:"Economie esterne",q:"Classifica ogni esempio di economia esterna",pairs:[["Un produttore compra tanto input e ne abbassa il prezzo","Pecuniaria"],["Un lavoratore cambia impresa e porta le competenze","Tecnologica"]],explain:"Pecuniarie: risparmi di costo. Tecnologiche: condivisione di conoscenza."},{id:"u7-3-4",type:"mc",topic:"Economie esterne",q:"Perch\xE9 per la teoria neoclassica le economie esterne tecnologiche sono un fallimento di mercato?",options:["Portano a sotto-investire in formazione dei lavoratori","Perch\xE9 fanno aumentare troppo i prezzi degli input","Perch\xE9 creano monopoli locali nel cluster","Perch\xE9 riducono la concorrenza tra le imprese vicine"],answer:0,explain:"Nei sistemi di imprese, invece, spiegano i rendimenti crescenti."},{id:"u7-3-5",type:"match",topic:"Azione collettiva",q:"Abbina ogni tipo di azione collettiva all\u2019esempio",pairs:[["Verticale","Fornitore e cliente della filiera vanno insieme a una fiera"],["Orizzontale","Imprese dello stesso prodotto condividono un macchinario costoso"],["Multilaterale","Attori del territorio offrono servizi per l\u2019export"]],explain:"L\u2019azione collettiva \xE8 volontaria, a differenza delle economie esterne."},{id:"u7-3-6",type:"tf",topic:"Azione collettiva",q:"L\u2019azione collettiva \xE8 un vantaggio che le imprese ottengono automaticamente, senza volerlo.",answer:!1,explain:"\xC8 volontaria: sono le imprese a decidere di agire insieme. Le economie esterne invece arrivano dalla sola prossimit\xE0."},{id:"u7-3-7",type:"mc",topic:"Economie esterne",q:"Un tintore specializzato cerca lavoro dove ci sono tante imprese di tintura. Quale origine delle economie esterne illustra?",options:["Mercato del lavoro specializzato","Accesso locale agli input produttivi","Flussi di conoscenza tecnica","Azione collettiva orizzontale"],answer:0,explain:"La domanda di lavoro specifica attrae lavoratori e riduce i costi di ricerca del personale."},{id:"u7-3-8",type:"mc",topic:"Economie esterne",q:"Nei sistemi di imprese, cosa spiegano le economie esterne?",options:["I rendimenti crescenti","I rendimenti decrescenti","La perdita secca","Il rent seeking"],answer:0,explain:"Pi\xF9 imprese si concentrano, pi\xF9 aumentano i vantaggi per tutte."},{id:"u7-3-9",type:"fill",topic:"Economie esterne",text:"Le economie esterne ___ generano risparmi di costo, quelle ___ permettono di condividere conoscenza.",answers:["pecuniarie","tecnologiche"],extra:["reali","collettive"],explain:"Esempi: grandi acquisti che abbassano il prezzo di un input; un lavoratore che porta competenze da un\u2019impresa all\u2019altra."},{id:"u7-3-10",type:"mc",topic:"Economie esterne",q:"Perch\xE9 in un cluster le innovazioni circolano pi\xF9 velocemente?",options:["Perch\xE9 la vicinanza aumenta i contatti, anche informali, tra chi fa lo stesso lavoro","Perch\xE9 i brevetti nel cluster non valgono","Perch\xE9 tutte le imprese hanno lo stesso proprietario","Perch\xE9 lo Stato obbliga a condividerle"],answer:0,explain:"\xC8 l\u2019accesso ai flussi di conoscenza: ognuno beneficia delle soluzioni trovate dal vicino."}]},{id:"u7l4",title:"Rischi e distretti italiani",icon:"\u{1F1EE}\u{1F1F9}",theory:[{title:"Rischi dei cluster",points:["**Eccessiva concorrenza** sui prezzi: produzioni standardizzate a basso valore aggiunto.","**Difficolt\xE0 di coordinamento**: progetti di R&S congiunti falliscono se qualcuno fa il **free rider**.","**Congestione**: inquinamento e qualit\xE0 della vita peggiore (cluster delle piastrelle nel Guangdong).","**Iperspecializzazione**: meno resilienza agli shock sulle materie prime.","I cluster di successo **diversificano** in attivit\xE0 correlate, partecipano ad azioni collettive, hanno **istituzioni** di supporto e piattaforme di innovazione, **legami extra-cluster**, puntano all\u2019**upgrading**."]},{title:"I distretti italiani",points:["Nascono negli **anni \u201970** con la crisi del **fordismo**, troppo rigido davanti all\u2019instabilit\xE0 internazionale e al cambiare dei gusti. Risposta: **produzione flessibile** di PMI legate da fiducia.","Istituzioni locali: **comitati di distretto** (enti pubblici, imprese, sindacati, associazioni), **fondazioni**, **centri specializzati** (formazione, design, controllo qualit\xE0), associazioni e consorzi, osservatori.","Hanno reagito meglio alle crisi grazie all\u2019efficienza collettiva.","Critiche e risposte: troppa enfasi sulle piccole imprese? Il distretto funziona dove non ci sono forti **indivisibilit\xE0**; distretti e grande impresa sono **complementari**. Sistemi troppo chiusi? Servono collegamenti esterni. Serve per forza una comunit\xE0 storica? No: fiducia e condivisione si possono **costruire** per scelta consapevole."]}],exercises:[{id:"u7-4-1",type:"match",topic:"Rischi dei cluster",q:"Abbina ogni rischio dei cluster alla sua conseguenza",pairs:[["Eccessiva concorrenza sui prezzi","Produzioni a basso valore aggiunto"],["Difficolt\xE0 di coordinamento","Free rider nei progetti di R&S"],["Congestione","Inquinamento e peggiore qualit\xE0 della vita"],["Iperspecializzazione","Meno resilienza agli shock"]],explain:"Il caso delle piastrelle nel Guangdong \xE8 un esempio di congestione."},{id:"u7-4-2",type:"mc",topic:"Cluster di successo",q:"Quale di questi \xE8 un tratto dei cluster leader mondiali?",options:["Diversificano in attivit\xE0 correlate e hanno legami extra-cluster","Competono solo sul prezzo per conquistare quote","Si chiudono verso l\u2019esterno per proteggere i segreti","Si specializzano in un solo prodotto standardizzato"],answer:0,explain:"Puntano anche su azioni collettive, istituzioni di supporto e upgrading."},{id:"u7-4-3",type:"mc",topic:"Distretti italiani",q:"Perch\xE9 nascono i distretti italiani negli anni \u201970?",options:["Per la crisi del fordismo, troppo rigido","Per la nascita dell\u2019euro e del mercato unico","Per le privatizzazioni delle imprese pubbliche","Per l\u2019arrivo delle multinazionali americane"],answer:0,explain:"Il modello fordista non rispondeva all\u2019instabilit\xE0 internazionale e ai nuovi gusti."},{id:"u7-4-4",type:"mc",topic:"Distretti italiani",q:"Cosa sono i comitati di distretto?",options:["Tavoli tra enti pubblici, imprese e sindacati per lo sviluppo","Cartelli tra imprese del distretto per fissare i prezzi","Sussidiarie di una holding che controlla il distretto","Uffici locali dell\u2019antitrust che vigilano sulla concorrenza"],answer:0,explain:"Altre istituzioni: fondazioni, centri specializzati, consorzi, osservatori."},{id:"u7-4-5",type:"tf",topic:"Critiche ai distretti",q:"Distretti e grande impresa sono necessariamente in contrapposizione.",answer:!1,explain:"Sono complementari: dove ci sono forti indivisibilit\xE0 serve la grande impresa, altrove la forma distrettuale funziona."},{id:"u7-4-6",type:"mc",topic:"Critiche ai distretti",q:"Quando \xE8 pi\xF9 indicata la forma a distretto?",options:["Quando il processo non ha forti indivisibilit\xE0","Quando servono enormi economie di scala e impianti indivisibili","Nell\u2019industria pesante, come acciaio e chimica","Solo nei servizi pubblici gestiti a livello locale"],answer:0,explain:"I distretti sono animati soprattutto da PMI dell\u2019industria leggera."},{id:"u7-4-7",type:"tf",topic:"Critiche ai distretti",q:"Senza una comunit\xE0 storica originaria non pu\xF2 esistere un distretto.",answer:!1,explain:"Fiducia e condivisione si possono costruire nel tempo, anche per scelta consapevole degli attori del territorio."},{id:"u7-4-8",type:"mc",topic:"Rischi dei cluster",q:"Cos\u2019\xE8 un free rider in un progetto di R&S del cluster?",options:["Chi ne prende i vantaggi senza fare la sua parte","Chi finanzia da solo tutto il progetto","Il coordinatore pubblico del progetto","Un concorrente esterno al cluster"],answer:0,explain:"Il comportamento opportunistico mina le relazioni nel cluster e il successo del progetto."},{id:"u7-4-9",type:"mc",topic:"Distretti italiani",q:"Perch\xE9 i distretti italiani hanno reagito meglio alle crisi?",options:["Grazie all\u2019efficienza collettiva presente nei distretti","Perch\xE9 erano protetti da dazi doganali","Perch\xE9 erano formati da grandi imprese","Perch\xE9 lo Stato ne copriva le perdite"],answer:0,explain:"Economie esterne e azione collettiva li hanno resi pi\xF9 flessibili e resistenti."},{id:"u7-4-10",type:"tf",topic:"Critiche ai distretti",q:"Un distretto troppo chiuso verso l\u2019esterno rischia di soffocare: deve collocare fuori la produzione in eccesso.",answer:!0,explain:"Per questo \xE8 importante sviluppare collegamenti con l\u2019esterno."}]},{id:"u7l5",title:"Reti e catene globali del valore",icon:"\u{1F517}",theory:[{title:"Le reti di imprese",points:["Insieme **stabile** di relazioni, pi\xF9 o meno formalizzate, tra imprese distinte (nodi e collegamenti). Flessibili, rispondono a domanda frammentata e personalizzata.","Al posto della prossimit\xE0 geografica c\u2019\xE8 una **prossimit\xE0 relazionale**: obiettivi condivisi (un prodotto, una tecnologia). Le imprese possono essere lontane.","Classificazione: **formali** o **informali**; **centralizzate** (un\u2019impresa responsabile: **piramidali** o **concentriche**, con la grande impresa al centro che attiva i fornitori uno per uno) o **non centralizzate** (rapporto paritario)."]},{title:"Catene globali del valore (GVC)",points:["Reti transnazionali: tutte le attivit\xE0 per portare un bene al consumatore, dalla progettazione in poi, con fasi separabili sul piano organizzativo e geografico. Guidate da **imprese leader**.","Alternativa alla multinazionale: controllo diretto o indiretto della filiera **senza integrazione verticale**. Possono essere guidate dal **produttore** (a monte) o dal **compratore** (a valle: catene di supermercati).","Governance: **captive** (fornitori piccoli e poco competenti, forte controllo del leader, \u201Ccatturati\u201D); **relazionale** (molta conoscenza tacita, fornitori competenti, R&S in interazione con il leader); **modulare** (moduli indipendenti, fornitori autonomi che possono servire pi\xF9 catene, come l\u2019elettronica dell\u2019auto)."]},{title:"La smiling curve",points:["Lega valore aggiunto e fasi di produzione: alto a monte (**R&S, design**) e a valle (**marketing, servizi post-vendita**), basso nella **produzione**.","Nel tempo la curva \xE8 diventata pi\xF9 \u201Csorridente\u201D: la distanza tra fasi \xE8 aumentata.","Per lo sviluppo di un territorio conta quale fase ospita: per Apple il valore che resta a Taiwan \xE8 diverso da quello che resta negli USA."]}],exercises:[{id:"u7-5-1",type:"mc",topic:"Reti",q:"Cosa sostituisce la prossimit\xE0 geografica nelle reti di imprese?",options:["La prossimit\xE0 relazionale, data da obiettivi condivisi","La propriet\xE0 comune delle imprese della rete","La gerarchia imposta da una holding","La concorrenza sui prezzi tra i nodi della rete"],answer:0,explain:"Per questo le reti possono legare imprese geograficamente distanti."},{id:"u7-5-2",type:"match",topic:"Reti",q:"Abbina ogni tipo di rete alla descrizione",pairs:[["Informale","Non regolata da un accordo formalizzato"],["Piramidale","Un\u2019impresa gestisce i fornitori in modo gerarchico"],["Concentrica","La grande impresa al centro attiva i fornitori uno per uno"],["Non centralizzata","Rapporto paritario tra tutti"]],explain:"Piramidali e concentriche sono reti centralizzate."},{id:"u7-5-3",type:"mc",topic:"Catene globali del valore",q:"In cosa una catena globale del valore differisce da una multinazionale?",options:["Il leader controlla la filiera senza integrazione verticale","Ha pi\xF9 stabilimenti di propriet\xE0 in paesi diversi","Non ha un\u2019impresa leader che coordina","Opera in un solo paese ma vende all\u2019estero"],answer:0,explain:"Collegamenti stabili transnazionali ma non proprietari."},{id:"u7-5-4",type:"match",topic:"Governance delle GVC",q:"Abbina ogni governance alla situazione",pairs:[["Captive","Fornitori piccoli, poco competenti, \u201Ccatturati\u201D dal leader"],["Relazionale","Molta conoscenza tacita e R&S in interazione"],["Modulare","Moduli indipendenti, il fornitore serve pi\xF9 catene"]],explain:"Dipende da come \xE8 fatta la produzione e dalle capacit\xE0 dei fornitori."},{id:"u7-5-5",type:"mc",topic:"Governance delle GVC",q:"Un fornitore produce in autonomia l\u2019elettronica dell\u2019auto, che la casa madre monta in una fase separata. Che governance \xE8?",options:["Modulare","Captive","Relazionale","Gerarchica"],answer:0,explain:"Le fasi sono indipendenti e il fornitore pu\xF2 lavorare per pi\xF9 catene."},{id:"u7-5-6",type:"hotspot",topic:"Smiling curve",scene:"smiling",q:"Tocca la fase con il valore aggiunto pi\xF9 basso.",answer:"prod",explain:"La produzione sta al centro, nel punto pi\xF9 basso della curva; R&S, design, marketing e post-vendita creano pi\xF9 valore."},{id:"u7-5-7",type:"tf",topic:"Smiling curve",q:"Nel tempo la smiling curve \xE8 diventata pi\xF9 \u201Csorridente\u201D: \xE8 aumentata la distanza di valore tra produzione e fasi a monte e a valle.",answer:!0,explain:"Per un territorio ospitare una fase invece di un\u2019altra fa una differenza enorme."},{id:"u7-5-8",type:"mc",topic:"Catene globali del valore",q:"Una catena di supermercati che gestisce la filiera internazionale dei prodotti sugli scaffali \xE8 una catena guidata\u2026",options:["dal compratore (a valle)","dal venditore (a monte)","dallo Stato","dai fornitori captive"],answer:0,explain:"Le GVC possono essere controllate a monte dal produttore o a valle dalla distribuzione."},{id:"u7-5-9",type:"fill",topic:"Reti",text:"Una rete \xE8 un insieme ___ di relazioni tra imprese ___, composta da nodi e collegamenti.",answers:["stabile","distinte"],extra:["occasionale","integrate"],explain:"Come cluster e distretti, le reti sono flessibili e rispondono a una domanda frammentata."},{id:"u7-5-10",type:"mc",topic:"Smiling curve",q:"Apple progetta negli USA e produce a Taiwan. Cosa dice la smiling curve?",options:["Negli USA resta pi\xF9 valore aggiunto che a Taiwan","Taiwan ottiene la quota pi\xF9 alta di valore aggiunto, perch\xE9 produce","Tutte le fasi della catena creano pi\xF9 o meno lo stesso valore","Conta solo il costo del lavoro, quindi vince chi produce a meno"],answer:0,explain:"Le fasi a monte e a valle sono le pi\xF9 strategiche e generano pi\xF9 valore e conoscenza."},{id:"u7-5-11",type:"tf",topic:"Governance delle GVC",q:"Nella governance captive i fornitori riescono facilmente a servire pi\xF9 catene del valore.",answer:!1,explain:"Sono \u201Ccatturati\u201D: competenze ridotte e forte potere del leader rendono difficile cambiare catena. \xC8 la governance modulare a permettere pi\xF9 catene."}]}],open:[{id:"u7-o1",q:"Cosa sono i sistemi di imprese e perch\xE9 esistono?",answer:"Sono imprese formalmente e sostanzialmente indipendenti che scambiano sul mercato ma traggono vantaggio da una prossimit\xE0 reciproca, geografica o relazionale, che rende la relazione diversa da un semplice contratto. Sono una modalit\xE0 alternativa all\u2019integrazione verticale per rispondere ai costi di transazione: provano a ridurre i problemi del mercato senza la gerarchia dell\u2019impresa.",keywords:["indipendenti","prossimit\xE0","costi di transazione","integrazione verticale","alternativa"]},{id:"u7-o2",q:"Che ruolo hanno fiducia e reputazione nei sistemi di imprese?",answer:"La fiducia \xE8 l\u2019aspettativa di comportamento corretto della controparte; la reputazione \xE8 l\u2019insieme di informazioni trasmissibili sulla storia di comportamento corretto. I costi di transazione crescono con incertezza, specificit\xE0 e frequenza, ma con transazioni ripetute e rapporti stabili le informazioni circolano, cresce la fiducia, calano le asimmetrie e la selezione avversa. Nessuno ha incentivo all\u2019opportunismo perch\xE9 danneggerebbe la propria reputazione.",keywords:["aspettativa","informazioni","ripetute","asimmetrie","opportunis"]},{id:"u7-o3",q:"Distingui cluster e distretto industriale.",answer:"Il cluster \xE8 un insieme di imprese e attivit\xE0 complementari specializzate in beni collegati e localizzate in un\u2019area: il luogo \xE8 uno spazio fisico e il successo si misura con performance economica, internazionalizzazione e competitivit\xE0. Il distretto (Becattini, 1989) \xE8 un\u2019entit\xE0 socio-territoriale con una comunit\xE0 di persone e una popolazione di imprese in un\u2019area storicamente determinata: il luogo \xE8 un fatto sociale (Prato), c\u2019\xE8 forte radicamento e fiducia, e si valuta anche lo sviluppo umano.",keywords:["spazio fisico","performance","Becattini","socio-territoriale","comunit\xE0","sviluppo umano"]},{id:"u7-o4",q:"Cos\u2019\xE8 l\u2019efficienza collettiva? Spiega le economie esterne.",answer:"\xC8 l\u2019insieme dei guadagni di efficienza a cui le imprese accedono collettivamente grazie alla prossimit\xE0 geografica; deriva da economie esterne e azione collettiva. Le economie esterne sono risparmi sui costi rispetto alle imprese fuori dal cluster: nascono da un mercato del lavoro specializzato, dall\u2019accesso locale agli input e dai flussi di conoscenza. Possono essere pecuniarie (risparmi di costo) o tecnologiche (conoscenza condivisa).",keywords:["prossimit\xE0","economie esterne","azione collettiva","lavoro specializzato","input","conoscenza"]},{id:"u7-o5",q:"Come vede la teoria neoclassica le economie esterne tecnologiche?",answer:"Come un fallimento di mercato (esternalit\xE0): se un lavoratore formato pu\xF2 passare a un concorrente portando le competenze, l\u2019impresa ha poco incentivo a formarlo, quindi a livello di sistema si sotto-investe in formazione e innovazione. Nei sistemi di imprese, invece, queste economie spiegano i rendimenti crescenti.",keywords:["fallimento di mercato","esternalit\xE0","sotto-investimento","formazione","rendimenti crescenti"]},{id:"u7-o6",q:"Quali tipi di azione collettiva esistono?",answer:"\xC8 un\u2019azione congiunta e volontaria. Verticale: coinvolge imprese a monte e a valle della stessa filiera, ad esempio partecipazione congiunta a fiere. Orizzontale: imprese che producono lo stesso bene mettono in comune risorse, come un macchinario costoso, acquisti, formazione o R&S. Multilaterale: attori del territorio, non solo imprese, offrono servizi specializzati come analisi di mercato, consulenza, finanza, marketing ed export.",keywords:["volontari","verticale","filiera","orizzontale","macchinario","multilaterale"]},{id:"u7-o7",q:"Quali sono i rischi dei cluster e cosa fanno i cluster di successo?",answer:"Rischi: concorrenza eccessiva sui prezzi che porta a produzioni a basso valore aggiunto; difficolt\xE0 di coordinamento e free rider nei progetti di R&S; congestione e inquinamento (piastrelle nel Guangdong); iperspecializzazione e scarsa resilienza agli shock. I cluster di successo diversificano in attivit\xE0 correlate, partecipano ad azioni collettive, hanno istituzioni di supporto e piattaforme di innovazione, legami extra-cluster e puntano all\u2019upgrading.",keywords:["prezzi","free rider","congestione","iperspecializzazione","diversific","upgrading"]},{id:"u7-o8",q:"Perch\xE9 nascono i distretti italiani e quali istituzioni li caratterizzano?",answer:"Nascono negli anni \u201970 con la crisi del fordismo, troppo rigido davanti all\u2019instabilit\xE0 internazionale e ai nuovi gusti: la risposta \xE8 la produzione flessibile di piccole e medie imprese legate da fiducia. Istituzioni: comitati di distretto (enti pubblici, imprese, sindacati, associazioni), fondazioni, centri specializzati per formazione, progettazione, design e controllo qualit\xE0, associazioni e consorzi, osservatori. Hanno reagito meglio alle crisi grazie all\u2019efficienza collettiva.",keywords:["anni \u201970","fordismo","flessibile","comitati","centri specializzati","crisi"]},{id:"u7-o9",q:"Quali critiche si fanno ai distretti e come si risponde?",answer:"Troppa enfasi sulle piccole imprese a scapito della crescita dimensionale: ma i distretti funzionano dove il processo non ha forti indivisibilit\xE0, e distretto e grande impresa sono complementari. Distretti come sistemi chiusi: se lo sono soffocano, per questo servono collegamenti con l\u2019esterno. Serve per forza una comunit\xE0 storica? No: fiducia e condivisione si possono costruire nel tempo per scelta consapevole.",keywords:["piccole imprese","indivisibilit\xE0","complementari","chiusi","collegamenti","costruit"]},{id:"u7-o10",q:"Cosa sono le reti di imprese e come si classificano?",answer:"Sono un insieme stabile di relazioni, pi\xF9 o meno formalizzate, tra imprese distinte: nodi e collegamenti. Sono flessibili e rispondono a domanda frammentata. Si basano sulla prossimit\xE0 relazionale, cio\xE8 su obiettivi condivisi, e possono legare imprese lontane. Si classificano per formalizzazione (formali e informali), centralizzazione (centralizzate piramidali o concentriche; non centralizzate paritarie) e livello di coordinamento.",keywords:["stabile","nodi","relazionale","formali","piramidali","concentriche"]},{id:"u7-o11",q:"Cosa sono le catene globali del valore?",answer:"Sono reti di imprese transnazionali: l\u2019insieme delle attivit\xE0 per portare un bene al consumatore finale, dalla progettazione in poi, con fasi separabili sul piano organizzativo e geografico. Sono guidate da imprese leader che coordinano i fornitori. Sono un\u2019alternativa alla multinazionale perch\xE9 controllano la filiera senza integrazione verticale, e possono essere guidate dal produttore (a monte) o dal compratore (a valle, come le catene di supermercati).",keywords:["transnazional","progettazione","leader","senza integrazione","compratore"]},{id:"u7-o12",q:"Descrivi le tre forme di governance delle catene globali del valore.",answer:"Captive: i fornitori sono piccoli, poco competenti e producono beni semplici; il leader li controlla fortemente e loro faticano a cambiare catena (sono catturati). Relazionale: la produzione richiede molta conoscenza tacita e i fornitori sono competenti; la R&S avviene in interazione con il leader. Modulare: la produzione si divide in moduli indipendenti; i fornitori lavorano in autonomia e possono servire pi\xF9 catene.",keywords:["captive","catturat","relazionale","tacita","modulare","moduli"]},{id:"u7-o13",q:"Cos\u2019\xE8 la smiling curve e perch\xE9 conta per i territori?",answer:"Mostra il valore aggiunto lungo le fasi: alto a monte (R&S, design) e a valle (marketing, servizi post-vendita), basso nella produzione. Nel tempo la distanza \xE8 cresciuta, la curva \xE8 diventata pi\xF9 sorridente. Per un territorio ospitare una fase o un\u2019altra fa una differenza enorme in valore aggiunto, rendita e flussi di conoscenza: per Apple, Taiwan e USA ottengono benefici molto diversi.",keywords:["valore aggiunto","R&S","marketing","produzione","sorridente","territorio"]},{id:"u7-o14",q:"Cosa caratterizza l\u2019impresa di un distretto e il suo radicamento sociale?",answer:"Di solito c\u2019\xE8 un\u2019impresa di medie dimensioni e una miriade di piccole e medie imprese indipendenti, altamente specializzate, che si dividono il lavoro. Il distretto \xE8 radicato socialmente: frequenti contatti personali, relazioni non solo sul lavoro ma nella vita quotidiana, alto grado di fiducia tra gli attori.",keywords:["medie dimensioni","piccole","specializzat","radicat","fiducia"]},{id:"u7-o15",q:"Collega mercato, impresa e sistemi di imprese alla teoria dei costi di transazione.",answer:"Per la teoria dei costi di transazione il mercato ha scambi orizzontali e liberi ma incertezza e contratti imperfetti, quindi costi di transazione; l\u2019impresa offre gerarchia e certezza, e l\u2019integrazione verticale \xE8 la risposta classica. I sistemi di imprese sono una via intermedia: imprese indipendenti che, grazie a prossimit\xE0, fiducia e reputazione, riducono i costi di transazione senza integrarsi. Le forme organizzative stanno su un continuo tra fiducia e gerarchia.",keywords:["mercato","incertezza","gerarchia","intermedi","fiducia","continuo"]}],cards:[{id:"u7-c1",front:"Sistema di imprese",back:"Imprese indipendenti con vantaggi da prossimit\xE0 geografica o relazionale."},{id:"u7-c2",front:"Fiducia",back:"Aspettativa di comportamento corretto della controparte."},{id:"u7-c3",front:"Reputazione",back:"Informazioni trasmissibili sulla storia di comportamento corretto."},{id:"u7-c4",front:"Cluster",back:"Imprese e attivit\xE0 complementari specializzate in un\u2019area: il luogo \xE8 spazio fisico."},{id:"u7-c5",front:"Distretto (Becattini, 1989)",back:"Entit\xE0 socio-territoriale: comunit\xE0 di persone + popolazione di imprese."},{id:"u7-c6",front:"Efficienza collettiva",back:"Economie esterne + azione collettiva."},{id:"u7-c7",front:"Origini delle economie esterne",back:"Lavoro specializzato, input locali, flussi di conoscenza."},{id:"u7-c8",front:"Economie esterne pecuniarie / tecnologiche",back:"Risparmi di costo / condivisione di conoscenza."},{id:"u7-c9",front:"Azione collettiva",back:"Volontaria: verticale, orizzontale, multilaterale."},{id:"u7-c10",front:"Rischi dei cluster",back:"Concorrenza sui prezzi, coordinamento (free rider), congestione, iperspecializzazione."},{id:"u7-c11",front:"Distretti italiani",back:"Anni \u201970, crisi del fordismo, produzione flessibile di PMI."},{id:"u7-c12",front:"Rete di imprese",back:"Insieme stabile di relazioni tra imprese distinte; prossimit\xE0 relazionale."},{id:"u7-c13",front:"Catena globale del valore",back:"Rete transnazionale guidata da un leader, senza integrazione verticale."},{id:"u7-c14",front:"Governance captive",back:"Fornitori piccoli e poco competenti, catturati dal leader."},{id:"u7-c15",front:"Governance relazionale",back:"Conoscenza tacita, fornitori competenti, R&S in interazione."},{id:"u7-c16",front:"Governance modulare",back:"Moduli indipendenti, fornitori autonomi su pi\xF9 catene."},{id:"u7-c17",front:"Smiling curve",back:"Valore alto in R&S/design e marketing/post-vendita, basso in produzione."}]},M0=Sz;var wz={id:"m1",n:1,title:"Insiemi e funzioni",subtitle:"Numeri, intervalli, dominio e inversa",color:"#4F46E5",colorDark:"#3730A3",lessons:[{id:"m1l1",title:"Insiemi numerici e intervalli",icon:"\u{1F522}",theory:[{title:"Gli insiemi numerici",points:["**\u2115** naturali {0, 1, 2, 3\u2026} \u2282 **\u2124** interi relativi {\u2026, \u22122, \u22121, 0, 1, 2\u2026} \u2282 **\u211A** razionali \u2282 **\u211D** reali \u2282 **\u2102** complessi.","**Razionali**: si scrivono come rapporto di due interi n/m (m \u2260 0). In forma decimale sono finiti (5/2 = 2,5) o periodici (2/3 = 0,6\u0304).","**Irrazionali**: non sono razionali; hanno scrittura decimale illimitata e non periodica (\u221A2, \u03C0, e).","Gli irrazionali si dividono in **algebrici** (soluzioni di un\u2019equazione polinomiale a coefficienti interi, come \u221A2 o \u221A3) e **trascendenti** (\u03C0, e, log 2)."]},{title:"Intervalli e piano cartesiano",points:["**Chiuso** [a, b] = {x \u2208 \u211D : a \u2264 x \u2264 b}, estremi inclusi. **Aperto** (a, b) = {a < x < b}, estremi esclusi. **Semiaperto** [a, b) = {a \u2264 x < b}.","**Semirette**: [a, +\u221E) = {x \u2265 a} chiusa; (a, +\u221E) = {x > a} aperta. Verso \xB1\u221E la parentesi \xE8 sempre tonda.","**Piano cartesiano** \u211D\xB2 = \u211D \xD7 \u211D: coppie ordinate (x, y). (\u22121, 3) \u2260 (3, \u22121).","Quadranti: **I** (x > 0, y > 0), **II** (x < 0, y > 0), **III** (x < 0, y < 0), **IV** (x > 0, y < 0). (0, 0) \xE8 l\u2019origine."]}],exercises:[{id:"m1-1-1",type:"mc",topic:"Insiemi numerici",q:"Che tipo di numero \xE8 \u221A2?",options:["Irrazionale algebrico","Irrazionale trascendente","Razionale con decimali periodici","Intero relativo"],answer:0,explain:"\u221A2 non si scrive come frazione, ma \xE8 soluzione di x\xB2 \u2212 2 = 0: quindi \xE8 algebrico."},{id:"m1-1-2",type:"mc",topic:"Insiemi numerici",q:"Che tipo di numero \xE8 \u03C0?",options:["Irrazionale trascendente","Irrazionale algebrico","Razionale, perch\xE9 vale 22/7","Razionale con decimali finiti"],answer:0,explain:"\u03C0 non \xE8 soluzione di nessuna equazione polinomiale a coefficienti interi: \xE8 trascendente. 22/7 \xE8 solo un\u2019approssimazione."},{id:"m1-1-3",type:"match",topic:"Insiemi numerici",q:"Abbina ogni numero al pi\xF9 piccolo insieme che lo contiene",pairs:[["5","\u2115 naturali"],["\u22123","\u2124 interi relativi"],["2/3","\u211A razionali"],["\u221A3","\u211D reali (irrazionale)"]],explain:"\u2115 \u2282 \u2124 \u2282 \u211A \u2282 \u211D: ogni numero sta anche in tutti gli insiemi pi\xF9 grandi."},{id:"m1-1-4",type:"mc",topic:"Insiemi numerici",q:"Il numero 0,6\u0304 (sei periodico) \xE8\u2026",options:["razionale, perch\xE9 \xE8 uguale a 2/3","irrazionale, perch\xE9 ha infinite cifre","trascendente, come \u03C0","un numero intero"],answer:0,explain:"I decimali periodici sono razionali: 0,6\u0304 = 2/3. Gli irrazionali hanno infinite cifre ma non periodiche."},{id:"m1-1-5",type:"tf",topic:"Insiemi numerici",q:"Ogni numero naturale \xE8 anche un numero intero relativo.",answer:!0,explain:"\u2115 \u2282 \u2124: 5 \xE8 naturale ed \xE8 anche intero relativo (+5)."},{id:"m1-1-6",type:"tf",topic:"Insiemi numerici",q:"Un numero irrazionale pu\xF2 avere una scrittura decimale periodica.",answer:!1,explain:"Periodico significa razionale. Gli irrazionali hanno decimali illimitati e non periodici."},{id:"m1-1-7",type:"mc",topic:"Intervalli",q:"Come si scrive l\u2019insieme {x \u2208 \u211D : \u22122 \u2264 x < 5}?",options:["[\u22122, 5)","(\u22122, 5]","[\u22122, 5]","(\u22122, 5)"],answer:0,explain:"\u22122 \xE8 incluso (parentesi quadra), 5 \xE8 escluso (parentesi tonda): intervallo semiaperto."},{id:"m1-1-8",type:"mc",topic:"Intervalli",q:"Quale semiretta contiene tutti i numeri strettamente maggiori di 3?",options:["(3, +\u221E)","[3, +\u221E)","(\u2212\u221E, 3)","[3, +\u221E]"],answer:0,explain:"Strettamente maggiore: 3 escluso, parentesi tonda. Verso +\u221E la parentesi \xE8 sempre tonda.",profNote:"Negli appunti la \u201Csemiretta aperta destra\u201D \xE8 scritta [a, +\u221E): la notazione corretta \xE8 (a, +\u221E) = {x > a}. Con la quadra l\u2019estremo a sarebbe incluso."},{id:"m1-1-9",type:"fill",topic:"Intervalli",text:"In un intervallo chiuso gli estremi sono ___; in un intervallo aperto sono ___.",answers:["inclusi","esclusi"],extra:["infiniti","negativi"],explain:"[a, b] include a e b; (a, b) li esclude."},{id:"m1-1-10",type:"mc",topic:"Piano cartesiano",q:"In quale quadrante si trova il punto (\u22121, 3)?",options:["Secondo quadrante","Primo quadrante","Terzo quadrante","Quarto quadrante"],answer:0,explain:"x < 0 e y > 0: secondo quadrante."},{id:"m1-1-11",type:"mc",topic:"Piano cartesiano",q:"In quale quadrante si trova il punto (2, \u22125)?",options:["Quarto quadrante","Secondo quadrante","Terzo quadrante","Primo quadrante"],answer:0,explain:"x > 0 e y < 0: quarto quadrante."},{id:"m1-1-12",type:"tf",topic:"Piano cartesiano",q:"I punti (\u22121, 3) e (3, \u22121) coincidono.",answer:!1,explain:"Le coppie sono ordinate: conta l\u2019ordine. (\u22121, 3) sta nel II quadrante, (3, \u22121) nel IV."},{id:"m1-1-13",type:"mc",topic:"Intervalli",q:"Quale insieme rappresenta [\u22122, \u22121) \u222A [1, 3]?",options:["\u22122 incluso, \u22121 escluso, poi da 1 a 3 entrambi inclusi","Tutti i numeri tra \u22122 e 3","\u22122 escluso, \u22121 incluso, da 1 a 3 esclusi","Solo i numeri interi \u22122, \u22121, 1, 2, 3"],answer:0,explain:"\xC8 l\u2019unione di due intervalli: il primo semiaperto, il secondo chiuso."}]},{id:"m1l2",title:"Funzioni, dominio e codominio",icon:"\u{1F4C8}",theory:[{title:"Che cos\u2019\xE8 una funzione",points:["Una funzione **f : A \u2282 \u211D \u2192 \u211D** associa a **ogni** x \u2208 A **un solo** y = f(x).","**Dominio** A: l\u2019insieme degli input (si legge sull\u2019asse x). **Codominio** f(A): l\u2019insieme degli output (si legge sull\u2019asse y).","Per calcolare f in un punto si sostituisce: f(x) = 4x \u2212 1 \u21D2 f(0) = \u22121, quindi il grafico passa per P(0; \u22121).","Test grafico: ogni retta verticale deve incontrare il grafico **al massimo una volta**."],example:"f(x) = \u221Ax ha dominio [0, +\u221E) perch\xE9 la radice quadrata di un numero negativo non \xE8 reale. f(x) = 1/x ha dominio \u211D \\ {0}."}],exercises:[{id:"m1-2-1",type:"num",topic:"Valore di una funzione",q:"f(x) = 4x \u2212 1. Quanto vale f(0)?",answer:-1,tol:0,explain:"f(0) = 4\xB70 \u2212 1 = \u22121: il grafico passa per P(0; \u22121)."},{id:"m1-2-2",type:"num",topic:"Valore di una funzione",q:"f(x) = x\xB2 + 1. Quanto vale f(3)?",answer:10,tol:0,explain:"3\xB2 + 1 = 9 + 1 = 10."},{id:"m1-2-3",type:"num",topic:"Valore di una funzione",q:"f(x) = 2x\xB2 \u2212 7x \u2212 4. Quanto vale f(4)?",answer:0,tol:0,explain:"2\xB716 \u2212 28 \u2212 4 = 32 \u2212 32 = 0. Infatti x = 4 sar\xE0 il punto di pareggio dell\u2019esercizio sul profitto."},{id:"m1-2-4",type:"mc",topic:"Definizione di funzione",q:"Quale di queste relazioni NON \xE8 una funzione?",options:["x\xB2 + y\xB2 = 1 (circonferenza)","y = x\xB2 (parabola)","y = 3x + 2 (retta)","y = |x| (valore assoluto)"],answer:0,explain:"Sulla circonferenza a uno stesso x corrispondono due y (sopra e sotto): non \xE8 una funzione."},{id:"m1-2-5",type:"mc",topic:"Dominio e codominio",q:"Su quale asse si legge il dominio di una funzione?",options:["Sull\u2019asse x","Sull\u2019asse y","Sulla bisettrice y = x","Su entrambi gli assi insieme"],answer:0,explain:"Dominio = input sull\u2019asse x; codominio = output sull\u2019asse y."},{id:"m1-2-6",type:"tf",topic:"Definizione di funzione",q:"In una funzione a uno stesso x possono corrispondere due valori di y diversi.",answer:!1,explain:"Ogni x ha un solo y. Il contrario \xE8 possibile: due x diversi possono avere lo stesso y (x\xB2 con \xB12)."},{id:"m1-2-7",type:"mc",topic:"Dominio e codominio",q:"Qual \xE8 il dominio di f(x) = \u221Ax?",options:["[0, +\u221E)","(0, +\u221E)","\u211D","\u211D \\ {0}"],answer:0,explain:"La radice quadrata \xE8 definita per x \u2265 0; lo zero \xE8 incluso (\u221A0 = 0)."},{id:"m1-2-8",type:"mc",topic:"Dominio e codominio",q:"Qual \xE8 il dominio di f(x) = 1/x?",options:["\u211D \\ {0}","[0, +\u221E)","\u211D","(0, +\u221E)"],answer:0,explain:"Non si pu\xF2 dividere per zero: si toglie solo x = 0."},{id:"m1-2-9",type:"mc",topic:"Dominio e codominio",q:"Qual \xE8 il codominio di f(x) = x\xB2 con x \u2208 \u211D?",options:["[0, +\u221E)","\u211D","(0, +\u221E)","(\u2212\u221E, 0]"],answer:0,explain:"Un quadrato non \xE8 mai negativo e vale 0 per x = 0."},{id:"m1-2-10",type:"num",topic:"Dominio e codominio",q:"f(x) = 2x \u2212 1 con dominio [0, +\u221E). Il codominio \xE8 [k, +\u221E). Quanto vale k?",answer:-1,tol:0,explain:"La funzione cresce: il valore pi\xF9 piccolo \xE8 f(0) = \u22121, quindi codominio [\u22121, +\u221E)."},{id:"m1-2-11",type:"mc",topic:"Dominio e codominio",q:"Qual \xE8 il dominio di f(x) = log(x \u2212 2)?",options:["(2, +\u221E)","[2, +\u221E)","\u211D","(0, +\u221E)"],answer:0,explain:"L\u2019argomento del logaritmo deve essere positivo: x \u2212 2 > 0 \u21D2 x > 2."}]},{id:"m1l3",title:"Monotonia e iniettivit\xE0",icon:"\u2197\uFE0F",theory:[{title:"Funzioni crescenti e decrescenti",points:["**Strettamente crescente**: x\u2081 < x\u2082 \u21D2 f(x\u2081) < f(x\u2082). **Crescente**: x\u2081 < x\u2082 \u21D2 f(x\u2081) \u2264 f(x\u2082).","**Strettamente decrescente**: x\u2081 < x\u2082 \u21D2 f(x\u2081) > f(x\u2082). **Decrescente**: f(x\u2081) \u2265 f(x\u2082).","Crescenti e decrescenti sono **monotone**; quelle in senso stretto sono **strettamente monotone**.","Si studia il **rapporto incrementale** \u0394f/\u0394x = [f(x\u2082) \u2212 f(x\u2081)] / (x\u2082 \u2212 x\u2081): > 0 str. crescente, \u2265 0 crescente, \u2264 0 decrescente, < 0 str. decrescente."]},{title:"Funzioni iniettive",points:["**Iniettiva**: x\u2081 \u2260 x\u2082 \u21D2 f(x\u2081) \u2260 f(x\u2082). A output diversi corrispondono input diversi.","Test grafico: ogni **retta orizzontale** incontra il grafico al massimo una volta.","Se f \xE8 **strettamente monotona** allora \xE8 iniettiva, e quindi invertibile. **Non vale il viceversa**."],example:"x\xB2 non \xE8 iniettiva su \u211D: f(\u22122) = f(2) = 4. La retta y = 4 taglia il grafico due volte."}],exercises:[{id:"m1-3-1",type:"mc",topic:"Monotonia",q:"Per ogni coppia x\u2081 < x\u2082 si ha \u0394f/\u0394x > 0. La funzione \xE8\u2026",options:["strettamente crescente","crescente ma non strettamente","strettamente decrescente","costante"],answer:0,explain:"Rapporto incrementale sempre positivo \u21D2 strettamente crescente."},{id:"m1-3-2",type:"num",topic:"Rapporto incrementale",q:"f(x) = 3x + 2. Calcola il rapporto incrementale tra x\u2081 = 1 e x\u2082 = 4.",answer:3,tol:0,explain:"[f(4) \u2212 f(1)] / (4 \u2212 1) = (14 \u2212 5) / 3 = 3. Per una retta \xE8 sempre il coefficiente angolare."},{id:"m1-3-3",type:"num",topic:"Rapporto incrementale",q:"f(x) = x\xB2. Calcola il rapporto incrementale tra x\u2081 = 1 e x\u2082 = 3.",answer:4,tol:0,explain:"(9 \u2212 1) / (3 \u2212 1) = 8 / 2 = 4."},{id:"m1-3-4",type:"mc",topic:"Iniettivit\xE0",q:"f(x) = x\xB2 con dominio \u211D \xE8 iniettiva?",options:["No, perch\xE9 f(\u22122) = f(2) = 4","S\xEC, perch\xE9 \xE8 una funzione","S\xEC, perch\xE9 \xE8 sempre positiva","No, perch\xE9 non \xE8 definita in 0"],answer:0,explain:"Due input diversi danno lo stesso output: la retta orizzontale y = 4 taglia il grafico due volte."},{id:"m1-3-5",type:"tf",topic:"Iniettivit\xE0",q:"Se una funzione \xE8 strettamente monotona allora \xE8 iniettiva.",answer:!0,explain:"Input diversi danno per forza output diversi. Quindi \xE8 anche invertibile."},{id:"m1-3-6",type:"tf",topic:"Iniettivit\xE0",q:"Ogni funzione iniettiva \xE8 strettamente monotona.",answer:!1,explain:"Gli appunti lo dicono: strettamente monotona \u21D2 iniettiva, \u201Cma non viceversa\u201D. Ad esempio 1/x \xE8 iniettiva ma su tutto \u211D \\ {0} non \xE8 monotona."},{id:"m1-3-7",type:"mc",topic:"Iniettivit\xE0",q:"Come si verifica dal grafico se una funzione \xE8 iniettiva?",options:["Ogni retta orizzontale deve tagliarlo al massimo una volta","Ogni retta verticale deve tagliarlo al massimo una volta","Il grafico deve passare per l\u2019origine","Il grafico deve stare sopra l\u2019asse x"],answer:0,explain:"Le rette verticali verificano che sia una funzione; quelle orizzontali che sia iniettiva."},{id:"m1-3-8",type:"match",topic:"Monotonia",q:"Abbina il segno di \u0394f/\u0394x al tipo di funzione",pairs:[["> 0","Strettamente crescente"],["\u2265 0","Crescente"],["\u2264 0","Decrescente"],["< 0","Strettamente decrescente"]],explain:"Lo stesso schema varr\xE0 per il segno della derivata prima."},{id:"m1-3-9",type:"mc",topic:"Monotonia",q:"La funzione costante f(x) = c \xE8\u2026",options:["crescente e decrescente, ma non strettamente","strettamente crescente su tutto \u211D","iniettiva, quindi invertibile","n\xE9 crescente n\xE9 decrescente"],answer:0,explain:"f(x\u2081) = f(x\u2082) soddisfa sia \u2264 sia \u2265: \xE8 monotona ma non strettamente, e non \xE8 iniettiva."},{id:"m1-3-10",type:"mc",topic:"Monotonia",q:"f(x) = \u22122x + 7 \xE8\u2026",options:["strettamente decrescente","strettamente crescente","costante","non monotona"],answer:0,explain:"Coefficiente angolare \u22122 < 0: il rapporto incrementale \xE8 sempre negativo."}]},{id:"m1l4",title:"Funzione inversa",icon:"\u{1F504}",theory:[{title:"Costruire l\u2019inversa",points:["Se f \xE8 **iniettiva** (restringendo il codominio a B = f(A)) esiste **f\u207B\xB9 : B \u2192 A** con f\u207B\xB9(y) = x \u21D4 y = f(x).","**Dominio di f\u207B\xB9 = codominio di f**; **codominio di f\u207B\xB9 = dominio di f**.","Per trovarla: scrivo y = f(x), ricavo x in funzione di y, poi rinomino y in x per disegnarla nello stesso piano.","Il grafico di f\u207B\xB9 \xE8 il **simmetrico** di quello di f rispetto alla **bisettrice y = x**: il punto (x, y) diventa (y, x)."],example:"f(x) = 2x \u2212 1 con x \u2208 [0, +\u221E). y = 2x \u2212 1 \u21D2 x = (y + 1)/2 \u21D2 f\u207B\xB9(x) = x/2 + 1/2. Dominio di f\u207B\xB9 = [\u22121, +\u221E), codominio = [0, +\u221E)."}],exercises:[{id:"m1-4-1",type:"mc",topic:"Inversa",q:"Qual \xE8 l\u2019inversa di f(x) = 2x \u2212 1?",options:["f\u207B\xB9(x) = (x + 1)/2","f\u207B\xB9(x) = (x \u2212 1)/2","f\u207B\xB9(x) = 2x + 1","f\u207B\xB9(x) = 1/(2x \u2212 1)"],answer:0,explain:"y = 2x \u2212 1 \u21D2 y + 1 = 2x \u21D2 x = (y + 1)/2, poi si rinomina y in x."},{id:"m1-4-2",type:"num",topic:"Inversa",q:"f(x) = 3x + 6. Quanto vale f\u207B\xB9(12)?",answer:2,tol:0,explain:"Cerco x con 3x + 6 = 12 \u21D2 x = 2. Oppure f\u207B\xB9(x) = (x \u2212 6)/3 \u21D2 (12 \u2212 6)/3 = 2."},{id:"m1-4-3",type:"mc",topic:"Inversa",q:"Il dominio della funzione inversa f\u207B\xB9 \xE8\u2026",options:["il codominio di f","il dominio di f","sempre tutto \u211D","l\u2019insieme dei punti dove f = 0"],answer:0,explain:"Input e output si scambiano: dominio di f\u207B\xB9 = codominio di f e viceversa."},{id:"m1-4-4",type:"mc",topic:"Inversa",q:"Rispetto a quale retta sono simmetrici i grafici di f e di f\u207B\xB9?",options:["La bisettrice y = x","L\u2019asse x","L\u2019asse y","La retta y = \u2212x"],answer:0,explain:"Il punto (x, y) di f diventa (y, x) di f\u207B\xB9: simmetria rispetto a y = x."},{id:"m1-4-5",type:"num",topic:"Inversa",q:"f(x) = 5x \u2212 3. Qual \xE8 il coefficiente angolare di f\u207B\xB9? (decimale)",answer:.2,tol:.001,explain:"L\u2019inversa di mx + q \xE8 x/m \u2212 q/m: coefficiente angolare 1/m = 1/5 = 0,2."},{id:"m1-4-6",type:"tf",topic:"Inversa",q:"Se f(x) = mx + q con m > 0, anche la sua inversa ha coefficiente angolare positivo.",answer:!0,explain:"1/m ha lo stesso segno di m: l\u2019inversa ha lo stesso \u201Ctono\u201D di f."},{id:"m1-4-7",type:"order",topic:"Inversa",q:"Ordina i passaggi per trovare l\u2019inversa di una funzione",items:["Verifico che f sia iniettiva","Scrivo y = f(x)","Ricavo x in funzione di y","Rinomino le variabili e scrivo f\u207B\xB9(x)"],explain:"Senza iniettivit\xE0 l\u2019inversa non esiste (bisogna restringere il dominio)."},{id:"m1-4-8",type:"mc",topic:"Inversa",q:"Perch\xE9 f(x) = x\xB2 su \u211D non ha inversa?",options:["Non \xE8 iniettiva: va ristretta a [0, +\u221E)","Il suo codominio \xE8 tutto \u211D, troppo ampio","Non \xE8 continua nel punto x = 0","Passa per l\u2019origine e quindi si annulla"],answer:0,explain:"Restringendo a [0, +\u221E) diventa iniettiva e l\u2019inversa \xE8 \u221Ax."},{id:"m1-4-9",type:"num",topic:"Inversa",q:"f(x) = 2x \u2212 1 con dominio [0, +\u221E). Il dominio di f\u207B\xB9 \xE8 [k, +\u221E): quanto vale k?",answer:-1,tol:0,explain:"Dominio di f\u207B\xB9 = codominio di f = [\u22121, +\u221E)."}]},{id:"m1l5",title:"Esercizi guidati: funzioni e inversa",icon:"\u{1FA9C}",theory:[{title:"Come si affronta l\u2019esercizio",points:["**Valore**: sostituisco x nella formula. **Zero**: pongo f(x) = 0 e ricavo x.","**Inversa**: controllo che f sia iniettiva, scrivo y = f(x), ricavo x, rinomino.","**Dominio e codominio dell\u2019inversa**: si scambiano con quelli di f.","**Monotonia**: segno del rapporto incrementale su pi\xF9 intervalli."]}],exercises:[{id:"m1-5-1",type:"steps",topic:"Inversa",q:"Data f(x) = 3x \u2212 6 su \u211D, rispondi passo per passo.",steps:[{q:"f(0) = ?",kind:"num",answer:-6,explain:"3 \xB7 0 \u2212 6 = \u22126: il grafico taglia l\u2019asse y in (0, \u22126)."},{q:"Dove si annulla f? x = ?",kind:"num",answer:2,explain:"3x \u2212 6 = 0 \u21D2 x = 2."},{q:"Qual \xE8 l\u2019inversa?",kind:"mc",answer:0,options:["f\u207B\xB9(x) = (x + 6)/3","f\u207B\xB9(x) = (x \u2212 6)/3","f\u207B\xB9(x) = 3x + 6","f\u207B\xB9(x) = 1/(3x \u2212 6)"],explain:"y = 3x \u2212 6 \u21D2 x = (y + 6)/3, poi rinomino y in x."},{q:"f\u207B\xB9(9) = ?",kind:"num",answer:5,explain:"(9 + 6)/3 = 5. Verifica: f(5) = 9."},{q:"Coefficiente angolare dell\u2019inversa?",kind:"num",answer:.3333333333333333,tol:.005,shown:"1/3",explain:"L\u2019inversa di mx + q ha pendenza 1/m = 1/3."}],explain:"Inversa f\u207B\xB9(x) = x/3 + 2: retta simmetrica di f rispetto a y = x."},{id:"m1-5-2",type:"steps",topic:"Inversa",q:"f(x) = 2x \u2212 1 con dominio [0, +\u221E) (esempio degli appunti).",steps:[{q:"Il codominio \xE8 [k, +\u221E). k = ?",kind:"num",answer:-1,explain:"f \xE8 crescente: il valore pi\xF9 piccolo \xE8 f(0) = \u22121."},{q:"f \xE8 invertibile su questo dominio?",kind:"mc",answer:0,options:["S\xEC: \xE8 strettamente crescente, quindi iniettiva","No: non \xE8 iniettiva","Solo se il dominio \xE8 \u211D","No: il codominio \xE8 negativo"],explain:"Strettamente monotona \u21D2 iniettiva \u21D2 invertibile."},{q:"Il dominio di f\u207B\xB9 \xE8 [h, +\u221E). h = ?",kind:"num",answer:-1,explain:"Dominio di f\u207B\xB9 = codominio di f = [\u22121, +\u221E)."},{q:"f\u207B\xB9(5) = ?",kind:"num",answer:3,explain:"f\u207B\xB9(x) = (x + 1)/2 \u21D2 (5 + 1)/2 = 3."}],explain:"Dominio e codominio si scambiano: f\u207B\xB9 : [\u22121, +\u221E) \u2192 [0, +\u221E)."},{id:"m1-5-3",type:"steps",topic:"Monotonia",q:"Studia la monotonia di f(x) = x\xB2 con il rapporto incrementale.",steps:[{q:"Rapporto incrementale tra x\u2081 = 1 e x\u2082 = 3?",kind:"num",answer:4,explain:"(9 \u2212 1)/(3 \u2212 1) = 4 > 0: a destra dello 0 cresce."},{q:"Rapporto incrementale tra x\u2081 = \u22123 e x\u2082 = \u22121?",kind:"num",answer:-4,explain:"(1 \u2212 9)/(\u22121 + 3) = \u22124 < 0: a sinistra dello 0 decresce."},{q:"Che cosa concludi?",kind:"mc",answer:0,options:["Decresce su (\u2212\u221E, 0], cresce su [0, +\u221E)","Cresce su (\u2212\u221E, 0], decresce su [0, +\u221E)","\xC8 crescente su tutto \u211D","\xC8 costante"],explain:"\xC8 proprio il punto in cui gli appunti sbagliano: la monotonia corretta \xE8 questa."},{q:"x\xB2 \xE8 iniettiva su \u211D?",kind:"mc",answer:0,options:["No: f(\u22122) = f(2)","S\xEC: \xE8 una funzione","S\xEC: \xE8 sempre positiva","S\xEC: \xE8 continua"],explain:"Due input diversi con lo stesso output: non iniettiva."}],explain:"Il segno del rapporto incrementale dice dove la funzione sale e dove scende.",profNote:"Negli appunti per x\u207F con n pari la monotonia \xE8 scritta al contrario: decrescente su (\u2212\u221E, 0], crescente su [0, +\u221E)."}]}],open:[{id:"m1-o1",q:"Descrivi gli i
