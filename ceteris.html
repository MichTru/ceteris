"0\u207A."},{id:"m4-c6",front:"Gerarchia degli infiniti",back:"ln x \u226A x\u207F \u226A e\u02E3."},{id:"m4-c7",front:"Asintoto verticale",back:"lim x\u2192x\u2080 f(x) = \xB1\u221E."},{id:"m4-c8",front:"Asintoto obliquo",back:"m = lim f/x, q = lim (f \u2212 mx). Solo se manca l\u2019orizzontale."},{id:"m4-c9",front:"Continuit\xE0 in x\u2080",back:"f(x\u2080) esiste, il limite esiste finito, sono uguali."},{id:"m4-c10",front:"Discontinuit\xE0 1\xAA specie",back:"Salto: limiti finiti diversi, S = L\u207A \u2212 L\u207B."},{id:"m4-c11",front:"Discontinuit\xE0 3\xAA specie",back:"Eliminabile: limite finito \u2260 f(x\u2080)."},{id:"m4-c12",front:"Weierstrass",back:"Continua su [a, b] chiuso e limitato \u21D2 max e min assoluti."},{id:"m4-c13",front:"Teorema degli zeri",back:"Continua su [a, b], f(a)\xB7f(b) < 0 \u21D2 \u2203c: f(c) = 0."}]},T0=Nz;var Az={id:"m5",n:5,title:"Derivate",subtitle:"Regole, tangente, marginali, De l\u2019H\xF4pital",color:"#EC4899",colorDark:"#BE185D",lessons:[{id:"m5l1",title:"Definizione e retta tangente",icon:"\u{1F4CD}",theory:[{title:"Dal rapporto incrementale alla derivata",points:["**Rapporto incrementale** in x\u2080: [f(x\u2080 + h) \u2212 f(x\u2080)] / h. \xC8 la pendenza della **retta secante** tra due punti del grafico.","**Derivata**: f\u2032(x\u2080) = **lim (h \u2192 0)** [f(x\u2080 + h) \u2212 f(x\u2080)] / h, se il limite esiste finito.","Geometricamente f\u2032(x\u2080) \xE8 il **coefficiente angolare della retta tangente** al grafico in x\u2080.","**Retta tangente**: **y = f\u2032(x\u2080)(x \u2212 x\u2080) + f(x\u2080)**."],example:"f(x) = x\xB2 in x\u2080 = 3: f(3) = 9, f\u2032(x) = 2x \u21D2 f\u2032(3) = 6. Tangente: y = 6(x \u2212 3) + 9 = 6x \u2212 9."}],exercises:[{id:"m5-1-1",type:"mc",topic:"Definizione",q:"Che cosa rappresenta geometricamente f\u2032(x\u2080)?",options:["La pendenza della retta tangente in x\u2080","L\u2019area sotto il grafico fino a x\u2080","Il valore di f in x\u2080","La distanza del punto dall\u2019origine"],answer:0,explain:"\xC8 il limite delle pendenze delle secanti quando i due punti si avvicinano."},{id:"m5-1-2",type:"mc",topic:"Definizione",q:"Qual \xE8 la definizione di derivata in x\u2080?",options:["lim h\u21920 [f(x\u2080 + h) \u2212 f(x\u2080)] / h","lim h\u21920 [f(x\u2080 + h) + f(x\u2080)] / h","[f(b) \u2212 f(a)] / (b \u2212 a)","lim x\u2192\u221E f(x)/x"],answer:0,explain:"\xC8 il limite del rapporto incrementale."},{id:"m5-1-3",type:"hotspot",topic:"Retta tangente",scene:"tangente",q:"Tocca la retta tangente al grafico nel punto P",answer:"tan",explain:"La tangente \u201Csfiora\u201D il grafico in P; la secante lo taglia in due punti."},{id:"m5-1-4",type:"hotspot",topic:"Rapporto incrementale",scene:"tangente",q:"Tocca la retta la cui pendenza \xE8 il rapporto incrementale",answer:"sec",explain:"Il rapporto incrementale \xE8 la pendenza della secante tra P e Q."},{id:"m5-1-5",type:"mc",topic:"Retta tangente",q:"Qual \xE8 l\u2019equazione della retta tangente in x\u2080?",options:["y = f\u2032(x\u2080)(x \u2212 x\u2080) + f(x\u2080)","y = f(x\u2080)(x \u2212 x\u2080) + f\u2032(x\u2080)","y = f\u2032(x\u2080) \xB7 x","y = f\u2032(x)(x \u2212 x\u2080)"],answer:0,explain:"Retta per (x\u2080, f(x\u2080)) con pendenza f\u2032(x\u2080)."},{id:"m5-1-6",type:"num",topic:"Retta tangente",q:"f(x) = x\xB2, x\u2080 = 3. Pendenza della tangente?",answer:6,tol:0,explain:"f\u2032(x) = 2x \u21D2 f\u2032(3) = 6."},{id:"m5-1-7",type:"num",topic:"Retta tangente",q:"f(x) = x\xB2, x\u2080 = 3. Tangente y = 6x + q: quanto vale q?",answer:-9,tol:0,explain:"y = 6(x \u2212 3) + 9 = 6x \u2212 9."},{id:"m5-1-8",type:"num",topic:"Rapporto incrementale",q:"f(x) = x\xB2. Rapporto incrementale tra x = 1 e x = 1 + h con h = 0,1? (decimale)",answer:2.1,tol:.001,explain:"(1,21 \u2212 1)/0,1 = 2,1. Per h \u2192 0 tende a f\u2032(1) = 2."},{id:"m5-1-9",type:"num",topic:"Retta tangente",q:"f(x) = x\xB3 \u2212 2x. Pendenza della tangente in x\u2080 = 1?",answer:1,tol:0,explain:"f\u2032(x) = 3x\xB2 \u2212 2 \u21D2 f\u2032(1) = 1."},{id:"m5-1-10",type:"tf",topic:"Retta tangente",q:"Se f\u2032(x\u2080) = 0 la retta tangente in x\u2080 \xE8 orizzontale.",answer:!0,explain:"Pendenza zero: y = f(x\u2080)."}]},{id:"m5l2",title:"Tabella e regole di derivazione",icon:"\u{1F4CB}",theory:[{title:"Derivate fondamentali",points:["**(c)\u2032 = 0** \xB7 **(x)\u2032 = 1** \xB7 **(x\u207F)\u2032 = n\xB7x\u207F\u207B\xB9** (vale per ogni esponente reale).","**(\u221Ax)\u2032 = 1/(2\u221Ax)** \xB7 **(1/x)\u2032 = \u22121/x\xB2**.","**(e\u02E3)\u2032 = e\u02E3** \xB7 **(a\u02E3)\u2032 = a\u02E3 \xB7 ln a**.","**(ln x)\u2032 = 1/x** \xB7 **(log_a x)\u2032 = 1/(x ln a)**.","**(sin x)\u2032 = cos x** \xB7 **(cos x)\u2032 = \u2212sin x**."]},{title:"Regole di calcolo",points:["**Linearit\xE0**: (a\xB7f + b\xB7g)\u2032 = a\xB7f\u2032 + b\xB7g\u2032.","**Prodotto**: (f \xB7 g)\u2032 = f\u2032g + fg\u2032.","**Quoziente**: (f/g)\u2032 = (f\u2032g \u2212 fg\u2032) / g\xB2.","**Composta (catena)**: [g(f(x))]\u2032 = g\u2032(f(x)) \xB7 f\u2032(x)."],example:"(e\u02E3\xB2)\u2032 = e\u02E3\xB2 \xB7 2x. (ln(3x + 1))\u2032 = 3/(3x + 1). (x\xB7e\u02E3)\u2032 = e\u02E3 + x\xB7e\u02E3."}],exercises:[{id:"m5-2-1",type:"mc",topic:"Tabella",q:"(x\u2075)\u2032 = ?",options:["5x\u2074","x\u2074","5x\u2075","x\u2076/6"],answer:0,explain:"(x\u207F)\u2032 = n\xB7x\u207F\u207B\xB9. Attenzione: x\u2076/6 \xE8 la primitiva, non la derivata."},{id:"m5-2-2",type:"mc",topic:"Tabella",q:"(ln x)\u2032 = ?",options:["1/x","ln x","x ln x","e\u02E3"],answer:0,explain:"Derivata da sapere a memoria."},{id:"m5-2-3",type:"mc",topic:"Tabella",q:"(e\u02E3)\u2032 = ?",options:["e\u02E3","x\xB7e\u02E3\u207B\xB9","ln x","e\u02E3/x"],answer:0,explain:"L\u2019esponenziale in base e \xE8 uguale alla sua derivata."},{id:"m5-2-4",type:"mc",topic:"Tabella",q:"(\u221Ax)\u2032 = ?",options:["1/(2\u221Ax)","2\u221Ax","\u221Ax / 2","1/\u221Ax"],answer:0,explain:"\u221Ax = x^\xBD \u21D2 \xBD x^(\u2212\xBD) = 1/(2\u221Ax)."},{id:"m5-2-5",type:"mc",topic:"Tabella",q:"(1/x)\u2032 = ?",options:["\u22121/x\xB2","1/x\xB2","ln x","\u22121/x"],answer:0,explain:"x\u207B\xB9 \u21D2 \u22121\xB7x\u207B\xB2 = \u22121/x\xB2."},{id:"m5-2-6",type:"mc",topic:"Tabella",q:"(2\u02E3)\u2032 = ?",options:["2\u02E3 \xB7 ln 2","x \xB7 2\u02E3\u207B\xB9","2\u02E3","2\u02E3 / ln 2"],answer:0,explain:"(a\u02E3)\u2032 = a\u02E3 ln a. Solo con a = e il fattore ln a vale 1."},{id:"m5-2-7",type:"match",topic:"Tabella",q:"Abbina ogni funzione alla sua derivata",pairs:[["c (costante)","0"],["x\u207F","n\xB7x\u207F\u207B\xB9"],["e\u02E3","e\u02E3"],["ln x","1/x"],["sin x","cos x"]],explain:"La tabella base: tutto il resto si ottiene con le regole."},{id:"m5-2-8",type:"mc",topic:"Regole",q:"Regola del prodotto: (f \xB7 g)\u2032 = ?",options:["f\u2032g + fg\u2032","f\u2032 \xB7 g\u2032","f\u2032g \u2212 fg\u2032","(f\u2032g \u2212 fg\u2032)/g\xB2"],answer:0,explain:"La derivata del prodotto NON \xE8 il prodotto delle derivate."},{id:"m5-2-9",type:"mc",topic:"Regole",q:"Regola del quoziente: (f/g)\u2032 = ?",options:["(f\u2032g \u2212 fg\u2032)/g\xB2","(f\u2032g + fg\u2032)/g\xB2","f\u2032/g\u2032","(fg\u2032 \u2212 f\u2032g)/g\xB2"],answer:0,explain:"Attenzione all\u2019ordine nel numeratore: prima f\u2032g."},{id:"m5-2-10",type:"mc",topic:"Regole",q:"Derivata della composta g(f(x)):",options:["g\u2032(f(x)) \xB7 f\u2032(x)","g\u2032(x) \xB7 f\u2032(x)","g\u2032(f\u2032(x))","g(f\u2032(x))"],answer:0,explain:"Derivata della funzione esterna calcolata nell\u2019interna, per la derivata dell\u2019interna."},{id:"m5-2-11",type:"mc",topic:"Regole",q:"(x \xB7 e\u02E3)\u2032 = ?",options:["e\u02E3(1 + x)","e\u02E3","x \xB7 e\u02E3","e\u02E3 + x"],answer:0,explain:"Prodotto: 1\xB7e\u02E3 + x\xB7e\u02E3 = e\u02E3(1 + x)."},{id:"m5-2-12",type:"mc",topic:"Regole",q:"(e^(x\xB2))\u2032 = ?",options:["2x \xB7 e^(x\xB2)","e^(x\xB2)","x\xB2 \xB7 e^(x\xB2\u22121)","e^(2x)"],answer:0,explain:"Catena: esterna e\u1D58, interna u = x\xB2, u\u2032 = 2x."},{id:"m5-2-13",type:"mc",topic:"Regole",q:"(ln(3x + 1))\u2032 = ?",options:["3/(3x + 1)","1/(3x + 1)","3 ln(3x + 1)","1/(3x)"],answer:0,explain:"Catena: 1/(3x + 1) \xB7 3."},{id:"m5-2-14",type:"num",topic:"Regole",q:"f(x) = 3x\xB2 \u2212 5x + 2. Quanto vale f\u2032(2)?",answer:7,tol:0,explain:"f\u2032(x) = 6x \u2212 5 \u21D2 f\u2032(2) = 7."},{id:"m5-2-15",type:"num",topic:"Regole",q:"f(x) = x\xB2 \xB7 ln x. Quanto vale f\u2032(1)?",answer:1,tol:0,explain:"f\u2032 = 2x ln x + x\xB2\xB7(1/x) = 2x ln x + x \u21D2 f\u2032(1) = 0 + 1 = 1."},{id:"m5-2-16",type:"num",topic:"Regole",q:"f(x) = (x + 1)/(x \u2212 1). Quanto vale f\u2032(0)?",answer:-2,tol:0,explain:"f\u2032 = [(x \u2212 1) \u2212 (x + 1)]/(x \u2212 1)\xB2 = \u22122/(x \u2212 1)\xB2 \u21D2 f\u2032(0) = \u22122."},{id:"m5-2-17",type:"num",topic:"Regole",q:"f(x) = (2x + 1)\xB3. Quanto vale f\u2032(0)?",answer:6,tol:0,explain:"f\u2032 = 3(2x + 1)\xB2 \xB7 2 \u21D2 f\u2032(0) = 6."}]},{id:"m5l3",title:"Derivate in economia",icon:"\u{1F4B9}",theory:[{title:"Grandezze marginali",points:["**Costo marginale** C\u2032(x): quanto costa approssimativamente **un\u2019unit\xE0 in pi\xF9** partendo da x.","**Tasso medio** di variazione: \u0394C/\u0394x = [C(x + \u0394x) \u2212 C(x)]/\u0394x, su un intervallo finito. La derivata \xE8 il suo limite per \u0394x \u2192 0.","**Ricavo marginale** R\u2032(x) e **profitto marginale** P\u2032(x) = R\u2032(x) \u2212 C\u2032(x).","**Costo medio** CM(x) = C(x)/x: costo per unit\xE0 prodotta."],example:"C(x) = 2000 + 10x + 0,2x\xB2 \u21D2 C\u2032(x) = 10 + 0,4x. A x = 100: C\u2032 = 50 \u20AC per il 101\xB0 pezzo."}],exercises:[{id:"m5-3-1",type:"mc",topic:"Marginali",q:"Che cosa misura il costo marginale C\u2032(x)?",options:["Il costo approssimato di un\u2019unit\xE0 in pi\xF9","Il costo medio di tutte le unit\xE0","Il costo fisso dell\u2019impresa","Il costo totale diviso per il prezzo"],answer:0,explain:"\xC8 la derivata del costo totale: variazione del costo per unit\xE0 aggiuntiva."},{id:"m5-3-2",type:"num",topic:"Marginali",q:"C(x) = 2000 + 10x + 0,2x\xB2. Quanto vale C\u2032(100)?",answer:50,tol:0,unit:"\u20AC",explain:"C\u2032 = 10 + 0,4x \u21D2 10 + 40 = 50."},{id:"m5-3-3",type:"num",topic:"Tasso medio",q:"C(x) = x\xB2 + 5. Tasso medio di variazione tra x = 2 e x = 4?",answer:6,tol:0,explain:"[C(4) \u2212 C(2)]/2 = (21 \u2212 9)/2 = 6."},{id:"m5-3-4",type:"num",topic:"Marginali",q:"R(x) = 50x \u2212 0,5x\xB2. Quanto vale il ricavo marginale R\u2032(20)?",answer:30,tol:0,explain:"R\u2032 = 50 \u2212 x \u21D2 50 \u2212 20 = 30."},{id:"m5-3-5",type:"mc",topic:"Marginali",q:"Differenza tra tasso medio e costo marginale:",options:["Il medio usa un \u0394x finito, il marginale il limite \u0394x \u2192 0","Sono la stessa grandezza chiamata con nomi diversi","Il marginale \xE8 sempre maggiore del tasso medio","Il medio si calcola usando la derivata seconda"],answer:0,explain:"Il rapporto incrementale diventa la derivata quando l\u2019intervallo si restringe a zero."},{id:"m5-3-6",type:"num",topic:"Costo medio",q:"C(x) = 2000 + 10x + 0,2x\xB2. Costo medio a x = 100?",answer:50,tol:0,unit:"\u20AC",explain:"C(100) = 2000 + 1000 + 2000 = 5000 \u21D2 5000/100 = 50."},{id:"m5-3-7",type:"mc",topic:"Marginali",q:"Profitto marginale P\u2032(x) =",options:["R\u2032(x) \u2212 C\u2032(x)","R\u2032(x) + C\u2032(x)","R(x)/C(x)","C\u2032(x) \u2212 R\u2032(x)"],answer:0,explain:"La derivata \xE8 lineare: (R \u2212 C)\u2032 = R\u2032 \u2212 C\u2032."},{id:"m5-3-8",type:"num",topic:"Marginali",q:"C(x) = 500 + 4x. Quanto vale il costo marginale?",answer:4,tol:0,explain:"Con costo lineare il marginale \xE8 costante e uguale al costo unitario."}]},{id:"m5l4",title:"Derivabilit\xE0 e punti critici",icon:"\u{1F4D0}",theory:[{title:"Derivata destra e sinistra",points:["**Derivata destra** f\u2032\u208A(x\u2080): limite del rapporto incrementale per h \u2192 0\u207A; **sinistra** f\u2032\u208B(x\u2080) per h \u2192 0\u207B.","f \xE8 derivabile in x\u2080 se le due esistono finite e **coincidono**.","**Derivabile \u21D2 continua**, ma **non vale il viceversa**: |x| \xE8 continua in 0 ma non derivabile."]},{title:"Punti di non derivabilit\xE0",points:["**Punto angoloso**: derivate destra e sinistra finite ma diverse (|x| in 0: \u22121 e +1).","**Cuspide**: derivate destra e sinistra infinite di segno opposto (\u221A|x| in 0).","**Flesso a tangente verticale**: derivate destra e sinistra infinite dello stesso segno (\u221Bx in 0)."]}],exercises:[{id:"m5-4-1",type:"tf",topic:"Derivabilit\xE0",q:"Se f \xE8 derivabile in x\u2080 allora \xE8 continua in x\u2080.",answer:!0,explain:"La derivabilit\xE0 \xE8 una condizione pi\xF9 forte della continuit\xE0."},{id:"m5-4-2",type:"tf",topic:"Derivabilit\xE0",q:"Se f \xE8 continua in x\u2080 allora \xE8 derivabile in x\u2080.",answer:!1,explain:"Controesempio: |x| in 0 \xE8 continua ma ha un punto angoloso."},{id:"m5-4-3",type:"mc",topic:"Punti critici",q:"f(x) = |x| in x = 0 presenta\u2026",options:["un punto angoloso","una cuspide","un flesso a tangente verticale","un punto di derivabilit\xE0"],answer:0,explain:"Derivata sinistra \u22121, destra +1: finite ma diverse."},{id:"m5-4-4",type:"mc",topic:"Punti critici",q:"Derivata destra +\u221E e sinistra \u2212\u221E. Che punto \xE8?",options:["Una cuspide","Un punto angoloso","Un flesso a tangente verticale","Un minimo derivabile"],answer:0,explain:"Infinite di segno opposto: la curva forma una punta."},{id:"m5-4-5",type:"mc",topic:"Punti critici",q:"f(x) = \u221Bx in x = 0 presenta\u2026",options:["un flesso a tangente verticale","una cuspide verso il basso","un punto angoloso in 0","un asintoto verticale x = 0"],answer:0,explain:"f\u2032 = 1/(3\u221Bx\xB2) \u2192 +\u221E da entrambi i lati: tangente verticale, curva che \u201Cattraversa\u201D."},{id:"m5-4-6",type:"match",topic:"Punti critici",q:"Abbina il punto alle derivate destra e sinistra",pairs:[["Punto angoloso","Finite e diverse"],["Cuspide","Infinite di segno opposto"],["Flesso a tangente verticale","Infinite dello stesso segno"]],explain:"Sono i tre casi di funzione continua ma non derivabile."},{id:"m5-4-7",type:"num",topic:"Derivabilit\xE0",q:"f(x) = |x \u2212 2|. Derivata destra in x = 2?",answer:1,tol:0,explain:"Per x > 2 f = x \u2212 2, pendenza 1. Da sinistra \u22121: punto angoloso."}]},{id:"m5l5",title:"De l\u2019H\xF4pital e derivate successive",icon:"\u{1F9E0}",theory:[{title:"Teorema di De l\u2019H\xF4pital",points:["Se lim f/g d\xE0 **0/0 oppure \u221E/\u221E** e f, g sono derivabili (g\u2032 \u2260 0 vicino al punto), allora **lim f/g = lim f\u2032/g\u2032** (se quest\u2019ultimo esiste).","Si deriva **separatamente** numeratore e denominatore: **NON** \xE8 la derivata del quoziente!","Si pu\xF2 applicare pi\xF9 volte. Con **0 \xB7 \u221E** si riscrive prima come quoziente: x ln x = ln x / (1/x)."],example:"lim (x \u2192 0) (\u221B(8 + x) \u2212 2)/x: 0/0. Derivo: [\u2153(8 + x)^(\u2212\u2154)]/1 \u2192 \u2153 \xB7 8^(\u2212\u2154) = \u2153 \xB7 \xBC = 1/12."},{title:"Derivate successive",points:["La **derivata seconda** f\u2033 \xE8 la derivata di f\u2032; la terza f\u2034 \xE8 la derivata di f\u2033, e cos\xEC via.","f\u2033 servir\xE0 per i massimi e minimi e per concavit\xE0 e convessit\xE0."],example:"f = x\u2074 \u21D2 f\u2032 = 4x\xB3, f\u2033 = 12x\xB2, f\u2034 = 24x, f\u207D\u2074\u207E = 24."}],exercises:[{id:"m5-5-1",type:"mc",topic:"De l\u2019H\xF4pital",q:"Quando si pu\xF2 applicare De l\u2019H\xF4pital?",options:["Con le forme 0/0 o \u221E/\u221E","Con qualsiasi limite","Solo con 1^\u221E","Solo con limiti finiti"],answer:0,explain:"Le altre forme indeterminate vanno prima ricondotte a 0/0 o \u221E/\u221E."},{id:"m5-5-2",type:"mc",topic:"De l\u2019H\xF4pital",q:"Applicando De l\u2019H\xF4pital a f/g si calcola\u2026",options:["lim f\u2032/g\u2032 (derivate separate)","lim (f/g)\u2032 (derivata del quoziente)","lim f\u2032 \xB7 g\u2032","lim f/g\u2032"],answer:0,explain:"Errore classico: non si usa la regola del quoziente."},{id:"m5-5-3",type:"num",topic:"De l\u2019H\xF4pital",q:"lim (x \u2192 0) (\u221B(8 + x) \u2212 2)/x = ? (decimale)",answer:.08333,tol:.001,shown:"1/12",explain:"\u2153(8 + x)^(\u2212\u2154) in 0 = \u2153 \xB7 \xBC = 1/12 \u2248 0,0833."},{id:"m5-5-4",type:"num",topic:"De l\u2019H\xF4pital",q:"lim (x \u2192 0\u207A) x \xB7 ln x = ?",answer:0,tol:0,explain:"0 \xB7 (\u2212\u221E): riscrivo ln x/(1/x) (\u221E/\u221E). Derivo: (1/x)/(\u22121/x\xB2) = \u2212x \u2192 0."},{id:"m5-5-5",type:"num",topic:"De l\u2019H\xF4pital",q:"lim (x \u2192 0) (e\u02E3 \u2212 1)/x = ?",answer:1,tol:0,explain:"0/0: e\u02E3/1 \u2192 1."},{id:"m5-5-6",type:"num",topic:"De l\u2019H\xF4pital",q:"lim (x \u2192 0) ln(1 + x)/x = ?",answer:1,tol:0,explain:"0/0: [1/(1 + x)]/1 \u2192 1."},{id:"m5-5-7",type:"mc",topic:"De l\u2019H\xF4pital",q:"lim (x \u2192 +\u221E) x/e\u02E3 = ?",options:["0","+\u221E","1","Non esiste"],answer:0,explain:"\u221E/\u221E: 1/e\u02E3 \u2192 0. L\u2019esponenziale batte la potenza."},{id:"m5-5-8",type:"num",topic:"De l\u2019H\xF4pital",q:"lim (x \u2192 2) (x\xB2 \u2212 4)/(x \u2212 2) con De l\u2019H\xF4pital = ?",answer:4,tol:0,explain:"2x/1 \u2192 4. Stesso risultato della scomposizione."},{id:"m5-5-9",type:"num",topic:"Derivate successive",q:"f(x) = x\u2074. Quanto vale f\u2033(1)?",answer:12,tol:0,explain:"f\u2032 = 4x\xB3, f\u2033 = 12x\xB2 \u21D2 12."},{id:"m5-5-10",type:"num",topic:"Derivate successive",q:"f(x) = x\xB3 \u2212 6x\xB2. Quanto vale f\u2033(2)?",answer:0,tol:0,explain:"f\u2032 = 3x\xB2 \u2212 12x, f\u2033 = 6x \u2212 12 \u21D2 f\u2033(2) = 0 (candidato flesso)."},{id:"m5-5-11",type:"mc",topic:"Derivate successive",q:"Derivata terza di f(x) = x\xB3:",options:["6","6x","3x\xB2","0"],answer:0,explain:"3x\xB2 \u2192 6x \u2192 6."},{id:"m5-5-12",type:"tf",topic:"De l\u2019H\xF4pital",q:"Per x \xB7 ln x con x \u2192 0\u207A (forma 0 \xB7 \u221E) si pu\xF2 usare direttamente De l\u2019H\xF4pital senza riscrivere.",answer:!1,explain:"Bisogna prima trasformarlo in quoziente: ln x / (1/x)."}]},{id:"m5l6",title:"Esercizi guidati: derivate",icon:"\u{1FA9C}",theory:[{title:"Retta tangente in 3 passi",points:["1 \xB7 Calcolo **f(x\u2080)**: il punto di tangenza.","2 \xB7 Calcolo **f\u2032(x\u2080)**: la pendenza.","3 \xB7 Scrivo **y = f\u2032(x\u2080)(x \u2212 x\u2080) + f(x\u2080)** e semplifico.","Per De l\u2019H\xF4pital: controllo la forma (0/0 o \u221E/\u221E), derivo sopra e sotto separatamente."]}],exercises:[{id:"m5-6-1",type:"steps",topic:"Retta tangente",q:"Tangente a f(x) = x\xB2 nel punto x\u2080 = 3.",steps:[{q:"f(3) = ?",kind:"num",answer:9,explain:"Punto di tangenza (3, 9)."},{q:"f\u2032(3) = ?",kind:"num",answer:6,explain:"f\u2032 = 2x \u21D2 6."},{q:"Tangente y = 6x + q: q = ?",kind:"num",answer:-9,explain:"y = 6(x \u2212 3) + 9 = 6x \u2212 9."}],explain:"Tangente y = 6x \u2212 9."},{id:"m5-6-2",type:"steps",topic:"Retta tangente",q:"Tangente a f(x) = ln x nel punto x\u2080 = 1.",steps:[{q:"f(1) = ?",kind:"num",answer:0,explain:"ln 1 = 0."},{q:"f\u2032(1) = ?",kind:"num",answer:1,explain:"f\u2032 = 1/x \u21D2 1."},{q:"Equazione della tangente?",kind:"mc",answer:0,options:["y = x \u2212 1","y = x","y = x + 1","y = 1/x"],explain:"y = 1 \xB7 (x \u2212 1) + 0."}],explain:"Tangente y = x \u2212 1."},{id:"m5-6-3",type:"steps",topic:"De l\u2019H\xF4pital",q:"Calcola lim (x \u2192 0) (\u221B(8 + x) \u2212 2)/x (esempio degli appunti).",steps:[{q:"Forma?",kind:"mc",answer:0,options:["0/0","\u221E/\u221E","2/0","0 \xB7 \u221E"],explain:"\u221B8 \u2212 2 = 0 e x \u2192 0."},{q:"Derivata del numeratore?",kind:"mc",answer:0,options:["\u2153(8 + x)^(\u2212\u2154)","3(8 + x)\xB2","\u2153(8 + x)^(\u2154)","1/(2\u221A(8 + x))"],explain:"(\u221Bu)\u2032 = \u2153u^(\u2212\u2154)."},{q:"Valore della derivata del numeratore in 0?",kind:"num",answer:.08333333333333333,tol:.002,shown:"1/12",explain:"8^(\u2212\u2154) = 1/4 \u21D2 \u2153 \xB7 \xBC = 1/12."},{q:"Limite?",kind:"num",answer:.08333333333333333,tol:.002,shown:"1/12",explain:"La derivata del denominatore \xE8 1: (1/12)/1."}],explain:"Derivo sopra e sotto separatamente, poi sostituisco."},{id:"m5-6-4",type:"steps",topic:"De l\u2019H\xF4pital",q:"Calcola lim (x \u2192 0\u207A) x \xB7 ln x.",steps:[{q:"Forma?",kind:"mc",answer:0,options:["0 \xB7 (\u2212\u221E)","0/0","\u221E/\u221E","1^\u221E"],explain:"x \u2192 0 e ln x \u2192 \u2212\u221E."},{q:"Come la riscrivo?",kind:"mc",answer:0,options:["ln x / (1/x)","x / ln x","(x ln x)\u2032","ln(x\xB2)"],explain:"Cos\xEC diventa \u221E/\u221E."},{q:"Rapporto delle derivate?",kind:"mc",answer:0,options:["(1/x)/(\u22121/x\xB2) = \u2212x","(1/x)/(1/x) = 1","ln x / x","\u22121/x"],explain:"(ln x)\u2032 = 1/x, (1/x)\u2032 = \u22121/x\xB2."},{q:"Limite?",kind:"num",answer:0,explain:"\u2212x \u2192 0."}],explain:"Con 0 \xB7 \u221E prima si riscrive come quoziente."},{id:"m5-6-5",type:"steps",topic:"Marginali",scenario:"Magliette: C(x) = 2000 + 10x + 0,2x\xB2.",q:"Confronta costo marginale e tasso medio.",steps:[{q:"C\u2032(x) = ?",kind:"mc",answer:0,options:["10 + 0,4x","10 + 0,2x","2000 + 10x","0,4x"],explain:"La costante sparisce, (0,2x\xB2)\u2032 = 0,4x."},{q:"C\u2032(100) = ?",kind:"num",answer:50,unit:"\u20AC",explain:"10 + 40 = 50."},{q:"Tasso medio tra 100 e 110: [C(110) \u2212 C(100)]/10 = ?",kind:"num",answer:52,unit:"\u20AC",explain:"C(110) = 2000 + 1100 + 2420 = 5520, C(100) = 5000 \u21D2 520/10 = 52."}],explain:"Il tasso medio si avvicina a C\u2032 quando l\u2019intervallo si restringe."}]}],open:[{id:"m5-o1",q:"Definisci la derivata e spiega il suo significato geometrico.",answer:"f\u2032(x\u2080) = lim (h \u2192 0) [f(x\u2080 + h) \u2212 f(x\u2080)]/h, cio\xE8 il limite del rapporto incrementale, se esiste finito. Il rapporto incrementale \xE8 la pendenza della secante tra due punti; al limite diventa la pendenza della retta tangente in x\u2080, di equazione y = f\u2032(x\u2080)(x \u2212 x\u2080) + f(x\u2080).",keywords:["rapporto incrementale","limite","h \u2192 0","secante","tangente","pendenza"]},{id:"m5-o2",q:"Elenca le regole di derivazione con un esempio per ciascuna.",answer:"Linearit\xE0 (af + bg)\u2032 = af\u2032 + bg\u2032. Prodotto (fg)\u2032 = f\u2032g + fg\u2032, es. (x e\u02E3)\u2032 = e\u02E3(1 + x). Quoziente (f/g)\u2032 = (f\u2032g \u2212 fg\u2032)/g\xB2, es. ((x + 1)/(x \u2212 1))\u2032 = \u22122/(x \u2212 1)\xB2. Catena [g(f(x))]\u2032 = g\u2032(f(x))\xB7f\u2032(x), es. (e^(x\xB2))\u2032 = 2x e^(x\xB2).",keywords:["prodotto","f\u2032g + fg\u2032","quoziente","g\xB2","catena","composta"]},{id:"m5-o3",q:"Che differenza c\u2019\xE8 tra tasso medio di variazione e costo marginale?",answer:"Il tasso medio \xE8 \u0394C/\u0394x = [C(x + \u0394x) \u2212 C(x)]/\u0394x su un intervallo finito; il costo marginale \xE8 la derivata C\u2032(x), cio\xE8 il limite del tasso medio per \u0394x \u2192 0, e approssima il costo di un\u2019unit\xE0 in pi\xF9. Esempio C = 2000 + 10x + 0,2x\xB2: C\u2032(100) = 50.",keywords:["\u0394C/\u0394x","intervallo","derivata","limite","unit\xE0 in pi\xF9"]},{id:"m5-o4",q:"Che legame c\u2019\xE8 tra continuit\xE0 e derivabilit\xE0? Descrivi i punti di non derivabilit\xE0.",answer:"Derivabile implica continua, ma non viceversa. Punti in cui f \xE8 continua ma non derivabile: punto angoloso (derivate destra e sinistra finite ma diverse, |x| in 0), cuspide (infinite di segno opposto, \u221A|x|), flesso a tangente verticale (infinite dello stesso segno, \u221Bx).",keywords:["derivabile","continua","viceversa","angoloso","cuspide","tangente verticale"]},{id:"m5-o5",q:"Enuncia il teorema di De l\u2019H\xF4pital e risolvi lim (x \u2192 0\u207A) x ln x.",answer:"Se lim f/g \xE8 nella forma 0/0 o \u221E/\u221E, f e g derivabili con g\u2032 \u2260 0, allora lim f/g = lim f\u2032/g\u2032 se quest\u2019ultimo esiste. Si derivano numeratore e denominatore separatamente, non il quoziente. x ln x \xE8 0\xB7\u221E: lo riscrivo ln x / (1/x) (\u221E/\u221E), derivo: (1/x)/(\u22121/x\xB2) = \u2212x \u2192 0.",keywords:["0/0","\u221E/\u221E","f\u2032/g\u2032","separatamente","riscriv","0"]}],cards:[{id:"m5-c1",front:"Derivata in x\u2080",back:"lim h\u21920 [f(x\u2080 + h) \u2212 f(x\u2080)]/h."},{id:"m5-c2",front:"Retta tangente",back:"y = f\u2032(x\u2080)(x \u2212 x\u2080) + f(x\u2080)."},{id:"m5-c3",front:"(x\u207F)\u2032",back:"n\xB7x\u207F\u207B\xB9."},{id:"m5-c4",front:"(e\u02E3)\u2032 e (a\u02E3)\u2032",back:"e\u02E3; a\u02E3 ln a."},{id:"m5-c5",front:"(ln x)\u2032 e (\u221Ax)\u2032",back:"1/x; 1/(2\u221Ax)."},{id:"m5-c6",front:"Prodotto",back:"(fg)\u2032 = f\u2032g + fg\u2032."},{id:"m5-c7",front:"Quoziente",back:"(f/g)\u2032 = (f\u2032g \u2212 fg\u2032)/g\xB2."},{id:"m5-c8",front:"Catena",back:"[g(f(x))]\u2032 = g\u2032(f(x))\xB7f\u2032(x)."},{id:"m5-c9",front:"Costo marginale",back:"C\u2032(x): costo di un\u2019unit\xE0 in pi\xF9."},{id:"m5-c10",front:"Derivabile \u21D4 continua?",back:"Derivabile \u21D2 continua; il viceversa \xE8 falso (|x|)."},{id:"m5-c11",front:"Punto angoloso / cuspide",back:"Derivate finite diverse / infinite di segno opposto."},{id:"m5-c12",front:"De l\u2019H\xF4pital",back:"0/0 o \u221E/\u221E: lim f/g = lim f\u2032/g\u2032 (derivate separate)."}]},D0=Az;var Ez={id:"m6",n:6,title:"Studio di funzione",subtitle:"Massimi, minimi, convessit\xE0, ottimo economico",color:"#8B5CF6",colorDark:"#6D28D9",lessons:[{id:"m6l1",title:"Massimi, minimi e Fermat",icon:"\u26F0\uFE0F",theory:[{title:"Estremi locali e globali",points:["x\u2080 \xE8 **massimo locale** se f(x\u2080) \u2265 f(x) per ogni x **vicino** a x\u2080; **minimo locale** se f(x\u2080) \u2264 f(x).","x\u2080 \xE8 **massimo globale (assoluto)** se f(x\u2080) \u2265 f(x) per **ogni** x del dominio.","**Globale \u21D2 locale**, non il contrario: un massimo locale pu\xF2 essere superato altrove."]},{title:"Teorema di Fermat",points:["Se x\u2080 \xE8 un estremo locale **interno** al dominio e f \xE8 derivabile in x\u2080, allora **f\u2032(x\u2080) = 0**.","I punti con f\u2032(x\u2080) = 0 si chiamano **stazionari**: la tangente \xE8 orizzontale.","**Non vale il viceversa**: f(x) = x\xB3 ha f\u2032(0) = 0 ma in 0 c\u2019\xE8 un flesso, non un estremo.","Gli estremi possono trovarsi anche negli **estremi dell\u2019intervallo** o nei punti di non derivabilit\xE0 (|x| in 0)."]}],exercises:[{id:"m6-1-1",type:"tf",topic:"Estremi",q:"Ogni massimo globale \xE8 anche un massimo locale.",answer:!0,explain:"Se f(x\u2080) supera tutti i valori, supera anche quelli vicini."},{id:"m6-1-2",type:"tf",topic:"Estremi",q:"Ogni massimo locale \xE8 anche un massimo globale.",answer:!1,explain:"Un \u201Cpicco\u201D pu\xF2 essere pi\xF9 basso di un altro punto del grafico."},{id:"m6-1-3",type:"mc",topic:"Fermat",q:"Che cosa dice il teorema di Fermat?",options:["In un estremo locale interno derivabile f\u2032(x\u2080) = 0","Se f\u2032(x\u2080) = 0 allora x\u2080 \xE8 sicuramente un massimo","Ogni funzione continua ha sempre un massimo","In un punto di minimo f\u2032 \xE8 sempre positiva"],answer:0,explain:"\xC8 una condizione necessaria, non sufficiente."},{id:"m6-1-4",type:"tf",topic:"Fermat",q:"Se f\u2032(x\u2080) = 0 allora x\u2080 \xE8 sicuramente un massimo o un minimo.",answer:!1,explain:"x\xB3 in 0: derivata nulla ma flesso orizzontale."},{id:"m6-1-5",type:"mc",topic:"Fermat",q:"Un punto stazionario \xE8 un punto in cui\u2026",options:["f\u2032(x\u2080) = 0","f(x\u2080) = 0","f\u2033(x\u2080) = 0","f non \xE8 derivabile"],answer:0,explain:"La tangente \xE8 orizzontale."},{id:"m6-1-6",type:"hotspot",topic:"Estremi",scene:"studio",q:"Tocca il massimo locale",answer:"max",explain:"\xC8 il punto pi\xF9 alto \u201Cnei dintorni\u201D: prima la funzione sale, poi scende."},{id:"m6-1-7",type:"hotspot",topic:"Estremi",scene:"studio",q:"Tocca il minimo locale",answer:"min",explain:"Prima scende, poi sale: f\u2032 passa da negativa a positiva."},{id:"m6-1-8",type:"num",topic:"Punti stazionari",q:"f(x) = x\xB2 \u2212 6x + 1. In quale x si trova il punto stazionario?",answer:3,tol:0,explain:"f\u2032 = 2x \u2212 6 = 0 \u21D2 x = 3."},{id:"m6-1-9",type:"mc",topic:"Estremi",q:"f(x) = |x| ha un minimo in x = 0 anche se\u2026",options:["f\u2032(0) non esiste","f\u2032(0) = 1","f(0) \xE8 negativo","f non \xE8 continua in 0"],answer:0,explain:"Gli estremi si cercano anche nei punti di non derivabilit\xE0."},{id:"m6-1-10",type:"num",topic:"Punti stazionari",q:"f(x) = x\xB3 \u2212 3x. Quanti punti stazionari ha?",answer:2,tol:0,explain:"f\u2032 = 3x\xB2 \u2212 3 = 0 \u21D2 x = \xB11."}]},{id:"m6l2",title:"Monotonia e test della derivata",icon:"\u{1F50D}",theory:[{title:"Teorema di Lagrange e conseguenze",points:["**Lagrange**: f continua su [a, b] e derivabile in (a, b) \u21D2 esiste c \u2208 (a, b) con **f\u2032(c) = [f(b) \u2212 f(a)]/(b \u2212 a)**.","In un punto la tangente \xE8 parallela alla secante tra gli estremi.","Conseguenze: **f\u2032 > 0** su un intervallo \u21D2 f **strettamente crescente**; **f\u2032 < 0** \u21D2 **strettamente decrescente**; f\u2032 = 0 \u21D2 costante."],example:"f = x\xB2 su [1, 3]: (9 \u2212 1)/2 = 4 = 2c \u21D2 c = 2."},{title:"Classificare i punti stazionari",points:["**Segno di f\u2032**: + poi \u2212 \u21D2 **massimo**; \u2212 poi + \u21D2 **minimo**; stesso segno \u21D2 **flesso orizzontale**.","**Test della derivata seconda** in un punto stazionario: **f\u2033 > 0 \u21D2 minimo**, **f\u2033 < 0 \u21D2 massimo**.","Se f\u2033(x\u2080) = 0 si guarda **f\u2034**: se f\u2034(x\u2080) \u2260 0 \xE8 un **flesso orizzontale**."],tip:"f\u2033 > 0 = \u201Csorriso\u201D \u222A = minimo. f\u2033 < 0 = \u201Cbroncio\u201D \u2229 = massimo."}],exercises:[{id:"m6-2-1",type:"mc",topic:"Lagrange",q:"Che cosa garantisce il teorema di Lagrange?",options:["Un c con f\u2032(c) = [f(b) \u2212 f(a)]/(b \u2212 a)","Un punto c in (a, b) con f(c) = 0","Che f abbia massimo e minimo assoluti","Che f\u2032 sia positiva su tutto (a, b)"],answer:0,explain:"Esiste una tangente parallela alla secante tra gli estremi."},{id:"m6-2-2",type:"num",topic:"Lagrange",q:"f(x) = x\xB2 su [1, 3]. Trova il punto c di Lagrange.",answer:2,tol:0,explain:"[f(3) \u2212 f(1)]/2 = 4 = f\u2032(c) = 2c \u21D2 c = 2."},{id:"m6-2-3",type:"mc",topic:"Monotonia",q:"Se f\u2032(x) > 0 su tutto un intervallo, allora f \xE8\u2026",options:["strettamente crescente","strettamente decrescente","costante","concava"],answer:0,explain:"\xC8 una conseguenza del teorema di Lagrange."},{id:"m6-2-4",type:"mc",topic:"Segno di f\u2032",q:"f\u2032 \xE8 positiva prima di x\u2080 e negativa dopo. In x\u2080 c\u2019\xE8\u2026",options:["un massimo","un minimo","un flesso orizzontale","un asintoto"],answer:0,explain:"La funzione sale e poi scende."},{id:"m6-2-5",type:"mc",topic:"Derivata seconda",q:"f\u2032(x\u2080) = 0 e f\u2033(x\u2080) > 0. In x\u2080 c\u2019\xE8\u2026",options:["un minimo locale","un massimo locale","un flesso orizzontale","un punto angoloso"],answer:0,explain:"Concavit\xE0 verso l\u2019alto: minimo."},{id:"m6-2-6",type:"mc",topic:"Derivata seconda",q:"f\u2032(x\u2080) = 0, f\u2033(x\u2080) = 0 e f\u2034(x\u2080) \u2260 0. In x\u2080 c\u2019\xE8\u2026",options:["un flesso orizzontale","un massimo locale","un minimo locale","una cuspide"],answer:0,explain:"\xC8 il caso di x\xB3 in 0."},{id:"m6-2-7",type:"num",topic:"Derivata seconda",q:"f(x) = x\xB3 \u2212 3x. Dove si trova il massimo locale? (x = ?)",answer:-1,tol:0,explain:"f\u2032 = 3x\xB2 \u2212 3 \u21D2 x = \xB11. f\u2033 = 6x: f\u2033(\u22121) = \u22126 < 0 \u21D2 massimo in x = \u22121."},{id:"m6-2-8",type:"num",topic:"Derivata seconda",q:"f(x) = x\xB3 \u2212 3x. Valore del minimo locale f(1)?",answer:-2,tol:0,explain:"f(1) = 1 \u2212 3 = \u22122; f\u2033(1) = 6 > 0 conferma il minimo."},{id:"m6-2-9",type:"num",topic:"Segno di f\u2032",q:"f(x) = \u2212x\xB2 + 8x \u2212 5. In che x c\u2019\xE8 il massimo?",answer:4,tol:0,explain:"f\u2032 = \u22122x + 8 = 0 \u21D2 x = 4; f\u2033 = \u22122 < 0."},{id:"m6-2-10",type:"match",topic:"Classificazione",q:"Abbina la situazione (con f\u2032(x\u2080) = 0) al tipo di punto",pairs:[["f\u2032: + \u2192 \u2212","Massimo"],["f\u2032: \u2212 \u2192 +","Minimo"],["f\u2032: + \u2192 +","Flesso orizzontale"],["f\u2033(x\u2080) > 0","Minimo (test di f\u2033)"]],explain:"Due metodi: segno di f\u2032 intorno al punto oppure segno di f\u2033 nel punto."},{id:"m6-2-11",type:"order",topic:"Procedura",q:"Ordina i passaggi per trovare massimi e minimi locali",items:["Trovo il dominio di f","Calcolo f\u2032(x)","Risolvo f\u2032(x) = 0","Studio il segno di f\u2032 (o di f\u2033) nei punti trovati"],explain:"Poi si calcolano i valori f(x\u2080) dei punti trovati."}]},{id:"m6l3",title:"Massimi e minimi assoluti su [a, b]",icon:"\u{1F3D4}\uFE0F",theory:[{title:"Il metodo dei candidati",points:["Per Weierstrass, se f \xE8 continua su **[a, b]** gli estremi assoluti esistono.","**Candidati**: punti stazionari interni (f\u2032 = 0), punti di non derivabilit\xE0, **estremi a e b**.","Si calcola f in tutti i candidati: il valore pi\xF9 grande \xE8 il **massimo assoluto**, il pi\xF9 piccolo il **minimo assoluto**."],example:"f = x\xB3 \u2212 3x su [\u22122, 3]: candidati \u22122, \u22121, 1, 3. f(\u22122) = \u22122, f(\u22121) = 2, f(1) = \u22122, f(3) = 18. Max assoluto 18 in x = 3; min assoluto \u22122 in x = \u22122 e x = 1."}],exercises:[{id:"m6-3-1",type:"mc",topic:"Estremi assoluti",q:"Su [a, b], quali sono i candidati per gli estremi assoluti?",options:["Punti stazionari, non derivabili ed estremi a, b","Solo i punti in cui f\u2032(x) = 0","Solo gli estremi a e b dell\u2019intervallo","Solo i punti in cui f\u2033(x) = 0"],answer:0,explain:"Spesso il massimo assoluto \xE8 proprio in un estremo dell\u2019intervallo."},{id:"m6-3-2",type:"num",topic:"Estremi assoluti",q:"f(x) = x\xB3 \u2212 3x su [\u22122, 3]. Massimo assoluto?",answer:18,tol:0,explain:"f(3) = 27 \u2212 9 = 18 supera f(\u22121) = 2."},{id:"m6-3-3",type:"num",topic:"Estremi assoluti",q:"f(x) = x\xB3 \u2212 3x su [\u22122, 3]. Minimo assoluto?",answer:-2,tol:0,explain:"f(\u22122) = \u22122 e f(1) = \u22122: entrambi minimi assoluti."},{id:"m6-3-4",type:"num",topic:"Estremi assoluti",q:"f(x) = x\xB2 \u2212 4x su [0, 5]. Minimo assoluto?",answer:-4,tol:0,explain:"f\u2032 = 2x \u2212 4 \u21D2 x = 2, f(2) = \u22124. Estremi: f(0) = 0, f(5) = 5."},{id:"m6-3-5",type:"num",topic:"Estremi assoluti",q:"f(x) = x\xB2 \u2212 4x su [0, 5]. Massimo assoluto?",answer:5,tol:0,explain:"f(5) = 25 \u2212 20 = 5 > f(0) = 0."},{id:"m6-3-6",type:"tf",topic:"Estremi assoluti",q:"Il massimo locale trovato con f\u2032 = 0 \xE8 sempre anche il massimo assoluto su [a, b].",answer:!1,explain:"Bisogna confrontarlo con gli estremi: in x\xB3 \u2212 3x su [\u22122, 3] il max locale vale 2 ma f(3) = 18."},{id:"m6-3-7",type:"num",topic:"Estremi assoluti",q:"f(x) = 2x + 1 su [\u22121, 4]. Massimo assoluto?",answer:9,tol:0,explain:"Retta crescente: il massimo \xE8 all\u2019estremo destro, f(4) = 9."}]},{id:"m6l4",title:"Convessit\xE0 e flessi",icon:"\u{1F300}",theory:[{title:"Concava o convessa",points:["**f\u2033 \u2265 0** su un intervallo \u21D2 f **convessa** (\u222A, \u201Crivolta verso l\u2019alto\u201D): il grafico sta sopra le tangenti.","**f\u2033 \u2264 0** \u21D2 f **concava** (\u2229, \u201Crivolta verso il basso\u201D): il grafico sta sotto le tangenti.","**Flesso**: punto in cui la concavit\xE0 cambia; l\xEC f\u2033 = 0 (se esiste) e cambia segno."],example:"f = \xBDx\xB2 + log(x \u2212 1), dominio x > 1. f\u2032 = x + 1/(x \u2212 1), f\u2033 = 1 \u2212 1/(x \u2212 1)\xB2. f\u2033 = 0 \u21D2 (x \u2212 1)\xB2 = 1 \u21D2 x = 2. Concava su (1, 2), convessa su (2, +\u221E). Flesso in (2, 2)."},{title:"Lo studio di funzione completo",points:["1 \xB7 **Dominio** \xB7 2 \xB7 simmetrie e **intersezioni** con gli assi \xB7 3 \xB7 **segno** di f.","4 \xB7 **limiti** agli estremi del dominio e **asintoti**.","5 \xB7 **f\u2032**: monotonia, massimi e minimi \xB7 6 \xB7 **f\u2033**: concavit\xE0 e flessi \xB7 7 \xB7 **grafico**."]}],exercises:[{id:"m6-4-1",type:"mc",topic:"Convessit\xE0",q:"Se f\u2033(x) > 0 su un intervallo, f \xE8\u2026",options:["convessa (\u222A)","concava (\u2229)","decrescente","costante"],answer:0,explain:"La pendenza cresce: la curva si piega verso l\u2019alto."},{id:"m6-4-2",type:"mc",topic:"Convessit\xE0",q:"f(x) = \u2212x\xB2 \xE8\u2026",options:["concava su tutto \u211D","convessa su tutto \u211D","concava solo per x > 0","n\xE9 concava n\xE9 convessa"],answer:0,explain:"f\u2033 = \u22122 < 0 ovunque."},{id:"m6-4-3",type:"hotspot",topic:"Flessi",scene:"studio",q:"Tocca il punto di flesso",answer:"flesso",explain:"Tra massimo e minimo la curva passa da concava a convessa."},{id:"m6-4-4",type:"num",topic:"Flessi",q:"f(x) = x\xB3 \u2212 6x\xB2 + 1. Ascissa del flesso?",answer:2,tol:0,explain:"f\u2033 = 6x \u2212 12 = 0 \u21D2 x = 2, e f\u2033 cambia segno."},{id:"m6-4-5",type:"num",topic:"Flessi",q:"f(x) = \xBDx\xB2 + log(x \u2212 1). Ascissa del flesso?",answer:2,tol:0,explain:"f\u2033 = 1 \u2212 1/(x \u2212 1)\xB2 = 0 \u21D2 (x \u2212 1)\xB2 = 1 \u21D2 x = 2 (x = 0 \xE8 fuori dominio)."},{id:"m6-4-6",type:"num",topic:"Flessi",q:"Stessa funzione: ordinata del flesso f(2)?",answer:2,tol:0,explain:"\xBD \xB7 4 + log 1 = 2 + 0 = 2. Flesso in (2, 2)."},{id:"m6-4-7",type:"mc",topic:"Convessit\xE0",q:"f(x) = \xBDx\xB2 + log(x \u2212 1) su (1, 2) \xE8\u2026",options:["concava","convessa","costante","non definita"],answer:0,explain:"Per 1 < x < 2 si ha (x \u2212 1)\xB2 < 1 \u21D2 1/(x \u2212 1)\xB2 > 1 \u21D2 f\u2033 < 0."},{id:"m6-4-8",type:"tf",topic:"Flessi",q:"Se f\u2033(x\u2080) = 0 allora x\u2080 \xE8 sicuramente un flesso.",answer:!1,explain:"Serve che f\u2033 cambi segno: x\u2074 ha f\u2033(0) = 0 ma \xE8 convessa ovunque."},{id:"m6-4-9",type:"order",topic:"Studio di funzione",q:"Ordina le fasi dello studio di funzione",items:["Dominio","Segno e intersezioni con gli assi","Limiti e asintoti","Derivata prima: monotonia ed estremi","Derivata seconda: concavit\xE0 e flessi"],explain:"Alla fine si mettono insieme le informazioni per disegnare il grafico."},{id:"m6-4-10",type:"mc",topic:"Convessit\xE0",q:"e\u02E3 \xE8\u2026",options:["convessa su tutto \u211D","concava su tutto \u211D","convessa solo per x > 0","con un flesso in x = 0"],answer:0,explain:"(e\u02E3)\u2033 = e\u02E3 > 0 sempre."},{id:"m6-4-11",type:"mc",topic:"Convessit\xE0",q:"ln x \xE8\u2026",options:["concava su (0, +\u221E)","convessa su (0, +\u221E)","convessa per x > 1","con un flesso in x = 1"],answer:0,explain:"(ln x)\u2033 = \u22121/x\xB2 < 0."}]},{id:"m6l5",title:"Ottimizzazione economica",icon:"\u{1F3ED}",theory:[{title:"Minimo del costo medio",points:["Costo medio **CM(x) = C(x)/x**. Derivando: CM\u2032(x) = [x\xB7C\u2032(x) \u2212 C(x)]/x\xB2.","CM\u2032 = 0 \u21D4 **C\u2032(x\u2080) = C(x\u2080)/x\u2080**: nel minimo del costo medio **costo marginale = costo medio**.","Il costo marginale \u201Ctaglia\u201D il costo medio nel suo punto pi\xF9 basso."],example:"Magliette: C = 2000 + 10x + 0,2x\xB2. CM = 2000/x + 10 + 0,2x. CM\u2032 = \u22122000/x\xB2 + 0,2 = 0 \u21D2 x\xB2 = 10.000 \u21D2 x\u2080 = 100. CM(100) = 20 + 10 + 20 = 50 \u20AC = C\u2032(100)."},{title:"Massimo profitto",points:["P(x) = R(x) \u2212 C(x). Punto stazionario: P\u2032 = 0 \u21D4 **R\u2032(x) = C\u2032(x)** (ricavo marginale = costo marginale).","\xC8 un massimo se P\u2033 < 0."],example:"R = 40x, C = 100 + 4x + 0,5x\xB2: P\u2032 = 40 \u2212 4 \u2212 x = 0 \u21D2 x = 36. P\u2033 = \u22121 < 0 \u21D2 massimo. P(36) = 1440 \u2212 100 \u2212 144 \u2212 648 = 548."}],exercises:[{id:"m6-5-1",type:"mc",topic:"Costo medio",q:"Nel punto di minimo del costo medio vale\u2026",options:["C\u2032(x\u2080) = C(x\u2080)/x\u2080","C\u2032(x\u2080) = 0","C(x\u2080) = 0","C\u2033(x\u2080) = C(x\u2080)"],answer:0,explain:"Costo marginale uguale a costo medio."},{id:"m6-5-2",type:"num",topic:"Costo medio",scenario:"Produzione di magliette: C(x) = 2000 + 10x + 0,2x\xB2.",q:"Quante magliette minimizzano il costo medio?",answer:100,tol:0,explain:"CM\u2032 = \u22122000/x\xB2 + 0,2 = 0 \u21D2 x\xB2 = 10.000 \u21D2 x = 100."},{id:"m6-5-3",type:"num",topic:"Costo medio",scenario:"Produzione di magliette: C(x) = 2000 + 10x + 0,2x\xB2.",q:"Quanto vale il costo medio minimo?",answer:50,tol:0,unit:"\u20AC",explain:"CM(100) = 20 + 10 + 20 = 50 \u20AC, uguale a C\u2032(100) = 10 + 40."},{id:"m6-5-4",type:"mc",topic:"Massimo profitto",q:"La condizione del primo ordine per il massimo profitto \xE8\u2026",options:["R\u2032(x) = C\u2032(x)","R(x) = C(x)","C\u2032(x) = 0","R\u2032(x) = 0"],answer:0,explain:"P\u2032 = R\u2032 \u2212 C\u2032 = 0. R = C \xE8 invece il punto di pareggio."},{id:"m6-5-5",type:"num",topic:"Massimo profitto",q:"R = 40x, C = 100 + 4x + 0,5x\xB2. Quantit\xE0 che massimizza il profitto?",answer:36,tol:0,explain:"P\u2032 = 36 \u2212 x = 0 \u21D2 x = 36."},{id:"m6-5-6",type:"num",topic:"Massimo profitto",q:"Stesso esercizio: profitto massimo P(36)?",answer:548,tol:0,explain:"P = 36x \u2212 100 \u2212 0,5x\xB2 \u21D2 1296 \u2212 100 \u2212 648 = 548."},{id:"m6-5-7",type:"num",topic:"Costo medio",q:"C(x) = 800 + 2x\xB2. Per quale x il costo medio \xE8 minimo?",answer:20,tol:0,explain:"CM = 800/x + 2x; CM\u2032 = \u2212800/x\xB2 + 2 = 0 \u21D2 x\xB2 = 400 \u21D2 x = 20."},{id:"m6-5-8",type:"tf",topic:"Massimo profitto",q:"Il punto di pareggio e il punto di massimo profitto coincidono.",answer:!1,explain:"Pareggio: P = 0. Massimo: P\u2032 = 0. Sono punti diversi."},{id:"m6-5-9",type:"num",topic:"Massimo profitto",q:"P(x) = \u22122x\xB2 + 120x \u2212 1000. Profitto massimo?",answer:800,tol:0,explain:"P\u2032 = \u22124x + 120 = 0 \u21D2 x = 30; P(30) = \u22121800 + 3600 \u2212 1000 = 800."}]},{id:"m6l6",title:"Esercizi d\u2019esame: studio di funzione",icon:"\u{1FA9C}",theory:[{title:"Scaletta per massimi, minimi e flessi",points:["1 \xB7 **Dominio**. 2 \xB7 **f\u2032(x)** e soluzioni di f\u2032 = 0.","3 \xB7 **f\u2033** nei punti stazionari: > 0 minimo, < 0 massimo.","4 \xB7 **f\u2033 = 0** e cambio di segno: flessi.","Su **[a, b]** confronto anche i valori agli estremi."]}],exercises:[{id:"m6-6-1",type:"steps",topic:"Massimi e minimi",q:"Studia f(x) = x\xB3 \u2212 3x.",figure:"studio",steps:[{q:"f\u2032(x) = 0 per x = \xB1 ? (scrivi il valore positivo)",kind:"num",answer:1,explain:"3x\xB2 \u2212 3 = 0 \u21D2 x = \xB11."},{q:"f\u2033(\u22121) = ?",kind:"num",answer:-6,explain:"f\u2033 = 6x \u21D2 \u22126 < 0: massimo."},{q:"Valore del massimo f(\u22121)?",kind:"num",answer:2,explain:"\u22121 + 3 = 2."},{q:"Valore del minimo f(1)?",kind:"num",answer:-2,explain:"1 \u2212 3 = \u22122."},{q:"Ascissa del flesso?",kind:"num",answer:0,explain:"f\u2033 = 6x = 0 \u21D2 x = 0."}],explain:"Massimo (\u22121, 2), minimo (1, \u22122), flesso (0, 0)."},{id:"m6-6-2",type:"steps",topic:"Estremi assoluti",q:"Stessa f(x) = x\xB3 \u2212 3x, ma su [\u22122, 3]: massimo e minimo assoluti.",steps:[{q:"f(\u22122) = ?",kind:"num",answer:-2,explain:"\u22128 + 6 = \u22122."},{q:"f(3) = ?",kind:"num",answer:18,explain:"27 \u2212 9 = 18."},{q:"Massimo assoluto?",kind:"num",answer:18,explain:"Confronto 2 (max locale) e 18: vince l\u2019estremo destro."},{q:"Minimo assoluto?",kind:"num",answer:-2,explain:"f(\u22122) = f(1) = \u22122."}],explain:"Il massimo locale non \xE8 per forza quello assoluto."},{id:"m6-6-3",type:"steps",topic:"Costo medio",scenario:"Magliette: C(x) = 2000 + 10x + 0,2x\xB2.",q:"Trova la produzione che minimizza il costo medio.",steps:[{q:"CM(x) = ?",kind:"mc",answer:0,options:["2000/x + 10 + 0,2x","10 + 0,4x","2000 + 10 + 0,2x","2000x + 10 + 0,2"],explain:"Divido C per x."},{q:"CM\u2032(x) = 0 per x = ?",kind:"num",answer:100,explain:"\u22122000/x\xB2 + 0,2 = 0 \u21D2 x\xB2 = 10.000."},{q:"Costo medio minimo?",kind:"num",answer:50,unit:"\u20AC",explain:"20 + 10 + 20 = 50."},{q:"C\u2032(100) = ?",kind:"num",answer:50,unit:"\u20AC",explain:"10 + 0,4 \xB7 100 = 50: uguale al costo medio."}],explain:"Nel minimo del costo medio: C\u2032(x\u2080) = C(x\u2080)/x\u2080."},{id:"m6-6-4",type:"steps",topic:"Flessi",q:"Studia la concavit\xE0 di f(x) = \xBDx\xB2 + log(x \u2212 1).",steps:[{q:"Dominio?",kind:"mc",answer:0,options:["x > 1","x \u2265 1","\u211D","x > 0"],explain:"Argomento del log positivo: x \u2212 1 > 0."},{q:"f\u2033(x) = ?",kind:"mc",answer:0,options:["1 \u2212 1/(x \u2212 1)\xB2","1 + 1/(x \u2212 1)\xB2","x + 1/(x \u2212 1)","1/(x \u2212 1)"],explain:"f\u2032 = x + 1/(x \u2212 1), f\u2033 = 1 \u2212 1/(x \u2212 1)\xB2."},{q:"f\u2033 = 0 per x = ?",kind:"num",answer:2,explain:"(x \u2212 1)\xB2 = 1 \u21D2 x = 2 (x = 0 \xE8 fuori dominio)."},{q:"f(2) = ?",kind:"num",answer:2,explain:"\xBD \xB7 4 + log 1 = 2."},{q:"Su (1, 2) la funzione \xE8\u2026",kind:"mc",answer:0,options:["concava","convessa","costante","non definita"],explain:"L\xEC 1/(x \u2212 1)\xB2 > 1, quindi f\u2033 < 0."}],explain:"Flesso in (2, 2): concava prima, convessa dopo."},{id:"m6-6-5",type:"steps",topic:"Massimo profitto",scenario:"R(x) = 40x, C(x) = 100 + 4x + 0,5x\xB2.",q:"Massimizza il profitto.",steps:[{q:"R\u2032(x) = C\u2032(x) per x = ?",kind:"num",answer:36,explain:"40 = 4 + x \u21D2 x = 36."},{q:"P\u2033(x) = ?",kind:"num",answer:-1,explain:"P = 36x \u2212 0,5x\xB2 \u2212 100 \u21D2 P\u2033 = \u22121 < 0: massimo."},{q:"Profitto massimo?",kind:"num",answer:548,unit:"\u20AC",explain:"1296 \u2212 648 \u2212 100 = 548."}],explain:"Massimo profitto dove ricavo marginale = costo marginale."}]}],open:[{id:"m6-o1",q:"Enuncia il teorema di Fermat e spiega perch\xE9 non vale il viceversa.",answer:"Se x\u2080 \xE8 un punto di massimo o minimo locale interno al dominio e f \xE8 derivabile in x\u2080, allora f\u2032(x\u2080) = 0 (punto stazionario, tangente orizzontale). Il viceversa \xE8 falso: x\xB3 ha f\u2032(0) = 0 ma in 0 c\u2019\xE8 un flesso orizzontale. Inoltre gli estremi possono trovarsi nei punti non derivabili o agli estremi dell\u2019intervallo.",keywords:["estremo locale","interno","derivabile","f\u2032(x\u2080) = 0","viceversa","x\xB3"]},{id:"m6-o2",q:"Enuncia il teorema di Lagrange e le sue conseguenze sulla monotonia.",answer:"Se f \xE8 continua su [a, b] e derivabile in (a, b) esiste c in (a, b) con f\u2032(c) = [f(b) \u2212 f(a)]/(b \u2212 a): la tangente in c \xE8 parallela alla secante. Conseguenze: se f\u2032 > 0 su un intervallo f \xE8 strettamente crescente, se f\u2032 < 0 strettamente decrescente, se f\u2032 = 0 \xE8 costante.",keywords:["continua","derivabile","f\u2032(c)","secante","crescente","costante"]},{id:"m6-o3",q:"Come si classificano i punti stazionari? Spiega il test della derivata seconda.",answer:"Con il segno di f\u2032: da + a \u2212 massimo, da \u2212 a + minimo, stesso segno flesso orizzontale. Oppure con f\u2033 nel punto stazionario: f\u2033 > 0 minimo, f\u2033 < 0 massimo; se f\u2033 = 0 si guarda f\u2034: se \xE8 diversa da zero c\u2019\xE8 un flesso orizzontale.",keywords:["segno","massimo","minimo","f\u2033 > 0","f\u2033 < 0","f\u2034","flesso"]},{id:"m6-o4",q:"Come si trovano massimo e minimo assoluti di una funzione su [a, b]?",answer:"Per Weierstrass esistono se f \xE8 continua sul chiuso [a, b]. Si cercano i candidati: punti stazionari interni, punti di non derivabilit\xE0 e gli estremi a e b; si calcola f in ciascuno e si confrontano i valori. Esempio x\xB3 \u2212 3x su [\u22122, 3]: max 18 in x = 3, min \u22122 in x = \u22122 e x = 1.",keywords:["Weierstrass","candidati","stazionari","estremi","confront"]},{id:"m6-o5",q:"Definisci convessit\xE0, concavit\xE0 e flesso. Risolvi f(x) = \xBDx\xB2 + log(x \u2212 1).",answer:"f\u2033 \u2265 0 convessa (\u222A), f\u2033 \u2264 0 concava (\u2229); il flesso \xE8 dove cambia la concavit\xE0. Per f = \xBDx\xB2 + log(x \u2212 1) (dominio x > 1): f\u2032 = x + 1/(x \u2212 1), f\u2033 = 1 \u2212 1/(x \u2212 1)\xB2. f\u2033 = 0 per x = 2: concava su (1, 2), convessa su (2, +\u221E), flesso in (2, 2).",keywords:["f\u2033 \u2265 0","convessa","concava","flesso","x = 2","(2, 2)"]},{id:"m6-o6",q:"Dimostra che nel minimo del costo medio il costo marginale \xE8 uguale al costo medio, con l\u2019esempio delle magliette.",answer:"CM = C(x)/x, CM\u2032 = [xC\u2032 \u2212 C]/x\xB2 = 0 \u21D4 C\u2032(x\u2080) = C(x\u2080)/x\u2080. Magliette: C = 2000 + 10x + 0,2x\xB2, CM = 2000/x + 10 + 0,2x, CM\u2032 = \u22122000/x\xB2 + 0,2 = 0 \u21D2 x\u2080 = 100, CM(100) = 50 \u20AC = C\u2032(100) = 10 + 0,4\xB7100.",keywords:["C(x)/x","derivata","C\u2032 = C/x","100","50"]}],cards:[{id:"m6-c1",front:"Globale \u21D2 locale?",back:"S\xEC; locale \u21D2 globale no."},{id:"m6-c2",front:"Fermat",back:"Estremo interno derivabile \u21D2 f\u2032(x\u2080) = 0 (non il viceversa)."},{id:"m6-c3",front:"Lagrange",back:"f\u2032(c) = [f(b) \u2212 f(a)]/(b \u2212 a)."},{id:"m6-c4",front:"f\u2032 > 0 su un intervallo",back:"f strettamente crescente."},{id:"m6-c5",front:"Test di f\u2033",back:"f\u2032 = 0 e f\u2033 > 0 \u21D2 min; f\u2033 < 0 \u21D2 max."},{id:"m6-c6",front:"f\u2033 = f\u2032 = 0, f\u2034 \u2260 0",back:"Flesso orizzontale."},{id:"m6-c7",front:"Estremi assoluti su [a, b]",back:"Confronto f nei punti stazionari, non derivabili e in a, b."},{id:"m6-c8",front:"Convessa / concava",back:"f\u2033 \u2265 0 \u222A convessa; f\u2033 \u2264 0 \u2229 concava."},{id:"m6-c9",front:"Flesso",back:"Cambio di concavit\xE0: f\u2033 = 0 e cambia segno."},{id:"m6-c10",front:"Minimo costo medio",back:"C\u2032(x\u2080) = C(x\u2080)/x\u2080."},{id:"m6-c11",front:"Massimo profitto",back:"R\u2032 = C\u2032 e P\u2033 < 0."}]},L0=Ez;var Tz={id:"m7",n:7,title:"Integrali",subtitle:"Primitive, regole, aree, costo totale",color:"#65A30D",colorDark:"#3F6212",lessons:[{id:"m7l1",title:"Primitive e integrale indefinito",icon:"\u21A9\uFE0F",theory:[{title:"Primitive",points:["F \xE8 una **primitiva** di f se **F\u2032(x) = f(x)**: l\u2019integrazione \xE8 l\u2019operazione inversa della derivazione.","Se F \xE8 primitiva, lo \xE8 anche F + c per ogni costante c: **due primitive differiscono per una costante**.","**Integrale indefinito**: \u222B f(x) dx = F(x) + c, l\u2019insieme di tutte le primitive.","Una condizione come G(x\u2080) = y\u2080 fissa la costante c."],example:"g(x) = x/\u221A(3x\xB2 + 1). Una primitiva \xE8 G(x) = \u2153\u221A(3x\xB2 + 1) + c. Se G(1) = 3: \u2153 \xB7 2 + c = 3 \u21D2 c = 7/3."},{title:"Integrali immediati",points:["**\u222B x\u207F dx = x\u207F\u207A\xB9/(n + 1) + c** (n \u2260 \u22121) \xB7 **\u222B 1/x dx = ln|x| + c**.","**\u222B e\u02E3 dx = e\u02E3 + c** \xB7 **\u222B a\u02E3 dx = a\u02E3/ln a + c**.","**\u222B cos x dx = sin x + c** \xB7 **\u222B sin x dx = \u2212cos x + c**.","**Linearit\xE0**: \u222B (a\xB7f + b\xB7g) dx = a\u222Bf dx + b\u222Bg dx.","Composta: \u222B f\u2032(x)\xB7g\u2032(f(x)) dx = g(f(x)) + c; es. \u222B f\u2032/f dx = ln|f| + c."]}],exercises:[{id:"m7-1-1",type:"mc",topic:"Primitive",q:"F \xE8 primitiva di f se\u2026",options:["F\u2032(x) = f(x)","f\u2032(x) = F(x)","F(x) = f(x) + 1","F(x) \xB7 f(x) = 1"],answer:0,explain:"Derivando la primitiva si ritrova la funzione."},{id:"m7-1-2",type:"tf",topic:"Primitive",q:"Due primitive della stessa funzione differiscono per una costante.",answer:!0,explain:"La derivata di una costante \xE8 0: F e F + c hanno la stessa derivata."},{id:"m7-1-3",type:"mc",topic:"Integrali immediati",q:"\u222B x\xB3 dx = ?",options:["x\u2074/4 + c","3x\xB2 + c","x\u2074 + c","x\xB3/3 + c"],answer:0,explain:"Si aumenta l\u2019esponente di 1 e si divide per il nuovo esponente."},{id:"m7-1-4",type:"mc",topic:"Integrali immediati",q:"\u222B 1/x dx = ?",options:["ln|x| + c","\u22121/x\xB2 + c","x\u2070/0 + c","e\u02E3 + c"],answer:0,explain:"\xC8 il caso n = \u22121, escluso dalla regola delle potenze."},{id:"m7-1-5",type:"mc",topic:"Integrali immediati",q:"\u222B e\u02E3 dx = ?",options:["e\u02E3 + c","e\u02E3\u207A\xB9/(x + 1) + c","x\xB7e\u02E3 + c","ln x + c"],answer:0,explain:"e\u02E3 \xE8 derivata e primitiva di s\xE9 stessa."},{id:"m7-1-6",type:"mc",topic:"Integrali immediati",q:"\u222B \u221Ax dx = ?",options:["\u2154 x^(3/2) + c","1/(2\u221Ax) + c","\xBD x^(\xBD) + c","x^(3/2) + c"],answer:0,explain:"x^\xBD \u21D2 x^(3/2)/(3/2) = \u2154 x^(3/2)."},{id:"m7-1-7",type:"mc",topic:"Linearit\xE0",q:"\u222B (6x\xB2 + 4x \u2212 3) dx = ?",options:["2x\xB3 + 2x\xB2 \u2212 3x + c","12x + 4 + c","6x\xB3 + 4x\xB2 \u2212 3x + c","2x\xB3 + 4x\xB2 \u2212 3 + c"],answer:0,explain:"6 \xB7 x\xB3/3 + 4 \xB7 x\xB2/2 \u2212 3x = 2x\xB3 + 2x\xB2 \u2212 3x."},{id:"m7-1-8",type:"mc",topic:"Integrali immediati",q:"\u222B 2x/(x\xB2 + 1) dx = ?",options:["ln(x\xB2 + 1) + c","2 ln x + c","x\xB2 + x + c","1/(x\xB2 + 1) + c"],answer:0,explain:"Il numeratore \xE8 la derivata del denominatore: \u222B f\u2032/f = ln|f|."},{id:"m7-1-9",type:"mc",topic:"Primitive",q:"Quale \xE8 una primitiva di x/\u221A(3x\xB2 + 1)?",options:["\u2153 \u221A(3x\xB2 + 1)","\u221A(3x\xB2 + 1)","3\u221A(3x\xB2 + 1)","\u2159 (3x\xB2 + 1)\xB2"],answer:0,explain:"Derivo \u2153\u221A(3x\xB2 + 1): \u2153 \xB7 6x/(2\u221A(3x\xB2 + 1)) = x/\u221A(3x\xB2 + 1). \u2713"},{id:"m7-1-10",type:"num",topic:"Costante di integrazione",q:"G(x) = \u2153\u221A(3x\xB2 + 1) + c con G(1) = 3. Quanto vale c? (decimale)",answer:2.3333,tol:.001,shown:"7/3",explain:"G(1) = \u2153 \xB7 \u221A4 + c = \u2154 + c = 3 \u21D2 c = 7/3 \u2248 2,333."},{id:"m7-1-11",type:"num",topic:"Costante di integrazione",q:"F\u2032(x) = 2x e F(0) = 5. Quanto vale F(3)?",answer:14,tol:0,explain:"F = x\xB2 + c, F(0) = c = 5 \u21D2 F(3) = 9 + 5 = 14."},{id:"m7-1-12",type:"match",topic:"Integrali immediati",q:"Abbina la funzione alla sua primitiva",pairs:[["x\u207F","x\u207F\u207A\xB9/(n + 1)"],["1/x","ln|x|"],["e\u02E3","e\u02E3"],["cos x","sin x"],["sin x","\u2212cos x"]],explain:"\xC8 la tabella delle derivate letta al contrario."}]},{id:"m7l2",title:"Integrazione per parti",icon:"\u2702\uFE0F",theory:[{title:"La formula",points:["Dalla regola del prodotto: **\u222B f(x)\xB7g\u2032(x) dx = f(x)\xB7g(x) \u2212 \u222B f\u2032(x)\xB7g(x) dx**.","Si sceglie come **f** il fattore che si semplifica derivando (x, ln x) e come **g\u2032** quello facile da integrare (e\u02E3, cos x).","Trucco per \u222B ln x dx: si scrive come \u222B 1 \xB7 ln x dx con g\u2032 = 1."],example:"\u222B x e\u02E3 dx: f = x, g\u2032 = e\u02E3 \u21D2 x e\u02E3 \u2212 \u222B e\u02E3 dx = e\u02E3(x \u2212 1) + c. \u222B ln x dx = x ln x \u2212 \u222B x \xB7 (1/x) dx = x ln x \u2212 x + c."}],exercises:[{id:"m7-2-1",type:"mc",topic:"Per parti",q:"Formula di integrazione per parti:",options:["\u222B f\xB7g\u2032 = f\xB7g \u2212 \u222B f\u2032\xB7g","\u222B f\xB7g\u2032 = f\u2032\xB7g \u2212 \u222B f\xB7g","\u222B f\xB7g = \u222B f \xB7 \u222B g","\u222B f\xB7g\u2032 = f\xB7g + \u222B f\u2032\xB7g\u2032"],answer:0,explain:"Deriva dalla regola del prodotto (fg)\u2032 = f\u2032g + fg\u2032."},{id:"m7-2-2",type:"mc",topic:"Per parti",q:"\u222B x e\u02E3 dx = ?",options:["e\u02E3(x \u2212 1) + c","x e\u02E3 + c","\xBDx\xB2 e\u02E3 + c","e\u02E3(x + 1) + c"],answer:0,explain:"f = x, g\u2032 = e\u02E3: x e\u02E3 \u2212 e\u02E3. Controllo: [e\u02E3(x \u2212 1)]\u2032 = e\u02E3(x \u2212 1) + e\u02E3 = x e\u02E3 \u2713."},{id:"m7-2-3",type:"mc",topic:"Per parti",q:"\u222B ln x dx = ?",options:["x ln x \u2212 x + c","1/x + c","x ln x + c","(ln x)\xB2/2 + c"],answer:0,explain:"1 \xB7 ln x con f = ln x, g\u2032 = 1."},{id:"m7-2-4",type:"mc",topic:"Per parti",q:"In \u222B x cos x dx conviene scegliere\u2026",options:["f = x e g\u2032 = cos x","f = cos x e g\u2032 = x","f = x cos x e g\u2032 = 1","Non si integra per parti"],answer:0,explain:"Derivando x diventa 1 e l\u2019integrale si semplifica: x sin x + cos x + c."},{id:"m7-2-5",type:"mc",topic:"Per parti",q:"\u222B x cos x dx = ?",options:["x sin x + cos x + c","x sin x \u2212 cos x + c","\xBDx\xB2 sin x + c","\u2212x sin x + c"],answer:0,explain:"x sin x \u2212 \u222B sin x dx = x sin x + cos x."},{id:"m7-2-6",type:"tf",topic:"Per parti",q:"L\u2019integrazione per parti deriva dalla regola di derivazione del prodotto.",answer:!0,explain:"Integrando (fg)\u2032 = f\u2032g + fg\u2032 si ottiene la formula."},{id:"m7-2-7",type:"order",topic:"Per parti",q:"Ordina i passaggi per calcolare \u222B x e\u02E3 dx",items:["Scelgo f = x e g\u2032 = e\u02E3","Calcolo f\u2032 = 1 e g = e\u02E3","Applico: x e\u02E3 \u2212 \u222B 1 \xB7 e\u02E3 dx","Risultato: e\u02E3(x \u2212 1) + c"],explain:"Alla fine si pu\xF2 verificare derivando."}]},{id:"m7l3",title:"Integrali e costi marginali",icon:"\u{1F3A9}",theory:[{title:"Dal marginale al totale",points:["Il costo totale \xE8 una **primitiva del costo marginale**: C(x) = \u222B C\u2032(x) dx.","La costante di integrazione \xE8 il **costo fisso** (C(0)); la si trova con una condizione data.","Lo stesso vale per il ricavo: R(x) = \u222B R\u2032(x) dx con R(0) = 0."],example:"Cappelli: C\u2032(x) = 3,20 \u2212 0,001x e C(50) = 200. C = 3,2x \u2212 0,0005x\xB2 + k. C(50) = 160 \u2212 1,25 + k = 158,75 + k = 200 \u21D2 k = 41,25. C(x) = 3,2x \u2212 0,0005x\xB2 + 41,25."}],exercises:[{id:"m7-3-1",type:"mc",topic:"Costo totale",q:"Come si ottiene il costo totale dal costo marginale?",options:["Integrando il costo marginale","Derivando il costo marginale","Dividendo il marginale per x","Moltiplicando il marginale per x"],answer:0,explain:"C\u2032 \xE8 la derivata di C, quindi C \xE8 una primitiva di C\u2032."},{id:"m7-3-2",type:"mc",topic:"Costo totale",q:"Che significato ha la costante di integrazione nel costo totale?",options:["Il costo fisso","Il costo marginale","Il prezzo di vendita","Il profitto massimo"],answer:0,explain:"C(0) = k: il costo sostenuto anche producendo zero."},{id:"m7-3-3",type:"num",topic:"Costo totale",scenario:"Cappelli: C\u2032(x) = 3,20 \u2212 0,001x e C(50) = 200 \u20AC.",q:"Quanto vale il costo fisso?",answer:41.25,tol:.001,unit:"\u20AC",explain:"C = 3,2x \u2212 0,0005x\xB2 + k; C(50) = 158,75 + k = 200 \u21D2 k = 41,25.",profNote:"Negli appunti il costo fisso viene calcolato correttamente come 41,25, ma nella funzione finale \xE8 scritto 41,42. Il valore giusto \xE8 C(x) = 3,2x \u2212 0,0005x\xB2 + 41,25."},{id:"m7-3-4",type:"mc",topic:"Costo totale",scenario:"Cappelli: C\u2032(x) = 3,20 \u2212 0,001x.",q:"Qual \xE8 la forma del costo totale?",options:["3,2x \u2212 0,0005x\xB2 + k","3,2 \u2212 0,001x\xB2 + k","\u22120,001 + k","3,2x \u2212 0,001x\xB2 + k"],answer:0,explain:"\u222B 0,001x dx = 0,001 \xB7 x\xB2/2 = 0,0005x\xB2."},{id:"m7-3-5",type:"num",topic:"Costo totale",q:"C\u2032(x) = 6x + 10, costo fisso 200. Quanto vale C(10)?",answer:600,tol:0,unit:"\u20AC",explain:"C = 3x\xB2 + 10x + 200 \u21D2 300 + 100 + 200 = 600."},{id:"m7-3-6",type:"num",topic:"Ricavo totale",q:"R\u2032(x) = 100 \u2212 2x e R(0) = 0. Quanto vale R(20)?",answer:1600,tol:0,explain:"R = 100x \u2212 x\xB2 \u21D2 2000 \u2212 400 = 1600."},{id:"m7-3-7",type:"num",topic:"Costo totale",q:"C\u2032(x) = 4 e C(10) = 90. Quanto vale il costo fisso?",answer:50,tol:0,unit:"\u20AC",explain:"C = 4x + k; 40 + k = 90 \u21D2 k = 50."}]},{id:"m7l4",title:"Integrale definito e aree",icon:"\u{1F4CA}",theory:[{title:"Dalle somme di Riemann al teorema fondamentale",points:["**Somme di Riemann**: divido [a, b] in n rettangoli di base \u0394x e altezza f(x\u1D62) e sommo \u03A3 f(x\u1D62)\u0394x. Per n \u2192 \u221E si ottiene **\u222B\u2090\u1D47 f(x) dx**.","**Teorema fondamentale del calcolo**: se F \xE8 una primitiva di f continua, **\u222B\u2090\u1D47 f(x) dx = F(b) \u2212 F(a)**.","Propriet\xE0: \u222B\u2090\u1D43 f = 0; \u222B\u2090\u1D47 f = \u2212\u222B\u1D66\u1D43 f; \u222B\u2090\u1D47 f = \u222B\u2090\u1D9C f + \u222B\u1D9C\u1D47 f (additivit\xE0)."],example:"\u222B\u2080\xB2 x\xB2 dx = [x\xB3/3]\u2080\xB2 = 8/3."},{title:"Integrale e area",points:["Se f \u2265 0 su [a, b], l\u2019integrale \xE8 l\u2019**area** tra il grafico e l\u2019asse x.","Dove **f < 0** l\u2019integrale \xE8 **negativo**: conta l\u2019area \u201Ccon il segno meno\u201D.","Per l\u2019**area geometrica** si **spezza l\u2019integrale** nei punti in cui f cambia segno e si sommano i valori assoluti."],example:"\u222B\u208B\u2081\u2070 x\xB3 dx = [x\u2074/4]\u208B\u2081\u2070 = 0 \u2212 \xBC = \u2212\xBC, ma l\u2019area \xE8 \xBC. Su [\u22121, 1] l\u2019integrale di x\xB3 vale 0 mentre l\u2019area \xE8 \xBD."}],exercises:[{id:"m7-4-1",type:"mc",topic:"Teorema fondamentale",q:"Teorema fondamentale del calcolo: \u222B\u2090\u1D47 f(x) dx = ?",options:["F(b) \u2212 F(a)","F(a) \u2212 F(b)","f(b) \u2212 f(a)","F(b) \xB7 F(a)"],answer:0,explain:"Primitiva calcolata nell\u2019estremo superiore meno quella nell\u2019inferiore."},{id:"m7-4-2",type:"num",topic:"Integrale definito",q:"\u222B\u2080\xB2 x\xB2 dx = ? (decimale)",answer:2.6667,tol:.001,shown:"8/3",explain:"[x\xB3/3]\u2080\xB2 = 8/3 \u2248 2,667."},{id:"m7-4-3",type:"num",topic:"Integrale definito",q:"\u222B\u2081\xB3 2x dx = ?",answer:8,tol:0,explain:"[x\xB2]\u2081\xB3 = 9 \u2212 1 = 8."},{id:"m7-4-4",type:"num",topic:"Integrale e area",q:"\u222B\u208B\u2081\u2070 x\xB3 dx = ? (decimale)",answer:-.25,tol:.001,shown:"\u22121/4",explain:"[x\u2074/4]\u208B\u2081\u2070 = 0 \u2212 \xBC = \u2212\xBC. \xC8 negativo perch\xE9 x\xB3 < 0 su (\u22121, 0)."},{id:"m7-4-5",type:"num",topic:"Integrale e area",q:"Area della regione tra x\xB3 e l\u2019asse x per x \u2208 [\u22121, 0]? (decimale)",answer:.25,tol:.001,shown:"1/4",explain:"L\u2019area \xE8 sempre positiva: |\u2212\xBC| = \xBC."},{id:"m7-4-6",type:"num",topic:"Integrale e area",q:"\u222B\u208B\u2081\xB9 x\xB3 dx = ?",answer:0,tol:0,explain:"Le due parti (\u2212\xBC e +\xBC) si compensano."},{id:"m7-4-7",type:"num",topic:"Integrale e area",q:"Area totale tra x\xB3 e l\u2019asse x per x \u2208 [\u22121, 1]? (decimale)",answer:.5,tol:.001,shown:"1/2",explain:"Si spezza in 0: \xBC + \xBC = \xBD."},{id:"m7-4-8",type:"hotspot",topic:"Integrale e area",scene:"area",q:"Tocca la regione che contribuisce all\u2019integrale con il segno meno",answer:"neg",explain:"Dove il grafico \xE8 sotto l\u2019asse x, f < 0 e l\u2019integrale \xE8 negativo."},{id:"m7-4-9",type:"mc",topic:"Integrale e area",q:"Per calcolare l\u2019area quando f cambia segno bisogna\u2026",options:["spezzarlo negli zeri e sommare i valori assoluti","calcolare un solo integrale su tutto [a, b]","cambiare il segno di tutto l\u2019integrale finale","derivare f e poi integrare la sua derivata f\u2032"],answer:0,explain:"Altrimenti le parti positive e negative si compensano."},{id:"m7-4-10",type:"num",topic:"Integrale definito",q:"\u222B\u2080\xB9 e\u02E3 dx = ? (decimale, 2 cifre)",answer:1.718,tol:.01,shown:"e \u2212 1 \u2248 1,72",explain:"[e\u02E3]\u2080\xB9 = e \u2212 1 \u2248 1,718."},{id:"m7-4-11",type:"num",topic:"Integrale definito",q:"\u222B\u2081\u1D49 1/x dx = ?",answer:1,tol:0,explain:"[ln x]\u2081\u1D49 = 1 \u2212 0 = 1."},{id:"m7-4-12",type:"mc",topic:"Propriet\xE0",q:"\u222B\u2083\xB9 f(x) dx \xE8 uguale a\u2026",options:["\u2212\u222B\u2081\xB3 f(x) dx","\u222B\u2081\xB3 f(x) dx","0","2 \xB7 \u222B\u2081\xB3 f(x) dx"],answer:0,explain:"Scambiando gli estremi l\u2019integrale cambia segno."},{id:"m7-4-13",type:"mc",topic:"Riemann",q:"Che cosa approssimano le somme di Riemann?",options:["L\u2019area sotto il grafico, con rettangoli sottili","La pendenza della retta tangente in un punto","Il limite di una successione per n \u2192 \u221E","Il valore massimo assunto dalla funzione"],answer:0,explain:"\u03A3 f(x\u1D62)\u0394x tende all\u2019integrale definito per n \u2192 \u221E."},{id:"m7-4-14",type:"num",topic:"Integrale definito",q:"\u222B\u2080\xB3 (2x + 1) dx = ?",answer:12,tol:0,explain:"[x\xB2 + x]\u2080\xB3 = 9 + 3 = 12."}]},{id:"m7l5",title:"Esercizi d\u2019esame: integrali",icon:"\u{1FA9C}",theory:[{title:"Metodo",points:["**Primitiva con condizione**: integro, poi uso il dato (es. C(50) = 200) per trovare la costante.","**Integrale definito**: primitiva F, poi F(b) \u2212 F(a).","**Area**: spezzo negli zeri di f e sommo i valori assoluti.","**Per parti**: f si semplifica derivando, g\u2032 si integra facilmente."]}],exercises:[{id:"m7-5-1",type:"steps",topic:"Costo totale",scenario:"Cappelli: costo marginale C\u2032(x) = 3,20 \u2212 0,001x, con C(50) = 200 \u20AC.",q:"Ricostruisci il costo totale.",steps:[{q:"Primitiva generale?",kind:"mc",answer:0,options:["3,2x \u2212 0,0005x\xB2 + k","3,2x \u2212 0,001x\xB2 + k","\u22120,001 + k","3,2 \u2212 0,0005x\xB2 + k"],explain:"\u222B 0,001x dx = 0,0005x\xB2."},{q:"Costo fisso k = ?",kind:"num",answer:41.25,tol:.001,unit:"\u20AC",explain:"160 \u2212 1,25 + k = 200 \u21D2 k = 41,25."},{q:"C(100) = ?",kind:"num",answer:356.25,tol:.001,unit:"\u20AC",explain:"320 \u2212 5 + 41,25 = 356,25."}],explain:"C(x) = 3,2x \u2212 0,0005x\xB2 + 41,25.",profNote:"Negli appunti la costante \xE8 calcolata come 41,25 ma la funzione finale riporta 41,42: il valore giusto \xE8 41,25."},{id:"m7-5-2",type:"steps",topic:"Primitive",q:"Trova la primitiva G di g(x) = x/\u221A(3x\xB2 + 1) con G(1) = 3.",steps:[{q:"Primitiva generale?",kind:"mc",answer:0,options:["\u2153\u221A(3x\xB2 + 1) + c","\u221A(3x\xB2 + 1) + c","3\u221A(3x\xB2 + 1) + c","\u2159(3x\xB2 + 1)\xB2 + c"],explain:"Derivando \u2153\u221A(3x\xB2 + 1) ottengo \u2153 \xB7 6x/(2\u221A(3x\xB2 + 1)) = x/\u221A(3x\xB2 + 1)."},{q:"c = ?",kind:"num",answer:2.3333333333333335,tol:.005,shown:"7/3",explain:"\u2153 \xB7 \u221A4 + c = 3 \u21D2 c = 3 \u2212 \u2154 = 7/3."},{q:"G(0) = ?",kind:"num",answer:2.6666666666666665,tol:.005,shown:"8/3",explain:"\u2153 \xB7 1 + 7/3 = 8/3."}],explain:"G(x) = \u2153\u221A(3x\xB2 + 1) + 7/3."},{id:"m7-5-3",type:"steps",topic:"Integrale e area",q:"f(x) = x\xB3 su [\u22121, 1].",figure:"area",steps:[{q:"\u222B\u208B\u2081\u2070 x\xB3 dx = ?",kind:"num",answer:-.25,tol:.005,shown:"\u22121/4",explain:"[x\u2074/4]\u208B\u2081\u2070 = 0 \u2212 \xBC."},{q:"\u222B\u2080\xB9 x\xB3 dx = ?",kind:"num",answer:.25,tol:.005,shown:"1/4",explain:"\xBC \u2212 0."},{q:"\u222B\u208B\u2081\xB9 x\xB3 dx = ?",kind:"num",answer:0,explain:"\u2212\xBC + \xBC = 0."},{q:"Area totale?",kind:"num",answer:.5,tol:.005,shown:"1/2",explain:"|\u2212\xBC| + \xBC = \xBD."}],explain:"Integrale con segno \u2260 area geometrica."},{id:"m7-5-4",type:"steps",topic:"Per parti",q:"Calcola \u222B\u2080\xB9 x\xB7e\u02E3 dx.",steps:[{q:"Scelta per l\u2019integrazione per parti?",kind:"mc",answer:0,options:["f = x, g\u2032 = e\u02E3","f = e\u02E3, g\u2032 = x","f = x\xB7e\u02E3, g\u2032 = 1","Non serve: \xE8 immediato"],explain:"Derivando x diventa 1."},{q:"Primitiva?",kind:"mc",answer:0,options:["e\u02E3(x \u2212 1)","x\xB7e\u02E3","e\u02E3(x + 1)","\xBDx\xB2\xB7e\u02E3"],explain:"x\xB7e\u02E3 \u2212 \u222B e\u02E3 dx = e\u02E3(x \u2212 1)."},{q:"Valore dell\u2019integrale?",kind:"num",answer:1,explain:"[e\u02E3(x \u2212 1)]\u2080\xB9 = 0 \u2212 (\u22121) = 1."}],explain:"Per parti, poi teorema fondamentale."}]}],open:[{id:"m7-o1",q:"Che cos\u2019\xE8 una primitiva? Perch\xE9 due primitive differiscono per una costante?",answer:"F \xE8 primitiva di f se F\u2032 = f. Se F \xE8 primitiva lo \xE8 anche F + c, perch\xE9 la derivata di una costante \xE8 zero; viceversa due primitive hanno differenza con derivata nulla, quindi costante. L\u2019integrale indefinito \u222B f dx = F + c \xE8 l\u2019insieme di tutte le primitive. Una condizione come G(1) = 3 fissa c.",keywords:["F\u2032 = f","costante","derivata","zero","integrale indefinito","condizione"]},{id:"m7-o2",q:"Enuncia la formula di integrazione per parti e calcola \u222B x e\u02E3 dx.",answer:"\u222B f\xB7g\u2032 dx = f\xB7g \u2212 \u222B f\u2032\xB7g dx, ricavata dalla regola del prodotto. Per \u222B x e\u02E3 dx scelgo f = x (si semplifica derivando) e g\u2032 = e\u02E3: x e\u02E3 \u2212 \u222B e\u02E3 dx = e\u02E3(x \u2212 1) + c.",keywords:["f\xB7g","\u222B f\u2032\xB7g","prodotto","f = x","e\u02E3(x \u2212 1)"]},{id:"m7-o3",q:"Come si ricava il costo totale dal costo marginale? Risolvi l\u2019esercizio dei cappelli.",answer:"Il costo totale \xE8 una primitiva del costo marginale; la costante \xE8 il costo fisso. C\u2032 = 3,20 \u2212 0,001x \u21D2 C = 3,2x \u2212 0,0005x\xB2 + k. Con C(50) = 200: 160 \u2212 1,25 + k = 200 \u21D2 k = 41,25. Quindi C(x) = 3,2x \u2212 0,0005x\xB2 + 41,25 (negli appunti c\u2019\xE8 il refuso 41,42).",keywords:["primitiva","costo fisso","0,0005","C(50)","41,25"]},{id:"m7-o4",q:"Enuncia il teorema fondamentale del calcolo integrale e spiega il legame tra integrale e area.",answer:"Se f \xE8 continua su [a, b] e F \xE8 una sua primitiva, \u222B\u2090\u1D47 f dx = F(b) \u2212 F(a). L\u2019integrale nasce dalle somme di Riemann \u03A3 f(x\u1D62)\u0394x. Se f \u2265 0 \xE8 l\u2019area sotto il grafico; dove f < 0 l\u2019integrale \xE8 negativo. Per l\u2019area geometrica si spezza l\u2019integrale negli zeri: \u222B\u208B\u2081\u2070 x\xB3 = \u2212\xBC ma l\u2019area \xE8 \xBC.",keywords:["F(b) \u2212 F(a)","primitiva","Riemann","area","negativ","spezz"]}],cards:[{id:"m7-c1",front:"Primitiva",back:"F con F\u2032 = f. Le primitive differiscono per una costante."},{id:"m7-c2",front:"\u222B x\u207F dx",back:"x\u207F\u207A\xB9/(n + 1) + c, n \u2260 \u22121."},{id:"m7-c3",front:"\u222B 1/x dx",back:"ln|x| + c."},{id:"m7-c4",front:"\u222B e\u02E3 dx",back:"e\u02E3 + c."},{id:"m7-c5",front:"\u222B f\u2032/f dx",back:"ln|f| + c."},{id:"m7-c6",front:"Per parti",back:"\u222B f\xB7g\u2032 = f\xB7g \u2212 \u222B f\u2032\xB7g."},{id:"m7-c7",front:"\u222B x e\u02E3 dx",back:"e\u02E3(x \u2212 1) + c."},{id:"m7-c8",front:"\u222B ln x dx",back:"x ln x \u2212 x + c."},{id:"m7-c9",front:"Costo totale da marginale",back:"C = \u222B C\u2032 dx; la costante \xE8 il costo fisso."},{id:"m7-c10",front:"Teorema fondamentale",back:"\u222B\u2090\u1D47 f dx = F(b) \u2212 F(a)."},{id:"m7-c11",front:"Integrale e area",back:"f < 0 \u21D2 integrale negativo; per l\u2019area spezzo negli zeri."},{id:"m7-c12",front:"\u222B\u208B\u2081\u2070 x\xB3 dx",back:"\u2212\xBC (area \xBC)."}]},R0=Tz;var _0=[{id:"mf1",unit:1,name:"Rapporto incrementale",expr:"\u0394f/\u0394x = [f(x\u2082) \
