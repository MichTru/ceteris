nsiemi numerici \u2115, \u2124, \u211A, \u211D e la differenza tra razionali e irrazionali.",answer:"\u2115 sono i naturali {0, 1, 2\u2026}, \u2124 gli interi relativi, \u211A i razionali (rapporti n/m con m \u2260 0), \u211D i reali che contengono razionali e irrazionali; \u2115 \u2282 \u2124 \u2282 \u211A \u2282 \u211D \u2282 \u2102. I razionali hanno decimali finiti o periodici, gli irrazionali decimali illimitati non periodici. Gli irrazionali possono essere algebrici (\u221A2) o trascendenti (\u03C0, e).",keywords:["naturali","interi","razionali","periodic","irrazionali","trascendenti"]},{id:"m1-o2",q:"Che differenza c\u2019\xE8 tra intervallo chiuso, aperto e semiaperto? Fai un esempio di ciascuno.",answer:"[a, b] chiuso: a \u2264 x \u2264 b, estremi inclusi. (a, b) aperto: a < x < b, estremi esclusi. [a, b) semiaperto: a \u2264 x < b. Le semirette verso \xB1\u221E hanno sempre la parentesi tonda dalla parte dell\u2019infinito: [a, +\u221E) = {x \u2265 a}, (a, +\u221E) = {x > a}.",keywords:["chiuso","inclusi","aperto","esclusi","semiaperto","infinito"]},{id:"m1-o3",q:"Definisci una funzione reale, il suo dominio e il suo codominio.",answer:"Una funzione f : A \u2282 \u211D \u2192 \u211D associa a ogni x del dominio A uno e un solo y = f(x). Il dominio \xE8 l\u2019insieme degli input, letto sull\u2019asse x; il codominio f(A) \xE8 l\u2019insieme degli output, letto sull\u2019asse y. Graficamente ogni retta verticale incontra il grafico al massimo una volta.",keywords:["ogni x","un solo","dominio","codominio","asse x","asse y"]},{id:"m1-o4",q:"Quando una funzione \xE8 strettamente crescente? E come lo verifichi?",answer:"Quando per x\u2081 < x\u2082 si ha f(x\u2081) < f(x\u2082). Si verifica col rapporto incrementale \u0394f/\u0394x = [f(x\u2082) \u2212 f(x\u2081)]/(x\u2082 \u2212 x\u2081): se \xE8 sempre > 0 \xE8 strettamente crescente, \u2265 0 crescente, \u2264 0 decrescente, < 0 strettamente decrescente.",keywords:["x\u2081 < x\u2082","f(x\u2081) < f(x\u2082)","rapporto incrementale","positiv"]},{id:"m1-o5",q:"Che cos\u2019\xE8 una funzione iniettiva e che legame ha con la monotonia?",answer:"\xC8 iniettiva se a input diversi corrispondono output diversi: x\u2081 \u2260 x\u2082 \u21D2 f(x\u2081) \u2260 f(x\u2082). Graficamente ogni retta orizzontale taglia il grafico al massimo una volta. Se una funzione \xE8 strettamente monotona allora \xE8 iniettiva e quindi invertibile, ma non vale il viceversa.",keywords:["input diversi","output diversi","orizzontale","strettamente monotona","invertibile","viceversa"]},{id:"m1-o6",q:"Come si costruisce la funzione inversa? Fai l\u2019esempio di f(x) = 2x \u2212 1.",answer:"Serve che f sia iniettiva (restringendo il codominio a f(A)). Si scrive y = f(x) e si ricava x: y = 2x \u2212 1 \u21D2 x = (y + 1)/2. Rinominando: f\u207B\xB9(x) = x/2 + 1/2. Il dominio di f\u207B\xB9 \xE8 il codominio di f e viceversa; i grafici sono simmetrici rispetto alla bisettrice y = x.",keywords:["iniettiva","ricav","(y + 1)/2","dominio","codominio","bisettrice"]},{id:"m1-o7",q:"Descrivi i quattro quadranti del piano cartesiano.",answer:"Gli assi dividono il piano in quattro quadranti: I con x > 0 e y > 0; II con x < 0 e y > 0; III con x < 0 e y < 0; IV con x > 0 e y < 0. L\u2019origine \xE8 (0, 0). I punti sono coppie ordinate, quindi (\u22121, 3) \u2260 (3, \u22121).",keywords:["primo","secondo","terzo","quarto","origine","ordinate"]}],cards:[{id:"m1-c1",front:"Numero razionale",back:"Rapporto n/m di interi (m \u2260 0): decimali finiti o periodici."},{id:"m1-c2",front:"Numero irrazionale",back:"Non razionale: decimali illimitati non periodici (\u221A2, \u03C0)."},{id:"m1-c3",front:"Algebrico / trascendente",back:"Algebrico: soluzione di un polinomio a coefficienti interi (\u221A2). Trascendente: no (\u03C0, e)."},{id:"m1-c4",front:"[a, b] / (a, b)",back:"Chiuso: estremi inclusi. Aperto: estremi esclusi."},{id:"m1-c5",front:"Quadranti",back:"I (+,+) \xB7 II (\u2212,+) \xB7 III (\u2212,\u2212) \xB7 IV (+,\u2212)."},{id:"m1-c6",front:"Funzione",back:"A ogni x del dominio associa un solo y."},{id:"m1-c7",front:"Dominio e codominio",back:"Dominio: input (asse x). Codominio f(A): output (asse y)."},{id:"m1-c8",front:"Strettamente crescente",back:"x\u2081 < x\u2082 \u21D2 f(x\u2081) < f(x\u2082); \u0394f/\u0394x > 0."},{id:"m1-c9",front:"Iniettiva",back:"x\u2081 \u2260 x\u2082 \u21D2 f(x\u2081) \u2260 f(x\u2082). Rette orizzontali: al massimo un\u2019intersezione."},{id:"m1-c10",front:"Strettamente monotona \u21D2 ?",back:"Iniettiva e invertibile (non vale il viceversa)."},{id:"m1-c11",front:"Dominio di f\u207B\xB9",back:"\xC8 il codominio di f (e il codominio di f\u207B\xB9 \xE8 il dominio di f)."},{id:"m1-c12",front:"Grafico di f\u207B\xB9",back:"Simmetrico di quello di f rispetto alla bisettrice y = x."}]},N0=wz;var kz={id:"m2",n:2,title:"Funzioni elementari",subtitle:"Potenze, esponenziali, logaritmi, composte",color:"#0EA5E9",colorDark:"#0369A1",lessons:[{id:"m2l1",title:"Rette, valore assoluto e potenze",icon:"\u{1F4D0}",theory:[{title:"Le funzioni pi\xF9 semplici",points:["**Costante** f(x) = c: retta orizzontale, crescente e decrescente (non strettamente).","**Identit\xE0** f(x) = x: la bisettrice del I e III quadrante, strettamente crescente.","**Valore assoluto** |x| = x se x \u2265 0, \u2212x se x < 0: grafico a \u201CV\u201D, decrescente su (\u2212\u221E, 0], crescente su [0, +\u221E).","**Affine** f(x) = mx + q: m coefficiente angolare (pendenza), q intercetta. m > 0 crescente, m < 0 decrescente. L\u2019inversa ha pendenza **1/m**."]},{title:"Potenze e radici",points:["**x\u207F con n pari** (x\xB2, x\u2074): grafico a parabola, simmetrico rispetto all\u2019asse y, \u2265 0. **Decrescente su (\u2212\u221E, 0], crescente su [0, +\u221E)**. Non iniettiva su \u211D.","**x\u207F con n dispari** (x\xB3): strettamente crescente su tutto \u211D, iniettiva, codominio \u211D.","**Radice n-esima** \u207F\u221Ax: inversa di x\u207F. Con n pari \xE8 definita per x \u2265 0; con n dispari su tutto \u211D.","**x\u207B\u207F = 1/x\u207F**: definita per x \u2260 0; per x \u2192 0 \u201Cesplode\u201D."],tip:"Il trucco per ricordare la monotonia di x\xB2: a sinistra dello zero la parabola scende, a destra sale."}],exercises:[{id:"m2-1-1",type:"mc",topic:"Potenze",q:"Dove \xE8 crescente f(x) = x\xB2?",options:["Su [0, +\u221E)","Su (\u2212\u221E, 0]","Su tutto \u211D","Da nessuna parte"],answer:0,explain:"La parabola scende fino all\u2019origine e poi sale: crescente su [0, +\u221E).",profNote:"Negli appunti per x\u207F con n pari la monotonia \xE8 invertita: la funzione \xE8 DECRESCENTE su (\u2212\u221E, 0] e CRESCENTE su [0, +\u221E), non il contrario."},{id:"m2-1-2",type:"tf",topic:"Potenze",q:"f(x) = x\xB3 \xE8 strettamente crescente su tutto \u211D.",answer:!0,explain:"Con esponente dispari la potenza \xE8 strettamente crescente e quindi iniettiva."},{id:"m2-1-3",type:"tf",topic:"Potenze",q:"f(x) = x\u2074 \xE8 iniettiva su \u211D.",answer:!1,explain:"(\u22121)\u2074 = 1\u2074 = 1: due input diversi, stesso output."},{id:"m2-1-4",type:"mc",topic:"Riconosci il grafico",figure:"g-x2",q:"Quale funzione \xE8 disegnata?",options:["f(x) = x\xB2","f(x) = x\xB3","f(x) = |x|","f(x) = \u221Ax"],answer:0,explain:"Parabola simmetrica rispetto all\u2019asse y, con il vertice nell\u2019origine e sempre \u2265 0."},{id:"m2-1-5",type:"mc",topic:"Riconosci il grafico",figure:"g-x3",q:"Quale funzione \xE8 disegnata?",options:["f(x) = x\xB3","f(x) = x\xB2","f(x) = 1/x","f(x) = e\u02E3"],answer:0,explain:"Passa per l\u2019origine, sempre crescente, negativa per x < 0 e positiva per x > 0."},{id:"m2-1-6",type:"mc",topic:"Riconosci il grafico",figure:"g-abs",q:"Quale funzione \xE8 disegnata?",options:["f(x) = |x|","f(x) = x\xB2","f(x) = x","f(x) = \u2212x"],answer:0,explain:"Il grafico a \u201CV\u201D con due semirette di pendenza \u22121 e +1 \xE8 il valore assoluto."},{id:"m2-1-7",type:"mc",topic:"Riconosci il grafico",figure:"g-sqrt",q:"Quale funzione \xE8 disegnata?",options:["f(x) = \u221Ax","f(x) = log x","f(x) = x\xB2","f(x) = 1/x"],answer:0,explain:"Parte dall\u2019origine (\u221A0 = 0), esiste solo per x \u2265 0 e cresce sempre pi\xF9 lentamente."},{id:"m2-1-8",type:"mc",topic:"Riconosci il grafico",figure:"g-inv",q:"Quale funzione \xE8 disegnata?",options:["f(x) = 1/x","f(x) = x\xB3","f(x) = log x","f(x) = |x|"],answer:0,explain:"Iperbole nel I e III quadrante, non definita in x = 0."},{id:"m2-1-9",type:"num",topic:"Valore assoluto",q:"Quanto vale |\u22127| + |3|?",answer:10,tol:0,explain:"|\u22127| = 7 e |3| = 3: totale 10."},{id:"m2-1-10",type:"mc",topic:"Funzioni affini",q:"Nella retta f(x) = \u22123x + 5, che cosa indica \u22123?",options:["Il coefficiente angolare: la retta scende","L\u2019intercetta sull\u2019asse y","Lo zero della funzione","Il valore minimo della funzione"],answer:0,explain:"m = \u22123 \xE8 la pendenza; 5 \xE8 l\u2019intercetta (f(0) = 5)."},{id:"m2-1-11",type:"num",topic:"Funzioni affini",q:"Dove si annulla f(x) = 2x \u2212 8? (x = ?)",answer:4,tol:0,explain:"2x \u2212 8 = 0 \u21D2 x = 4."},{id:"m2-1-12",type:"mc",topic:"Potenze",q:"Qual \xE8 il dominio di \u221Cx (radice quarta)?",options:["[0, +\u221E)","\u211D","(0, +\u221E)","\u211D \\ {0}"],answer:0,explain:"Con indice pari la radice esiste solo per x \u2265 0."},{id:"m2-1-13",type:"mc",topic:"Potenze",q:"Qual \xE8 il dominio di \u221Bx (radice cubica)?",options:["\u211D","[0, +\u221E)","(0, +\u221E)","\u211D \\ {0}"],answer:0,explain:"Con indice dispari la radice esiste per ogni x: \u221B(\u22128) = \u22122."},{id:"m2-1-14",type:"match",topic:"Potenze",q:"Abbina la funzione alla sua propriet\xE0",pairs:[["x\xB2","Simmetrica rispetto all\u2019asse y"],["x\xB3","Strettamente crescente su \u211D"],["1/x","Non definita in 0"],["\u221Ax","Definita solo per x \u2265 0"]],explain:"Potenze pari: simmetria; dispari: monotonia; negative: buco in 0; radici pari: dominio x \u2265 0."},{id:"m2-1-15",type:"num",topic:"Potenze",q:"Quanto vale 2\u207B\xB3? (decimale)",answer:.125,tol:1e-4,shown:"1/8",explain:"2\u207B\xB3 = 1/2\xB3 = 1/8 = 0,125."}]},{id:"m2l2",title:"Esponenziali",icon:"\u{1F680}",theory:[{title:"La funzione esponenziale a\u02E3",points:["Base **a > 0 e a \u2260 1**, esponente variabile x. Dominio \u211D, codominio **(0, +\u221E)**: \xE8 **sempre positiva**.","**a\u2070 = 1** per ogni base: il grafico passa sempre per **(0, 1)**.","**a > 1**: strettamente crescente (2\u02E3, e\u02E3). **0 < a < 1**: strettamente decrescente ((1/2)\u02E3).","Il numero di Nepero **e \u2248 2,718** \xE8 la base pi\xF9 usata: e\u02E3.","Propriet\xE0: a\u02E3 \xB7 a\u02B8 = a\u02E3\u207A\u02B8; a\u02E3 / a\u02B8 = a\u02E3\u207B\u02B8; (a\u02E3)\u02B8 = a\u02E3\u02B8; a\u207B\u02E3 = 1/a\u02E3."]}],exercises:[{id:"m2-2-1",type:"mc",topic:"Esponenziali",q:"Per quale punto passa sempre il grafico di a\u02E3?",options:["(0, 1)","(1, 0)","(0, 0)","(1, 1)"],answer:0,explain:"a\u2070 = 1 qualunque sia la base."},{id:"m2-2-2",type:"mc",topic:"Esponenziali",q:"Qual \xE8 il codominio di f(x) = e\u02E3?",options:["(0, +\u221E)","\u211D","[0, +\u221E)","[1, +\u221E)"],answer:0,explain:"L\u2019esponenziale \xE8 sempre strettamente positivo e si avvicina a 0 senza toccarlo."},{id:"m2-2-3",type:"tf",topic:"Esponenziali",q:"Esiste un x reale per cui 2\u02E3 = 0.",answer:!1,explain:"a\u02E3 > 0 per ogni x: lo zero non viene mai raggiunto, l\u2019asse x \xE8 un asintoto."},{id:"m2-2-4",type:"mc",topic:"Esponenziali",q:"f(x) = (1/3)\u02E3 \xE8\u2026",options:["strettamente decrescente","strettamente crescente","costante","negativa per x > 0"],answer:0,explain:"Base compresa tra 0 e 1: esponenziale decrescente, comunque sempre positiva."},{id:"m2-2-5",type:"mc",topic:"Riconosci il grafico",figure:"g-exp",q:"Quale funzione \xE8 disegnata?",options:["f(x) = e\u02E3","f(x) = log x","f(x) = x\xB2","f(x) = (1/2)\u02E3"],answer:0,explain:"Passa per (0, 1), sempre sopra l\u2019asse x, crescente: esponenziale con base > 1."},{id:"m2-2-6",type:"mc",topic:"Riconosci il grafico",figure:"g-expd",q:"Quale funzione \xE8 disegnata?",options:["f(x) = (1/2)\u02E3","f(x) = 2\u02E3","f(x) = 1/x","f(x) = log\u2081/\u2082 x"],answer:0,explain:"Passa per (0, 1), sempre positiva, decrescente: base tra 0 e 1."},{id:"m2-2-7",type:"num",topic:"Esponenziali",q:"Quanto vale 2\xB3 \xB7 2\xB2?",answer:32,tol:0,explain:"2\xB3 \xB7 2\xB2 = 2\u2075 = 32: gli esponenti si sommano."},{id:"m2-2-8",type:"mc",topic:"Esponenziali",q:"Quale condizione deve rispettare la base a di a\u02E3?",options:["a > 0 e a \u2260 1","a \u2265 0","a qualsiasi reale","a > 1"],answer:0,explain:"Con a < 0 non si definisce per ogni x (es. (\u22122)^\xBD); con a = 1 \xE8 la costante 1."},{id:"m2-2-9",type:"num",topic:"Esponenziali",q:"Risolvi 2\u02E3 = 16. (x = ?)",answer:4,tol:0,explain:"16 = 2\u2074 \u21D2 x = 4."},{id:"m2-2-10",type:"num",topic:"Esponenziali",q:"Risolvi 3\u02E3\u207A\xB9 = 27. (x = ?)",answer:2,tol:0,explain:"27 = 3\xB3 \u21D2 x + 1 = 3 \u21D2 x = 2."},{id:"m2-2-11",type:"fill",topic:"Esponenziali",text:"a\u02E3 \xB7 a\u02B8 = a elevato a ___; (a\u02E3)\u02B8 = a elevato a ___.",answers:["x + y","x \xB7 y"],extra:["x \u2212 y","x / y"],explain:"Prodotto di potenze di uguale base: si sommano gli esponenti. Potenza di potenza: si moltiplicano."},{id:"m2-2-12",type:"num",topic:"Esponenziali",q:"Quanto vale (1/2)\u207B\xB2?",answer:4,tol:0,explain:"(1/2)\u207B\xB2 = 2\xB2 = 4."}]},{id:"m2l3",title:"Logaritmi",icon:"\u{1FAB5}",theory:[{title:"Il logaritmo log_a x",points:["**log_a x = y \u21D4 a\u02B8 = x**: \xE8 l\u2019esponente da dare ad a per ottenere x. \xC8 l\u2019**inversa** dell\u2019esponenziale.","Base a > 0, a \u2260 1. **Dominio (0, +\u221E)**: l\u2019argomento deve essere positivo. Codominio \u211D.","**log_a 1 = 0** (il grafico passa per (1, 0)) e **log_a a = 1**.","a > 1: crescente; log < 0 per 0 < x < 1, log > 0 per x > 1. **0 < a < 1**: decrescente; log > 0 per 0 < x < 1, = 0 in x = 1, < 0 per x > 1."]},{title:"Propriet\xE0 dei logaritmi",points:["**Prodotto**: log_a(xy) = log_a x + log_a y.","**Quoziente**: log_a(x/y) = log_a x \u2212 log_a y.","**Potenza**: log_a(x\u1D4F) = k \xB7 log_a x.","**Cambio di base**: log_a x = log_b x / log_b a.","**log_a(a\u02E3) = x** e a^(log_a x) = x: logaritmo ed esponenziale si annullano a vicenda."],example:"log\u2082 8 = 3 perch\xE9 2\xB3 = 8. log 100 (base 10) = 2. ln e = 1."}],exercises:[{id:"m2-3-1",type:"num",topic:"Logaritmi",q:"Quanto vale log\u2082 8?",answer:3,tol:0,explain:"2\xB3 = 8, quindi log\u2082 8 = 3."},{id:"m2-3-2",type:"num",topic:"Logaritmi",q:"Quanto vale log\u2083 81?",answer:4,tol:0,explain:"3\u2074 = 81."},{id:"m2-3-3",type:"num",topic:"Logaritmi",q:"Quanto vale log\u2085 1?",answer:0,tol:0,explain:"log_a 1 = 0 per ogni base, perch\xE9 a\u2070 = 1."},{id:"m2-3-4",type:"num",topic:"Logaritmi",q:"Quanto vale log\u2081\u2080 0,01?",answer:-2,tol:0,explain:"10\u207B\xB2 = 0,01."},{id:"m2-3-5",type:"mc",topic:"Logaritmi",q:"Qual \xE8 il dominio di log_a x?",options:["(0, +\u221E)","[0, +\u221E)","\u211D","\u211D \\ {1}"],answer:0,explain:"L\u2019argomento deve essere strettamente positivo: log 0 non esiste."},{id:"m2-3-6",type:"mc",topic:"Propriet\xE0 dei logaritmi",q:"log_a(x \xB7 y) \xE8 uguale a\u2026",options:["log_a x + log_a y","log_a x \xB7 log_a y","log_a x \u2212 log_a y","x \xB7 log_a y"],answer:0,explain:"Il logaritmo trasforma prodotti in somme."},{id:"m2-3-7",type:"mc",topic:"Propriet\xE0 dei logaritmi",q:"log_a(x\xB3) \xE8 uguale a\u2026",options:["3 \xB7 log_a x","(log_a x)\xB3","log_a 3 \xB7 x","log_a x + 3"],answer:0,explain:"L\u2019esponente dell\u2019argomento \u201Cscende\u201D davanti: log_a(x\u1D4F) = k log_a x."},{id:"m2-3-8",type:"mc",topic:"Propriet\xE0 dei logaritmi",q:"Formula del cambio di base: log_a x = \u2026",options:["log_b x / log_b a","log_b a / log_b x","log_b x \xB7 log_b a","log_b (x / a)"],answer:0,explain:"Serve per calcolare log con la calcolatrice, che ha solo ln e log\u2081\u2080."},{id:"m2-3-9",type:"num",topic:"Propriet\xE0 dei logaritmi",q:"Calcola log\u2082 4 + log\u2082 8.",answer:5,tol:0,explain:"2 + 3 = 5, oppure log\u2082 32 = 5."},{id:"m2-3-10",type:"num",topic:"Propriet\xE0 dei logaritmi",q:"Calcola log\u2083 54 \u2212 log\u2083 2.",answer:3,tol:0,explain:"log\u2083(54/2) = log\u2083 27 = 3."},{id:"m2-3-11",type:"mc",topic:"Segno del logaritmo",q:"Con base 0 < a < 1, che segno ha log_a x per x > 1?",options:["Negativo","Positivo","Nullo","Dipende dal valore di x"],answer:0,explain:"Con base minore di 1 il logaritmo \xE8 decrescente: vale 0 in x = 1, poi diventa negativo.",profNote:"Negli appunti la tabella dei segni per 0 < a < 1 \xE8 rimasta vuota. Va compilata cos\xEC: log_a x > 0 per 0 < x < 1, = 0 per x = 1, < 0 per x > 1."},{id:"m2-3-12",type:"mc",topic:"Segno del logaritmo",q:"Con base a > 1, per quali x si ha log_a x < 0?",options:["0 < x < 1","x > 1","x < 0","Mai"],answer:0,explain:"Il logaritmo crescente \xE8 negativo prima di x = 1 e positivo dopo."},{id:"m2-3-13",type:"mc",topic:"Riconosci il grafico",figure:"g-log",q:"Quale funzione \xE8 disegnata?",options:["f(x) = log x (base > 1)","f(x) = e\u02E3","f(x) = \u221Ax","f(x) = log x (base < 1)"],answer:0,explain:"Passa per (1, 0), esiste solo per x > 0, crescente, asintoto verticale x = 0."},{id:"m2-3-14",type:"mc",topic:"Riconosci il grafico",figure:"g-logd",q:"Quale funzione \xE8 disegnata?",options:["f(x) = log\u2081/\u2082 x","f(x) = (1/2)\u02E3","f(x) = ln x","f(x) = 1/x"],answer:0,explain:"Passa per (1, 0), solo x > 0, decrescente: logaritmo con base minore di 1."},{id:"m2-3-15",type:"tf",topic:"Logaritmi",q:"log_a(a\u02E3) = x per ogni x reale.",answer:!0,explain:"Logaritmo ed esponenziale con la stessa base sono funzioni inverse."},{id:"m2-3-16",type:"num",topic:"Logaritmi",q:"Quanto vale ln e\u2075?",answer:5,tol:0,explain:"ln(e\u02E3) = x."},{id:"m2-3-17",type:"match",topic:"Propriet\xE0 dei logaritmi",q:"Abbina ogni espressione alla sua semplificazione",pairs:[["log_a 1","0"],["log_a a","1"],["log_a(x/y)","log_a x \u2212 log_a y"],["a^(log_a x)","x"]],explain:"Sono le propriet\xE0 base da sapere a memoria."}]},{id:"m2l4",title:"Funzioni composte",icon:"\u{1F9E9}",theory:[{title:"Comporre due funzioni",points:["Date f : A \u2192 \u211D e g : B \u2192 \u211D, la **composta** \xE8 **(g \u2218 f)(x) = g(f(x))**: prima si applica f, poi g.","Serve che **f(A) \u2286 B**: i valori prodotti da f devono stare nel dominio di g.","L\u2019ordine conta: in generale g \u2218 f \u2260 f \u2218 g."],example:"f(x) = x\xB2 + 1, g(y) = \u221Ay \u21D2 g(f(x)) = \u221A(x\xB2 + 1), definita su tutto \u211D perch\xE9 x\xB2 + 1 \u2265 1. f(x) = x\xB2 \u2212 1, g(y) = log\u2082 y \u21D2 log\u2082(x\xB2 \u2212 1) definita per x < \u22121 o x > 1."}],exercises:[{id:"m2-4-1",type:"mc",topic:"Composte",q:"f(x) = x\xB2 + 1, g(y) = \u221Ay. Quanto vale g(f(x))?",options:["\u221A(x\xB2 + 1)","(\u221Ax)\xB2 + 1","x + 1","\u221Ax\xB2 + 1"],answer:0,explain:"Prima f, poi g: la radice si applica a tutto x\xB2 + 1."},{id:"m2-4-2",type:"mc",topic:"Composte",q:"Qual \xE8 il dominio di log\u2082(x\xB2 \u2212 1)?",options:["x < \u22121 oppure x > 1","\u22121 < x < 1","x > 1","\u211D"],answer:0,explain:"Serve x\xB2 \u2212 1 > 0 \u21D2 x\xB2 > 1 \u21D2 x < \u22121 o x > 1."},{id:"m2-4-3",type:"mc",topic:"Composte",q:"Qual \xE8 il dominio di \u221A(x\xB2 + 1)?",options:["\u211D","x \u2265 \u22121","x \u2265 0","x \u2265 1"],answer:0,explain:"x\xB2 + 1 \u2265 1 > 0 per ogni x: la radice esiste sempre."},{id:"m2-4-4",type:"num",topic:"Composte",q:"f(x) = 2x + 1, g(y) = y\xB2. Quanto vale g(f(3))?",answer:49,tol:0,explain:"f(3) = 7 e g(7) = 49."},{id:"m2-4-5",type:"num",topic:"Composte",q:"f(x) = 2x + 1, g(y) = y\xB2. Quanto vale f(g(3))?",answer:19,tol:0,explain:"g(3) = 9 e f(9) = 19. Diverso da g(f(3)) = 49: l\u2019ordine conta."},{id:"m2-4-6",type:"tf",topic:"Composte",q:"La composizione \xE8 commutativa: g \u2218 f = f \u2218 g sempre.",answer:!1,explain:"Con f = 2x + 1 e g = y\xB2: g(f(3)) = 49 ma f(g(3)) = 19."},{id:"m2-4-7",type:"mc",topic:"Composte",q:"Quale condizione serve per definire g \u2218 f?",options:["f(A) \u2286 B: i valori di f stanno nel dominio di g","Il dominio di f contiene quello di g","f e g devono essere iniettive","f e g devono avere lo stesso codominio"],answer:0,explain:"g deve poter \u201Cmangiare\u201D tutti gli output di f."},{id:"m2-4-8",type:"mc",topic:"Composte",q:"Qual \xE8 il dominio di ln(x \u2212 3)?",options:["(3, +\u221E)","[3, +\u221E)","(0, +\u221E)","(\u22123, +\u221E)"],answer:0,explain:"x \u2212 3 > 0 \u21D2 x > 3."},{id:"m2-4-9",type:"mc",topic:"Composte",q:"Qual \xE8 il dominio di \u221A(4 \u2212 x)?",options:["(\u2212\u221E, 4]","[4, +\u221E)","(\u2212\u221E, 4)","[\u22124, 4]"],answer:0,explain:"4 \u2212 x \u2265 0 \u21D2 x \u2264 4."},{id:"m2-4-10",type:"mc",topic:"Composte",q:"Qual \xE8 il dominio di 1/(x\xB2 \u2212 4)?",options:["\u211D \\ {\u22122, 2}","\u211D \\ {2}","x > 2","\u211D \\ {4}"],answer:0,explain:"Il denominatore si annulla per x = \xB12."},{id:"m2-4-11",type:"order",topic:"Composte",q:"Calcola g(f(2)) con f(x) = x\xB2 e g(y) = 3y \u2212 1: ordina i passaggi",items:["Calcolo f(2) = 4","Sostituisco 4 al posto di y in g","g(4) = 3 \xB7 4 \u2212 1","Risultato: 11"],explain:"Si lavora sempre dall\u2019interno verso l\u2019esterno."}]},{id:"m2l5",title:"Costi, ricavi e profitto",icon:"\u{1F4B6}",theory:[{title:"Le funzioni economiche",points:["**Costo totale** C(x) = Cm \xB7 x + Cf: Cm costo unitario (variabile), Cf costo fisso.","**Ricavo** R(x) = r \xB7 x (r prezzo unitario), oppure una funzione non lineare come R = 2x\xB2.","**Profitto** P(x) = R(x) \u2212 C(x) = (r \u2212 Cm)x \u2212 Cf.","**Punto di pareggio** (break even) x*: dove P(x*) = 0, cio\xE8 R(x*) = C(x*). Per x > x* si guadagna (se r > Cm)."],example:"R = 2x\xB2, C = 7x + 4 \u21D2 P = 2x\xB2 \u2212 7x \u2212 4. P = 0 \u21D2 x = (7 \xB1 9)/4 \u21D2 x = 4 (l\u2019altra soluzione \u22121/2 non ha senso economico)."},{title:"Profitto quadratico",points:["Se P(x) = ax\xB2 + bx + c il grafico \xE8 una parabola. Il **vertice** ha ascissa **x_v = \u2212b/(2a)**.","Con **a < 0** la parabola \xE8 rivolta verso il basso: il vertice \xE8 il **massimo profitto**.","Le disequazioni P(x) > 0 si risolvono con le radici: per a > 0 si prendono i valori esterni, per a < 0 quelli interni."],example:"R = \u22124x\xB2 + 12x, C = \u22124x + 6 \u21D2 P = \u22124x\xB2 + 16x \u2212 6. x_v = \u221216/(\u22128) = 2, P(2) = \u221216 + 32 \u2212 6 = 10."}],exercises:[{id:"m2-5-1",type:"mc",topic:"Profitto",q:"R(x) = 2x\xB2, C(x) = 7x + 4. Qual \xE8 il profitto?",options:["P(x) = 2x\xB2 \u2212 7x \u2212 4","P(x) = 2x\xB2 + 7x + 4","P(x) = 7x + 4 \u2212 2x\xB2","P(x) = 2x\xB2 \u2212 7x + 4"],answer:0,explain:"P = R \u2212 C = 2x\xB2 \u2212 (7x + 4) = 2x\xB2 \u2212 7x \u2212 4."},{id:"m2-5-2",type:"num",topic:"Punto di pareggio",q:"P(x) = 2x\xB2 \u2212 7x \u2212 4. Qual \xE8 il punto di pareggio (x > 0)?",answer:4,tol:0,explain:"\u0394 = 49 + 32 = 81 \u21D2 x = (7 \xB1 9)/4 \u21D2 x = 4 oppure \u22121/2. Solo x = 4 ha senso."},{id:"m2-5-3",type:"num",topic:"Vertice",q:"P(x) = 2x\xB2 \u2212 7x \u2212 4. Ascissa del vertice? (decimale)",answer:1.75,tol:.001,shown:"7/4",explain:"x_v = \u2212b/(2a) = 7/4 = 1,75. Ordinata P(7/4) = \u221281/8: \xE8 un minimo (a > 0)."},{id:"m2-5-4",type:"num",topic:"Massimo profitto",q:"R = \u22124x\xB2 + 12x, C = \u22124x + 6. Per quale x il profitto \xE8 massimo?",answer:2,tol:0,explain:"P = \u22124x\xB2 + 16x \u2212 6, x_v = \u221216/(2 \xB7 \u22124) = 2."},{id:"m2-5-5",type:"num",topic:"Massimo profitto",q:"Stesso esercizio: quanto vale il profitto massimo P(2)?",answer:10,tol:0,explain:"P(2) = \u221216 + 32 \u2212 6 = 10."},{id:"m2-5-6",type:"mc",topic:"Profitto",q:"R = x\xB2 + 4x, C = 5x + 2. Per quali x il profitto \xE8 positivo?",options:["x > 2","x > 1","\u22121 < x < 2","x < 2"],answer:0,explain:"P = x\xB2 \u2212 x \u2212 2 = (x \u2212 2)(x + 1) > 0 per x < \u22121 o x > 2; con x \u2265 0 resta x > 2."},{id:"m2-5-7",type:"mc",scenario:"Tariffa telefonica: il costo mensile \xE8 T(x) = x\xB2 \u2212 80x + 1400, con x minuti di chiamata.",topic:"Disequazioni",q:"Per quali x la spesa \xE8 minore di 700 \u20AC?",options:["10 < x < 70","x < 10 oppure x > 70","0 < x < 40","40 < x < 70"],answer:0,explain:"x\xB2 \u2212 80x + 700 < 0. Radici: x = 40 \xB1 30 \u21D2 10 e 70. Parabola verso l\u2019alto: negativa tra le radici."},{id:"m2-5-8",type:"num",topic:"Vertice",scenario:"Tariffa telefonica: T(x) = x\xB2 \u2212 80x + 1400.",q:"Qual \xE8 l\u2019ordinata del vertice T(40)?",answer:-200,tol:0,explain:"T(40) = 1600 \u2212 3200 + 1400 = \u2212200. Vertice (40, \u2212200).",profNote:"Negli appunti il vertice \xE8 scritto (40, \u221280): il calcolo corretto d\xE0 T(40) = 1600 \u2212 3200 + 1400 = \u2212200."},{id:"m2-5-9",type:"num",topic:"Punto di pareggio",scenario:"Due linee di produzione. Linea 1: C\u2081 = 300x + 550.000. Linea 2: C\u2082 = 250x + 650.000.",q:"Per quale quantit\xE0 x* i costi si equivalgono?",answer:2e3,tol:0,explain:"300x + 550.000 = 250x + 650.000 \u21D2 50x = 100.000 \u21D2 x* = 2000."},{id:"m2-5-10",type:"mc",scenario:"Linea 1: C\u2081 = 300x + 550.000. Linea 2: C\u2082 = 250x + 650.000.",topic:"Confronto di costi",q:"Se l\u2019impresa produce pi\xF9 di 2000 pezzi, quale linea conviene?",options:["La linea 2: costa meno per ogni pezzo in pi\xF9","La linea 1: ha i costi fissi pi\xF9 bassi","Sono equivalenti per ogni quantit\xE0","La linea 1: ha il costo unitario pi\xF9 alto"],answer:0,explain:"Oltre x* pesa di pi\xF9 il costo unitario: 250 < 300, quindi la linea 2 \xE8 pi\xF9 economica. Es. x = 3000: C\u2081 = 1.450.000, C\u2082 = 1.400.000.",profNote:"Negli appunti la conclusione \xE8 che per x > 2000 conviene la linea 1: \xE8 il contrario. Con x > 2000 conviene la linea 2 (costo unitario 250 contro 300)."},{id:"m2-5-11",type:"fill",topic:"Profitto",text:"Il profitto \xE8 ricavo ___ costo. Il punto di pareggio \xE8 dove il profitto vale ___.",answers:["meno","zero"],extra:["pi\xF9","uno"],explain:"P = R \u2212 C e P(x*) = 0."},{id:"m2-5-12",type:"num",topic:"Punto di pareggio",q:"C(x) = 4x + 600, R(x) = 10x. Qual \xE8 il punto di pareggio?",answer:100,tol:0,explain:"10x = 4x + 600 \u21D2 6x = 600 \u21D2 x = 100."},{id:"m2-5-13",type:"mc",topic:"Profitto",q:"P(x) = ax\xB2 + bx + c ha un massimo quando\u2026",options:["a < 0: la parabola \xE8 rivolta verso il basso","a > 0: la parabola \xE8 rivolta verso l\u2019alto","b = 0","c > 0"],answer:0,explain:"Con a < 0 il vertice \xE8 il punto pi\xF9 alto."},{id:"m2-5-14",type:"num",topic:"Profitto",q:"C(x) = 3x + 50, prezzo unitario r = 8. Quanto vale il profitto per x = 20?",answer:50,tol:0,explain:"P = (8 \u2212 3) \xB7 20 \u2212 50 = 100 \u2212 50 = 50."}]},{id:"m2l6",title:"Esercizi d\u2019esame: funzioni economiche",icon:"\u{1FA9C}",theory:[{title:"Lo schema che si ripete all\u2019esame",points:["1 \xB7 Scrivo **P(x) = R(x) \u2212 C(x)** e semplifico.","2 \xB7 **Pareggio**: risolvo P(x) = 0 (formula delle radici) e tengo solo x \u2265 0.","3 \xB7 **Vertice** x_v = \u2212b/(2a): massimo se a < 0, minimo se a > 0.","4 \xB7 **Disequazioni**: con a > 0 la parabola \xE8 negativa tra le radici, positiva fuori."]}],exercises:[{id:"m2-6-1",type:"steps",topic:"Profitto",scenario:"Ricavo R(x) = 2x\xB2, costo C(x) = 7x + 4.",q:"Studia il profitto.",steps:[{q:"Profitto P(x) = ?",kind:"mc",answer:0,options:["2x\xB2 \u2212 7x \u2212 4","2x\xB2 + 7x + 4","2x\xB2 \u2212 7x + 4","7x + 4 \u2212 2x\xB2"],explain:"P = R \u2212 C = 2x\xB2 \u2212 7x \u2212 4."},{q:"Discriminante \u0394 = b\xB2 \u2212 4ac = ?",kind:"num",answer:81,explain:"49 \u2212 4 \xB7 2 \xB7 (\u22124) = 49 + 32 = 81."},{q:"Punto di pareggio (x > 0)?",kind:"num",answer:4,explain:"x = (7 \xB1 9)/4 \u21D2 4 oppure \u22121/2. Solo 4 ha senso economico."},{q:"Ascissa del vertice?",kind:"num",answer:1.75,tol:.005,shown:"7/4",explain:"x_v = 7/(2 \xB7 2) = 7/4."},{q:"Ordinata del vertice P(7/4)?",kind:"num",answer:-10.125,tol:.005,shown:"\u221281/8",explain:"2 \xB7 49/16 \u2212 49/4 \u2212 4 = 49/8 \u2212 98/8 \u2212 32/8 = \u221281/8."}],explain:"Parabola verso l\u2019alto: profitto negativo fino a 4, positivo dopo; il vertice \xE8 un minimo."},{id:"m2-6-2",type:"steps",topic:"Disequazioni",scenario:"Tariffa telefonica: spesa mensile T(x) = x\xB2 \u2212 80x + 1400, con x minuti.",q:"Per quali x la spesa \xE8 minore di 700 \u20AC?",steps:[{q:"Quale disequazione devo risolvere?",kind:"mc",answer:0,options:["x\xB2 \u2212 80x + 700 < 0","x\xB2 \u2212 80x + 2100 < 0","x\xB2 \u2212 80x + 700 > 0","x\xB2 \u2212 80x < 700"],explain:"Porto 700 a sinistra: 1400 \u2212 700 = 700."},{q:"\u0394 = ?",kind:"num",answer:3600,explain:"6400 \u2212 2800 = 3600, \u221A\u0394 = 60."},{q:"Radice pi\xF9 piccola?",kind:"num",answer:10,explain:"(80 \u2212 60)/2 = 10."},{q:"Radice pi\xF9 grande?",kind:"num",answer:70,explain:"(80 + 60)/2 = 70."},{q:"Soluzione?",kind:"mc",answer:0,options:["10 < x < 70","x < 10 oppure x > 70","x > 70","0 < x < 10"],explain:"Parabola verso l\u2019alto: negativa tra le radici."},{q:"Ordinata del vertice T(40)?",kind:"num",answer:-200,explain:"1600 \u2212 3200 + 1400 = \u2212200."}],explain:"Spesa sotto 700 \u20AC tra 10 e 70 minuti.",profNote:"Negli appunti il vertice \xE8 (40, \u221280): il valore corretto \xE8 T(40) = \u2212200."},{id:"m2-6-3",type:"steps",topic:"Confronto di costi",scenario:"Linea 1: C\u2081 = 300x + 550.000. Linea 2: C\u2082 = 250x + 650.000.",q:"Quale linea conviene?",steps:[{q:"Quantit\xE0 x* in cui i costi sono uguali?",kind:"num",answer:2e3,explain:"50x = 100.000 \u21D2 x* = 2000."},{q:"C\u2081(3000) = ?",kind:"num",answer:145e4,unit:"\u20AC",explain:"900.000 + 550.000 = 1.450.000."},{q:"C\u2082(3000) = ?",kind:"num",answer:14e5,unit:"\u20AC",explain:"750.000 + 650.000 = 1.400.000."},{q:"Per x > 2000 conviene\u2026",kind:"mc",answer:0,options:["la linea 2","la linea 1","indifferente","nessuna delle due"],explain:"Costo unitario pi\xF9 basso (250 < 300): la linea 2 vince oltre x*."}],explain:"Sotto 2000 pezzi conviene la linea 1 (costi fissi pi\xF9 bassi), sopra la linea 2.",profNote:"Negli appunti la conclusione \xE8 invertita: per x > 2000 conviene la linea 2."},{id:"m2-6-4",type:"steps",topic:"Massimo profitto",scenario:"R(x) = \u22124x\xB2 + 12x, C(x) = \u22124x + 6.",q:"Trova il profitto massimo.",steps:[{q:"P(x) = ?",kind:"mc",answer:0,options:["\u22124x\xB2 + 16x \u2212 6","\u22124x\xB2 + 8x + 6","\u22124x\xB2 + 16x + 6","4x\xB2 \u2212 16x + 6"],explain:"\u22124x\xB2 + 12x \u2212 (\u22124x + 6) = \u22124x\xB2 + 16x \u2212 6."},{q:"Ascissa del vertice?",kind:"num",answer:2,explain:"\u221216/(2 \xB7 (\u22124)) = 2."},{q:"Profitto massimo P(2)?",kind:"num",answer:10,explain:"\u221216 + 32 \u2212 6 = 10."},{q:"Il profitto \xE8 positivo tra due radici. La pi\xF9 piccola (2 decimali)?",kind:"num",answer:.419,tol:.01,shown:"2 \u2212 \u221A10/2 \u2248 0,42",explain:"4x\xB2 \u2212 16x + 6 = 0 \u21D2 x = (16 \xB1 \u221A160)/8 = 2 \xB1 \u221A10/2 \u2248 0,42 e 3,58."}],explain:"Parabola verso il basso: massimo nel vertice (2, 10)."},{id:"m2-6-5",type:"steps",topic:"Composte",q:"Trova il dominio di f(x) = log\u2082(x\xB2 \u2212 1).",steps:[{q:"Quale condizione serve?",kind:"mc",answer:0,options:["x\xB2 \u2212 1 > 0","x\xB2 \u2212 1 \u2265 0","x\xB2 \u2212 1 \u2260 0","x > 0"],explain:"L\u2019argomento del logaritmo deve essere strettamente positivo."},{q:"Radice positiva di x\xB2 \u2212 1 = 0?",kind:"num",answer:1,explain:"x\xB2 = 1 \u21D2 x = \xB11."},{q:"Dominio?",kind:"mc",answer:0,options:["x < \u22121 oppure x > 1","\u22121 < x < 1","x \u2265 1","\u211D \\ {\u22121, 1}"],explain:"x\xB2 \u2212 1 > 0 fuori dalle radici, estremi esclusi."}],explain:"Per le composte: prima le condizioni della funzione esterna sull\u2019argomento interno."}]}],open:[{id:"m2-o1",q:"Descrivi le potenze x\u207F con n pari e n dispari: dominio, codominio, monotonia.",answer:"Con n pari (x\xB2, x\u2074) il dominio \xE8 \u211D, il codominio [0, +\u221E), il grafico \xE8 simmetrico rispetto all\u2019asse y; \xE8 decrescente su (\u2212\u221E, 0] e crescente su [0, +\u221E), quindi non iniettiva. Con n dispari (x\xB3) dominio e codominio sono \u211D ed \xE8 strettamente crescente, quindi iniettiva e invertibile con la radice n-esima.",keywords:["pari","simmetric","decrescente","crescente","dispari","iniettiva"]},{id:"m2-o2",q:"Descrivi la funzione esponenziale a\u02E3 e le sue propriet\xE0.",answer:"\xC8 definita per a > 0 e a \u2260 1, dominio \u211D e codominio (0, +\u221E): \xE8 sempre positiva. Passa per (0, 1) perch\xE9 a\u2070 = 1. Se a > 1 \xE8 strettamente crescente, se 0 < a < 1 strettamente decrescente. Propriet\xE0: a\u02E3a\u02B8 = a\u02E3\u207A\u02B8, (a\u02E3)\u02B8 = a\u02E3\u02B8, a\u207B\u02E3 = 1/a\u02E3. La base pi\xF9 usata \xE8 e \u2248 2,718.",keywords:["a > 0","positiva","(0, 1)","crescente","decrescente","e"]},{id:"m2-o3",q:"Che cos\u2019\xE8 il logaritmo? Elenca dominio e propriet\xE0 principali.",answer:"log_a x \xE8 l\u2019esponente da dare ad a per ottenere x: log_a x = y \u21D4 a\u02B8 = x; \xE8 l\u2019inversa dell\u2019esponenziale. Base a > 0, a \u2260 1, dominio (0, +\u221E). log_a 1 = 0, log_a a = 1. Propriet\xE0: log(xy) = log x + log y, log(x/y) = log x \u2212 log y, log(x\u1D4F) = k log x, cambio di base log_a x = log_b x / log_b a.",keywords:["esponente","inversa","dominio","positiv","prodotto","cambio di base"]},{id:"m2-o4",q:"Studia il segno di log_a x nei casi a > 1 e 0 < a < 1.",answer:"Con a > 1 il logaritmo \xE8 crescente: negativo per 0 < x < 1, nullo in x = 1, positivo per x > 1. Con 0 < a < 1 \xE8 decrescente: positivo per 0 < x < 1, nullo in x = 1, negativo per x > 1. In entrambi i casi non esiste per x \u2264 0.",keywords:["crescente","decrescente","x = 1","negativo","positivo","x \u2264 0"]},{id:"m2-o5",q:"Che cos\u2019\xE8 una funzione composta e quando si pu\xF2 definire? Fai un esempio con il dominio.",answer:"\xC8 (g \u2218 f)(x) = g(f(x)): prima f poi g. Si pu\xF2 definire se f(A) \u2286 B, cio\xE8 se gli output di f stanno nel dominio di g. Esempio: log\u2082(x\xB2 \u2212 1) richiede x\xB2 \u2212 1 > 0, quindi x < \u22121 o x > 1. Invece \u221A(x\xB2 + 1) \xE8 definita su tutto \u211D. L\u2019ordine conta: g \u2218 f \u2260 f \u2218 g.",keywords:["g(f(x))","f(A) \u2286 B","dominio","esempio","ordine"]},{id:"m2-o6",q:"Definisci costo, ricavo, profitto e punto di pareggio, con un esempio.",answer:"C(x) = Cm\xB7x + Cf (costo unitario per quantit\xE0 pi\xF9 costo fisso), R(x) = r\xB7x, P(x) = R \u2212 C = (r \u2212 Cm)x \u2212 Cf. Il punto di pareggio x* \xE8 dove P(x*) = 0, cio\xE8 ricavi = costi. Esempio: C = 4x + 600, R = 10x \u21D2 x* = 100; oltre si guadagna.",keywords:["costo fisso","ricavo","profitto","R \u2212 C","pareggio","P(x*) = 0"]},{id:"m2-o7",q:"Risolvi l\u2019esercizio delle due linee di produzione: C\u2081 = 300x + 550.000 e C\u2082 = 250x + 650.000.",answer:"Uguaglio i costi: 300x + 550.000 = 250x + 650.000 \u21D2 50x = 100.000 \u21D2 x* = 2000. Per x < 2000 conviene la linea 1 (costi fissi pi\xF9 bassi), per x > 2000 la linea 2 (costo unitario pi\xF9 basso). Negli appunti la conclusione \xE8 invertita.",keywords:["2000","linea 1","linea 2","costi fissi","costo unitario"]}],cards:[{id:"m2-c1",front:"x\u207F, n pari: monotonia",back:"Decrescente su (\u2212\u221E, 0], crescente su [0, +\u221E)."},{id:"m2-c2",front:"x\u207F, n dispari",back:"Strettamente crescente su \u211D, iniettiva."},{id:"m2-c3",front:"a\u02E3: condizioni e codominio",back:"a > 0, a \u2260 1. Codominio (0, +\u221E), passa per (0, 1)."},{id:"m2-c4",front:"a\u02E3 crescente o decrescente?",back:"a > 1 crescente; 0 < a < 1 decrescente."},{id:"m2-c5",front:"log_a x = y",back:"\u21D4 a\u02B8 = x. Dominio x > 0."},{id:"m2-c6",front:"log_a 1 e log_a a",back:"0 e 1."},{id:"m2-c7",front:"log(xy), log(x/y), log(x\u1D4F)",back:"log x + log y; log x \u2212 log y; k log x."},{id:"m2-c8",front:"Cambio di base",back:"log_a x = log_b x / log_b a."},{id:"m2-c9",front:"Segno log, base < 1",back:"> 0 per 0 < x < 1, = 0 in 1, < 0 per x > 1."},{id:"m2-c10",front:"Composta g \u2218 f",back:"g(f(x)); serve f(A) \u2286 dominio di g."},{id:"m2-c11",front:"Profitto",back:"P = R \u2212 C = (r \u2212 Cm)x \u2212 Cf."},{id:"m2-c12",front:"Punto di pareggio",back:"x* con P(x*) = 0, cio\xE8 R = C."},{id:"m2-c13",front:"Vertice della parabola",back:"x_v = \u2212b/(2a). a < 0 \u21D2 massimo."}]},A0=kz;var Mz={id:"m3",n:3,title:"Successioni",subtitle:"Progressioni, interesse, convergenza",color:"#14B8A6",colorDark:"#0F766E",lessons:[{id:"m3l1",title:"Che cos\u2019\xE8 una successione",icon:"\u{1F522}",theory:[{title:"Definizione",points:["Una **successione** \xE8 una funzione **s : \u2115\u208A \u2192 \u211D**: a ogni naturale n associa un numero s_n. Si scrive (s_n) oppure {s\u2081, s\u2082, s\u2083\u2026}.","Si pu\xF2 dare con il **termine generale** (s_n = 1/n) oppure **per ricorrenza** (s\u2081 = 1, s_{n+1} = s_n + 2): ogni termine si ricava dal precedente.","**Monotonia**: crescente se s_{n+1} \u2265 s_n, strettamente crescente se s_{n+1} > s_n; analogamente decrescente.","Una propriet\xE0 vale **definitivamente** se vale da un certo indice in poi: (n \u2212 3)/(n + 1) > 0 definitivamente, cio\xE8 per n > 3."],example:"s_n = 1/n: 1, 1/2, 1/3, 1/4\u2026 strettamente decrescente. s_n = (\u22121)\u207F: \u22121, 1, \u22121, 1\u2026 non monotona."}],exercises:[{id:"m3-1-1",type:"mc",topic:"Definizione",q:"Una successione \xE8 una funzione che va\u2026",options:["dai naturali \u2115\u208A ai reali \u211D","dai reali \u211D ai naturali \u2115","dai reali ai reali","dai razionali agli interi"],answer:0,explain:"L\u2019input \xE8 l\u2019indice n (naturale), l\u2019output s_n \xE8 un numero reale."},{id:"m3-1-2",type:"num",topic:"Termine generale",q:"s_n = 3n \u2212 1. Quanto vale s\u2085?",answer:14,tol:0,explain:"3 \xB7 5 \u2212 1 = 14."},{id:"m3-1-3",type:"num",topic:"Termine generale",q:"s_n = n\xB2 \u2212 n. Quanto vale s\u2084?",answer:12,tol:0,explain:"16 \u2212 4 = 12."},{id:"m3-1-4",type:"num",topic:"Ricorrenza",q:"s\u2081 = 2, s_{n+1} = 3 \xB7 s_n. Quanto vale s\u2084?",answer:54,tol:0,explain:"2 \u2192 6 \u2192 18 \u2192 54."},{id:"m3-1-5",type:"num",topic:"Ricorrenza",q:"s\u2081 = 5, s_{n+1} = s_n \u2212 2. Quanto vale s\u2085?",answer:-3,tol:0,explain:"5 \u2192 3 \u2192 1 \u2192 \u22121 \u2192 \u22123."},{id:"m3-1-6",type:"mc",topic:"Monotonia",q:"s_n = 1/n \xE8\u2026",options:["strettamente decrescente","strettamente crescente","costante","non monotona"],answer:0,explain:"1 > 1/2 > 1/3 > \u2026: ogni termine \xE8 pi\xF9 piccolo del precedente."},{id:"m3-1-7",type:"mc",topic:"Monotonia",q:"s_n = (\u22121)\u207F \xE8\u2026",options:["non monotona: oscilla tra \u22121 e 1","strettamente crescente","strettamente decrescente","costante uguale a 1"],answer:0,explain:"\u22121, 1, \u22121, 1\u2026: sale e scende."},{id:"m3-1-8",type:"mc",topic:"Definitivamente",q:"Per quali n si ha (n \u2212 3)/(n + 1) > 0?",options:["Per n > 3: vale definitivamente","Per ogni n \u2265 1, senza eccezioni","Solo per n = 3, dove si annulla","Per n < 3, poi diventa negativa"],answer:0,explain:"Il denominatore \xE8 sempre positivo; il numeratore \xE8 positivo per n > 3."},{id:"m3-1-9",type:"fill",topic:"Definizione",text:"Una successione si pu\xF2 definire con il termine ___ oppure per ___.",answers:["generale","ricorrenza"],extra:["limite","derivata"],explain:"Termine generale: formula diretta. Ricorrenza: dal termine precedente."},{id:"m3-1-10",type:"tf",topic:"Definitivamente",q:"\u201CDefinitivamente\u201D significa che la propriet\xE0 vale da un certo indice n\u2080 in poi.",answer:!0,explain:"Non per forza per tutti gli n, ma per tutti gli n \u2265 n\u2080."},{id:"m3-1-11",type:"num",topic:"Termine generale",q:"s_n = (n \u2212 3)/(n + 1). Quanto vale s\u2087? (decimale)",answer:.5,tol:.001,shown:"1/2",explain:"(7 \u2212 3)/(7 + 1) = 4/8 = 0,5."}]},{id:"m3l2",title:"Progressioni e interesse",icon:"\u{1F3E6}",theory:[{title:"Progressione aritmetica",points:["Ogni termine si ottiene **sommando** una ragione d: s_{n+1} = s_n + d.","Termine generale: **s_n = a + (n \u2212 1)d**, con a primo termine.","d > 0 crescente, d < 0 decrescente, d = 0 costante.","**Interesse semplice**: capitale C, tasso r. Dopo n anni **S_n = C(1 + n\xB7r)**: cresce in modo aritmetico (ogni anno + C\xB7r)."],example:"C = 1000 \u20AC, r = 5%: S\u2081 = 1050, S\u2082 = 1100, S\u2083 = 1150\u2026"},{title:"Progressione geometrica",points:["Ogni termine si ottiene **moltiplicando** per una ragione q: s_{n+1} = s_n \xB7 q.","Termine generale: **s_n = a \xB7 q\u207F\u207B\xB9**.","**Interesse composto**: gli interessi producono interessi. S_n = C(1 + r)\u207F."],example:"2, 6, 18, 54\u2026 \xE8 geometrica con a = 2 e q = 3: s\u2085 = 2 \xB7 3\u2074 = 162."}],exercises:[{id:"m3-2-1",type:"mc",topic:"Progressione aritmetica",q:"Qual \xE8 il termine generale di una progressione aritmetica?",options:["s_n = a + (n \u2212 1)d","s_n = a + (n + 1)d","s_n = a \xB7 d\u207F\u207B\xB9","s_n = a \xB7 n \xB7 d"],answer:0,explain:"Il primo termine (n = 1) deve essere a: a + 0\xB7d = a.",profNote:"Negli appunti il termine generale \xE8 scritto a + (n + 1)d: \xE8 un refuso. Con n = 1 darebbe a + 2d invece di a. La formula corretta \xE8 a + (n \u2212 1)d."},{id:"m3-2-2",type:"num",topic:"Progressione aritmetica",q:"Progressione aritmetica con a = 3 e d = 4. Quanto vale s\u2081\u2080?",answer:39,tol:0,explain:"3 + 9 \xB7 4 = 39."},{id:"m3-2-3",type:"num",topic:"Progressione aritmetica",q:"5, 8, 11, 14\u2026 Qual \xE8 la ragione d?",answer:3,tol:0,explain:"Differenza costante tra termini consecutivi: 3."},{id:"m3-2-4",type:"num",topic:"Progressione geometrica",q:"Progressione geometrica con a = 2 e q = 3. Quanto vale s\u2085?",answer:162,tol:0,explain:"2 \xB7 3\u2074 = 2 \xB7 81 = 162."},{id:"m3-2-5",type:"num",topic:"Progressione geometrica",q:"4, 2, 1, 1/2\u2026 Qual \xE8 la ragione q? (decimale)",answer:.5,tol:.001,shown:"1/2",explain:"Ogni termine \xE8 la met\xE0 del precedente."},{id:"m3-2-6",type:"mc",topic:"Progressioni",q:"7, 14, 28, 56\u2026 che progressione \xE8?",options:["Geometrica di ragione 2","Aritmetica di ragione 7","Aritmetica di ragione 2","Geometrica di ragione 7"],answer:0,explain:"Il rapporto tra termini consecutivi \xE8 costante (2), la differenza no (7, 14, 28)."},{id:"m3-2-7",type:"num",topic:"Interesse semplice",q:"C = 1000 \u20AC, tasso semplice 5% annuo. Montante dopo 4 anni?",answer:1200,tol:0,unit:"\u20AC",explain:"S\u2084 = 1000 \xB7 (1 + 4 \xB7 0,05) = 1000 \xB7 1,2 = 1200 \u20AC."},{id:"m3-2-8",type:"num",topic:"Interesse composto",q:"C = 1000 \u20AC, tasso composto 10% annuo. Montante dopo 2 anni?",answer:1210,tol:0,unit:"\u20AC",explain:"1000 \xB7 1,1\xB2 = 1210 \u20AC. Con l\u2019interesse semplice sarebbero 1200 \u20AC."},{id:"m3-2-9",type:"mc",topic:"Interesse semplice",q:"Il montante con interesse semplice cresce come una progressione\u2026",options:["aritmetica: ogni anno si aggiunge C\xB7r","geometrica: ogni anno si moltiplica per (1 + r)","costante","che decresce nel tempo"],answer:0,explain:"S_n = C + n\xB7C\xB7r: ogni anno si somma lo stesso interesse."},{id:"m3-2-10",type:"match",topic:"Progressioni",q:"Abbina la formula al suo significato",pairs:[["a + (n \u2212 1)d","Progressione aritmetica"],["a \xB7 q\u207F\u207B\xB9","Progressione geometrica"],["C(1 + n\xB7r)","Interesse semplice"],["C(1 + r)\u207F","Interesse composto"]],explain:"Aritmetica \u2194 semplice (somme), geometrica \u2194 composto (prodotti)."},{id:"m3-2-11",type:"tf",topic:"Progressione aritmetica",q:"Una progressione aritmetica con d < 0 \xE8 strettamente decrescente.",answer:!0,explain:"Ogni passo si sottrae |d|: s_{n+1} < s_n."}]},{id:"m3l3",title:"Limite di una successione",icon:"\u{1F3AF}",theory:[{title:"Successioni convergenti",points:["(s_n) **converge** a S se per ogni \u03B5 > 0 esiste n\u2080 tale che **|s_n \u2212 S| < \u03B5 per ogni n > n\u2080**. Si scrive lim s_n = S.","In parole: da un certo punto in poi tutti i termini stanno nella \u201Cstriscia\u201D (S \u2212 \u03B5, S + \u03B5), per quanto stretta.","**Per eccesso** (dall\u2019alto, S\u207A): 1/n \u2192 0\u207A. **Per difetto** (dal basso, S\u207B): 1 \u2212 1/n \u2192 1\u207B.","**Unicit\xE0 del limite**: se il limite esiste \xE8 unico."],example:"s_n = 1/n e \u03B5 = 1/10: serve 1/n < 1/10 \u21D2 n > 10. Il primo indice che funziona \xE8 n\u2080 = 11."},{title:"Divergenti e irregolari",points:["**Divergente a +\u221E**: per ogni M > 0 da un certo punto s_n > M (es. s_n = n\xB2, 2\u207F).","**Divergente a \u2212\u221E**: s_n < \u2212M definitivamente (es. \u2212n).","**Irregolare** (oscillante): non ha limite, come (\u22121)\u207F.","Una successione **monotona** ha sempre limite (finito o infinito): non pu\xF2 essere irregolare."]}],exercises:[{id:"m3-3-1",type:"mc",topic:"Convergenza",q:"lim (n \u2192 \u221E) 1/n vale\u2026",options:["0\u207A","1","+\u221E","Non esiste"],answer:0,explain:"I termini sono positivi e si avvicinano a 0 dall\u2019alto."},{id:"m3-3-2",type:"mc",topic:"Convergenza",q:"lim (n \u2192 \u221E) (1 \u2212 1/n) vale\u2026",options:["1\u207B","1\u207A","0","+\u221E"],answer:0,explain:"I termini sono sempre minori di 1 e si avvicinano a 1: limite per difetto."},{id:"m3-3-3",type:"mc",topic:"Successioni irregolari",q:"La successione (\u22121)\u207F \xE8\u2026",options:["irregolare: non ha limite","convergente a 0 per eccesso","divergente a +\u221E","convergente a 1 per difetto"],answer:0,explain:"Oscilla tra \u22121 e 1 senza stabilizzarsi."},{id:"m3-3-4",type:"mc",topic:"Successioni divergenti",q:"s_n = n\xB2 \xE8\u2026",options:["divergente a +\u221E","convergente a 0","irregolare","convergente a 1"],answer:0,explain:"Supera qualsiasi soglia M da un certo n in poi."},{id:"m3-3-5",type:"num",topic:"Definizione con \u03B5",q:"s_n = 1/n, \u03B5 = 1/10. Qual \xE8 il primo indice n\u2080 da cui |s_n \u2212 0| < \u03B5?",answer:11,tol:0,explain:"1/n < 1/10 \u21D4 n > 10 (strettamente). Con n = 10 si ha 1/10, che non \xE8 < 1/10. Quindi n\u2080 = 11.",profNote:"Negli appunti si conclude n\u2080 = 10, ma la disuguaglianza \xE8 stretta: 1/10 non \xE8 minore di 1/10. Il primo indice valido \xE8 11."},{id:"m3-3-6",type:"tf",topic:"Unicit\xE0",q:"Una successione pu\xF2 convergere a due limiti diversi.",answer:!1,explain:"Teorema di unicit\xE0 del limite: se esiste \xE8 unico."},{id:"m3-3-7",type:"tf",topic:"Monotonia e limite",q:"Una successione monotona non pu\xF2 essere irregolare.",answer:!0,explain:"Una monotona converge oppure diverge: ha sempre un limite."},{id:"m3-3-8",type:"mc",topic:"Convergenza",q:"Che cosa significa |s_n \u2212 S| < \u03B5?",options:["La distanza tra s_n e S \xE8 minore di \u03B5","s_n supera S di almeno \u03B5","s_n \xE8 negativo da un certo n in poi","Il limite S \xE8 pi\xF9 piccolo di \u03B5"],answer:0,explain:"Il valore assoluto misura la distanza: i termini entrano nella striscia (S \u2212 \u03B5, S + \u03B5)."},{id:"m3-3-9",type:"num",topic:"Convergenza",q:"lim (n \u2192 \u221E) (2n + 1)/n = ?",answer:2,tol:0,explain:"(2n + 1)/n = 2 + 1/n \u2192 2."},{id:"m3-3-10",type:"num",topic:"Convergenza",q:"lim (n \u2192 \u221E) (3n\xB2 + 1)/(n\xB2 + 5) = ?",answer:3,tol:0,explain:"Stesso grado: rapporto dei coefficienti direttivi, 3/1."},{id:"m3-3-11",type:"mc",topic:"Progressione geometrica",q:"Per quali ragioni q la successione q\u207F converge a 0?",options:["\u22121 < q < 1","q > 1","q = 1","q < \u22121"],answer:0,explain:"|q| < 1: i termini si rimpiccioliscono. q > 1 diverge, q = 1 \xE8 costante, q \u2264 \u22121 oscilla."},{id:"m3-3-12",type:"match",topic:"Classificazione",q:"Abbina ogni successione al suo comportamento",pairs:[["1/n","Converge a 0"],["n\xB2","Diverge a +\u221E"],["(\u22121)\u207F","Irregolare"],["\u2212n","Diverge a \u2212\u221E"]],explain:"Convergenti, divergenti e irregolari sono le tre possibilit\xE0."}]},{id:"m3l4",title:"Esercizi guidati: successioni",icon:"\u{1FA9C}",theory:[{title:"Metodo",points:["**Termine n-esimo**: sostituisco n nella formula, o applico la ricorrenza passo per passo.","**Interesse**: semplice C(1 + nr), composto C(1 + r)\u207F.","**Limite**: confronto i gradi di n come per i polinomi.","**Con \u03B5**: risolvo |s_n \u2212 S| < \u03B5 e prendo il primo n che la soddisfa."]}],exercises:[{id:"m3-4-1",type:"steps",topic:"Interesse",scenario:"Capitale 1000 \u20AC, tasso 5% annuo, 3 anni.",q:"Confronta interesse semplice e composto.",steps:[{q:"Montante con interesse semplice?",kind:"num",answer:1150,unit:"\u20AC",explain:"1000 \xB7 (1 + 3 \xB7 0,05) = 1150."},{q:"Montante con interesse composto (2 decimali)?",kind:"num",answer:1157.625,tol:.01,shown:"1157,63",unit:"\u20AC",explain:"1000 \xB7 1,05\xB3 = 1157,625."},{q:"Differenza tra composto e semplice (2 decimali)?",kind:"num",answer:7.625,tol:.01,shown:"7,63",unit:"\u20AC",explain:"Nel composto anche gli interessi producono interessi."},{q:"Che progressione segue il montante semplice?",kind:"mc",answer:0,options:["Aritmetica, ragione 50 \u20AC","Geometrica, ragione 1,05","Aritmetica, ragione 5 \u20AC","Geometrica, ragione 50"],explain:"Ogni anno si aggiunge C \xB7 r = 50 \u20AC."}],explain:"Semplice \u2194 aritmetica, composto \u2194 geometrica."},{id:"m3-4-2",type:"steps",topic:"Successioni",q:"Studia s_n = (n \u2212 3)/(n + 1).",steps:[{q:"s\u2081 = ?",kind:"num",answer:-.5,tol:.005,shown:"\u22121/2",explain:"(1 \u2212 3)/(1 + 1) = \u22122/2."},{q:"s\u2083 = ?",kind:"num",answer:0,explain:"(3 \u2212 3)/4 = 0."},{q:"Quando s_n > 0?",kind:"mc",answer:0,options:["Definitivamente, per n > 3","Per ogni n","Mai","Solo per n < 3"],explain:"Il denominatore \xE8 sempre positivo; il numeratore per n > 3."},{q:"lim s_n = ?",kind:"num",answer:1,explain:"Stesso grado: rapporto dei coefficienti 1/1."}],explain:"Una successione pu\xF2 essere negativa all\u2019inizio e positiva definitivamente."},{id:"m3-4-3",type:"steps",topic:"Definizione con \u03B5",q:"s_n = 1/n converge a 0. Verificalo con \u03B5 = 1/100.",steps:[{q:"Quale disequazione risolvo?",kind:"mc",answer:0,options:["1/n < 1/100","1/n > 1/100","n < 1/100","1/n = 1/100"],explain:"|s_n \u2212 0| = 1/n < \u03B5."},{q:"Primo indice n\u2080 valido?",kind:"num",answer:101,explain:"1/n < 1/100 \u21D4 n > 100: il primo \xE8 101 (con 100 si ha l\u2019uguaglianza)."},{q:"Il limite \xE8 raggiunto\u2026",kind:"mc",answer:0,options:["per eccesso (0\u207A)","per difetto (0\u207B)","in modo oscillante","mai"],explain:"I termini sono tutti positivi: si avvicinano a 0 dall\u2019alto."}],explain:"Stesso ragionamento dell\u2019esempio degli appunti con \u03B5 = 1/10, dove n\u2080 = 11.",profNote:"Negli appunti con \u03B5 = 1/10 si conclude n\u2080 = 10, ma serve n > 10: il primo indice \xE8 11."},{id:"m3-4-4",type:"steps",topic:"Progressione aritmetica",q:"Progressione aritmetica con primo termine 4 e ragione 3.",steps:[{q:"s\u2081\u2080 = ?",kind:"num",answer:31,explain:"4 + 9 \xB7 3 = 31."},{q:"Quale termine vale 52? n = ?",kind:"num",answer:17,explain:"4 + 3(n \u2212 1) = 52 \u21D2 n \u2212 1 = 16 \u21D2 n = 17."},{q:"La successione \xE8\u2026",kind:"mc",answer:0,options:["strettamente crescente e divergente","convergente a 3","irregolare","decrescente"],explain:"d = 3 > 0: cresce senza limite."}],explain:"Termine generale a + (n \u2212 1)d."}]}],open:[{id:"m3-o1",q:"Che cos\u2019\xE8 una successione? Come si pu\xF2 definire?",answer:"\xC8 una funzione s : \u2115\u208A \u2192 \u211D che associa a ogni naturale n un reale s_n. Si pu\xF2 dare con il termine generale (es. s_n = 1/n) oppure per ricorrenza, dando il primo termine e la regola che lega s_{n+1} a s_n (es. s\u2081 = 2, s_{n+1} = 3s_n).",keywords:["funzione","naturali","reali","termine generale","ricorrenza"]},{id:"m3-o2",q:"Spiega progressione aritmetica e geometrica e il legame con l\u2019interesse semplice e composto.",answer:"Aritmetica: si somma una ragione d, s_n = a + (n \u2212 1)d. Geometrica: si moltiplica per q, s_n = a\xB7q\u207F\u207B\xB9. L\u2019interesse semplice S_n = C(1 + nr) cresce in modo aritmetico (ogni anno + C\xB7r); l\u2019interesse composto S_n = C(1 + r)\u207F cresce in modo geometrico, perch\xE9 anche gli interessi producono interessi.",keywords:["aritmetica","a + (n \u2212 1)d","geometrica","semplice","composto","C(1 + nr)"]},{id:"m3-o3",q:"Dai la definizione di successione convergente e fai un esempio con \u03B5.",answer:"lim s_n = S se per ogni \u03B5 > 0 esiste n\u2080 tale che |s_n \u2212 S| < \u03B5 per ogni n > n\u2080. Esempio: 1/n \u2192 0. Con \u03B5 = 1/10 serve 1/n < 1/10 \u21D2 n > 10, quindi da n\u2080 = 11 in poi tutti i termini stanno nella striscia.",keywords:["\u03B5","n\u2080","|s_n \u2212 S| < \u03B5","1/n","definitivamente"]},{id:"m3-o4",q:"Classifica le successioni in base al loro comportamento all\u2019infinito.",answer:"Convergenti: hanno limite finito S (1/n \u2192 0, per eccesso o per difetto). Divergenti: tendono a +\u221E (n\xB2) o \u2212\u221E (\u2212n), cio\xE8 superano ogni soglia M. Irregolari: non hanno limite, come (\u22121)\u207F. Le monotone hanno sempre limite. Il limite, se esiste, \xE8 unico.",keywords:["convergenti","divergenti","irregolari","(\u22121)\u207F","unico"]},{id:"m3-o5",q:"Che cosa significa che una propriet\xE0 vale \u201Cdefinitivamente\u201D?",answer:"Significa che vale per tutti gli n da un certo indice n\u2080 in poi, anche se non per i primi termini. Esempio: (n \u2212 3)/(n + 1) > 0 vale definitivamente, cio\xE8 per n > 3. \xC8 il linguaggio usato nella definizione di limite.",keywords:["da un certo","n\u2080","in poi","esempio"]}],cards:[{id:"m3-c1",front:"Successione",back:"Funzione s : \u2115\u208A \u2192 \u211D, n \u21A6 s_n."},{id:"m3-c2",front:"Progressione aritmetica",back:"s_n = a + (n \u2212 1)d."},{id:"m3-c3",front:"Progressione geometrica",back:"s_n = a \xB7 q\u207F\u207B\xB9."},{id:"m3-c4",front:"Interesse semplice",back:"S_n = C(1 + n\xB7r)."},{id:"m3-c5",front:"Interesse composto",back:"S_n = C(1 + r)\u207F."},{id:"m3-c6",front:"Definitivamente",back:"Per ogni n \u2265 n\u2080, da un certo indice in poi."},{id:"m3-c7",front:"lim s_n = S",back:"\u2200\u03B5 > 0 \u2203n\u2080: |s_n \u2212 S| < \u03B5 per ogni n > n\u2080."},{id:"m3-c8",front:"Per eccesso / per difetto",back:"1/n \u2192 0\u207A (dall\u2019alto); 1 \u2212 1/n \u2192 1\u207B (dal basso)."},{id:"m3-c9",front:"Irregolare",back:"Senza limite, es. (\u22121)\u207F."},{id:"m3-c10",front:"q\u207F \u2192 0 quando?",back:"Per \u22121 < q < 1."}]},E0=Mz;var Nz={id:"m4",n:4,title:"Limiti e continuit\xE0",subtitle:"Forme indeterminate, asintoti, teoremi",color:"#F59E0B",colorDark:"#B45309",lessons:[{id:"m4l1",title:"Limiti di funzioni",icon:"\u{1F3AF}",theory:[{title:"Il concetto di limite",points:["**lim (x \u2192 x\u2080) f(x) = L**: quando x si avvicina a x\u2080 (senza per forza arrivarci), f(x) si avvicina a L.","**Limite destro** x \u2192 x\u2080\u207A (da valori pi\xF9 grandi) e **sinistro** x \u2192 x\u2080\u207B (da valori pi\xF9 piccoli).","Il limite **globale esiste solo se destro e sinistro coincidono**.","Il valore f(x\u2080) non conta per il limite: la funzione pu\xF2 anche non essere definita in x\u2080."],example:"lim (x \u2192 0\u207A) 1/x = +\u221E, lim (x \u2192 0\u207B) 1/x = \u2212\u221E: i due limiti sono diversi, il limite globale in 0 non esiste."},{title:"Limiti delle funzioni elementari",points:["x \u2192 +\u221E: **x\u207F \u2192 +\u221E**, **\u221Ax \u2192 +\u221E**, **1/x \u2192 0\u207A**, **e\u02E3 \u2192 +\u221E**, **ln x \u2192 +\u221E**.","x \u2192 \u2212\u221E: **e\u02E3 \u2192 0\u207A**; x\xB2 \u2192 +\u221E; x\xB3 \u2192 \u2212\u221E.","x \u2192 0\u207A: **ln x \u2192 \u2212\u221E** (asintoto verticale), 1/x \u2192 +\u221E.","Base 0 < a < 1: a\u02E3 \u2192 0\u207A per x \u2192 +\u221E e \u2192 +\u221E per x \u2192 \u2212\u221E.","Gerarchia degli infiniti per x \u2192 +\u221E: ln x \u226A x\u207F \u226A e\u02E3."]}],exercises:[{id:"m4-1-1",type:"mc",topic:"Limiti elementari",q:"lim (x \u2192 +\u221E) e\u02E3 = ?",options:["+\u221E","0","1","e"],answer:0,explain:"L\u2019esponenziale con base e > 1 cresce senza limite."},{id:"m4-1-2",type:"mc",topic:"Limiti elementari",q:"lim (x \u2192 \u2212\u221E) e\u02E3 = ?",options:["0\u207A","\u2212\u221E","+\u221E","1"],answer:0,explain:"L\u2019esponenziale resta positivo e si schiaccia sull\u2019asse x: asintoto orizzontale y = 0."},{id:"m4-1-3",type:"mc",topic:"Limiti elementari",q:"lim (x \u2192 0\u207A) ln x = ?",options:["\u2212\u221E","0","+\u221E","1"],answer:0,explain:"Avvicinandosi a 0 da destra il logaritmo precipita: asintoto verticale x = 0."},{id:"m4-1-4",type:"mc",topic:"Limiti elementari",q:"lim (x \u2192 +\u221E) 1/x = ?",options:["0\u207A","+\u221E","1","\u2212\u221E"],answer:0,explain:"Dividere 1 per numeri sempre pi\xF9 grandi d\xE0 valori positivi sempre pi\xF9 piccoli."},{id:"m4-1-5",type:"mc",topic:"Limite destro e sinistro",q:"Quando esiste il limite di f(x) per x \u2192 x\u2080?",options:["Quando destro e sinistro esistono e coincidono","Quando f \xE8 definita nel punto x\u2080","Quando esiste almeno il limite destro","Sempre, per qualsiasi funzione reale"],answer:0,explain:"Il limite globale richiede che da destra e da sinistra si arrivi allo stesso valore."},{id:"m4-1-6",type:"tf",topic:"Limite destro e sinistro",q:"Il limite di 1/x per x \u2192 0 esiste ed \xE8 +\u221E.",answer:!1,explain:"Da destra +\u221E, da sinistra \u2212\u221E: i limiti unilaterali sono diversi, quello globale non esiste."},{id:"m4-1-7",type:"tf",topic:"Concetto di limite",q:"Per calcolare lim (x \u2192 x\u2080) f(x) serve che f sia definita in x\u2080.",answer:!1,explain:"Conta il comportamento vicino a x\u2080, non in x\u2080: (x\xB2 \u2212 1)/(x \u2212 1) non \xE8 definita in 1 ma ha limite 2."},{id:"m4-1-8",type:"num",topic:"Calcolo di limiti",q:"lim (x \u2192 2) (x\xB2 + 3x) = ?",answer:10,tol:0,explain:"Funzione continua: si sostituisce, 4 + 6 = 10."},{id:"m4-1-9",type:"mc",topic:"Gerarchia degli infiniti",q:"Per x \u2192 +\u221E, chi cresce pi\xF9 velocemente?",options:["e\u02E3","x\xB9\u2070\u2070","ln x","\u221Ax"],answer:0,explain:"L\u2019esponenziale batte qualsiasi potenza, che a sua volta batte il logaritmo."},{id:"m4-1-10",type:"mc",topic:"Limiti elementari",q:"lim (x \u2192 +\u221E) (1/2)\u02E3 = ?",options:["0\u207A","+\u221E","1/2","\u2212\u221E"],answer:0,explain:"Base tra 0 e 1: l\u2019esponenziale \xE8 decrescente e tende a 0."},{id:"m4-1-11",type:"match",topic:"Limiti elementari",q:"Abbina il limite al suo valore",pairs:[["lim x\u2192+\u221E ln x","+\u221E"],["lim x\u21920\u207A ln x","\u2212\u221E"],["lim x\u2192\u2212\u221E e\u02E3","0"],["lim x\u2192+\u221E x\xB3","+\u221E (potenza)"]],explain:"Sono i limiti da sapere a memoria per gli asintoti."}]},{id:"m4l2",title:"Algebra dei limiti e forme indeterminate",icon:"\u2753",theory:[{title:"Regole di calcolo",points:["Somma, prodotto e quoziente di limiti finiti si calcolano normalmente (se il denominatore non tende a 0).","Con gli infiniti: **+\u221E + L = +\u221E**, **L \xB7 \u221E = \u221E** (L \u2260 0, con la regola dei segni), **L/\u221E = 0**, **L/0\u207A = \xB1\u221E** (L \u2260 0).","Le **7 forme indeterminate**: **0/0, \u221E/\u221E, 0 \xB7 \u221E, +\u221E \u2212 \u221E, 0\u2070, 1^\u221E, \u221E\u2070**. Il risultato non si sa a priori: bisogna trasformare l\u2019espressione."]},{title:"Come si sciolgono",points:["**\u221E/\u221E con polinomi**: si raccoglie la potenza pi\xF9 alta. Grado num. > den. \u21D2 \xB1\u221E; uguale \u21D2 rapporto dei coefficienti direttivi; minore \u21D2 0.","**0/0 con polinomi**: si scompone e si semplifica il fattore (x \u2212 x\u2080).","**+\u221E \u2212 \u221E con polinomi**: vince il termine di grado massimo.","Nelle prossime unit\xE0: **De l\u2019H\xF4pital** per 0/0 e \u221E/\u221E."],example:"lim (x \u2192 1) (x\xB2 \u2212 1)/(x \u2212 1) = lim (x + 1)(x \u2212 1)/(x \u2212 1) = lim (x + 1) = 2."}],exercises:[{id:"m4-2-1",type:"mc",topic:"Forme indeterminate",q:"Quale di queste NON \xE8 una forma indeterminata?",options:["+\u221E + \u221E","0/0","+\u221E \u2212 \u221E","1^\u221E"],answer:0,explain:"+\u221E + \u221E = +\u221E senza dubbi. Le altre tre sono indeterminate."},{id:"m4-2-2",type:"mc",topic:"Forme indeterminate",q:"Quale di queste NON \xE8 una forma indeterminata?",options:["5/0\u207A","\u221E/\u221E","0 \xB7 \u221E","\u221E\u2070"],answer:0,explain:"Un numero diverso da 0 diviso 0\u207A d\xE0 +\u221E."},{id:"m4-2-3",type:"num",topic:"Forme indeterminate",q:"Quante sono le forme indeterminate?",answer:7,tol:0,explain:"0/0, \u221E/\u221E, 0\xB7\u221E, +\u221E \u2212 \u221E, 0\u2070, 1^\u221E, \u221E\u2070."},{id:"m4-2-4",type:"num",topic:"0/0",q:"lim (x \u2192 1) (x\xB2 \u2212 1)/(x \u2212 1) = ?",answer:2,tol:0,explain:"Scompongo: (x + 1)(x \u2212 1)/(x \u2212 1) = x + 1 \u2192 2."},{id:"m4-2-5",type:"num",topic:"0/0",q:"lim (x \u2192 3) (x\xB2 \u2212 9)/(x \u2212 3) = ?",answer:6,tol:0,explain:"(x \u2212 3)(x + 3)/(x \u2212 3) = x + 3 \u2192 6."},{id:"m4-2-6",type:"num",topic:"\u221E/\u221E",q:"lim (x \u2192 +\u221E) (4x\xB2 \u2212 x)/(2x\xB2 + 7) = ?",answer:2,tol:0,explain:"Stesso grado: 4/2 = 2."},{id:"m4-2-7",type:"mc",topic:"\u221E/\u221E",q:"lim (x \u2192 +\u221E) (x\xB3 + 1)/(x\xB2 + 5) = ?",options:["+\u221E","0","1","1/5"],answer:0,explain:"Grado del numeratore maggiore: diverge."},{id:"m4-2-8",type:"num",topic:"\u221E/\u221E",q:"lim (x \u2192 +\u221E) (3x + 2)/(x\xB2 + 1) = ?",answer:0,tol:0,explain:"Grado del denominatore maggiore: tende a 0."},{id:"m4-2-9",type:"mc",topic:"+\u221E \u2212 \u221E",q:"lim (x \u2192 +\u221E) (x\xB3 \u2212 5x\xB2) = ?",options:["+\u221E","\u2212\u221E","0","Non esiste"],answer:0,explain:"Raccolgo x\xB3(1 \u2212 5/x) \u2192 +\u221E \xB7 1: vince il grado pi\xF9 alto."},{id:"m4-2-10",type:"mc",topic:"Algebra dei limiti",q:"Se f \u2192 3 e g \u2192 +\u221E, allora f/g \u2192 ?",options:["0","+\u221E","3","Forma indeterminata"],answer:0,explain:"Un numero finito diviso un infinito tende a 0."},{id:"m4-2-11",type:"mc",topic:"Algebra dei limiti",q:"lim (x \u2192 2\u207A) 1/(x \u2212 2) = ?",options:["+\u221E","\u2212\u221E","0","1/2"],answer:0,explain:"Da destra x \u2212 2 \u2192 0\u207A: 1/0\u207A = +\u221E."},{id:"m4-2-12",type:"mc",topic:"Algebra dei limiti",q:"lim (x \u2192 2\u207B) 1/(x \u2212 2) = ?",options:["\u2212\u221E","+\u221E","0","\u22121/2"],answer:0,explain:"Da sinistra x \u2212 2 \u2192 0\u207B: 1/0\u207B = \u2212\u221E."},{id:"m4-2-13",type:"fill",topic:"\u221E/\u221E",text:"Nel rapporto di polinomi per x \u2192 \u221E: se il grado del numeratore \xE8 maggiore il limite \xE8 ___; se \xE8 minore il limite \xE8 ___.",answers:["infinito","zero"],extra:["uno","indeterminato"],explain:"Con gradi uguali \xE8 il rapporto dei coefficienti direttivi."},{id:"m4-2-14",type:"num",topic:"\u221E/\u221E",q:"lim (x \u2192 +\u221E) (5 \u2212 2x)/(x + 1) = ?",answer:-2,tol:0,explain:"Stesso grado: coefficienti direttivi \u22122 e 1 \u21D2 \u22122."}]},{id:"m4l3",title:"Asintoti",icon:"\u{1F4CF}",theory:[{title:"I tre tipi di asintoto",points:["**Verticale x = x\u2080**: lim (x \u2192 x\u2080) f(x) = \xB1\u221E (anche solo da un lato). Si cerca nei punti esclusi dal dominio e negli estremi aperti.","**Orizzontale y = L**: lim (x \u2192 \xB1\u221E) f(x) = L finito.","**Obliquo y = mx + q**: m = lim (x \u2192 \u221E) f(x)/x (finito e \u2260 0), q = lim (x \u2192 \u221E) [f(x) \u2212 mx] (finito).","L\u2019obliquo si cerca **solo se non c\u2019\xE8 l\u2019orizzontale** (da quel lato)."],example:"f(x) = (x\xB2 + 1)/x: dominio x \u2260 0 \u21D2 asintoto verticale x = 0. Per x \u2192 \u221E f \u2192 \u221E (niente orizzontale). m = lim (x\xB2 + 1)/x\xB2 = 1, q = lim [(x\xB2 + 1)/x \u2212 x] = lim 1/x = 0 \u21D2 obliquo y = x."}],exercises:[{id:"m4-3-1",type:"mc",topic:"Asintoti",q:"f(x) = 1/(x \u2212 3) ha un asintoto verticale in\u2026",options:["x = 3","x = 0","y = 3","x = \u22123"],answer:0,explain:"Il denominatore si annulla in x = 3 e l\xEC f \u2192 \xB1\u221E."},{id:"m4-3-2",type:"mc",topic:"Asintoti",q:"f(x) = (2x + 1)/(x \u2212 1) ha asintoto orizzontale\u2026",options:["y = 2","y = 1","y = 0","y = \u22121"],answer:0,explain:"lim (x \u2192 \u221E) = 2/1 = 2."},{id:"m4-3-3",type:"mc",topic:"Asintoti",q:"Quando si cerca l\u2019asintoto obliquo?",options:["Solo se non c\u2019\xE8 l\u2019asintoto orizzontale","Sempre, insieme all\u2019orizzontale","Solo se c\u2019\xE8 un asintoto verticale","Solo per le funzioni pari"],answer:0,explain:"Se f \u2192 L finito c\u2019\xE8 l\u2019orizzontale; se f \u2192 \u221E si pu\xF2 cercare l\u2019obliquo."},{id:"m4-3-4",type:"mc",topic:"Asintoti",q:"Come si calcola il coefficiente m dell\u2019asintoto obliquo?",options:["m = lim f(x)/x","m = lim f(x) \u2212 x","m = lim f(x)","m = f(1) \u2212 f(0)"],answer:0,explain:"Poi q = lim [f(x) \u2212 mx]."},{id:"m4-3-5",type:"num",topic:"Asintoti",q:"f(x) = (x\xB2 + 1)/x. Coefficiente m dell\u2019asintoto obliquo?",answer:1,tol:0,explain:"f/x = (x\xB2 + 1)/x\xB2 \u2192 1."},{id:"m4-3-6",type:"num",topic:"Asintoti",q:"f(x) = (2x\xB2 + 3x)/(x + 1). Coefficiente m dell\u2019asintoto obliquo?",answer:2,tol:0,explain:"f/x = (2x\xB2 + 3x)/(x\xB2 + x) \u2192 2."},{id:"m4-3-7",type:"num",topic:"Asintoti",q:"Stessa f(x) = (2x\xB2 + 3x)/(x + 1). Quanto vale q?",answer:1,tol:0,explain:"f \u2212 2x = (2x\xB2 + 3x \u2212 2x\xB2 \u2212 2x)/(x + 1) = x/(x + 1) \u2192 1. Asintoto y = 2x + 1."},{id:"m4-3-8",type:"tf",topic:"Asintoti",q:"ln x ha un asintoto verticale in x = 0.",answer:!0,explain:"lim (x \u2192 0\u207A) ln x = \u2212\u221E."},{id:"m4-3-9",type:"tf",topic:"Asintoti",q:"e\u02E3 ha un asintoto orizzontale y = 0 per x \u2192 \u2212\u221E.",answer:!0,explain:"lim (x \u2192 \u2212\u221E) e\u02E3 = 0."},{id:"m4-3-10",type:"hotspot",topic:"Asintoti",scene:"asintoti",q:"Tocca l\u2019asintoto verticale",answer:"av",explain:"\xC8 la retta verticale vicino alla quale la funzione va a \xB1\u221E."},{id:"m4-3-11",type:"hotspot",topic:"Asintoti",scene:"asintoti",q:"Tocca l\u2019asintoto orizzontale",answer:"ao",explain:"\xC8 la retta orizzontale a cui la funzione si avvicina per x \u2192 \xB1\u221E."},{id:"m4-3-12",type:"match",topic:"Asintoti",q:"Abbina la condizione al tipo di asintoto",pairs:[["lim x\u2192x\u2080 f = \u221E","Verticale x = x\u2080"],["lim x\u2192\u221E f = L","Orizzontale y = L"],["lim f/x = m \u2260 0","Obliquo y = mx + q"]],explain:"Verticali vicino a un punto, orizzontali e obliqui all\u2019infinito."}]},{id:"m4l4",title:"Continuit\xE0 e discontinuit\xE0",icon:"\u3030\uFE0F",theory:[{title:"Funzione continua",points:["f \xE8 **continua in x\u2080** se valgono **3 condizioni**: (1) f(x\u2080) esiste; (2) lim (x \u2192 x\u2080) f(x) esiste finito; (3) **il limite \xE8 uguale a f(x\u2080)**.","Intuitivamente: il grafico si disegna \u201Csenza staccare la penna\u201D.","Le funzioni elementari (polinomi, esponenziali, logaritmi, radici) sono continue nel loro dominio."]},{title:"Tipi di discontinuit\xE0",points:["**Prima specie (salto)**: limite destro e sinistro finiti ma diversi. **Salto S = L\u207A \u2212 L\u207B**.","**Seconda specie**: almeno uno dei limiti unilaterali \xE8 infinito o non esiste (es. 1/x in 0).","**Terza specie (eliminabile)**: il limite esiste finito ma \xE8 diverso da f(x\u2080), o f non \xE8 definita in x\u2080. Si \u201Cripara\u201D ridefinendo f(x\u2080) = limite."],example:"(x\xB2 \u2212 1)/(x \u2212 1) in x = 1: limite 2, f(1) non esiste \u21D2 discontinuit\xE0 eliminabile."}],exercises:[{id:"m4-4-1",type:"order",topic:"Continuit\xE0",q:"Ordina le tre condizioni della continuit\xE0 in x\u2080",items:["f(x\u2080) esiste","Il limite per x \u2192 x\u2080 esiste finito","Il limite coincide con f(x\u2080)"],explain:"Se anche una sola manca la funzione \xE8 discontinua."},{id:"m4-4-2",type:"mc",topic:"Discontinuit\xE0",q:"Limite sinistro 2, limite destro 5. Che discontinuit\xE0 \xE8?",options:["Prima specie, salto 3","Seconda specie","Terza specie (eliminabile)","Nessuna: la funzione \xE8 continua"],answer:0,explain:"Due limiti finiti ma diversi: salto S = 5 \u2212 2 = 3."},{id:"m4-4-3",type:"mc",topic:"Discontinuit\xE0",q:"f(x) = 1/x in x = 0 ha una discontinuit\xE0 di\u2026",options:["seconda specie","prima specie","terza specie","nessun tipo: \xE8 continua"],answer:0,explain:"I limiti unilaterali sono infiniti."},{id:"m4-4-4",type:"mc",topic:"Discontinuit\xE0",q:"(x\xB2 \u2212 4)/(x \u2212 2) in x = 2 ha una discontinuit\xE0 di\u2026",options:["terza specie (eliminabile)","prima specie","seconda specie","nessun tipo: \xE8 continua"],answer:0,explain:"Il limite vale 4 ma f(2) non \xE8 definita: basta porre f(2) = 4."},{id:"m4-4-5",type:"num",topic:"Discontinuit\xE0",q:"f(x) = x + 1 per x < 0 e f(x) = x + 4 per x \u2265 0. Ampiezza del salto in 0?",answer:3,tol:0,explain:"L\u207B = 1, L\u207A = 4 \u21D2 S = 4 \u2212 1 = 3."},{id:"m4-4-6",type:"hotspot",topic:"Discontinuit\xE0",scene:"discont",q:"Tocca la retta verticale dove c\u2019\xE8 una discontinuit\xE0 di prima specie (salto)",answer:"salto",explain:"Il grafico \u201Csalta\u201D da un livello all\u2019altro: i due limiti sono finiti ma diversi."},{id:"m4-4-7",type:"hotspot",topic:"Discontinuit\xE0",scene:"discont",q:"Tocca la retta verticale dove c\u2019\xE8 la discontinuit\xE0 eliminabile",answer:"elim",explain:"Il grafico ha solo un \u201Cbuco\u201D: il limite esiste ma il valore manca o \xE8 spostato."},{id:"m4-4-8",type:"tf",topic:"Continuit\xE0",q:"Una funzione pu\xF2 avere limite in x\u2080 senza essere continua in x\u2080.",answer:!0,explain:"\xC8 il caso della discontinuit\xE0 eliminabile."},{id:"m4-4-9",type:"tf",topic:"Continuit\xE0",q:"ln x \xE8 continua in x = 0.",answer:!1,explain:"x = 0 non appartiene al dominio: la continuit\xE0 si studia solo dove f \xE8 definita."},{id:"m4-4-10",type:"num",topic:"Continuit\xE0",q:"f(x) = x\xB2 + k per x \u2264 1 e f(x) = 3x per x > 1. Per quale k f \xE8 continua?",answer:2,tol:0,explain:"Serve 1 + k = 3 \u21D2 k = 2."},{id:"m4-4-11",type:"match",topic:"Discontinuit\xE0",q:"Abbina il tipo alla descrizione",pairs:[["Prima specie","Limiti finiti ma diversi"],["Seconda specie","Almeno un limite infinito o inesistente"],["Terza specie","Limite finito \u2260 f(x\u2080)"]],explain:"La terza \xE8 l\u2019unica che si ripara."}]},{id:"m4l5",title:"Teoremi sulle funzioni continue",icon:"\u{1F3DB}\uFE0F",theory:[{title:"I tre teoremi",points:["**Teorema degli zeri**: f continua su [a, b] e f(a), f(b) di segno opposto \u21D2 esiste c \u2208 (a, b) con **f(c) = 0**.","**Bolzano (valori intermedi)**: f continua su [a, b] assume **tutti i valori** compresi tra f(a) e f(b).","**Weierstrass**: f continua su un intervallo **chiuso e limitato** [a, b] \u21D2 ha **massimo e minimo assoluti**.","Le ipotesi contano: su (0, 1] la funzione 1/x \xE8 continua ma non ha massimo."]}],exercises:[{id:"m4-5-1",type:"mc",topic:"Teoremi",q:"f continua su [1, 3], f(1) = \u22122, f(3) = 5. Che cosa si pu\xF2 dire?",options:["Esiste c \u2208 (1, 3) con f(c) = 0","f \xE8 crescente su [1, 3]","f(2) = 1,5","f non ha zeri"],answer:0,explain:"Teorema degli zeri: segni opposti agli estremi."},{id:"m4-5-2",type:"mc",topic:"Teoremi",q:"Che cosa garantisce il teorema di Weierstrass?",options:["Massimo e minimo assoluti su [a, b]","Almeno uno zero in (a, b)","Che f sia derivabile in (a, b)","Che f sia crescente su [a, b]"],answer:0,explain:"Servono continuit\xE0 e intervallo chiuso e limitato."},{id:"m4-5-3",type:"tf",topic:"Teoremi",q:"f(x) = 1/x su (0, 1] ha massimo assoluto.",answer:!1,explain:"Per x \u2192 0\u207A cresce senza limite. Weierstrass non si applica: l\u2019intervallo non \xE8 chiuso."},{id:"m4-5-4",type:"mc",topic:"Teoremi",q:"f continua su [0, 2], f(0) = 1 e f(2) = 7. Per Bolzano f assume sicuramente il valore\u2026",options:["4","8","0","\u22121"],answer:0,explain:"Assume tutti i valori tra 1 e 7."},{id:"m4-5-5",type:"match",topic:"Teoremi",q:"Abbina il teorema alla tesi",pairs:[["Zeri","Esiste c con f(c) = 0"],["Bolzano","Tutti i valori intermedi"],["Weierstrass","Massimo e minimo assoluti"]],explain:"Tutti richiedono f continua su [a, b]."},{id:"m4-5-6",type:"mc",topic:"Teoremi",q:"Quale ipotesi \xE8 comune a tutti e tre i teoremi?",options:["f continua su un chiuso [a, b]","f derivabile su tutto \u211D","f strettamente crescente","f(a) = f(b) agli estremi"],answer:0,explain:"Senza continuit\xE0 sul chiuso nessuno dei tre vale."},{id:"m4-5-7",type:"tf",topic:"Teoremi",q:"x\xB3 + x \u2212 1 ha almeno uno zero tra 0 e 1.",answer:!0,explain:"f(0) = \u22121 < 0 e f(1) = 1 > 0, f \xE8 continua: teorema degli zeri."}]},{id:"m4l6",title:"Esercizi d\u2019esame: limiti e asintoti",icon:"\u{1FA9C}",theory:[{title:"Ricerca degli asintoti",points:["1 \xB7 **Dominio**: i punti esclusi sono i candidati asintoti verticali.","2 \xB7 **Verticali**: limite nei punti esclusi; se \xE8 \u221E c\u2019\xE8 l\u2019asintoto.","3 \xB7 **Orizzontali**: limite per x \u2192 \xB1\u221E; se \xE8 finito, y = L.","4 \xB7 **Obliqui** solo se f \u2192 \u221E: m = lim f/x, q = lim (f \u2212 mx)."]}],exercises:[{id:"m4-6-1",type:"steps",topic:"Asintoti",q:"Trova tutti gli asintoti di f(x) = (x\xB2 + 1)/x.",steps:[{q:"Dominio?",kind:"mc",answer:0,options:["\u211D \\ {0}","\u211D","(0, +\u221E)","\u211D \\ {\u22121}"],explain:"Il denominatore si annulla in 0."},{q:"Asintoto verticale: x = ?",kind:"num",answer:0,explain:"lim (x \u2192 0\u207A) = +\u221E: x = 0 \xE8 asintoto verticale."},{q:"C\u2019\xE8 l\u2019asintoto orizzontale?",kind:"mc",answer:0,options:["No: f \u2192 \xB1\u221E per x \u2192 \xB1\u221E","S\xEC: y = 1","S\xEC: y = 0","S\xEC: y = x"],explain:"Grado 2 sopra, 1 sotto: f diverge."},{q:"m = lim f(x)/x = ?",kind:"num",answer:1,explain:"(x\xB2 + 1)/x\xB2 \u2192 1."},{q:"q = lim [f(x) \u2212 x] = ?",kind:"num",answer:0,explain:"(x\xB2 + 1)/x \u2212 x = 1/x \u2192 0."}],explain:"Asintoti: x = 0 e y = x."},{id:"m4-6-2",type:"steps",topic:"Asintoti",q:"Studia f(x) = (2x + 1)/(x \u2212 1).",steps:[{q:"Asintoto verticale: x = ?",kind:"num",answer:1,explain:"x \u2212 1 = 0 \u21D2 x = 1, e il numeratore l\xEC vale 3 \u2260 0."},{q:"lim (x \u2192 1\u207A) f(x) = ?",kind:"mc",answer:0,options:["+\u221E","\u2212\u221E","3","2"],explain:"Numeratore \u2192 3 > 0, denominatore \u2192 0\u207A: 3/0\u207A = +\u221E."},{q:"lim (x \u2192 1\u207B) f(x) = ?",kind:"mc",answer:0,options:["\u2212\u221E","+\u221E","3","0"],explain:"Denominatore \u2192 0\u207B: 3/0\u207B = \u2212\u221E."},{q:"Asintoto orizzontale: y = ?",kind:"num",answer:2,explain:"Stesso grado: 2/1."}],explain:"Asintoti x = 1 e y = 2, niente obliquo."},{id:"m4-6-3",type:"steps",topic:"Discontinuit\xE0",q:"f(x) = x + 1 per x < 0 e f(x) = x + 4 per x \u2265 0. Studia la continuit\xE0 in 0.",steps:[{q:"Limite sinistro in 0?",kind:"num",answer:1,explain:"Uso il pezzo x + 1: \u2192 1."},{q:"Limite destro in 0?",kind:"num",answer:4,explain:"Uso il pezzo x + 4: \u2192 4."},{q:"Ampiezza del salto S = L\u207A \u2212 L\u207B?",kind:"num",answer:3,explain:"4 \u2212 1 = 3."},{q:"Tipo di discontinuit\xE0?",kind:"mc",answer:0,options:["Prima specie (salto)","Seconda specie","Terza specie (eliminabile)","Nessuna: \xE8 continua"],explain:"Limiti finiti ma diversi."}],explain:"Per i pezzi si calcolano sempre i due limiti laterali."},{id:"m4-6-4",type:"steps",topic:"Discontinuit\xE0",q:"Studia f(x) = (x\xB2 \u2212 4)/(x \u2212 2) in x = 2.",steps:[{q:"Sostituendo x = 2 ottengo\u2026",kind:"mc",answer:0,options:["La forma indeterminata 0/0","4/0, quindi \u221E","0","2"],explain:"4 \u2212 4 = 0 sopra e 2 \u2212 2 = 0 sotto."},{q:"lim (x \u2192 2) f(x) = ?",kind:"num",answer:4,explain:"(x \u2212 2)(x + 2)/(x \u2212 2) = x + 2 \u2192 4."},{q:"Tipo di discontinuit\xE0?",kind:"mc",answer:0,options:["Terza specie (eliminabile)","Prima specie","Seconda specie","Asintoto verticale"],explain:"Il limite esiste finito ma f(2) non \xE8 definita."},{q:"Quale valore f(2) la rende continua?",kind:"num",answer:4,explain:"Si pone f(2) uguale al limite."}],explain:"Un punto escluso dal dominio non \xE8 sempre un asintoto: qui \xE8 solo un buco."},{id:"m4-6-5",type:"steps",topic:"Limiti \u221E/\u221E",q:"Calcola lim (x \u2192 +\u221E) (4x\xB2 \u2212 x)/(2x\xB2 + 7).",steps:[{q:"Che forma si ottiene sostituendo?",kind:"mc",answer:0,options:["\u221E/\u221E","0/0","\u221E \u2212 \u221E","1^\u221E"],explain:"Entrambi i polinomi divergono."},{q:"Raccolgo x\xB2: il limite \xE8 il rapporto di\u2026",kind:"mc",answer:0,options:["coefficienti direttivi 4 e 2","termini noti 0 e 7","coefficienti di x","gradi 2 e 2"],explain:"(4 \u2212 1/x)/(2 + 7/x\xB2) \u2192 4/2."},{q:"Risultato?",kind:"num",answer:2,explain:"4/2 = 2."}],explain:"Gradi uguali: rapporto dei coefficienti direttivi."}]}],open:[{id:"m4-o1",q:"Che cosa sono il limite destro, il limite sinistro e quando esiste il limite?",answer:"Il limite destro (x \u2192 x\u2080\u207A) guarda i valori di f per x pi\xF9 grandi di x\u2080, il sinistro (x \u2192 x\u2080\u207B) per x pi\xF9 piccoli. Il limite esiste solo se destro e sinistro esistono e coincidono. Il valore f(x\u2080) non conta. Esempio: 1/x in 0 ha limite destro +\u221E e sinistro \u2212\u221E, quindi il limite non esiste.",keywords:["destro","sinistro","coincid","f(x\u2080)","1/x"]},{id:"m4-o2",q:"Elenca le forme indeterminate e spiega come si risolvono con i polinomi.",answer:"Sono sette: 0/0, \u221E/\u221E, 0\xB7\u221E, +\u221E \u2212 \u221E, 0\u2070, 1^\u221E, \u221E\u2070. Con i polinomi: \u221E/\u221E si raccoglie la potenza massima (grado maggiore sopra \u21D2 \u221E, uguale \u21D2 rapporto dei coefficienti direttivi, minore \u21D2 0); 0/0 si scompone e si semplifica il fattore (x \u2212 x\u2080); +\u221E \u2212 \u221E vince il termine di grado massimo. In alternativa si usa De l\u2019H\xF4pital.",keywords:["0/0","\u221E/\u221E","+\u221E \u2212 \u221E","1^\u221E","grado","scompon"]},{id:"m4-o3",q:"Definisci asintoto verticale, orizzontale e obliquo. Come si calcola l\u2019obliquo?",answer:"Verticale x = x\u2080 se lim (x \u2192 x\u2080) f = \xB1\u221E; orizzontale y = L se lim (x \u2192 \xB1\u221E) f = L finito; obliquo y = mx + q con m = lim f(x)/x finito e diverso da 0 e q = lim [f(x) \u2212 mx] finito. L\u2019obliquo si cerca solo se non c\u2019\xE8 l\u2019orizzontale.",keywords:["verticale","orizzontale","obliquo","f(x)/x","f(x) \u2212 mx","solo se"]},{id:"m4-o4",q:"Quando una funzione \xE8 continua? Classifica le discontinuit\xE0.",answer:"f \xE8 continua in x\u2080 se f(x\u2080) esiste, il limite esiste finito e coincide con f(x\u2080). Discontinuit\xE0 di prima specie: limiti destro e sinistro finiti ma diversi, salto S = L\u207A \u2212 L\u207B. Seconda specie: almeno un limite infinito o inesistente. Terza specie o eliminabile: il limite esiste ma \xE8 diverso da f(x\u2080) o f non \xE8 definita.",keywords:["tre condizioni","limite","f(x\u2080)","prima specie","salto","seconda","eliminabile"]},{id:"m4-o5",q:"Enuncia il teorema degli zeri, di Bolzano e di Weierstrass.",answer:"Zeri: se f \xE8 continua su [a, b] e f(a)\xB7f(b) < 0 allora esiste c in (a, b) con f(c) = 0. Bolzano: f continua su [a, b] assume tutti i valori tra f(a) e f(b). Weierstrass: f continua su un intervallo chiuso e limitato ammette massimo e minimo assoluti. Le ipotesi sono essenziali: 1/x su (0, 1] non ha massimo.",keywords:["continua","[a, b]","segno opposto","valori intermedi","chiuso e limitato","massimo e minimo"]}],cards:[{id:"m4-c1",front:"Limite globale esiste se\u2026",back:"Limite destro = limite sinistro."},{id:"m4-c2",front:"Le 7 forme indeterminate",back:"0/0, \u221E/\u221E, 0\xB7\u221E, +\u221E \u2212 \u221E, 0\u2070, 1^\u221E, \u221E\u2070."},{id:"m4-c3",front:"Polinomi \u221E/\u221E",back:"Grado sopra > sotto: \u221E; = : rapporto coeff. direttivi; < : 0."},{id:"m4-c4",front:"lim x\u21920\u207A ln x",back:"\u2212\u221E."},{id:"m4-c5",front:"lim x\u2192\u2212\u221E e\u02E3",back:
