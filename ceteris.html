",topic:"Rapporto CN",q:"Stesse quote (0,50; 0,20; 0,15; 0,10; 0,05). Calcola C3.",answer:.85,tol:.001,explain:"0,50 + 0,20 + 0,15 = 0,85."},{id:"u4-7-8",type:"num",topic:"Indice HH",q:"Cinque imprese con quota 0,20 ciascuna. Quanto vale l\u2019indice HH?",answer:.2,tol:.001,explain:"5 \xD7 0,04 = 0,20 = 1/N: \xE8 il valore minimo con 5 imprese."},{id:"u4-7-9",type:"num",topic:"Rapporto CN",q:"Industria delle lampadine: le prime 4 imprese fatturano 600, 400, 200 e 100 milioni; il settore 2.000 milioni. Calcola C4 in percentuale.",answer:65,tol:.1,unit:"%",explain:"(600 + 400 + 200 + 100) / 2.000 = 1.300 / 2.000 = 65%."},{id:"u4-7-10",type:"num",topic:"Indice HH",q:"Industria dei cereali: quote 50%, 25%, 15%, 10%. Calcola l\u2019indice HH usando le quote in punti percentuali.",answer:3450,tol:0,explain:"50\xB2 + 25\xB2 + 15\xB2 + 10\xB2 = 2.500 + 625 + 225 + 100 = 3.450 (cio\xE8 0,345 con le quote in decimali)."},{id:"u4-7-11",type:"tf",topic:"Indice HH",q:"L\u2019indice HH vale al massimo 1, in caso di monopolio.",answer:!0,explain:"Un\u2019impresa con quota 1: 1\xB2 = 1. Il minimo \xE8 1/N."},{id:"u4-7-12",type:"mc",topic:"Misure di concentrazione",q:"Qual \xE8 il difetto principale del rapporto CN?",options:["Non dice nulla su cosa succede dopo le prime n imprese","Richiede troppi dati sulle imprese pi\xF9 piccole","Vale sempre 1, qualunque sia il mercato","Non si pu\xF2 esprimere in percentuale"],answer:0,explain:"L\u2019HH invece usa tutte le imprese del settore."},{id:"u4-7-13",type:"order",topic:"Ciclo di vita",q:"Ordina le fasi del ciclo di vita del prodotto",items:["Introduzione: poche imprese, concentrazione alta","Sviluppo: entrano concorrenti, concentrazione cala","Maturit\xE0: situazione stabile","Declino: chi non guadagna esce, concentrazione risale"],explain:"Il ciclo di vita \xE8 una delle determinanti della concentrazione."},{id:"u4-7-14",type:"order",topic:"S-C-P",q:"Ordina i blocchi della prima formulazione del paradigma S-C-P",items:["Condizioni di domanda e offerta","Struttura","Comportamenti","Performance"],explain:"Nelle formulazioni successive la performance torna indietro a influenzare domanda, offerta e struttura."},{id:"u4-7-15",type:"tf",topic:"S-C-P",q:"Secondo il paradigma S-C-P i comportamenti delle imprese sono automatici e non influenzano la performance.",answer:!1,explain:"Questo \xE8 il punto di vista neoclassico. Per l\u2019S-C-P le scelte strategiche impattano sulla performance, che non \xE8 solo il profitto."}]}],open:[{id:"u4-o1",q:"Cosa sono le barriere all\u2019entrata? Elencane almeno cinque con esempi.",answer:"Sono extra costi o svantaggi che un nuovo entrante sopporta rispetto agli incumbent. Economie di scala; propriet\xE0 esclusiva dei fattori (De Beers); differenziazione di prodotto (Samsung contro iPhone); costi di riconversione del cliente (QWERTY); esternalit\xE0 di rete (Facebook); barriere legali (brevetti, licenze dei taxi); fabbisogno di capitali; altri vantaggi come ubicazione e cultura.",keywords:["nuovo entrante","incumbent","economie di scala","esternalit\xE0 di rete","legali","differenziazione"]},{id:"u4-o2",q:"Cosa sono le barriere all\u2019uscita e che relazione hanno con quelle all\u2019entrata?",answer:"Sono costi alti e non recuperabili (sunk costs) per uscire: impianti specializzati (Ferr\xE8), costi fissi di uscita da contratti, interdipendenze strategiche, barriere emotive (Ferrero), ostacoli politici e sociali (sindacati). Agiscono come barriere all\u2019entrata perch\xE9 rendono gli incumbent pi\xF9 aggressivi: costruiscono barriere strategiche come prezzi predatori o prezzi limite.",keywords:["non recuperabili","impianti specializzati","emotive","aggressivi","prezzi predatori"]},{id:"u4-o3",q:"Elenca le caratteristiche della concorrenza perfetta e spiega perch\xE9 la si studia.",answer:"Tante piccole imprese e tanti consumatori price-taker; prodotto standardizzato; simmetria tecnologica; informazione perfetta; nessuna barriera all\u2019entrata e all\u2019uscita. Devono valere tutte. Si studia perch\xE9 \xE8 l\u2019ottimo teorico in termini di efficienza allocativa (massimizza la somma dei surplus) ed \xE8 il termine di paragone per le altre strutture.",keywords:["price-taker","standardizzato","simmetria","informazione","barriere","paragone"]},{id:"u4-o4",q:"Spiega l\u2019equilibrio di breve e di lungo periodo dell\u2019impresa in concorrenza perfetta.",answer:"L\u2019impresa ha domanda orizzontale: P = R\u2019. Produce dove R\u2019 = C\u2019. Nel breve, se P \xE8 sopra il CMT fa extraprofitti, se sotto ha perdite. Gli extraprofitti attirano nuove imprese, l\u2019offerta aumenta e il prezzo scende; con perdite le imprese escono. Nel lungo periodo P = R\u2019 incrocia il C\u2019 nel minimo del CMT: profitti normali, che coprono tutti i costi opportunit\xE0. Solo qui la condizione diventa C\u2019 = P.",keywords:["orizzontale","R\u2019 = C\u2019","extraprofitti","entrano","minimo del CMT","normali"]},{id:"u4-o5",q:"Come fissa prezzo e quantit\xE0 il monopolista e perch\xE9 genera una perdita secca?",answer:"La domanda di mercato coincide con quella dell\u2019impresa ed \xE8 discendente; la curva R\u2019 parte dallo stesso punto e taglia l\u2019asse a Q/2. Il monopolista produce dove R\u2019 = C\u2019 e proietta quella quantit\xE0 sulla domanda per trovare il prezzo; la differenza tra prezzo e costo medio \xE8 extraprofitto. Rispetto alla concorrenza perfetta il prezzo \xE8 pi\xF9 alto e la quantit\xE0 pi\xF9 bassa: parte del surplus dei consumatori va all\u2019impresa e una parte va persa (perdita secca).",keywords:["R\u2019 = C\u2019","curva di domanda","extraprofitto","prezzo pi\xF9 alto","perdita secca"]},{id:"u4-o6",q:"Quali sono i tipi di monopolio? Cos\u2019\xE8 la subadditivit\xE0 dei costi?",answer:"Legale (autorizzazione del governo, brevetto, copyright), tecnologico (vantaggio tecnologico come Intel o controllo esclusivo di risorse come De Beers), naturale (economie di scala cos\xEC forti che un\u2019impresa sola soddisfa la domanda a costi minori di due o pi\xF9). Subadditivit\xE0: produrre tutto insieme costa meno della somma dei costi per produrre le singole frazioni.",keywords:["legale","tecnologico","naturale","economie di scala","subadditivit\xE0"]},{id:"u4-o7",q:"Come pu\xF2 intervenire lo Stato sul monopolio? Cos\u2019\xE8 il rent seeking?",answer:"A) stimolando la concorrenza (antitrust che frammenta l\u2019impresa); B) regolando il comportamento, ad esempio con un prezzo massimo, che per\xF2 \xE8 difficile da fissare perch\xE9 lo Stato non conosce i costi; C) trasformando il monopolio privato in impresa pubblica (Trenitalia). Il rent seeking \xE8 spendere risorse per ottenere o mantenere il potere di mercato, ad esempio corrompendo un funzionario, invece di innovare (rent creation).",keywords:["concorrenza","prezzo massimo","impresa pubblica","rent seeking","corromp"]},{id:"u4-o8",q:"Descrivi il modello di Cournot: ipotesi, round ed equilibrio.",answer:"Due imprese, prodotto identico, potere di mercato, barriere insormontabili, C\u2019 = 0, domanda lineare, massimo profitto, variazione congetturale nulla. Mercato = 1: A produce 1/2 come un monopolista, B 1/4. Poi A 3/8 e B 5/16, poi A 11/32 e B 21/64. Si converge all\u2019equilibrio di Cournot-Nash, 1/3 ciascuno, all\u2019incrocio delle funzioni di reazione. Critiche: congettura nulla irrealistica, nessun apprendimento, ignora la collusione.",keywords:["C\u2019 = 0","congetturale nulla","1/2","3/8","1/3","funzioni di reazione"]},{id:"u4-o9",q:"In cosa il modello di Stackelberg differisce da Cournot?",answer:"La congettura nulla cade per una delle due imprese: il leader conosce la funzione di reazione del follower e sceglie l\u2019output migliore su di essa (vantaggio del pioniere). C\u2019\xE8 un solo round: il leader produce 1/2 come un monopolista e il follower si adegua producendo 1/4 (punto Sa o Sb). Se entrambi fanno i leader si va nel punto P-W: sovrapproduzione e prezzi in calo.",keywords:["leader","follower","funzione di reazione","pioniere","1/2","P-W"]},{id:"u4-o10",q:"Spiega il modello di Bertrand e la critica che ne deriva.",answer:"Le imprese fissano il prezzo. Imprese identiche con C\u2019 orizzontale, prodotto omogeneo, informazione perfetta, nessun costo di transazione per i clienti: chi ha il prezzo pi\xF9 basso prende tutti i clienti. A fissa il prezzo di monopolio, B lo abbassa di poco, e cos\xEC via fino a P = C\u2019. Risultato: prezzo e quantit\xE0 di concorrenza perfetta divise a met\xE0. La critica \xE8 che bisogna considerare la possibilit\xE0 di modelli collusivi.",keywords:["prezzo","abbassa","P = C\u2019","concorrenza perfetta","collusiv"]},{id:"u4-o11",q:"Cos\u2019\xE8 un cartello e quando \xE8 pi\xF9 probabile che regga?",answer:"\xC8 un accordo formale o informale tra imprese per tenere prezzi pi\xF9 alti o quantit\xE0 pi\xF9 basse, simil-monopolio; \xE8 illegale. \xC8 pi\xF9 probabile con poche imprese, simili per costi, quote e prodotto; ordini piccoli e frequenti; agenti di vendita comuni o associazioni che scoprono le deviazioni; punizioni attese basse; meccanismi che prevengono le deviazioni (quote fisse, clausole). Esempio: l\u2019OPEC.",keywords:["accordo","illegale","poche imprese","simili","deviazioni","OPEC"]},{id:"u4-o12",q:"Spiega il dilemma del prigioniero e l\u2019equilibrio di Nash applicati all\u2019oligopolio.",answer:"Gigi e Toni, interrogati separatamente: chi confessa esce se l\u2019altro tace (che fa 20 anni), entrambi zitti 1 anno, entrambi confessano 5 anni. Confessare \xE8 la strategia dominante, quindi entrambi confessano: \xE8 l\u2019equilibrio di Nash, in cui ognuno fa la scelta migliore qualunque cosa faccia l\u2019altro, anche se cooperare sarebbe meglio. Nell\u2019oligopolio (Ajinomoto e ADM) la tentazione di aumentare la produzione porta a 160 milioni a testa invece di 180: i cartelli tendono ad autodistruggersi.",keywords:["confessare","dominante","equilibrio di Nash","cooperazione","scartellare"]},{id:"u4-o13",q:"Descrivi la concorrenza monopolistica e il suo equilibrio.",answer:"\xC8 pi\xF9 simile alla concorrenza perfetta: niente barriere, informazione fluida, offerta frammentata, ma prodotti non identici (olio di oliva e di girasole; la mozzarella sotto casa). L\u2019impresa usa R\u2019 = C\u2019 e fissa il prezzo sulla domanda decrescente. In equilibrio il CMT \xE8 tangente alla domanda: profitti nulli, ma non nel minimo del CMT, quindi c\u2019\xE8 capacit\xE0 in eccesso e una piccola perdita secca tollerata come prezzo della variet\xE0.",keywords:["non identici","barriere","tangente","profitti nulli","capacit\xE0 in eccesso"]},{id:"u4-o14",q:"Come si definisce il mercato rilevante? Spiega SSNIP ed errore del cellophane.",answer:"Dal punto di vista geografico (un aumento di prezzo in una localit\xE0 sposta la domanda nell\u2019altra?) e di prodotto (sostituti stretti, misurati con l\u2019elasticit\xE0 incrociata). Il test SSNIP chiede se un monopolista ipotetico che alza il prezzo del 5-10% aumenterebbe i profitti: se s\xEC, quello \xE8 il mercato; se i clienti passano ad altro, il mercato va allargato. Nell\u2019errore del cellophane la Du Pont fu assolta perch\xE9 il mercato fu definito troppo ampio, includendo la carta.",keywords:["geografic","sostituti stretti","elasticit\xE0 incrociata","5","monopolista ipotetico","cellophane"]},{id:"u4-o15",q:"Confronta CN e HH e illustra il paradigma S-C-P.",answer:"CN \xE8 la somma delle quote delle prime n imprese: servono pochi dati ma non si sa cosa succede dopo. HH \xE8 la somma dei quadrati delle quote di tutte le imprese, pesa di pi\xF9 le grandi e va da 1/N a 1. Il paradigma S-C-P lega le condizioni di domanda e offerta alla struttura, la struttura ai comportamenti e questi alla performance; le versioni successive aggiungono un feedback della performance (Apple) e il ruolo del governo.",keywords:["prime n","quadrati","1/N","struttura","comportamenti","performance"]}],cards:[{id:"u4-c1",front:"Barriera all\u2019entrata",back:"Extra costo o svantaggio del nuovo entrante rispetto agli incumbent."},{id:"u4-c2",front:"Barriera all\u2019uscita",back:"Costo alto e non recuperabile (sunk cost) per lasciare il mercato."},{id:"u4-c3",front:"Esternalit\xE0 di rete",back:"Il valore del prodotto cresce con il numero di utenti (Facebook)."},{id:"u4-c4",front:"Price-taker",back:"Impresa che non influenza il prezzo: domanda individuale orizzontale."},{id:"u4-c5",front:"Curva di offerta in concorrenza perfetta",back:"Il C\u2019 sopra il minimo del CMT."},{id:"u4-c6",front:"Equilibrio di lungo in concorrenza perfetta",back:"P = R\u2019 = C\u2019 = minimo CMT: profitti normali."},{id:"u4-c7",front:"Monopolio: scelta di P e Q",back:"Q dove R\u2019 = C\u2019, P letto sulla curva di domanda."},{id:"u4-c8",front:"Perdita secca",back:"Benessere perso che non va n\xE9 ai consumatori n\xE9 ai produttori."},{id:"u4-c9",front:"Subadditivit\xE0 dei costi",back:"Produrre tutto insieme costa meno della somma delle frazioni (monopolio naturale)."},{id:"u4-c10",front:"Rent seeking",back:"Spendere per ottenere/mantenere il monopolio (es. corruzione) invece di innovare."},{id:"u4-c11",front:"Variazione congetturale nulla",back:"Ogni impresa crede che il rivale non reagir\xE0 alle sue scelte."},{id:"u4-c12",front:"Cournot: round",back:"A 1/2, B 1/4 \u2192 A 3/8, B 5/16 \u2192 A 11/32, B 21/64 \u2192 1/3 e 1/3."},{id:"u4-c13",front:"Stackelberg",back:"Leader 1/2, follower 1/4. Se entrambi leader: punto P-W."},{id:"u4-c14",front:"Bertrand",back:"Si sceglie il prezzo; equilibrio P = C\u2019, ognuno Qc/2."},{id:"u4-c15",front:"Cartello",back:"Accordo illegale per prezzi alti o quantit\xE0 basse (OPEC)."},{id:"u4-c16",front:"Equilibrio di Nash",back:"Ognuno fa la scelta migliore qualunque sia la scelta degli altri."},{id:"u4-c17",front:"Concorrenza monopolistica: equilibrio",back:"CMT tangente alla domanda: profitti nulli, capacit\xE0 in eccesso."},{id:"u4-c18",front:"Test SSNIP",back:"Monopolista ipotetico che alza i prezzi del 5-10%: se i profitti salgono, \xE8 un mercato."},{id:"u4-c19",front:"Errore del cellophane",back:"Du Pont assolta perch\xE9 il mercato fu definito troppo ampio (inclusa la carta)."},{id:"u4-c20",front:"Indice HH",back:"Somma dei quadrati delle quote. Da 1/N a 1."},{id:"u4-c21",front:"Rapporto CN",back:"Somma delle quote delle prime n imprese."},{id:"u4-c22",front:"Paradigma S-C-P",back:"Struttura \u2192 Comportamenti \u2192 Performance, con feedback."}]},S0=yz;var qz={id:"u5",n:5,title:"Teorie dell\u2019impresa",subtitle:"Aprire la black box",color:"#0EA5E9",colorDark:"#0A7FB5",lessons:[{id:"u5l1",title:"Che cos\u2019\xE8 un\u2019impresa",icon:"\u{1F3DB}\uFE0F",theory:[{title:"Dalla semplificazione alla complessit\xE0",points:["L\u2019impresa \xE8 un\u2019**istituzione economica** che si occupa di produzione e scambio di beni e servizi, attraverso **componenti organizzative interne** e **legami esterni**.","Nella storia: **impresa artigiana** (et\xE0 dei comuni: l\u2019artigiano \xE8 imprenditore, lavoratore e direttore); **impresa mercantile** (dal XIII secolo, commerci oltremare: il mercante si assume tutto il rischio); **impresa industriale e capitalistica** (Rivoluzione industriale: separazione tra chi possiede i mezzi di produzione e chi lavora).","**Adam Smith** (1776, *La ricchezza delle nazioni*): la nazione prospera se c\u2019\xE8 un mercato in espansione; divisione del lavoro (fabbrica di spilli) e **mano invisibile**, il meccanismo per cui l\u2019egoismo individuale diventa benessere collettivo."]},{title:"Come si forma il prezzo?",points:["**Adam Smith**: conta l\u2019**offerta**. Prezzo = costo + profitto (mark-up).","**William S. Jevons**: conta la **domanda**. Il valore dipende dall\u2019utilit\xE0 per chi compra.","**Alfred Marshall** (*Principles of Economics*, 1890): prezzo e quantit\xE0 nascono dall\u2019**incontro** tra domanda e offerta.","La teoria neoclassica dell\u2019impresa \xE8 una parte della **teoria dei prezzi**: l\u2019impresa \xE8 una black box descritta da una funzione di produzione y = f(x)."]},{title:"Il marziano di Simon",points:["Herbert Simon (*Organizations and Markets*, 1991): un marziano con un telescopio che mostra le strutture sociali.","La teoria neoclassica gli farebbe vedere punti (imprese) collegati da linee rosse (mercato). In realt\xE0 vedrebbe **grandi aree verdi** (organizzazioni) collegate da linee rosse: quasi tutti lavoriamo dentro organizzazioni.","La visione atomistica trascura ci\xF2 che avviene **dentro** l\u2019impresa."]}],exercises:[{id:"u5-1-1",type:"mc",topic:"Definizione di impresa",q:"Secondo gli appunti, l\u2019impresa \xE8\u2026",options:["un\u2019istituzione economica di produzione e scambio, con componenti organizzative interne e legami esterni","un agente-atomo che massimizza il profitto senza interessarsi di cosa succede al suo interno","un insieme di contratti di mercato tra soggetti indipendenti, senza gerarchia","un\u2019organizzazione senza scopo di lucro che produce beni per la comunit\xE0"],answer:0,explain:"\xC8 la definizione che apre la seconda parte del corso."},{id:"u5-1-2",type:"order",topic:"Storia dell\u2019impresa",q:"Ordina le forme di impresa dalla pi\xF9 antica alla pi\xF9 recente",items:["Impresa artigiana (et\xE0 dei comuni)","Impresa mercantile (dal XIII secolo)","Impresa industriale e capitalistica (Rivoluzione industriale)"],explain:"L\u2019impresa industriale \xE8 la prima studiata dagli intellettuali: nasce l\u2019economia."},{id:"u5-1-3",type:"match",topic:"Teoria dei prezzi",q:"Abbina ogni economista alla sua idea sul prezzo",pairs:[["Adam Smith","Costo + mark-up: conta l\u2019offerta"],["William S. Jevons","Utilit\xE0 del compratore: conta la domanda"],["Alfred Marshall","Incontro tra domanda e offerta"]],explain:"Marshall sintetizza le due visioni."},{id:"u5-1-4",type:"mc",topic:"Mano invisibile",q:"Cosa indica la \u201Cmano invisibile\u201D di Adam Smith?",options:["Il meccanismo per cui l\u2019egoismo individuale si traduce in benessere collettivo","L\u2019intervento dello Stato che corregge i fallimenti del mercato","La divisione del lavoro nella fabbrica di spilli","Il potere dei manager nella grande impresa"],answer:0,explain:"Compare nella *Ricchezza delle nazioni* (1776)."},{id:"u5-1-5",type:"tf",topic:"Impresa mercantile",q:"Nell\u2019impresa mercantile il mercante si assume tutto il rischio d\u2019impresa.",answer:!0,explain:"Compra dagli artigiani senza sapere a che prezzo rivender\xE0 n\xE9 se la merce arriver\xE0."},{id:"u5-1-6",type:"mc",topic:"Simon",q:"Cosa vuole mostrare l\u2019esempio del marziano di Herbert Simon?",options:["Che quasi tutta l\u2019economia avviene dentro organizzazioni","Il mercato \xE8 pi\xF9 importante delle imprese, che sono solo punti isolati","Le imprese sono tutte uguali e si possono studiare come atomi","La concorrenza perfetta esiste davvero, vista dallo spazio"],answer:0,explain:"Il marziano vedrebbe grandi aree verdi (organizzazioni) collegate da linee rosse, non punti isolati."},{id:"u5-1-7",type:"fill",topic:"Teoria neoclassica",text:"La teoria neoclassica dell\u2019impresa \xE8 un elemento della teoria dei ___: l\u2019impresa \xE8 una ___ box descritta da una funzione di produzione.",answers:["prezzi","black"],extra:["costi","white","contratti"],explain:"Interessa come si forma il prezzo, non cosa succede dentro l\u2019impresa."},{id:"u5-1-8",type:"mc",topic:"Adam Smith",q:"Per Adam Smith cosa fa prosperare una nazione?",options:["Un mercato sempre pi\xF9 esteso e la divisione del lavoro","Imprese pubbliche che pianificano tutta la produzione nazionale","Ridurre il commercio con l\u2019estero per proteggere le imprese","Il controllo pubblico dei prezzi dei beni essenziali"],answer:0,explain:"Con pi\xF9 produttivit\xE0 serve un mercato abbastanza esteso per vendere i prodotti."}]},{id:"u5l2",title:"Critiche e difese",icon:"\u{1F94A}",theory:[{title:"Unboxing: 4 aree di critica",points:["**1. Obiettivi**: nella realt\xE0 il massimo profitto non \xE8 raggiungibile. La separazione tra propriet\xE0 e controllo crea pi\xF9 obiettivi da negoziare; si punta a un **profitto soddisfacente** (prestigio, vendite, quota di mercato).","**2. Complessit\xE0 organizzativa**: l\u2019impresa non \xE8 atomistica e antropomorfa (imprenditore = impresa) ma un\u2019organizzazione gerarchica. Pi\xF9 \xE8 grande pi\xF9 \xE8 complessa; asimmetrie informative principale-agente; contano gli **stakeholder** interni ed esterni.","**3. Incertezza e informazione**: non c\u2019\xE8 informazione perfetta; ci sono asimmetrie e shock imprevedibili (pandemia, conflitti). **Razionalit\xE0 limitata** (Simon).","**4. Processo decisionale**: nella realt\xE0 si decide con pratiche e convenzioni (**costo medio + markup**), non con R\u2019 = C\u2019; l\u2019imprenditore \xE8 centrale per innovazione e strategie."]},{title:"A difesa della teoria neoclassica",points:["**Milton Friedman** (Nobel 1976): una scienza deve fare **previsioni** accurate, non descrivere perfettamente la realt\xE0. La teoria prevede bene il comportamento delle imprese.","**Fritz Machlup**: i decisori tendono intuitivamente al massimo profitto, come il guidatore che non conosce il motore ma arriva dove vuole.","**Armen Alchian**: interpretazione **darwinista**, sopravvivono le imprese che massimizzano il profitto. Non \xE8 confermata empiricamente.","Conclusione: la teoria non si butta. Le alternative: **teorie manageriali**, **comportamentali**, dei **costi di transazione** e dell\u2019**agenzia**."]}],exercises:[{id:"u5-2-1",type:"order",topic:"Critiche",q:"Ordina le 4 aree di critica alla teoria neoclassica come negli appunti",items:["Obiettivi","Complessit\xE0 organizzativa","Incertezza e informazione","Processo decisionale"],explain:"\xC8 l\u2019\u201Cunboxing\u201D della black box."},{id:"u5-2-2",type:"mc",topic:"Critiche: obiettivi",q:"Secondo la critica sugli obiettivi, cosa persegue davvero l\u2019impresa?",options:["Un profitto soddisfacente, insieme ad altri obiettivi","Sempre il massimo profitto, come dice la teoria neoclassica","Solo la quota di mercato, a qualunque costo","Il minimo costo di produzione, anche a scapito delle vendite"],answer:0,explain:"Con la separazione tra propriet\xE0 e controllo ci sono pi\xF9 obiettivi da negoziare."},{id:"u5-2-3",type:"mc",topic:"Critiche: processo decisionale",q:"Come decidono il prezzo gli imprenditori nella realt\xE0, secondo la critica?",options:["Con pratiche e convenzioni: costo medio + markup","Applicando la regola marginalista R\u2019 = C\u2019","Copiando sempre il prezzo dei concorrenti","Lasciando che sia lo Stato a fissare il prezzo"],answer:0,explain:"Si usano semplificazioni, non il calcolo marginalista."},{id:"u5-2-4",type:"match",topic:"Difese",q:"Abbina ogni autore alla sua difesa della teoria neoclassica",pairs:[["Milton Friedman","La scienza deve prevedere, non descrivere"],["Fritz Machlup","Il guidatore che non conosce il motore"],["Armen Alchian","Sopravvivono le imprese migliori (darwinismo)"]],explain:"La difesa di Alchian non \xE8 confermata empiricamente.",profNote:"Negli appunti il nome \xE8 scritto \u201CAlchien\u201D: la grafia corretta \xE8 Armen Alchian."},{id:"u5-2-5",type:"tf",topic:"Difese",q:"L\u2019interpretazione darwinista di Alchian \xE8 stata confermata empiricamente.",answer:!1,explain:"Gli appunti sottolineano: \u201CN.B. non confermato empiricamente!\u201D"},{id:"u5-2-6",type:"mc",topic:"Critiche: complessit\xE0",q:"Cosa significa che per i neoclassici l\u2019impresa \xE8 \u201Cantropomorfa\u201D?",options:["Che impresa e imprenditore coincidono","Che ha molti dipendenti","Che ha una struttura gerarchica","Che ha obiettivi sociali"],answer:0,explain:"Nella realt\xE0 impresa e imprenditore non sono sempre sovrapponibili."},{id:"u5-2-7",type:"mc",topic:"Razionalit\xE0 limitata",q:"Chi ha elaborato il concetto di razionalit\xE0 limitata?",options:["Herbert Simon","Milton Friedman","Adam Smith","Alfred Marshall"],answer:0,explain:"\xC8 impossibile immagazzinare informazioni infinite, conoscere tutte le opzioni, prevedere il futuro."},{id:"u5-2-8",type:"tf",topic:"Critiche: complessit\xE0",q:"Le decisioni d\u2019impresa sono condizionate anche da stakeholder esterni come fornitori, governi e associazioni dei consumatori.",answer:!0,explain:"Pur essendo esterni, orientano le decisioni."},{id:"u5-2-9",type:"mc",topic:"Teorie alternative",q:"Quale di queste NON \xE8 una teoria alternativa a quella neoclassica dell\u2019impresa?",options:["Teoria della mano invisibile","Teorie manageriali","Teorie comportamentali","Teoria dei costi di transazione"],answer:0,explain:"Le alternative sono manageriali, comportamentali, costi di transazione e agenzia."}]},{id:"u5l3",title:"Grande impresa e teorie manageriali",icon:"\u{1F3E2}",theory:[{title:"Il caso americano",points:["Inizio \u2019900: gli USA diventano la prima economia. Nascono i **consumi di massa** e la **grande impresa verticalmente integrata** (pi\xF9 fasi della produzione al suo interno).","Pi\xF9 prodotti, lavoratori e fasi; reparti specializzati; gerarchie; dimensioni fisiche enormi.","**Taylorismo**: organizzazione scientifica del lavoro. Scomposizione e parcellizzazione delle fasi, misura di tempi e metodi, catena di montaggio, gerarchia.","**Fordismo**: produzione di massa standardizzata (\u201Cla Ford T di qualunque colore, purch\xE9 nero\u201D), economie di scala, grandi scorte, fabbriche e citt\xE0 operaie, grande impresa al centro di una rete di fornitori.","Delle prime 500 imprese USA a inizio 2000, la maggioranza \xE8 nata tra il 1880 e il 1920."]},{title:"Teorie manageriali",points:["Nascono dalla **divaricazione tra propriet\xE0 e controllo**: pi\xF9 complessit\xE0 e pi\xF9 bisogno di capitali, l\u2019impresa va in borsa, la propriet\xE0 si diffonde e il potere passa ai **manager**.","**Berle e Means**: negli anni \u201930-\u201960 i proprietari perdono il controllo diretto. Nel 1966, nell\u2019**85%** delle grandi imprese nessun azionista aveva pi\xF9 del **5%**.","**Chandler** (1965): fenomeno anche positivo. Le imprese di maggior successo hanno investito in manager specializzati capaci di sfruttare infrastrutture, innovazioni ed economie di scala.","Problemi: lo **status** dei manager dipende dalla dimensione della divisione (crescita delle vendite nel breve). **Williamson** (1963): i manager massimizzano la loro utilit\xE0 con **spese discrezionali** (staff, jet, auto) invece di distribuire dividendi.","Rimedi: retribuzione legata alla **performance**; minaccia di **takeover** (OPA se le azioni scendono); **finanziatori esterni** (ruolo ambivalente: disciplina, ma anche visione di breve periodo).","Valide dove domina la grande impresa (USA, Regno Unito), meno nei contesti di PMI (Italia, Francia, Germania, Giappone, Corea del Sud)."]}],exercises:[{id:"u5-3-1",type:"match",topic:"Taylorismo e fordismo",q:"Abbina ogni caratteristica al modello",pairs:[["Misura di tempi e metodi","Taylorismo"],["Ford T di un solo colore","Fordismo"],["Parcellizzazione delle operazioni","Taylorismo"],["Grandi scorte e citt\xE0 operaie","Fordismo"]],explain:"Taylorismo: organizzazione scientifica del lavoro. Fordismo: produzione di massa standardizzata."},{id:"u5-3-2",type:"mc",topic:"Grande impresa",q:"Cosa significa che la grande impresa americana \xE8 \u201Cverticalmente integrata\u201D?",options:["Ha al suo interno diversi passaggi del processo produttivo","\xC8 quotata in borsa con molti piccoli azionisti","\xC8 di propriet\xE0 dello Stato e ne segue i piani","Ha molti stabilimenti sparsi in paesi diversi"],answer:0,explain:"Risponde alla domanda di massa dell\u2019inizio \u2019900."},{id:"u5-3-3",type:"mc",topic:"Teorie manageriali",q:"Da cosa nascono le teorie manageriali?",options:["Dalla divaricazione tra propriet\xE0 e controllo dell\u2019impresa","Dalla crisi del fordismo negli anni \u201970","Dalla teoria dei costi di transazione di Coase","Dal dilemma del prigioniero applicato all\u2019oligopolio"],answer:0,explain:"Con la propriet\xE0 diffusa in borsa, il controllo passa ai manager."},{id:"u5-3-4",type:"num",topic:"Berle e Means",q:"Nel 1966, in che percentuale delle grandi imprese USA nessun azionista deteneva pi\xF9 del 5%?",answer:85,tol:0,unit:"%",explain:"Dato citato a sostegno della tesi di Berle e Means sulla perdita di controllo dei proprietari.",profNote:"Negli appunti compare come \u201CBarley-Means\u201D: gli autori sono Adolf Berle e Gardiner Means."},{id:"u5-3-5",type:"mc",topic:"Chandler",q:"Qual \xE8 la posizione di Chandler sul potere dei manager?",options:["\xC8 anche un\u2019opportunit\xE0, se i manager sono specializzati","\xC8 solo opportunismo che allontana l\u2019impresa dal profitto","I manager vanno sostituiti dai proprietari appena possibile","I manager non contano: decide sempre il mercato"],answer:0,explain:"Manager capaci hanno sfruttato ferrovie, innovazioni ed economie di scala."},{id:"u5-3-6",type:"mc",topic:"Williamson",q:"Secondo Williamson (1963), come massimizzano la loro utilit\xE0 i manager?",options:["Con spese discrezionali: staff, jet, auto","Distribuendo pi\xF9 dividendi agli azionisti","Riducendo le dimensioni della propria divisione","Massimizzando il profitto come i proprietari"],answer:0,explain:"Le risorse vengono dirottate dai dividendi agli azionisti verso spese che danno prestigio e potere."},{id:"u5-3-7",type:"match",topic:"Limitare i manager",q:"Abbina ogni strumento per limitare la discrezionalit\xE0 dei manager al suo funzionamento",pairs:[["Retribuzione legata alla performance","Premi in base ai risultati e ai dividendi"],["Minaccia di takeover","OPA se il valore delle azioni scende"],["Finanziatori esterni","Pi\xF9 disciplina, ma rischio di visione di breve"]],explain:"Il ruolo dei finanziatori esterni \xE8 ambivalente."},{id:"u5-3-8",type:"tf",topic:"Validit\xE0 delle teorie manageriali",q:"Le teorie manageriali spiegano molto bene anche contesti di piccola e media impresa come l\u2019Italia.",answer:!1,explain:"Hanno pi\xF9 potere esplicativo dove domina la grande impresa (USA, Regno Unito)."},{id:"u5-3-9",type:"mc",topic:"Status dei manager",q:"Perch\xE9 i manager tendono a far crescere la propria divisione?",options:["Perch\xE9 il loro status dipende dalla dimensione della divisione","Perch\xE9 \xE8 l\u2019unico modo per aumentare il profitto","Perch\xE9 glielo chiedono sempre gli azionisti","Per ridurre i costi medi grazie alle economie di scala"],answer:0,explain:"Il contributo del singolo al profitto \xE8 difficile da misurare; la dimensione segnala il ruolo."}]},{id:"u5l4",title:"Teorie comportamentali",icon:"\u{1F9E0}",theory:[{title:"L\u2019impresa non ha obiettivi propri",points:["L\u2019impresa **non \xE8 un\u2019unit\xE0 omogenea**: dentro e fuori ci sono **stakeholder** (azionisti, manager, operai, reparti, consumatori, governi, fornitori) con obiettivi diversi.","Ognuno ha una diversa capacit\xE0 di organizzarsi (**voice**). Il comportamento finale nasce da **negoziazione e conflitto**, in un contesto di interdipendenza.","**Cyert e March** (*A Behavioral Theory of the Firm*, 1963): 5 obiettivi. **Produzione** (reparto produzione: occupazione, flessibilit\xE0); **scorte** (produzione e commerciale: magazzini pieni); **vendite** (commerciale); **quote di mercato** (management); **profitto** (azionisti)."]},{title:"Razionalit\xE0 limitata e profitto soddisfacente",points:["Nessuno ha informazioni complete: capacit\xE0 limitata di immagazzinare informazioni e conoscenza diretta solo di ci\xF2 che si fa (**learning by doing**).","Le decisioni sono l\u2019esito di **conflitti, negoziazioni e contrattazioni**, non di un processo razionale.","L\u2019obiettivo diventa un **profitto soddisfacente**: copre i costi, mantiene una certa dignit\xE0 economica e i rapporti con tutti gli attori. I conflitti si risolvono con meccanismi di compensazione."]}],exercises:[{id:"u5-4-1",type:"mc",topic:"Teorie comportamentali",q:"Qual \xE8 l\u2019idea alla base delle teorie comportamentali?",options:["L\u2019impresa non \xE8 un\u2019unit\xE0 omogenea e non ha obiettivi propri","L\u2019impresa massimizza sempre il profitto, anche se in modo inconsapevole","Il manager decide tutto da solo e impone i suoi obiettivi","L\u2019impresa \xE8 solo un insieme di contratti di mercato"],answer:0,explain:"Dentro ci sono molti portatori di interessi con obiettivi diversi."},{id:"u5-4-2",type:"match",topic:"Cyert e March",q:"Abbina ogni obiettivo al gruppo che lo persegue",pairs:[["Profitto","Azionisti"],["Quote di mercato","Management"],["Vendite","Reparto commerciale"],["Produzione","Reparto produzione"],["Scorte","Produzione e commerciale"]],explain:"Sono i 5 obiettivi di Cyert e March (1963), che possono entrare in conflitto."},{id:"u5-4-3",type:"num",topic:"Cyert e March",q:"Quanti obiettivi individuano Cyert e March nelle imprese?",answer:5,tol:0,explain:"Produzione, scorte, vendite, quote di mercato, profitto."},{id:"u5-4-4",type:"mc",topic:"Voice",q:"Cosa indica la \u201Cvoice\u201D degli stakeholder?",options:["La loro capacit\xE0 di organizzarsi e di influire sulle decisioni","Il diritto di voto degli azionisti in assemblea","La pubblicit\xE0 dell\u2019impresa verso i consumatori","Le lamentele dei clienti sui social network"],answer:0,explain:"Gruppi diversi hanno diversa capacit\xE0 di farsi sentire."},{id:"u5-4-5",type:"fill",topic:"Profitto soddisfacente",text:"Per le teorie comportamentali l\u2019impresa si accontenta di un profitto ___, che copre i costi e mantiene i rapporti con gli ___.",answers:["soddisfacente","stakeholder"],extra:["massimo","azionisti","normale"],explain:"Cos\xEC si evitano defezioni dei gruppi interni ed esterni."},{id:"u5-4-6",type:"mc",topic:"Razionalit\xE0 limitata",q:"Perch\xE9 nessun individuo ha informazioni complete sull\u2019impresa?",options:["Memoria limitata e conoscenza diretta solo del proprio lavoro","Perch\xE9 le informazioni interne sono segrete per legge","Perch\xE9 i manager nascondono sempre le informazioni agli altri","Perch\xE9 le imprese sono troppo piccole per raccoglierle"],answer:0,explain:"\xC8 la razionalit\xE0 limitata di Simon, legata anche al learning by doing."},{id:"u5-4-7",type:"tf",topic:"Processo decisionale",q:"Per le teorie comportamentali le decisioni d\u2019impresa sono l\u2019esito di un processo perfettamente razionale.",answer:!1,explain:"Sono l\u2019esito di conflitti, negoziazioni e contrattazioni tra le parti."},{id:"u5-4-8",type:"tf",topic:"Obiettivi",q:"Gli obiettivi dei diversi reparti possono entrare in conflitto tra loro.",answer:!0,explain:"Ad esempio magazzini pieni (scorte) contro profitto (azionisti)."}]},{id:"u5l5",title:"Costi di transazione",icon:"\u{1F91D}",theory:[{title:"Perch\xE9 esistono le imprese? (Coase)",points:["**Ronald Coase** (*La natura dell\u2019impresa*, 1937; Nobel 1991). Due sistemi: il **mercato** (coordinato dai prezzi, orizzontale, scelte libere) e l\u2019**impresa** (gerarchica e pianificata, ordini di un capo).","Il maglione rosso: andare da pastore, tessitore e tintore costa troppo in tempo e risorse.","Ogni scambio di mercato ha un **costo di transazione**, legato all\u2019incertezza: i contratti sono sempre **incompleti**, non si possono prevedere tutte le circostanze (soprattutto nei servizi, come il lavoro).","Costi **prima** del contratto (raccolta informazioni, negoziazione) e **dopo** (esecuzione, eventuali vie legali).","Per ogni transazione si sceglie tra **make** (produzione interna) e **buy** (mercato)."]},{title:"Williamson: cosa genera i costi di transazione",points:["**1. Razionalit\xE0 limitata**: limiti fisici (non si raccolgono informazioni su tutti i fornitori del mondo) ed espressivi (non si riesce a trasmettere tutto ci\xF2 che si sa).","**2. Comportamenti opportunistici**: interesse proprio perseguito con l\u2019inganno. Manipolazione strategica di informazioni, false dichiarazioni di intenti. Pesano di pi\xF9 con piccoli numeri e contrattazioni ripetute.","**3. Blocco informativo**: informazione accessibile a una sola parte (vantaggio della prima mossa).","**4. Atmosfera**: il mercato pu\xF2 essere spietato, nell\u2019impresa c\u2019\xE8 pi\xF9 clima di squadra."]},{title:"Make or buy?",points:["I costi di transazione crescono con **specificit\xE0** degli investimenti (competenze non recuperabili altrove), **frequenza** degli scambi e **incertezza**: tutto spinge verso il **make**.","Ma internalizzare ha **costi di organizzazione interna** (coordinamento, controllo qualit\xE0 senza concorrenza): spingono verso il **buy**. Senza di essi avremmo un\u2019unica grande impresa.","Regola: se costi di transazione > costi di organizzazione interna \u2192 **make**; altrimenti \u2192 **buy**."]}],exercises:[{id:"u5-5-1",type:"mc",topic:"Coase",q:"Secondo Coase, perch\xE9 esistono le imprese?",options:["Perch\xE9 usare il mercato ha un costo: i costi di transazione","Perch\xE9 lo Stato impone di organizzare la produzione in imprese","Per sfruttare la mano invisibile del mercato","Perch\xE9 i prezzi di mercato sono sempre giusti e completi"],answer:0,explain:"Alcune relazioni conviene internalizzarle sotto la gerarchia di un capo."},{id:"u5-5-2",type:"match",topic:"Mercato e impresa",q:"Abbina ogni caratteristica al sistema di produzione",pairs:[["Coordinato dal meccanismo dei prezzi","Mercato"],["Sistema gerarchico e pianificato","Impresa"],["Scelte libere tra agenti","Mercato"],["Ordini di un capo","Impresa"]],explain:"\xC8 la distinzione di Coase (1937)."},{id:"u5-5-3",type:"tf",topic:"Contratti incompleti",q:"I contratti di mercato sono per natura incompleti: non si possono prevedere tutte le circostanze.",answer:!0,explain:"Da qui nasce l\u2019incertezza dello scambio e quindi il costo di transazione."},{id:"u5-5-4",type:"match",topic:"Williamson",q:"Abbina ogni caratteristica di Williamson al suo significato",pairs:[["Razionalit\xE0 limitata","Limiti fisici ed espressivi"],["Opportunismo","Interesse proprio perseguito con l\u2019inganno"],["Blocco informativo","Informazione accessibile a una sola parte"],["Atmosfera","Clima: spietato sul mercato, di squadra nell\u2019impresa"]],explain:"Sono le 4 caratteristiche dello scambio che generano costi di transazione."},{id:"u5-5-5",type:"mc",topic:"Make or buy",q:"Quale fattore spinge un\u2019impresa verso il make?",options:["Investimenti molto specifici e scambi frequenti","Costi di coordinamento interni elevati","Molti fornitori in concorrenza tra loro","Prestazioni semplici, standard e occasionali"],answer:0,explain:"Specificit\xE0, frequenza e incertezza fanno crescere i costi di transazione."},{id:"u5-5-6",type:"mc",topic:"Make or buy",q:"Da cosa dipende in ultimo la scelta tra make e buy?",options:["Dal confronto tra costi di transazione e costi interni","Dal prezzo di mercato del bene da acquistare","Dal numero di dipendenti dell\u2019impresa","Dalla tecnologia disponibile nel settore"],answer:0,explain:"Se i costi di transazione sono maggiori si internalizza, altrimenti si compra sul mercato."},{id:"u5-5-7",type:"mc",topic:"Make or buy",q:"Perch\xE9 non esiste un\u2019unica impresa che ha internalizzato tutto?",options:["Per i costi di organizzazione interna: coordinamento e controllo qualit\xE0","Perch\xE9 l\u2019antitrust vieta alle imprese di crescere oltre una soglia","Perch\xE9 i costi di transazione sono sempre nulli","Perch\xE9 la mano invisibile divide la produzione tra molte imprese"],answer:0,explain:"Senza concorrenza i controlli di qualit\xE0 costano; con grandi numeri crescono i costi di coordinamento."},{id:"u5-5-8",type:"mc",topic:"Specificit\xE0",q:"Un lavoratore esterno ha acquisito competenze utili solo nella tua impresa. Cosa succede al rinnovo del contratto?",options:["Cresce il potere contrattuale di entrambi: conviene internalizzare","Il lavoratore non ha alcun potere: pu\xF2 essere sostituito subito","Il contratto si rinnova automaticamente e senza alcun costo","Conviene sempre comprare la prestazione sul mercato"],answer:0,explain:"Investimenti specifici non recuperabili creano dipendenza reciproca e costi di negoziazione."},{id:"u5-5-9",type:"order",topic:"Costi di transazione",q:"Ordina i momenti in cui compaiono i costi di transazione",items:["Raccolta delle informazioni","Negoziazione dell\u2019accordo","Esecuzione del contratto","Eventuali vie legali per mancata esecuzione"],explain:"Ci sono costi prima e dopo la stipula del contratto."},{id:"u5-5-10",type:"tf",topic:"Opportunismo",q:"I comportamenti opportunistici creano maggiori costi di transazione quando gli attori sono pochi e le contrattazioni ripetute.",answer:!0,explain:"In quel caso pu\xF2 convenire internalizzare."}]},{id:"u5l6",title:"Agenzia e strutture organizzative",icon:"\u{1F5C2}\uFE0F",theory:[{title:"La teoria dell\u2019agenzia",points:["Il **principale** affida un\u2019attivit\xE0 all\u2019**agente**; gli interessi divergono e il principale non pu\xF2 controllare direttamente l\u2019agente (dipendente e datore, manager e propriet\xE0).","**Selezione avversa** (informazione nascosta, prima del contratto): il principale non pu\xF2 verificare qualit\xE0 e capacit\xE0. **Mercato dei bidoni**: non riconoscendo la qualit\xE0 delle auto usate, si paga un prezzo medio e restano solo le auto peggiori.","**Azzardo morale** (azione nascosta, dopo il contratto): l\u2019agente agisce in modo opportunistico. **Assicurazione dentistica**: ci si assicura e poi si rif\xE0 l\u2019arcata da 10.000 \u20AC; le rate salgono e restano solo gli assicurati peggiori."]},{title:"Le strutture organizzative",points:["Nessuna \xE8 migliore in assoluto: ognuna riduce costi di agenzia e coordinamento in certe condizioni.","**U (funzionale)**: monoprodotto, piccole, mercati stabili. Prevalente fino al 1850. + specializzazione ed economie di scala nei reparti. \u2212 direzione sommersa da decisioni operative, lentezza davanti agli shock, poco tempo per strategie, difficile valutare i reparti, enfasi sulla produzione. Cambia tutto con navi a vapore, ferrovie e telegrafo.","**M (multidivisionale)**: multiprodotto o multimercato; divisioni per prodotto o area, con manager autonomi. + direzione libera per strategie di lungo periodo, risultati misurabili. Serve il giusto decentramento: troppo = azzardo morale, poco = congestione. \u2212 coordinamento tra divisioni.","**M per gruppi**: per imprese multiprodotto e multiregione, divisioni con problematiche comuni.","**A matrice**: imprese a commessa o in transizione da U a M; due livelli di direzione (funzioni e progetti). + flessibilit\xE0 ed economie di scala. \u2212 doppio comando, indicazioni contrastanti, frustrazione, disordine.","**A portafoglio (holding)**: grandissime imprese molto diversificate; la casa madre ha partecipazioni in sussidiarie autonome. + facile comprare o vendere, diversa allocazione del rischio."]}],exercises:[{id:"u5-6-1",type:"mc",topic:"Selezione avversa",q:"Il \u201Cmercato dei bidoni\u201D delle auto usate \xE8 un esempio di\u2026",options:["selezione avversa: informazione nascosta","azzardo morale: azione nascosta dopo il contratto","esternalit\xE0 di rete tra compratori di auto usate","economie di scala dei grandi concessionari"],answer:0,explain:"Non potendo valutare la qualit\xE0, il compratore paga poco e le auto migliori escono dal mercato."},{id:"u5-6-2",type:"mc",topic:"Azzardo morale",q:"Dopo aver stipulato l\u2019assicurazione dentistica ti rifai l\u2019arcata da 10.000 \u20AC. \xC8\u2026",options:["azzardo morale: azione nascosta dopo il contratto","selezione avversa: informazione nascosta prima del contratto","un costo di transazione sostenuto prima del contratto","rent seeking per ottenere un vantaggio dall\u2019assicuratore"],answer:0,explain:"L\u2019agente agisce in modo opportunistico contro l\u2019interesse del principale dopo l\u2019accordo."},{id:"u5-6-3",type:"match",topic:"Agenzia",q:"Abbina ogni concetto",pairs:[["Selezione avversa","Informazione nascosta"],["Azzardo morale","Azione nascosta"],["Principale","Chi affida l\u2019attivit\xE0"],["Agente","Chi svolge l\u2019attivit\xE0"]],explain:"In entrambi i problemi l\u2019agente nasconde qualcosa al principale."},{id:"u5-6-4",type:"match",topic:"Strutture organizzative",q:"Abbina ogni struttura all\u2019impresa adatta",pairs:[["Forma U","Piccola, monoprodotto, mercato stabile"],["Forma M","Multiprodotto o su mercati diversi"],["A matrice","A commessa o in transizione da U a M"],["A portafoglio","Grandissima e molto diversificata"]],explain:"Nessuna struttura \xE8 migliore in assoluto."},{id:"u5-6-5",type:"mc",topic:"Forma U",q:"Quale di questi \xE8 uno svantaggio della forma funzionale (U)?",options:["La direzione \xE8 sommersa da decisioni operative e reagisce lentamente agli shock","Non permette economie di scala nei singoli reparti funzionali","I manager di divisione hanno troppa autonomia e rischio di azzardo morale","C\u2019\xE8 un doppio livello manageriale con indicazioni contrastanti"],answer:0,explain:"Altri svantaggi: poco tempo per le strategie, difficolt\xE0 a valutare i reparti, enfasi sulla produzione."},{id:"u5-6-6",type:"mc",topic:"Forma U",q:"Quali invenzioni hanno messo in crisi la forma U, prevalente fino al 1850?",options:["Navi a vapore, ferrovie e telegrafo","Internet e smartphone","Catena di montaggio e motore elettrico","Stampa e bussola"],answer:0,explain:"Hanno reso raggiungibili a costi molto pi\xF9 bassi mercati diversi."},{id:"u5-6-7",type:"mc",topic:"Forma M",q:"Cosa succede se in una forma M si decentra troppo?",options:["Pericolo di azzardo morale","Congestione della direzione","Perdita di economie di scala","Selezione avversa"],answer:0,explain:"Se si decentra troppo poco, invece, non si risolve la congestione della direzione."},{id:"u5-6-8",type:"tf",topic:"Struttura a matrice",q:"La struttura a matrice ha due livelli di direzione: uno per le funzioni e uno per i progetti o prodotti.",answer:!0,explain:"D\xE0 flessibilit\xE0 ma crea doppio comando, indicazioni contrastanti e frustrazione nello staff."},{id:"u5-6-9",type:"mc",topic:"Holding",q:"Qual \xE8 un vantaggio della struttura a portafoglio (holding)?",options:["Facile rimodulazione: se una sussidiaria va male la si vende","Massima centralizzazione delle decisioni nella casa madre","Nessun bisogno di manager nelle sussidiarie","Economie di scala nei reparti funzionali comuni"],answer:0,explain:"Inoltre permette una diversa allocazione del rischio d\u2019impresa."},{id:"u5-6-10",type:"fill",topic:"Forma M",text:"Nella forma M la direzione si concentra sulle strategie di ___ periodo e i risultati delle singole ___ sono pi\xF9 facilmente misurabili.",answers:["lungo","divisioni"],extra:["breve","funzioni"],explain:"Le divisioni hanno al loro interno le varie funzioni e manager con autonomia decisionale."}]}],open:[{id:"u5-o1",q:"Che cos\u2019\xE8 un\u2019impresa e come si \xE8 evoluta storicamente?",answer:"\xC8 un\u2019istituzione economica che si occupa di produzione e scambio di beni e servizi attraverso componenti organizzative interne e legami esterni. Prima l\u2019impresa artigiana nell\u2019et\xE0 dei comuni (l\u2019artigiano \xE8 imprenditore, lavoratore e direttore); poi dal XIII secolo l\u2019impresa mercantile, con il mercante che si assume tutto il rischio dei commerci oltremare; infine l\u2019impresa industriale e capitalistica della Rivoluzione industriale, con la separazione tra proprietari dei mezzi di produzione e operai.",keywords:["istituzione","organizzative","artigiana","mercantile","industriale"]},{id:"u5-o2",q:"Come si determina il prezzo secondo Smith, Jevons e Marshall?",answer:"Per Adam Smith conta l\u2019offerta: il prezzo \xE8 il costo pi\xF9 un mark-up di profitto. Per Jevons conta la domanda: il valore dipende dall\u2019utilit\xE0 che ne trae chi acquista. Per Marshall prezzo e quantit\xE0 sono determinati congiuntamente dall\u2019incontro tra domanda e offerta.",keywords:["Smith","mark-up","Jevons","utilit\xE0","Marshall","incontro"]},{id:"u5-o3",q:"Spiega l\u2019esempio del marziano di Herbert Simon.",answer:"Un marziano osserva la Terra con un telescopio che mostra le strutture sociali. Secondo la teoria neoclassica vedrebbe punti collegati da un fitto network di linee rosse (il mercato). In realt\xE0 vedrebbe grandi aree verdi, le organizzazioni, collegate da linee rosse, perch\xE9 quasi tutti lavorano dentro organizzazioni. La rappresentazione atomistica \xE8 fuorviante perch\xE9 trascura ci\xF2 che avviene dentro l\u2019impresa.",keywords:["marziano","aree verdi","organizzazioni","atomistic","dentro"]},{id:"u5-o4",q:"Illustra le quattro aree di critica alla teoria neoclassica dell\u2019impresa.",answer:"Obiettivi: il massimo profitto non \xE8 raggiungibile, la separazione tra propriet\xE0 e controllo porta a pi\xF9 obiettivi e a un profitto soddisfacente. Complessit\xE0 organizzativa: l\u2019impresa non \xE8 atomistica e antropomorfa ma gerarchica, con asimmetrie informative e stakeholder. Incertezza e informazione: niente informazione perfetta, shock imprevedibili, razionalit\xE0 limitata. Processo decisionale: si usano convenzioni come costo medio pi\xF9 markup e l\u2019imprenditore \xE8 centrale nell\u2019innovazione.",keywords:["obiettivi","complessit\xE0","incertezza","razionalit\xE0 limitata","processo decisionale","markup"]},{id:"u5-o5",q:"Come difendono la teoria neoclassica Friedman, Machlup e Alchian?",answer:"Friedman: una scienza deve fornire previsioni accurate, non descrivere perfettamente la realt\xE0; la teoria prevede bene il comportamento delle imprese. Machlup: i decisori tendono intuitivamente al massimo profitto, come il guidatore che non conosce il motore ma arriva a destinazione. Alchian: interpretazione darwinista, sopravvivono le imprese che massimizzano il profitto, ma non \xE8 confermata empiricamente.",keywords:["Friedman","previsioni","Machlup","guidatore","Alchian","darwinista"]},{id:"u5-o6",q:"Descrivi la grande impresa americana, il taylorismo e il fordismo.",answer:"Inizio \u2019900: consumi di massa e grande impresa verticalmente integrata, con molti prodotti, lavoratori, fasi, reparti specializzati e gerarchie. Taylorismo: organizzazione scientifica del lavoro con scomposizione e parcellizzazione delle fasi, misura di tempi e metodi, catena di montaggio. Fordismo: produzione di massa standardizzata (Ford T nera), economie di scala, grandi scorte, citt\xE0 operaie, rete di fornitori attorno alla grande impresa.",keywords:["verticalmente integrata","consumi di massa","taylorismo","catena di montaggio","fordismo","standardizz"]},{id:"u5-o7",q:"Cosa sostengono le teorie manageriali? Cita Berle e Means, Chandler e Williamson.",answer:"Studiano il ruolo dei manager nato dalla separazione tra propriet\xE0 e controllo: con la quotazione in borsa la propriet\xE0 si diffonde e il potere passa ai manager. Berle e Means documentano la perdita di controllo dei proprietari (nel 1966 nell\u201985% delle grandi imprese nessuno superava il 5%). Chandler vede anche un\u2019opportunit\xE0: le imprese migliori hanno investito in manager specializzati. Williamson mostra che i manager massimizzano la loro utilit\xE0 con spese discrezionali invece di distribuire dividendi.",keywords:["propriet\xE0","controllo","Berle","85%","Chandler","Williamson","discrezionali"]},{id:"u5-o8",q:"Come si pu\xF2 limitare la discrezionalit\xE0 dei manager?",answer:"Legando la retribuzione alla performance d\u2019impresa e ai dividendi; con la minaccia di takeover, cio\xE8 un\u2019OPA se il valore delle azioni scende troppo, che porterebbe a sostituire il management; con il vincolo dei finanziatori esterni, che hanno un ruolo ambivalente: pi\xF9 disciplina finanziaria ma rischio di scelte di breve periodo.",keywords:["retribuzione","performance","takeover","OPA","finanziatori","ambivalente"]},{id:"u5-o9",q:"Spiega le teorie comportamentali e i cinque obiettivi di Cyert e March.",answer:"L\u2019impresa non \xE8 un\u2019unit\xE0 omogenea e non ha obiettivi propri: ci sono molti stakeholder interni ed esterni con diversa capacit\xE0 di voice. Il comportamento nasce da negoziazione e conflitto. Cyert e March individuano cinque obiettivi: produzione (reparto produzione), scorte (produzione e commerciale), vendite (commerciale), quote di mercato (management), profitto (azionisti). In razionalit\xE0 limitata si punta a un profitto soddisfacente.",keywords:["omogenea","stakeholder","voice","Cyert","cinque","soddisfacente"]},{id:"u5-o10",q:"Cos\u2019\xE8 la razionalit\xE0 limitata e perch\xE9 conta nell\u2019impresa?",answer:"Concetto di Herbert Simon: nessun individuo o gruppo ha informazioni complete, perch\xE9 la capacit\xE0 di immagazzinare informazioni \xE8 limitata e ognuno conosce soprattutto ci\xF2 che fa (learning by doing). Nell\u2019impresa le decisioni sono influenzate dalle diverse percezioni e dalla capacit\xE0 di organizzarsi degli attori, e diventano esito di conflitti e negoziazioni, non di un processo razionale.",keywords:["Simon","informazioni complete","immagazzinare","learning by doing","negoziazion"]},{id:"u5-o11",q:"Spiega la teoria dei costi di transazione di Coase.",answer:"Coase (1937) distingue il mercato, coordinato dai prezzi e orizzontale, e l\u2019impresa, gerarchica e pianificata. Le imprese esistono perch\xE9 usare il mercato costa: ogni scambio ha un costo di transazione legato all\u2019incertezza, perch\xE9 i contratti sono incompleti. Ci sono costi prima (informazioni, negoziazione) e dopo il contratto (esecuzione, vie legali). Per ogni transazione si sceglie tra make e buy (esempio del maglione rosso).",keywords:["Coase","mercato","gerarchic","costo di transazione","incompleti","make","buy"]},{id:"u5-o12",q:"Quali caratteristiche dello scambio generano costi di transazione secondo Williamson?",answer:"Razionalit\xE0 limitata (limiti fisici ed espressivi); comportamenti opportunistici (manipolazione strategica delle informazioni e false dichiarazioni di intenti, pi\xF9 gravi con pochi attori e contrattazioni ripetute); blocco informativo (informazione accessibile a una sola parte, legata al vantaggio della prima mossa); atmosfera (il mercato pu\xF2 essere spietato, l\u2019impresa offre un clima di squadra).",keywords:["razionalit\xE0 limitata","opportunistic","blocco informativo","atmosfera"]},{id:"u5-o13",q:"Da cosa dipende la scelta make or buy?",answer:"I costi di transazione aumentano con la specificit\xE0 degli investimenti (competenze non recuperabili altrove), la frequenza degli scambi e l\u2019incertezza: questo spinge verso il make. Ma internalizzare comporta costi di organizzazione interna (coordinamento con grandi numeri, controllo qualit\xE0 senza concorrenza) che spingono verso il buy. Si internalizza se i costi di transazione superano i costi di organizzazione interna, altrimenti si compra sul mercato.",keywords:["specificit\xE0","frequenza","incertezza","organizzazione interna","confronto"]},{id:"u5-o14",q:"Spiega selezione avversa e azzardo morale con esempi.",answer:"Nella teoria dell\u2019agenzia il principale affida un\u2019attivit\xE0 all\u2019agente senza poterlo controllare. Selezione avversa: informazione nascosta prima del contratto; nel mercato dei bidoni non si riconosce la qualit\xE0 delle auto usate e restano sul mercato solo le peggiori. Azzardo morale: azione nascosta dopo il contratto; chi si assicura per i denti e poi si rif\xE0 l\u2019arcata da 10.000 \u20AC fa salire le rate, e restano assicurati solo i casi peggiori.",keywords:["principale","agente","informazione nascosta","bidoni","azione nascosta","assicura"]},{id:"u5-o15",q:"Confronta le strutture organizzative U, M, a matrice e a portafoglio.",answer:"U funzionale: piccole imprese monoprodotto in mercati stabili; specializzazione ed economie di scala, ma direzione congestionata, lentezza e difficolt\xE0 a valutare i reparti. M multidivisionale: imprese multiprodotto o multimercato, divisioni autonome; la direzione pensa al lungo periodo e i risultati sono misurabili, ma serve il giusto decentramento. A matrice: commesse o transizione da U a M, doppio livello manageriale; flessibile ma con indicazioni contrastanti. A portafoglio: holding molto diversificate con sussidiarie autonome; facile comprare e vendere e ripartire il rischio.",keywords:["funzionale","monoprodotto","multidivisionale","decentramento","matrice","holding"]}],cards:[{id:"u5-c1",front:"Impresa (definizione)",back:"Istituzione economica di produzione e scambio, con componenti organizzative interne e legami esterni."},{id:"u5-c2",front:"Mano invisibile",back:"Adam Smith: l\u2019egoismo individuale si traduce in benessere collettivo."},{id:"u5-c3",front:"Smith / Jevons / Marshall",back:"Offerta (costo + mark-up) / domanda (utilit\xE0) / incontro tra domanda e offerta."},{id:"u5-c4",front:"Marziano di Simon",back:"Vedrebbe grandi aree verdi (organizzazioni), non punti isolati: la visione atomistica \xE8 fuorviante."},{id:"u5-c5",front:"4 critiche alla teoria neoclassica",back:"Obiettivi, complessit\xE0 organizzativa, incertezza e informazione, processo decisionale."},{id:"u5-c6",front:"Friedman",back:"La scienza deve prevedere, non descrivere."},{id:"u5-c7",front:"Machlup",back:"Il guidatore non conosce il motore ma arriva dove vuole."},{id:"u5-c8",front:"Alchian",back:"Darwinismo: sopravvivono le imprese che massimizzano il profitto (non confermato)."},{id:"u5-c9",front:"Taylorismo",back:"Organizzazione scientifica del lavoro: fasi parcellizzate, tempi e metodi, catena di montaggio."},{id:"u5-c10",front:"Fordismo",back:"Produzione di massa standardizzata, economie di scala, grandi scorte."},{id:"u5-c11",front:"Berle e Means",back:"Separazione propriet\xE0-controllo; 1966: nell\u201985% delle grandi imprese nessuno > 5%."},{id:"u5-c12",front:"Williamson (1963)",back:"I manager massimizzano la propria utilit\xE0 con spese discrezionali."},{id:"u5-c13",front:"Cyert e March",back:"5 obiettivi: produzione, scorte, vendite, quote di mercato, profitto."},{id:"u5-c14",front:"Profitto soddisfacente",back:"Copre i costi e mantiene i rapporti con gli stakeholder (teorie comportamentali)."},{id:"u5-c15",front:"Coase (1937)",back:"Le imprese esistono perch\xE9 usare il mercato ha costi di transazione."},{id:"u5-c16",front:"Contratti incompleti",back:"Non si possono prevedere tutte le circostanze: fonte dei costi di transazione."},{id:"u5-c17",front:"Make or buy",back:"Make se costi di transazione > costi di organizzazione interna."},{id:"u5-c18",front:"Selezione avversa",back:"Informazione nascosta (mercato dei bidoni)."},{id:"u5-c19",front:"Azzardo morale",back:"Azione nascosta dopo il contratto (assicurazione dentistica)."},{id:"u5-c20",front:"Forma U",back:"Funzionale: piccole imprese monoprodotto, mercati stabili."},{id:"u5-c21",front:"Forma M",back:"Multidivisionale: divisioni per prodotto o area con manager autonomi."},{id:"u5-c22",front:"Struttura a matrice",back:"Due livelli di direzione: funzioni e progetti."}]},w0=qz;var Cz={id:"u6",n:6,title:"Variet\xE0 dei capitalismi",subtitle:"Gruppi e forme di impresa nel mondo",color:"#EC4899",colorDark:"#C42A78",lessons:[{id:"u6l1",title:"Gli Zaibatsu",icon:"\u{1F3EF}",theory:[{title:"Oltre il caso anglosassone",points:["Il caso americano non \xE8 l\u2019unica traiettoria di sviluppo. Tra mercato e impresa verticalmente integrata ci sono molte sfumature, e in ogni sistema coesistono forme diverse con intensit\xE0 diverse (Italia: PMI e lavoratori in proprio; Cina: imprese di Stato, SOEs).","Si studiano: **gruppi di imprese** (Zaibatsu e Keiretsu in Giappone, Chaebol in Corea del Sud), **forme di impresa** (pubblica, cooperativa, sociale, multinazionale), **sistemi di imprese** (cluster, distretti, reti, catene globali del valore).","Nel caso giapponese l\u2019unit\xE0 di analisi non \xE8 pi\xF9 l\u2019impresa ma il **gruppo di imprese**."]},{title:"Gli Zaibatsu",points:["ZAI (benessere) + BATSU (famiglia potente): \u201Cricchezza prodotta da potenti famiglie\u201D. Grandi gruppi controllati da una **famiglia**, con stretti legami con lo **Stato**, con affiliate in molti settori.","Nascono con la **Rivoluzione Meiji (1868)**: l\u2019imperatore modernizza un paese agricolo e arretrato alleandosi con le famiglie ricche. Lo Stato crea domanda (anche bellica): diventano campioni delle esportazioni e motori del **catching-up**.","Struttura **piramidale**: la famiglia possiede una holding che controlla le sussidiarie; controllo e propriet\xE0 coincidono.","**Big Four**: Mitsubishi, Mitsui, Sumitomo, Yasuda. Settori: industria pesante (per gli armamenti), trasporto marittimo e commercio. Ruolo centrale delle banche: nel **1944** le banche delle Big Four controllavano il **75%** dei prestiti."]},{title:"Differenze con la grande impresa USA",points:["1. **Controllo familiare** della propriet\xE0 (non azionariato diffuso).","2. Management nominato dalla famiglia per **capacit\xE0 e lealt\xE0**.","3. Strategie legate agli **interessi nazionali**.","4. **Acquisti e vendite centralizzati** in compagnie affiliate; prezzi interni al gruppo pi\xF9 bassi.","5. **Credito** solo dalla banca del gruppo (cessioni azionarie solo in casi eccezionali, come la crisi del 1929)."]}],exercises:[{id:"u6-1-1",type:"mc",topic:"Zaibatsu",q:"Cosa significa \u201CZaibatsu\u201D?",options:["Ricchezza prodotta da potenti famiglie","Rete senza testa","Ricchezza prodotta da una famiglia","Grande impresa di Stato"],answer:0,explain:"ZAI = benessere, BATSU = famiglia potente. \u201CRete senza testa\u201D \xE8 il Keiretsu."},{id:"u6-1-2",type:"mc",topic:"Zaibatsu",q:"Con quale evento nascono gli Zaibatsu?",options:["La Rivoluzione Meiji del 1868","La fine della Seconda guerra mondiale","La guerra di Corea","La crisi del 1929"],answer:0,explain:"L\u2019imperatore modernizza il Giappone alleandosi con le famiglie ricche."},{id:"u6-1-3",type:"tf",topic:"Zaibatsu",q:"Negli Zaibatsu propriet\xE0 e controllo coincidono, nelle mani della famiglia.",answer:!0,explain:"Struttura piramidale: famiglia \u2192 holding \u2192 sussidiarie."},{id:"u6-1-4",type:"mc",topic:"Big Four",q:"Quali sono le Big Four degli Zaibatsu?",options:["Mitsubishi, Mitsui, Sumitomo, Yasuda","Toyota, Nissan, Honda, Sony","Samsung, Hyundai, LG, SK","Fuyo, Sanwa, Dai Ichi Kangyo, Mitsui"],answer:0,explain:"Supportano anche lo sforzo imperiale del Giappone in Corea e Cina."},{id:"u6-1-5",type:"num",topic:"Zaibatsu",q:"Nel 1944, quale percentuale dei prestiti totali controllavano le banche delle Big Four?",answer:75,tol:0,unit:"%",explain:"Il finanziamento passa dalla banca del gruppo, non dal mercato azionario come negli USA."},{id:"u6-1-6",type:"mc",topic:"Catching-up",q:"Cos\u2019\xE8 il catching-up di cui gli Zaibatsu sono protagonisti?",options:["La rincorsa verso i tassi di crescita dei paesi pi\xF9 avanzati","L\u2019acquisizione ostile di imprese straniere","Il crollo delle esportazioni dopo la guerra","Il passaggio dal fordismo ai distretti industriali"],answer:0,explain:"Lo Stato sostiene gli Zaibatsu per industrializzare il paese."},{id:"u6-1-7",type:"mc",topic:"Zaibatsu e USA",q:"Quale di queste \xE8 una differenza tra Zaibatsu e grande impresa statunitense?",options:["Le sussidiarie devono finanziarsi presso la banca del gruppo","Gli Zaibatsu hanno un azionariato diffuso tra molti piccoli risparmiatori","I manager degli Zaibatsu sono scelti dal mercato del lavoro manageriale","Gli Zaibatsu non hanno legami con lo Stato e con l\u2019imperatore"],answer:0,explain:"Il credito avviene in un contesto di coordinamento interno al gruppo, non di mercato."},{id:"u6-1-8",type:"fill",topic:"Zaibatsu",text:"Negli Zaibatsu il management \xE8 scelto dalla famiglia in base a capacit\xE0 e ___; acquisti e vendite sono ___.",answers:["lealt\xE0","centralizzati"],extra:["anzianit\xE0","decentrati"],explain:"I prezzi interni al gruppo sono diversi (e inferiori) rispetto a quelli per l\u2019esterno."}]},{id:"u6l2",title:"I Keiretsu",icon:"\u{1F5FE}",theory:[{title:"Da Zaibatsu a Keiretsu",points:["Dopo la Seconda guerra mondiale il Giappone \xE8 a **sovranit\xE0 limitata**. Il **piano McArthur** vuole smantellare gli Zaibatsu: su **83**, solo **19** vengono smantellati (e poi trasformati in Keiretsu).","Le **banche** non vengono toccate. Con la **Guerra fredda** il Giappone diventa alleato strategico degli USA e deve prosperare.","KEI (serie) + RETSU (linea): \u201C**rete senza testa**\u201D. Gruppi di grandi imprese collegati a una **banca** che fa da finanziatore e guida, con **azionariato incrociato**. Sparisce il ruolo della famiglia."]},{title:"Orizzontali e verticali",points:["**Orizzontali** (Big Six: Mitsui, Mitsubishi, Sumitomo, Fuyo, Sanwa, Dai Ichi Kangyo): imprese di settori diversi, indipendenti ma fortemente cooperative, unite da incroci azionari con la banca.","**Verticali** (Toyota, Nissan, Honda, Hitachi, Toshiba, Sony): integrano l\u2019intera **filiera** di un settore. I fornitori di 2\xB0 e 3\xB0 livello lavorano in esclusiva per la casa madre, che \xE8 **monopsonista**: ottiene prezzi e qualit\xE0 migliori, mentre i costi si scaricano sui piccoli fornitori."]},{title:"Confronti e bilancio",points:["**Rispetto agli Zaibatsu**: conta la banca, non la holding familiare; partecipazioni incrociate che rendono difficili gli **hostile takeover**; acquisti interni al gruppo; interesse nazionale ma orientato a **innovazione** e catching-up, non a colonie ed esercito.","**Rispetto alla grande impresa USA**: credito solo ai membri; azionariato stabile e competente (meno asimmetrie con i manager); dipendenti legati da partecipazioni; rete di contatti continua tra propriet\xE0 e management.","**Bilancio del caso giapponese**: propriet\xE0 e controllo incrociati; grandi dimensioni con flessibilit\xE0 produttiva (galassia di PMI) ma anche fragilit\xE0; dipendenza da pochi gruppi, rigidit\xE0 e scarsa mobilit\xE0 sociale; legame stretto con lo Stato utile al catching-up ma con rischi di corruzione."]}],exercises:[{id:"u6-2-1",type:"mc",topic:"Keiretsu",q:"Cosa significa \u201CKeiretsu\u201D?",options:["Rete senza testa","Ricchezza prodotta da potenti famiglie","Impresa di Stato","Gruppo familiare"],answer:0,explain:"KEI = serie, RETSU = linea."},{id:"u6-2-2",type:"num",topic:"Piano McArthur",q:"Il piano McArthur prevedeva lo smantellamento degli Zaibatsu. Su 83, quanti furono effettivamente smantellati?",answer:19,tol:0,explain:"E furono poi trasformati in Keiretsu: con la Guerra fredda serviva un Giappone prospero."},{id:"u6-2-3",type:"mc",topic:"Keiretsu",q:"Chi guida e finanzia un Keiretsu?",options:["Una banca, con azionariato incrociato tra le imprese","Una famiglia, tramite una holding a struttura piramidale","Lo Stato giapponese, tramite il ministero dell\u2019industria","Il mercato azionario, con molti piccoli azionisti"],answer:0,explain:"La banca sostituisce la famiglia e diventa centrale nell\u2019industrializzazione del dopoguerra."},{id:"u6-2-4",type:"match",topic:"Keiretsu",q:"Abbina ogni Keiretsu al suo tipo",pairs:[["Toyota","Verticale"],["Mitsubishi","Orizzontale"],["Sony","Verticale"],["Fuyo","Orizzontale"]],explain:"Orizzontali: settori diversi intorno a una banca. Verticali: intera filiera di un settore.",profNote:"Negli appunti due delle Big Six sono scritte \u201CSanyo\u201D e \u201CDai Ichi Kango\u201D: i nomi corretti sono Sanwa e Dai-Ichi Kangyo."},{id:"u6-2-5",type:"mc",topic:"Keiretsu verticali",q:"Nei Keiretsu verticali la casa madre \xE8 monopsonista. Cosa comporta?",options:["Prezzi migliori per lei, costi scaricati sui piccoli fornitori","Sono i fornitori a fissare i prezzi alla casa madre","La casa madre ha un solo fornitore per ogni componente","La casa madre non ha rapporti stabili con i fornitori"],answer:0,explain:"I fornitori di 2\xB0 e 3\xB0 livello producono solo per la casa madre e competono tra loro."},{id:"u6-2-6",type:"tf",topic:"Keiretsu",q:"Le partecipazioni azionarie incrociate rendono pi\xF9 difficili le acquisizioni ostili.",answer:!0,explain:"Acquisire una delle imprese non significa acquisire tutto il Keiretsu."},{id:"u6-2-7",type:"mc",topic:"Keiretsu e USA",q:"Perch\xE9 nei Keiretsu ci sono meno asimmetrie informative con i manager rispetto agli USA?",options:["Azionisti stabili e competenti, in contatto continuo","Perch\xE9 i manager sono tutti membri della famiglia proprietaria","Perch\xE9 nei Keiretsu non esistono manager professionisti","Perch\xE9 le imprese dei Keiretsu sono piccole e semplici"],answer:0,explain:"Anche i dipendenti sono vincolati tramite partecipazioni: meno conflitti tra propriet\xE0, controllo e lavoro."},{id:"u6-2-8",type:"mc",topic:"Caso giapponese",q:"Quale di questi \xE8 un aspetto negativo del sistema dei gruppi giapponesi?",options:["Rigidit\xE0 e scarsa mobilit\xE0 sociale: difficile l\u2019ingresso di nuovi attori innovativi","Troppa concorrenza tra le piccole imprese fornitrici","Assenza di banche in grado di finanziare le imprese","Mancanza di legami con lo Stato e con gli interessi nazionali"],answer:0,explain:"Ha anche effetti depressivi sul tasso di natalit\xE0 delle imprese."},{id:"u6-2-9",type:"match",topic:"Zaibatsu e Keiretsu",q:"Abbina ogni caratteristica",pairs:[["Holding a controllo familiare","Zaibatsu"],["Banca come guida del gruppo","Keiretsu"],["Obiettivi coloniali e militari","Zaibatsu"],["Focus su innovazione ed export","Keiretsu"]],explain:"In entrambi si privilegiano gli acquisti interni al gruppo."}]},{id:"u6l3",title:"I Chaebol coreani",icon:"\u{1F1F0}\u{1F1F7}",theory:[{title:"Nascita e Stato",points:["\u201C**Ricchezza prodotta da una famiglia**\u201D. Gruppi di imprese formalmente indipendenti (**nessuna holding**) ma sotto il controllo amministrativo e finanziario di una famiglia legata allo Stato.","Fine anni \u201950: economia frammentata e agricola. Eredit\xE0 del colonialismo giapponese, si sviluppano dopo la **guerra di Corea (1950-1953)** con il programma di industrializzazione del **governo Park**: grandi conglomerati dall\u2019industria pesante alla finanza e alla cantieristica.","Lo Stato sostiene poche famiglie (prestiti, sussidi, appalti) ma **monitora le performance**: i sussidi dipendono dal raggiungimento di obiettivi di sviluppo."]},{title:"Organizzazione, luci e ombre",points:["Diversamente dai Keiretsu (manager competenti e specializzati), propriet\xE0 e controllo sono affidati a **familiari** e persone vicine; management scelto per **lealt\xE0**; successione rigida **da padre in figlio**.","Decisioni veloci, ma rigidit\xE0 e **concentrazione del potere** in un circolo di \u201Coligarchi\u201D.","Oggi campioni dell\u2019export di beni di consumo di massa (elettronica, automotive), molto innovativi grazie al **learning by exporting**.","I chaebol vendono l\u2019**84,3%** della produzione del paese. Salari pi\xF9 alti, ma turni massacranti."]}],exercises:[{id:"u6-3-1",type:"mc",topic:"Chaebol",q:"Cosa significa \u201CChaebol\u201D?",options:["Ricchezza prodotta da una famiglia","Rete senza testa","Ricchezza prodotta da potenti famiglie","Conglomerato statale"],answer:0,explain:"Una sola famiglia, mentre gli Zaibatsu erano \u201Cpotenti famiglie\u201D."},{id:"u6-3-2",type:"tf",topic:"Chaebol",q:"I Chaebol sono organizzati attorno a una holding, come gli Zaibatsu.",answer:!1,explain:"Sono imprese formalmente indipendenti, senza holding, ma controllate da una famiglia."},{id:"u6-3-3",type:"mc",topic:"Chaebol",q:"Dopo quale evento si sviluppano i Chaebol?",options:["La guerra di Corea (1950-1953) e il programma del governo Park","La Rivoluzione Meiji e la modernizzazione imperiale","La crisi finanziaria asiatica e il crollo delle banche","La Rivoluzione industriale inglese e i commerci con l\u2019Europa"],answer:0,explain:"L\u2019industrializzazione procede tramite grandi conglomerati sostenuti dallo Stato."},{id:"u6-3-4",type:"mc",topic:"Chaebol e Stato",q:"Cosa distingue il sostegno statale ai Chaebol?",options:["Lo Stato monitora le performance e lega i sussidi al raggiungimento di obiettivi","Lo Stato concede sussidi senza alcuna condizione","Lo Stato possiede direttamente le imprese dei gruppi","Lo Stato vieta le esportazioni per proteggere il mercato interno"],answer:0,explain:"Le burocrazie pubbliche valutano le performance per assicurare standard rilevanti per lo sviluppo."},{id:"u6-3-5",type:"num",topic:"Chaebol",q:"Quale percentuale della produzione della Corea del Sud vendono oggi i Chaebol?",answer:84.3,tol:.1,unit:"%",explain:"Dato degli appunti: 84,3%."},{id:"u6-3-6",type:"match",topic:"Gruppi a confronto",q:"Abbina ogni gruppo alla scelta del management",pairs:[["Chaebol","Familiari e lealt\xE0, successione da padre in figlio"],["Keiretsu","Manager competenti e specializzati"],["Zaibatsu","Scelti dalla famiglia per capacit\xE0 e lealt\xE0"]],explain:"Nei Chaebol il controllo familiare \xE8 il pi\xF9 stretto."},{id:"u6-3-7",type:"mc",topic:"Chaebol",q:"Quale vantaggio d\xE0 il controllo stretto della famiglia nei Chaebol?",options:["Velocit\xE0 nelle decisioni","Maggiore mobilit\xE0 sociale","Pi\xF9 concorrenza","Azionariato diffuso"],answer:0,explain:"Ma crea rigidit\xE0 e concentrazione del potere in un gruppo ristrettissimo."},{id:"u6-3-8",type:"tf",topic:"Chaebol",q:"I Chaebol sono molto innovativi anche grazie al learning by exporting.",answer:!0,explain:"Confrontandosi con il mercato internazionale apprendono nuove strategie."}]},{id:"u6l4",title:"L\u2019impresa pubblica",icon:"\u{1F3DB}",theory:[{title:"Cos\u2019\xE8",points:["Impresa posseduta o controllata da autorit\xE0 di governo. **Impresa pubblica**: posseduta dallo Stato e soggetta al diritto pubblico. **Societ\xE0 a controllo pubblico**: gestione vicina al privato, ma con quote azionarie dello Stato.","**Cina**: dalla fine degli anni \u201970 le imprese di Stato guidano lo sviluppo, gestite dal Partito comunista, con interscambio di personale tra governo e imprese; perseguono gli obiettivi dei **piani quinquennali**. Negli anni \u201990 sono diminuite di numero ma cresciute di dimensione.","**Italia**: nascita nel primo dopoguerra, smantellamento progressivo dagli anni \u201970."]},{title:"Obiettivi e gestione",points:["Obiettivi di **interesse pubblico**: politiche industriali, beni pubblici, gestione del monopolio naturale, industrie strategiche.","**Non persegue il massimo profitto**: il profitto \xE8 un **vincolo** di sostenibilit\xE0 e buona gestione.","Le teorie manageriali non bastano: entrano in conflitto **interessi del manager**, **buona gestione** (efficienza) e **interesse pubblico**. Manca un vero proprietario interessato all\u2019efficienza.","Strumenti per l\u2019efficienza: **competizione tra imprese pubbliche** e possibilit\xE0 di **sostituire i manager**."]}],exercises:[{id:"u6-4-1",type:"mc",topic:"Impresa pubblica",q:"Che differenza c\u2019\xE8 tra impresa pubblica e societ\xE0 a controllo pubblico?",options:["La prima \xE8 dello Stato; la seconda \xE8 privatistica con quote statali","Non c\u2019\xE8 differenza: sono due nomi per la stessa cosa","La prima \xE8 privata con sussidi pubblici, la seconda \xE8 interamente statale","La seconda non persegue alcun obiettivo di interesse pubblico"],answer:0,explain:"Sono le due tipologie degli appunti."},{id:"u6-4-2",type:"tf",topic:"Impresa pubblica",q:"L\u2019impresa pubblica persegue la massimizzazione del profitto.",answer:!1,explain:"Il profitto \xE8 un vincolo di sostenibilit\xE0; l\u2019obiettivo \xE8 l\u2019interesse pubblico."},{id:"u6-4-3",type:"mc",topic:"Impresa pubblica",q:"Quale ruolo hanno avuto le imprese di Stato in Cina dalla fine degli anni \u201970?",options:["Guida del processo di sviluppo, legate ai piani quinquennali","Nessuno: sono state privatizzate in blocco","Un ruolo limitato al solo settore agricolo","Sono state smantellate progressivamente come in Italia"],answer:0,explain:"Gestite direttamente dal Partito comunista, con interscambio di personale tra governo e imprese."},{id:"u6-4-4",type:"order",topic:"Impresa pubblica",q:"Metti in ordine i tre interessi in gioco nell\u2019impresa pubblica come negli appunti",items:["Interessi del manager","Buona gestione dell\u2019impresa (efficienza)","Interesse pubblico (dello Stato)"],explain:"Possono entrare in conflitto perch\xE9 manca un vero proprietario interessato all\u2019efficienza."},{id:"u6-4-5",type:"mc",topic:"Impresa pubblica",q:"Come si pu\xF2 spingere un\u2019impresa pubblica verso l\u2019efficienza?",options:["Competizione tra imprese pubbliche e manager sostituibili","Quotandola obbligatoriamente in borsa","Eliminando ogni forma di controllo pubblico","Aumentando i sussidi a fondo perduto"],answer:0,explain:"La competizione aumenta efficienza, innovazione e aderenza agli obiettivi pubblici."},{id:"u6-4-6",type:"mc",topic:"Impresa pubblica",q:"Quale di questi \xE8 un tipico obiettivo dell\u2019impresa pubblica?",options:["Gestire un monopolio naturale","Massimizzare i dividendi","Ridurre la concorrenza","Aumentare le spese discrezionali"],answer:0,explain:"Altri: politiche industriali, beni pubblici, industrie strategiche."},{id:"u6-4-7",type:"tf",topic:"Impresa pubblica",q:"In Italia l\u2019apparato di impresa pubblica \xE8 stato progressivamente smantellato a partire dagli anni \u201970.",answer:!0,explain:"Era nato nel primo dopoguerra."}]},{id:"u6l5",title:"L\u2019impresa cooperativa",icon:"\u{1F932}",theory:[{title:"Scopo e principi",points:["Persegue uno **scopo mutualistico**: dare ai soci beni, servizi o lavoro a condizioni migliori del mercato. Non massimizza il profitto; opera secondo criteri di **economicit\xE0** ma **senza fini di lucro**.","Adesione **libera e volontaria**, con quote capitale. Controllo democratico: **una testa, un voto**, a prescindere dal capitale.","Remunera il **lavoro e l\u2019impegno** del socio, non il capitale. Tutti i soci sono co-imprenditori; i manager dipendono dai soci.","Mutualit\xE0 anche verso l\u2019esterno: in Italia ogni cooperativa versa il **3% degli utili** a un fondo per nuove cooperative o cooperative in difficolt\xE0.","Gli utili non diventano dividendi ma **ristorni**, proporzionali all\u2019intensit\xE0 dello scambio mutualistico (aumenti salariali, prezzi pi\xF9 convenienti)."]},{title:"Tipi di cooperative",points:["Per missione: **produzione e lavoro** (Francia); **consumo** (Regno Unito, i Probi Pionieri di Rochdale); **credito** (Germania, aree agricole); **edilizia** (case ai soci a prezzo di costo); **agricola** (Danimarca, input a prezzi migliori); **sociale** (servizi socio-sanitari, educativi, inserimento).","Per destinatari: **pure** (solo soci) e **miste** (anche non soci, a condizioni meno favorevoli: Coop)."]},{title:"Effetti e limiti",points:["Caratteristiche: controllo in mano ai soci e non al capitale; meno bisogno di supervisori; il lavoro \xE8 anche autorealizzazione; meno disuguaglianze salariali; meno licenziamenti negli shock (\u201Clavorare meno, lavorare tutti\u201D).","Effetti sul mercato: cooperative di consumo **calmierano i prezzi** e frenano i monopoli della distribuzione; cooperative di lavoro e agricole superano i **monopsoni**.","Limiti: la teoria degli effetti \u201Cperversi\u201D sull\u2019offerta (se il prezzo sale si riducono i soci per alzare il salario medio) ha poco riscontro, perch\xE9 la domanda di lavoro \xE8 pi\xF9 rigida. Problemi reali: **sotto-capitalizzazione** e minore interesse del socio a investire. Rimedi: riserve divisibili e indivisibili, credito bancario.","Attenzione alle **cooperative spurie**: formalmente cooperative, in realt\xE0 gestite come imprese private."]}],exercises:[{id:"u6-5-1",type:"mc",topic:"Cooperativa",q:"Qual \xE8 lo scopo di un\u2019impresa cooperativa?",options:["Uno scopo mutualistico: beni, servizi o lavoro ai soci a condizioni migliori del mercato","Massimizzare i dividendi pagati ai soci in proporzione al capitale","Massimizzare il profitto come una normale impresa privata","Produrre beni pubblici per conto dello Stato"],answer:0,explain:"Opera con criteri di economicit\xE0 ma senza fini di lucro."},{id:"u6-5-2",type:"mc",topic:"Cooperativa",q:"
