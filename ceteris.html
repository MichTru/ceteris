\xE0."}]},q0=bz;var hz={id:"u3",n:3,title:"Produzione e costi",subtitle:"Dentro la regola R\u2019 = C\u2019",color:"#14B8A6",colorDark:"#0E8C7E",lessons:[{id:"u3l1",title:"Profitto e orizzonti temporali",icon:"\u23F3",theory:[{title:"L\u2019impresa neoclassica",points:["Due caratteristiche: **massimizzazione del profitto** come unico obiettivo e **disinteresse** per ci\xF2 che accade dentro l\u2019impresa.","Tre ipotesi: propriet\xE0 e management coincidono; benefici e oneri sono rappresentati in modo completo da ricavi e costi; l\u2019unico obiettivo \xE8 il massimo profitto.","Massimizzare il profitto individuale porta, per i neoclassici, al massimo benessere collettivo.","Per massimizzare i profitti bisogna **minimizzare i costi e massimizzare i ricavi**. La domanda guida: esiste una regola che garantisce il massimo profitto?"]},{title:"Breve, lungo, lunghissimo",points:["I fattori produttivi si raggruppano in **lavoro (L)** e **capitale (K)**.","**Breve periodo**: alcuni input sono fissi (capitale, tecnologia); il lavoro \xE8 il fattore pi\xF9 facile da variare. Si usano meglio gli impianti esistenti.","**Lungo periodo**: variano lavoro e capitale, non la tecnologia. Ci si dota di nuovi impianti.","**Lunghissimo periodo**: varia anche la tecnologia.","Non sono durate di calendario ma capacit\xE0 di variare i fattori: per Apple comprare un capannone richiede un giorno, per un\u2019altra impresa dieci anni."]}],exercises:[{id:"u3-1-1",type:"mc",topic:"Impresa neoclassica",q:"Quali sono i due punti caratteristici della teoria neoclassica dell\u2019impresa?",options:["Massimizzazione del profitto come unico obiettivo e disinteresse per l\u2019interno dell\u2019impresa","Massimizzazione delle vendite e separazione tra propriet\xE0 e controllo","Profitto soddisfacente e razionalit\xE0 limitata dei decisori","Minimizzazione dei costi di transazione e organizzazione gerarchica"],answer:0,explain:"L\u2019impresa \xE8 una black box che trasforma input in output per massimizzare il profitto."},{id:"u3-1-2",type:"tf",topic:"Impresa neoclassica",q:"Tra le ipotesi neoclassiche c\u2019\xE8 che propriet\xE0 e management dell\u2019impresa coincidano.",answer:!0,explain:"Il proprietario prende anche le decisioni, senza influenze esterne."},{id:"u3-1-3",type:"match",topic:"Orizzonti temporali",q:"Abbina ogni periodo a cosa pu\xF2 cambiare l\u2019impresa",pairs:[["Breve periodo","Solo il lavoro, usando meglio gli impianti"],["Lungo periodo","Lavoro e capitale, non la tecnologia"],["Lunghissimo periodo","Anche la tecnologia"]],explain:"La distinzione dipende da quali fattori si possono variare."},{id:"u3-1-4",type:"mc",topic:"Orizzonti temporali",q:"Per Apple comprare un capannone richiede un giorno. Cosa ci insegna l\u2019esempio?",options:["Che breve e lungo periodo non sono durate fisse","Che per tutte le imprese il lungo periodo dura un giorno","Che Apple non ha mai un breve periodo perch\xE9 \xE8 troppo grande","Che il capitale \xE8 sempre variabile, anche nel breve periodo"],answer:0,explain:"Per un\u2019altra impresa lo stesso passaggio pu\xF2 richiedere dieci anni."},{id:"u3-1-5",type:"fill",topic:"Impresa neoclassica",text:"Per massimizzare i profitti \xE8 necessario ___ i costi e ___ i ricavi.",answers:["minimizzare","massimizzare"],extra:["azzerare","stabilizzare"],explain:"Si parte dai costi (quantit\xE0 e costo minimo), poi si aggiungono i ricavi."},{id:"u3-1-6",type:"tf",topic:"Orizzonti temporali",q:"Nel mondo reale breve, lungo e lunghissimo periodo sono sempre sequenziali.",answer:!1,explain:"Gli appunti precisano che nella realt\xE0 i tre periodi non sono sempre sequenziali."},{id:"u3-1-7",type:"mc",topic:"Orizzonti temporali",q:"Qual \xE8 il fattore pi\xF9 facilmente variabile nel breve periodo?",options:["Il lavoro","Il capitale","La tecnologia","Il capannone"],answer:0,explain:"Capitale e tecnologia sono fissi nel breve periodo."},{id:"u3-1-8",type:"order",topic:"Orizzonti temporali",q:"Ordina le strategie per produrre di pi\xF9, dal periodo pi\xF9 breve al pi\xF9 lungo",items:["Usare meglio gli impianti esistenti","Dotarsi di nuovi impianti","Sviluppare nuove tecnologie"],explain:"Breve, lungo, lunghissimo periodo."}]},{id:"u3l2",title:"Produzione nel breve",icon:"\u{1FA9A}",theory:[{title:"PT, PM e P\u2019",points:["**Prodotto totale (PT)**: quantit\xE0 prodotta con tutti gli input in un intervallo di tempo.","**Prodotto medio (PM)** = PT / L: prodotto per unit\xE0 di fattore variabile.","**Prodotto marginale (P\u2019)** = \u0394PT / \u0394L: quanto aumenta il prodotto con un lavoratore in pi\xF9 (derivata prima del PT).","P\u2019 prima cresce, poi scende e pu\xF2 diventare negativo. P\u2019 incrocia il PM **nel massimo del PM**. Scende prima il marginale, poi il medio."]},{title:"Rendimenti decrescenti",points:["**Legge dei rendimenti decrescenti**: con quantit\xE0 crescenti di un fattore variabile e capitale dato, da un certo punto PM e P\u2019 diminuiscono, perch\xE9 il capitale fisso si satura (l\u2019aula che si riempie).","Forma ammessa: PM = P\u2019 costanti, se il capitale non \xE8 del tutto usato o conta poco (imprese di pulizie).","Forma **non ammessa**: P\u2019 e PM che crescono sempre, perch\xE9 vorrebbe dire risorse infinite."],example:"Tavoli: con 7 lavoratori il PM tocca il massimo (101 / 7 \u2248 14,4). \xC8 la quantit\xE0 di lavoro pi\xF9 efficiente con quel capitale."}],exercises:[{id:"u3-2-1",type:"match",topic:"Grandezze di produzione",q:"Abbina ogni grandezza alla sua definizione",pairs:[["PT","Quantit\xE0 prodotta con tutti gli input"],["PM","Prodotto per unit\xE0 di fattore variabile"],["P\u2019","Variazione del PT con un\u2019unit\xE0 di input in pi\xF9"]],explain:"P\u2019 \xE8 la derivata prima del PT."},{id:"u3-2-2",type:"num",topic:"Prodotto marginale",q:"Con 3 lavoratori si producono 30 tavoli, con 4 lavoratori 48. Qual \xE8 il prodotto marginale del quarto lavoratore?",answer:18,tol:0,unit:"tavoli",explain:"P\u2019 = \u0394PT / \u0394L = (48 \u2212 30) / 1 = 18."},{id:"u3-2-3",type:"num",topic:"Prodotto medio",q:"Con 5 lavoratori si producono 67 tavoli. Qual \xE8 il prodotto medio?",answer:13.4,tol:.01,unit:"tavoli",explain:"PM = PT / L = 67 / 5 = 13,4."},{id:"u3-2-4",type:"num",topic:"Prodotto medio",q:"Tabella dei tavoli: PT = 85 con 6 lavoratori, 101 con 7, 113 con 8. Con quanti lavoratori il PM \xE8 massimo?",answer:7,tol:0,unit:"lavoratori",explain:"PM: 85/6 = 14,17; 101/7 = 14,43; 113/8 = 14,13. Massimo con 7 lavoratori."},{id:"u3-2-5",type:"hotspot",topic:"PM e P\u2019",scene:"prodotto",q:"Tocca il punto in cui P\u2019 incrocia il PM.",answer:"cross",explain:"P\u2019 incrocia il PM nel punto di massimo del PM: finch\xE9 P\u2019 > PM la media sale, quando P\u2019 < PM scende."},{id:"u3-2-6",type:"hotspot",topic:"PM e P\u2019",scene:"prodotto",q:"Tocca il punto di massimo del prodotto marginale (inizio dei rendimenti marginali decrescenti).",answer:"maxP",explain:"Dopo quel punto ogni lavoratore in pi\xF9 aggiunge meno del precedente."},{id:"u3-2-7",type:"mc",topic:"Rendimenti decrescenti",q:"Perch\xE9 si verificano i rendimenti decrescenti nel breve periodo?",options:["Perch\xE9 la dotazione fissa di capitale comincia a saturarsi","Perch\xE9 i lavoratori assunti dopo sono sempre meno bravi","Perch\xE9 il salario dei lavoratori aumenta con le assunzioni","Perch\xE9 la domanda del prodotto diminuisce quando si produce di pi\xF9"],answer:0,explain:"Come l\u2019aula che si riempie: la soluzione sarebbe un\u2019aula pi\xF9 grande, cio\xE8 pi\xF9 capitale, possibile solo nel lungo periodo."},{id:"u3-2-8",type:"tf",topic:"Forme delle curve",q:"\xC8 ammissibile una curva di P\u2019 che cresce sempre senza mai scendere.",answer:!1,explain:"Significherebbe che le risorse sono infinite: forma non ammissibile."},{id:"u3-2-9",type:"mc",topic:"Forme delle curve",q:"Quando PM e P\u2019 possono essere costanti e coincidenti?",options:["Quando il capitale \xE8 sottoutilizzato o conta poco","Mai: \xE8 una forma non ammissibile delle curve","Quando il capitale \xE8 completamente saturo","Solo nel lunghissimo periodo, quando cambia la tecnologia"],answer:0,explain:"Ogni lavoratore in pi\xF9 produce esattamente come i precedenti."},{id:"u3-2-10",type:"mc",topic:"Prodotto marginale",q:"Il secondo lavoratore fa salire il PT da 4 a 14 tavoli. Significa che \xE8 pi\xF9 bravo del primo?",options:["No: i compiti si dividono e anche il primo diventa pi\xF9 produttivo","S\xEC, perch\xE9 da solo produce 10 tavoli in pi\xF9 del primo","S\xEC, perch\xE9 il suo prodotto marginale \xE8 14","No, perch\xE9 il suo prodotto marginale \xE8 negativo"],answer:0,explain:"Il P\u2019 misura il contributo all\u2019organizzazione nel suo complesso, non la bravura individuale."},{id:"u3-2-11",type:"tf",topic:"Prodotto marginale",q:"Quando P\u2019 diventa negativo, un lavoratore in pi\xF9 fa diminuire la produzione totale.",answer:!0,explain:"Punto C del grafico: \xE8 come se l\u2019ultimo lavoratore distruggesse prodotto."}]},{id:"u3l3",title:"Costo opportunit\xE0",icon:"\u{1F393}",theory:[{title:"Contabile ed economico",points:["**Costo contabile**: costo esplicito, quello che spendo. Il profitto contabile non include il costo opportunit\xE0 del capitale n\xE9 il premio per il rischio.","**Costo economico** = costo esplicito + **costo implicito**. Il **costo opportunit\xE0** misura tutto ci\xF2 a cui si rinuncia per prendere una decisione.","Il profitto economico \xE8 anche detto **valore aggiunto**: differenza tra valore della produzione e costo dei fattori nel loro complesso."]},{title:"Gli esempi",points:["**Universit\xE0**: 15.000 \u20AC di spese in 5 anni + 60.000 \u20AC di stipendi a cui si rinuncia = **75.000 \u20AC** di costo opportunit\xE0.","**Pizza**: 40 \u20AC con la persona che ci piace invece di 20 \u20AC con l\u2019amico non \xE8 irrazionale: si sceglie in base al costo opportunit\xE0.","**Impresa di famiglia**: il primo anno sembra fare 60.000 \u20AC di profitto. Il secondo anno, monetizzando affitto e stipendi, perde 170.000 \u20AC. Era gi\xE0 in perdita di 170.000 \u20AC il primo anno: il profitto era un\u2019illusione."]}],exercises:[{id:"u3-3-1",type:"mc",topic:"Costo opportunit\xE0",q:"Il costo opportunit\xE0 misura\u2026",options:["tutto ci\xF2 a cui si rinuncia per prendere una decisione","solo l\u2019esborso monetario sostenuto per una decisione","il costo del capitale fisso investito nell\u2019impresa","il costo di un\u2019unit\xE0 di prodotto in pi\xF9"],answer:0,explain:"Non solo in termini monetari: anche tempo, alternative, redditi perduti."},{id:"u3-3-2",type:"num",topic:"Costo opportunit\xE0",q:"In 5 anni di universit\xE0 spendi 15.000 \u20AC e rinunci a 60.000 \u20AC di stipendi. Qual \xE8 il costo opportunit\xE0 dell\u2019universit\xE0?",answer:75e3,tol:0,unit:"\u20AC",explain:"15.000 + 60.000 = 75.000 \u20AC. Si sceglie l\u2019universit\xE0 se si prevede che valga di pi\xF9 in futuro."},{id:"u3-3-3",type:"num",topic:"Impresa di famiglia",q:"Anno 1: ricavi 150.000 \u20AC; materie prime 50.000, operaio 20.000, segretaria 20.000. Qual \xE8 il profitto contabile?",answer:6e4,tol:0,unit:"\u20AC",explain:"150.000 \u2212 90.000 = 60.000 \u20AC. Ma non tiene conto dei costi opportunit\xE0."},{id:"u3-3-4",type:"num",topic:"Impresa di famiglia",q:"Aggiungi i costi opportunit\xE0: direttore esecutivo 80.000, segretaria part-time 10.000, affitto 60.000, stipendio della titolare 80.000. Qual \xE8 il risultato economico? (con il segno)",answer:-17e4,tol:0,unit:"\u20AC",explain:"Costi totali 90.000 + 230.000 = 320.000 \u20AC. 150.000 \u2212 320.000 = \u2212170.000 \u20AC."},{id:"u3-3-5",type:"mc",topic:"Impresa di famiglia",q:"Dove ha sbagliato la titolare dell\u2019impresa di famiglia?",options:["Non considerava il costo opportunit\xE0 di capannone e lavoro dei familiari","Ha sbagliato a calcolare i ricavi del primo anno","Ha pagato troppo le materie prime e i salari","Il secondo anno i suoi costi monetari di produzione sono aumentati"],answer:0,explain:"Il secondo anno ha solo monetizzato un costo opportunit\xE0 che esisteva gi\xE0 nel primo."},{id:"u3-3-6",type:"tf",topic:"Costo opportunit\xE0",q:"Spendere 40 \u20AC per la pizza con la persona che ci piace invece di 20 \u20AC con l\u2019amico \xE8 una scelta irrazionale.",answer:!1,explain:"Si decide in base al costo opportunit\xE0 per soddisfare i propri bisogni: \xE8 razionale."},{id:"u3-3-7",type:"fill",topic:"Costo economico",text:"Il costo opportunit\xE0 \xE8 la somma del costo ___ (quello che spendo) e del costo ___.",answers:["esplicito","implicito"],extra:["marginale","fisso"],explain:"Costo economico = esplicito + implicito."},{id:"u3-3-8",type:"mc",topic:"Valore aggiunto",q:"Perch\xE9 il profitto economico \xE8 chiamato anche valore aggiunto?",options:["\xC8 il valore della produzione meno il costo di tutti i fattori","\xC8 il valore di mercato delle azioni dell\u2019impresa","\xC8 il ricavo aggiuntivo ottenuto dall\u2019ultima unit\xE0 venduta","\xC8 la somma dei profitti contabili di pi\xF9 anni"],answer:0,explain:"La definizione contabile \xE8 incompleta; quella economica considera tutti i fattori."}]},{id:"u3l4",title:"I costi di breve periodo",icon:"\u{1F4C9}",theory:[{title:"Costi totali e medi",points:["**CT = CF + CV**. I costi fissi (CF) si pagano anche se non si produce; i variabili (CV) partono da 0.","**CMT** = CT / Q (costo unitario) = **CMF + CMV**.","**C\u2019** = \u0394CT / \u0394Q: costo in pi\xF9 per un\u2019unit\xE0 di output in pi\xF9 (costo incrementale).","Esempio: K = 10 unit\xE0 a 10 \u20AC (CF = 100), ogni lavoratore costa 20 \u20AC. Con 1 lavoratore Q = 43, CT = 120, C\u2019 = 20 / 43 = 0,465."]},{title:"Forme delle curve",points:["Il **CMF scende sempre**: i 100 \u20AC si spalmano su pi\xF9 unit\xE0.","CMV e CMT scendono e poi risalgono (forma a U). Il loro andamento \xE8 lo specchio di PM e P\u2019.","Il **C\u2019** scende rapidamente, tocca il minimo e risale fino a incrociare il **CMT nel suo minimo**.","La **capacit\xE0 produttiva ottimale di breve periodo** non \xE8 la quantit\xE0 massima producibile, ma quella che minimizza il CMT, dove C\u2019 = CMT."]}],exercises:[{id:"u3-4-1",type:"fill",topic:"Costi totali",text:"Il costo totale \xE8 la somma dei costi ___ e dei costi ___.",answers:["fissi","variabili"],extra:["marginali","opportunit\xE0"],explain:"CT = CF + CV.",profNote:"Gli appunti definiscono il CT come costo \u201Cdiviso per il numero di unit\xE0 prodotte\u201D: quella \xE8 la definizione del costo medio totale (CMT). Il CT \xE8 il costo complessivo, non diviso."},{id:"u3-4-2",type:"num",topic:"Costo medio totale",q:"CF = 100 \u20AC, 5 lavoratori a 20 \u20AC l\u2019uno, Q = 875. Calcola il CMT (tre decimali).",answer:.229,tol:.002,unit:"\u20AC",explain:"CT = 100 + 100 = 200. CMT = 200 / 875 \u2248 0,229 \u20AC."},{id:"u3-4-3",type:"num",topic:"Costo marginale",q:"Passando da 4 a 5 lavoratori (20 \u20AC l\u2019uno) la produzione sale da 600 a 875. Calcola il C\u2019 (tre decimali).",answer:.073,tol:.002,unit:"\u20AC",explain:"C\u2019 = \u0394CT / \u0394Q = 20 / 275 \u2248 0,073 \u20AC."},{id:"u3-4-4",type:"num",topic:"Costo medio fisso",q:"CF = 100 \u20AC. Con Q = 43 il CMF \xE8 circa 2,326. Quanto vale il CMF con Q = 1750? (tre decimali)",answer:.057,tol:.002,unit:"\u20AC",explain:"CMF = 100 / 1750 \u2248 0,057: scende sempre perch\xE9 i costi fissi si spalmano su pi\xF9 unit\xE0."},{id:"u3-4-5",type:"hotspot",topic:"Curve di costo",scene:"costi-bp",q:"Tocca il punto di capacit\xE0 produttiva ottimale di breve periodo.",answer:"min",explain:"\xC8 il minimo del CMT, dove la curva del C\u2019 lo incrocia."},{id:"u3-4-6",type:"hotspot",topic:"Curve di costo",scene:"costi-bp",q:"Tocca la curva del costo medio fisso.",answer:"cmf",explain:"\xC8 la curva sempre decrescente: i costi fissi si distribuiscono su pi\xF9 unit\xE0."},{id:"u3-4-7",type:"mc",topic:"Curve di costo",q:"Se il C\u2019 \xE8 minore del CMT, il CMT\u2026",options:["sta scendendo","sta salendo","\xE8 al suo minimo","resta costante"],answer:0,explain:"Un\u2019unit\xE0 che costa meno della media abbassa la media. Quando C\u2019 > CMT la media sale."},{id:"u3-4-8",type:"tf",topic:"Capacit\xE0 ottimale",q:"La capacit\xE0 produttiva ottimale di breve periodo \xE8 la quantit\xE0 massima che l\u2019impianto pu\xF2 produrre.",answer:!1,explain:"\xC8 il livello che minimizza il costo medio totale."},{id:"u3-4-9",type:"mc",topic:"Curve di costo",q:"Cosa determina l\u2019andamento a U di CMV e C\u2019?",options:["L\u2019andamento di PM e P\u2019 del lavoro","Il prezzo di vendita del prodotto","La curva di domanda di mercato","L\u2019ammontare del costo fisso"],answer:0,explain:"Se ogni lavoratore costa uguale ma rende di pi\xF9, il costo per unit\xE0 scende; con i rendimenti decrescenti risale."},{id:"u3-4-10",type:"match",topic:"Curve di costo",q:"Abbina ogni curva al suo andamento",pairs:[["CMF","Sempre decrescente"],["CMT","A U, minimo dove incontra C\u2019"],["CF totale","Orizzontale"],["CV totale","Parte da 0 e cresce"]],explain:"Il CT parte dal livello dei CF e segue l\u2019andamento dei CV."}]},{id:"u3l5",title:"Lungo periodo ed economie di scala",icon:"\u{1F3D7}\uFE0F",theory:[{title:"Il mix ottimale di K e L",points:["Nel lungo periodo tutti i fattori variano. Condizione di minimo costo: **P\u2019K / pK = P\u2019L / pL**, cio\xE8 l\u2019ultimo euro speso in capitale rende quanto l\u2019ultimo euro speso in lavoro.","Riscritta: **P\u2019K / P\u2019L = pK / pL**. A sinistra ci\xF2 su cui l\u2019impresa pu\xF2 agire (produttivit\xE0 marginali), a destra un dato esogeno (prezzi di mercato).","Se un euro in K rende di pi\xF9, si investe in K: il suo P\u2019 scende (rendimenti decrescenti) e quello del lavoro sale, finch\xE9 i rapporti si eguagliano.","**Principio di sostituzione**: si usa di pi\xF9 il fattore meno costoso. In Cina il lavoro costa poco, in Europa il capitale costa relativamente meno: una maglietta prodotta in Cina costa meno."],example:"P\u2019K = 10, pK = 5 \u20AC, P\u2019L = 2, pL = 2 \u20AC. 10/5 = 2 contro 2/2 = 1: conviene spostare risorse sul capitale."},{title:"Curva di costo medio di lungo periodo (CMLP)",points:["C\u2019\xE8 un\u2019unica CMLP perch\xE9 nel lungo periodo i costi fissi diventano variabili. Si ottiene collegando le curve di breve periodo per ogni livello di output.","La sua altezza dipende dalla tecnologia. I punti sotto la curva sono irraggiungibili, quelli sopra raggiungibili ma inefficienti.","Forma a U: prima **economie di scala** (pi\xF9 produco, meno costa l\u2019unit\xE0), poi **diseconomie di scala**."]},{title:"Economie e diseconomie di scala",points:["**Reali** (cambiano le quantit\xE0 di input): indivisibilit\xE0 e costi una tantum (pubblicit\xE0, 10.000 principi attivi per un farmaco); relazioni geometriche (cisterne); specializzazione (gli spilli di Adam Smith: 10 contro 6000); tecnologia di produzione di massa.","**Pecuniarie** (cambia il prezzo degli input): finanziamenti migliori, sconti per grandi acquisti ed economie di commercializzazione, risparmi sui trasporti con stabilimenti sparsi.","**Diseconomie**: costi di **coordinamento** (sedi a Pechino e Bologna) e di **motivazione** (il manager non \xE8 il proprietario). Le economie di scala non spariscono, ma vengono pi\xF9 che compensate."],example:"Stabilimenti a Ferrara, Bologna, Modena: costo minimo sempre pi\xF9 basso. Con Forl\xEC e Ravenna (5 in tutto) torna a salire."}],exercises:[{id:"u3-5-1",type:"mc",topic:"Minimizzazione dei costi",q:"Qual \xE8 la condizione di minimizzazione dei costi nel lungo periodo?",options:["P\u2019K / pK = P\u2019L / pL","P\u2019K = P\u2019L","pK / pL = 1","R\u2019 = C\u2019"],answer:0,explain:"L\u2019ultimo euro speso in capitale deve aumentare il prodotto quanto l\u2019ultimo euro speso in lavoro."},{id:"u3-5-2",type:"num",topic:"Minimizzazione dei costi",q:"P\u2019K = 10 e pK = 5 \u20AC. Di quanto aumenta il prodotto l\u2019ultimo euro speso in capitale?",answer:2,tol:0,explain:"P\u2019K / pK = 10 / 5 = 2."},{id:"u3-5-3",type:"mc",topic:"Minimizzazione dei costi",q:"P\u2019K / pK = 2 e P\u2019L / pL = 1. Cosa deve fare l\u2019impresa?",options:["Investire di pi\xF9 in capitale e meno in lavoro","Investire di pi\xF9 in lavoro, perch\xE9 costa meno del capitale","Nulla: l\u2019impresa \xE8 gi\xE0 in equilibrio","Ridurre entrambi i fattori per abbassare i costi"],answer:0,explain:"Un euro in K rende di pi\xF9. Aumentando K il suo P\u2019 scende e quello di L sale, fino all\u2019uguaglianza."},{id:"u3-5-4",type:"mc",topic:"Principio di sostituzione",q:"Perch\xE9 una maglietta prodotta in Cina costa meno di una prodotta in Germania?",options:["Perch\xE9 in Cina il lavoro costa poco e si usa di pi\xF9 il fattore meno costoso","Perch\xE9 in Cina il capitale costa poco e si usano pi\xF9 macchinari","Perch\xE9 la tecnologia cinese \xE8 pi\xF9 avanzata di quella tedesca","Perch\xE9 la domanda cinese di magliette \xE8 pi\xF9 elastica"],answer:0,explain:"Principio di sostituzione: il rapporto tra i prezzi dei fattori determina il mix ottimale."},{id:"u3-5-5",type:"match",topic:"Economie di scala",q:"Classifica ogni fonte di economie di scala",pairs:[["Sconti dai fornitori per grandi acquisti","Pecuniaria"],["Cisterna pi\xF9 grande","Reale: relazioni geometriche"],["Fabbrica di spilli di Adam Smith","Reale: specializzazione"],["Finanziamenti a condizioni migliori","Pecuniaria"],["Campagna pubblicitaria da 1 milione","Reale: indivisibilit\xE0"]],explain:"Reali: cambiano le quantit\xE0 di input. Pecuniarie: cambia il prezzo pagato per gli input."},{id:"u3-5-6",type:"mc",topic:"Relazioni geometriche",q:"Se raddoppiano le dimensioni (il lato) di un contenitore, cosa succede?",options:["La superficie diventa 4 volte, il volume 8 volte","Superficie e volume raddoppiano entrambi","La superficie diventa 8 volte, il volume 4","Il volume resta uguale, cambia solo la forma"],answer:0,explain:"Il volume cresce pi\xF9 in fretta della superficie: conviene la cisterna grande (cemento, combustibili).",profNote:"Gli appunti scrivono \u201Cse raddoppiamo la superficie il volume aumenta 8 volte\u201D. Il rapporto corretto \xE8: raddoppiando il lato la superficie si quadruplica e il volume diventa 8 volte."},{id:"u3-5-7",type:"mc",topic:"Diseconomie di scala",q:"Perch\xE9, aprendo il quarto e il quinto stabilimento (Forl\xEC e Ravenna), il costo medio minimo torna a salire?",options:["Costi di coordinamento e di motivazione superano i vantaggi delle economie di scala","Perch\xE9 le economie di scala spariscono del tutto oltre tre stabilimenti","Perch\xE9 il prezzo di vendita del prodotto comincia a scendere","Perch\xE9 la tecnologia dei nuovi stabilimenti \xE8 peggiore"],answer:0,explain:"Le economie di scala ci sono ancora, ma vengono pi\xF9 che compensate dai nuovi costi."},{id:"u3-5-8",type:"tf",topic:"Diseconomie di scala",q:"I costi di motivazione nascono quando propriet\xE0 e management si separano: il manager potrebbe massimizzare il suo benessere e non quello dell\u2019impresa.",answer:!0,explain:"Il proprietario deve sostenere costi (incentivi) per far decidere il manager come se fosse al suo posto."},{id:"u3-5-9",type:"hotspot",topic:"CMLP",scene:"cmlp",q:"Tocca il tratto della CMLP con diseconomie di scala.",answer:"dis",explain:"\xC8 il tratto crescente: produrre di pi\xF9 fa aumentare il costo medio."},{id:"u3-5-10",type:"tf",topic:"CMLP",q:"I punti sotto la curva CMLP sono livelli di costo raggiungibili con la tecnologia attuale.",answer:!1,explain:"Sono irraggiungibili: per abbassare la curva serve una nuova tecnologia (lunghissimo periodo)."},{id:"u3-5-11",type:"mc",topic:"CMLP",q:"Come si ottiene la curva di costo medio di lungo periodo?",options:["Dalle curve di breve periodo dei possibili impianti","Sommando i costi fissi di tutti gli impianti dell\u2019impresa","Ricavandola dalla curva di domanda di lungo periodo","Prolungando la curva del costo marginale di breve periodo"],answer:0,explain:"Per ogni livello di output si sceglie l\u2019impianto che lo produce al costo minimo.",profNote:"Gli appunti dicono \u201Ccollegando i punti di minimo\u201D delle curve di breve. Pi\xF9 precisamente la CMLP \xE8 l\u2019inviluppo delle curve di breve periodo: le tocca per ogni livello di output, ma coincide con il loro minimo solo nel punto pi\xF9 basso (la SEM)."},{id:"u3-5-12",type:"mc",topic:"Economie di scala",q:"Cosa succede nei settori con forti economie di scala?",options:["Ci sono pochi grandi produttori","Ci sono molte piccole imprese","I prezzi sono sempre altissimi","Non esistono barriere all\u2019entrata"],answer:0,explain:"Essere piccoli \xE8 un grosso svantaggio. Dove le economie di scala contano poco, sopravvivono molte imprese piccole."}]},{id:"u3l6",title:"SEM e regola R\u2019 = C\u2019",icon:"\u{1F3AF}",theory:[{title:"Scala efficiente minima",points:["La **SEM** \xE8 la quantit\xE0 che minimizza il costo medio di lungo periodo.","**Indice delle economie di scala**: percentuale di costo medio in pi\xF9 che sostiene chi produce solo **un terzo della SEM**. Se la SEM \xE8 900.000 unit\xE0, quanto costa in pi\xF9 produrne 300.000?","U molto chiusa: economie di scala importanti, poche grandi imprese e barriere all\u2019entrata (chi entra pu\xF2 partire con un handicap del 90% di costo). U piatta: imprese pi\xF9 piccole.","Arrivare alla SEM non basta: bisogna vedere se il mercato assorbe quella quantit\xE0. Serve guardare la domanda."]},{title:"La regola R\u2019 = C\u2019",points:["Profitto: **\u03C0 = (p \xD7 q) \u2212 (c \xD7 q)**. Il massimo \xE8 dove la distanza tra RT e CT \xE8 massima.","Tavoli: per vendere di pi\xF9 bisogna abbassare il prezzo. Il profitto massimo \xE8 **27 con 6 tavoli**.","Regola marginalista: si aumenta la produzione finch\xE9 **R\u2019 > C\u2019**; ci si ferma dove **R\u2019 = C\u2019**. Il settimo tavolo ha R\u2019 = 9 e C\u2019 = 12: distrugge profitto.","Con domanda lineare, la curva R\u2019 parte dallo stesso punto sull\u2019asse Y e taglia l\u2019asse X a **Q/2**.","Questa regola vale **sempre**, per ogni struttura di mercato."]},{title:"Lunghissimo periodo",points:["Cambiano anche le tecnologie, spesso come risposta interna a cambiamenti esterni: scarsit\xE0 di un fattore, nuove norme.","Un produttore di auto oggi pensa gi\xE0 al 2035 (solo elettriche) o all\u2019idrogeno."]}],exercises:[{id:"u3-6-1",type:"mc",topic:"SEM",q:"La scala efficiente minima (SEM) \xE8\u2026",options:["la quantit\xE0 che minimizza il costo medio di lungo periodo","la quantit\xE0 massima che l\u2019impianto riesce a produrre","la quantit\xE0 per cui il ricavo marginale \xE8 uguale al costo marginale","la quantit\xE0 scambiata nell\u2019equilibrio di mercato"],answer:0,explain:"\xC8 il punto verso cui tendere, anche se a volte richiede una capacit\xE0 produttiva altissima."},{id:"u3-6-2",type:"mc",topic:"Indice delle economie di scala",q:"L\u2019indice delle economie di scala misura\u2026",options:["la percentuale di costo medio in pi\xF9 per chi produce un terzo della SEM","il numero di imprese che possono stare nel settore","il profitto che l\u2019impresa ottiene producendo alla SEM","il costo marginale sostenuto alla scala efficiente minima"],answer:0,explain:"Esempio: SEM = 900.000 unit\xE0, si confronta il costo medio a 300.000 unit\xE0 con il minimo."},{id:"u3-6-3",type:"num",topic:"Indice delle economie di scala",q:"La SEM di un settore \xE8 900.000 unit\xE0. A quale quantit\xE0 si misura l\u2019indice delle economie di scala?",answer:3e5,tol:0,unit:"unit\xE0",explain:"Un terzo della SEM: 900.000 / 3 = 300.000."},{id:"u3-6-4",type:"tf",topic:"SEM",q:"Una curva di costo medio a U molto chiusa indica economie di scala importanti e poche grandi imprese.",answer:!0,explain:"Chi entra con impianti piccoli ha un grosso svantaggio di costo: \xE8 una barriera all\u2019entrata."},{id:"u3-6-5",type:"num",topic:"Massimizzazione del profitto",q:"Con 6 tavoli il ricavo totale \xE8 96 \u20AC e il costo totale 69 \u20AC. Qual \xE8 il profitto?",answer:27,tol:0,unit:"\u20AC",explain:"96 \u2212 69 = 27 \u20AC: \xE8 il profitto massimo della tabella."},{id:"u3-6-6",type:"num",topic:"Ricavo marginale",q:"Con 6 tavoli RT = 96 \u20AC, con 7 tavoli RT = 105 \u20AC. Qual \xE8 il ricavo marginale del settimo tavolo?",answer:9,tol:0,unit:"\u20AC",explain:"R\u2019 = 105 \u2212 96 = 9 \u20AC."},{id:"u3-6-7",type:"mc",topic:"Regola R\u2019 = C\u2019",q:"Il settimo tavolo ha R\u2019 = 9 \u20AC e C\u2019 = 12 \u20AC. Conviene produrlo?",options:["No: il profitto marginale \xE8 \u22123, distrugge profitto","S\xEC: il ricavo totale aumenta comunque di 9 \u20AC","S\xEC: il profitto totale resta ancora positivo","\xC8 indifferente: R\u2019 e C\u2019 sono quasi uguali"],answer:0,explain:"Si produce finch\xE9 R\u2019 \u2265 C\u2019. Il settimo tavolo costa pi\xF9 di quanto rende."},{id:"u3-6-8",type:"mc",topic:"Regola R\u2019 = C\u2019",q:"Dopo 3 tavoli il profitto marginale \xE8 massimo (9). Perch\xE9 non fermarsi l\xEC?",options:["Perch\xE9 il quarto tavolo aggiunge comunque 8 \u20AC di profitto","Perch\xE9 dal quarto tavolo il ricavo marginale diventa negativo","Perch\xE9 dal quarto tavolo il costo marginale \xE8 zero","Bisogna fermarsi a 3, dove il profitto marginale \xE8 massimo"],answer:0,explain:"Conta il profitto totale: ogni tavolo con R\u2019 > C\u2019 lo aumenta, anche se di meno."},{id:"u3-6-9",type:"hotspot",topic:"Regola R\u2019 = C\u2019",scene:"ricavi-costi-totali",q:"Tocca la quantit\xE0 che massimizza il profitto.",answer:"qstar",explain:"\xC8 dove la distanza tra RT e CT \xE8 massima: l\xEC le pendenze delle due curve (R\u2019 e C\u2019) sono uguali."},{id:"u3-6-10",type:"num",topic:"Ricavo marginale",q:"Una domanda lineare taglia l\u2019asse delle quantit\xE0 a Q = 100. In quale punto la curva R\u2019 taglia lo stesso asse?",answer:50,tol:0,explain:"La curva R\u2019 parte dallo stesso punto della domanda sull\u2019asse Y e taglia l\u2019asse X a Q/2."},{id:"u3-6-11",type:"tf",topic:"Regola R\u2019 = C\u2019",q:"La regola R\u2019 = C\u2019 vale solo in concorrenza perfetta.",answer:!1,explain:"Vale sempre, per ogni struttura di mercato e per tutti i tipi di impresa.",profNote:"Negli appunti c\u2019\xE8 scritto \u201Cmi fermo quando R\u2019 = C\u2019 = 0\u201D. Va letto come \u201Cquando R\u2019 \u2212 C\u2019 = 0\u201D, cio\xE8 profitto marginale nullo: R\u2019 e C\u2019 non devono essere zero."},{id:"u3-6-12",type:"order",topic:"Regola R\u2019 = C\u2019",q:"Ordina il ragionamento per trovare la quantit\xE0 ottimale",items:["Calcolo R\u2019 e C\u2019 per ogni unit\xE0","Aumento la produzione finch\xE9 R\u2019 > C\u2019","Mi fermo dove R\u2019 = C\u2019","Leggo il prezzo sulla curva di domanda"],explain:"Il prezzo si ricava proiettando la quantit\xE0 ottimale sulla curva di domanda."}]}],open:[{id:"u3-o1",q:"Quali sono le ipotesi della teoria neoclassica dell\u2019impresa?",answer:"Propriet\xE0 e management coincidono (il proprietario decide senza influenze esterne); benefici e oneri sono rappresentati in modo completo da ricavi e costi; l\u2019unico obiettivo \xE8 la massimizzazione del profitto. L\u2019impresa \xE8 una black box che trasforma input in output, e il massimo profitto individuale porta al massimo benessere collettivo.",keywords:["propriet\xE0","management","ricavi e costi","profitto","black box"]},{id:"u3-o2",q:"Distingui breve, lungo e lunghissimo periodo.",answer:"Breve: alcuni fattori sono fissi (capitale e tecnologia), si varia il lavoro usando meglio gli impianti. Lungo: variano lavoro e capitale, non la tecnologia; ci si dota di nuovi impianti. Lunghissimo: varia anche la tecnologia. Non sono durate fisse ma dipendono dalla capacit\xE0 dell\u2019impresa di variare i fattori (Apple compra un capannone in un giorno).",keywords:["fissi","lavoro","capitale","tecnologia","capacit\xE0"]},{id:"u3-o3",q:"Definisci PT, PM, P\u2019 e spiega la loro relazione.",answer:"PT \xE8 la quantit\xE0 prodotta con tutti gli input; PM \xE8 PT diviso il numero di lavoratori; P\u2019 \xE8 la variazione del PT per un lavoratore in pi\xF9, cio\xE8 la derivata prima. P\u2019 cresce, poi scende e pu\xF2 diventare negativo. P\u2019 incrocia il PM nel punto di massimo del PM: finch\xE9 P\u2019 > PM la media sale, dopo scende.",keywords:["prodotto totale","medio","marginale","derivata","massimo"]},{id:"u3-o4",q:"Enuncia la legge dei rendimenti decrescenti.",answer:"Se si impiegano quantit\xE0 crescenti di un fattore variabile con una quantit\xE0 data di capitale, da un certo punto PM e P\u2019 del fattore variabile diminuiscono, perch\xE9 la dotazione fissa di capitale si satura. Esempio dell\u2019aula che si riempie: la soluzione \xE8 un\u2019aula pi\xF9 grande, possibile solo nel lungo periodo.",keywords:["fattore variabile","capitale","diminui","satura","aula"]},{id:"u3-o5",q:"Differenza tra costo contabile e costo economico con un esempio.",answer:"Il costo contabile \xE8 il costo esplicito, l\u2019esborso monetario. Il costo economico aggiunge il costo implicito e corrisponde al costo opportunit\xE0: tutto ci\xF2 a cui si rinuncia. Universit\xE0: 15.000 \u20AC spesi pi\xF9 60.000 \u20AC di stipendi persi = 75.000 \u20AC. Il profitto economico \xE8 detto valore aggiunto.",keywords:["esplicito","implicito","opportunit\xE0","rinuncia","75.000"]},{id:"u3-o6",q:"Spiega l\u2019esempio dell\u2019impresa di famiglia e cosa insegna.",answer:"Il primo anno: ricavi 150.000, costi monetari 90.000, profitto contabile 60.000. Il capannone era ereditato e i familiari lavoravano senza considerare lo stipendio di mercato. Il secondo anno, dopo il divorzio e l\u2019incendio, deve pagare direttore (80.000), segretaria part-time (10.000), affitto (60.000) e il proprio stipendio (80.000): perdita di 170.000. In realt\xE0 era in perdita gi\xE0 il primo anno: aveva solo monetizzato un costo opportunit\xE0 esistente.",keywords:["60.000","170.000","capannone","stipendi","costo opportunit\xE0","illusione"]},{id:"u3-o7",q:"Descrivi le curve di costo di breve periodo e le loro relazioni.",answer:"CT = CF + CV. CMT = CT/Q = CMF + CMV. C\u2019 = \u0394CT/\u0394Q. Il CMF scende sempre perch\xE9 i costi fissi si spalmano su pi\xF9 unit\xE0. CMV e CMT hanno forma a U, specchio di PM e P\u2019. Il C\u2019 scende, tocca il minimo e risale incrociando il CMT nel suo minimo, che \xE8 la capacit\xE0 produttiva ottimale di breve.",keywords:["CF","CV","CMF","a U","C\u2019","minimo"]},{id:"u3-o8",q:"Cos\u2019\xE8 la capacit\xE0 produttiva ottimale di breve periodo?",answer:"Non \xE8 la quantit\xE0 massima producibile ma il livello di produzione che minimizza il costo medio totale di breve periodo, cio\xE8 dove il costo marginale incrocia il CMT nel suo minimo.",keywords:["non \xE8 la quantit\xE0 massima","minimizza","costo medio","C\u2019","minimo"]},{id:"u3-o9",q:"Spiega la condizione di minimizzazione dei costi nel lungo periodo con l\u2019esempio numerico.",answer:"L\u2019impresa \xE8 efficiente quando l\u2019ultimo euro speso in capitale aumenta il prodotto quanto l\u2019ultimo speso in lavoro: P\u2019K/pK = P\u2019L/pL, oppure P\u2019K/P\u2019L = pK/pL. Con P\u2019K = 10, pK = 5, P\u2019L = 2, pL = 2 si ha 2 contro 1: conviene investire in capitale. Il P\u2019 del capitale scende e quello del lavoro sale finch\xE9 i rapporti si eguagliano. Principio di sostituzione: si usa di pi\xF9 il fattore meno caro (Cina).",keywords:["ultimo euro","P\u2019K/pK","capitale","decrescenti","sostituzione"]},{id:"u3-o10",q:"Descrivi la curva di costo medio di lungo periodo.",answer:"\xC8 unica perch\xE9 nel lungo i costi fissi diventano variabili. Si costruisce dalle curve di breve periodo dei possibili impianti. La posizione dipende dalla tecnologia; i punti sotto sono irraggiungibili, quelli sopra raggiungibili ma inefficienti. Ha forma a U: prima economie di scala, poi diseconomie. In alcuni settori \xE8 pi\xF9 piatta.",keywords:["unica","breve periodo","tecnologia","irraggiungibili","economie di scala","diseconomie"]},{id:"u3-o11",q:"Distingui economie di scala reali e pecuniarie con le loro fonti.",answer:"Reali: diminuzioni del costo medio dovute a cambiamenti nelle quantit\xE0 di input. Fonti: indivisibilit\xE0 e costi una tantum, relazioni geometriche, specializzazione e divisione del lavoro (spilli di Adam Smith), tecnologia di produzione di massa. Pecuniarie: diminuzioni dovute al prezzo pagato per gli input. Fonti: finanziamenti pi\xF9 vantaggiosi, sconti per acquisti in grandi quantit\xE0 ed economie di commercializzazione, risparmi sui trasporti.",keywords:["reali","quantit\xE0","indivisibilit\xE0","specializzazione","pecuniarie","prezzo"]},{id:"u3-o12",q:"Perch\xE9 nascono le diseconomie di scala?",answer:"Crescendo l\u2019impresa sostiene costi di coordinamento (gestire sedi lontane, migliaia di operai) e di motivazione (quando propriet\xE0 e management si separano il manager pu\xF2 massimizzare il suo benessere; servono incentivi). Le economie di scala non scompaiono ma vengono pi\xF9 che compensate da questi costi: esempio dei cinque stabilimenti emiliano-romagnoli.",keywords:["coordinamento","motivazione","manager","incentivi","compensate"]},{id:"u3-o13",q:"Cos\u2019\xE8 la SEM e come si misura l\u2019importanza delle economie di scala?",answer:"La scala efficiente minima \xE8 la quantit\xE0 che minimizza il costo medio di lungo periodo. Si misura con l\u2019indice delle economie di scala: la percentuale di costo medio in pi\xF9 che sostiene un\u2019impresa che produce solo un terzo della SEM. Una U chiusa indica forti economie di scala, poche grandi imprese e barriere all\u2019entrata.",keywords:["minimizza","costo medio","un terzo","percentuale","barriere"]},{id:"u3-o14",q:"Spiega la regola R\u2019 = C\u2019 con l\u2019esempio dei tavoli.",answer:"Il profitto \xE8 \u03C0 = pq \u2212 cq. Per vendere pi\xF9 tavoli bisogna abbassare il prezzo. Si aumenta la produzione finch\xE9 il ricavo marginale supera il costo marginale. Fino al sesto tavolo R\u2019 > C\u2019; il settimo ha R\u2019 = 9 e C\u2019 = 12, profitto marginale \u22123. Ci si ferma a 6 tavoli con profitto massimo 27. La regola vale per ogni struttura di mercato.",keywords:["ricavo marginale","costo marginale","6 tavoli","27","ogni struttura"]},{id:"u3-o15",q:"Cosa succede nel lunghissimo periodo?",answer:"Possono cambiare non solo i fattori ma anche le tecnologie. I cambiamenti tecnologici sono spesso risposte interne delle imprese a cambiamenti esterni, come la minore disponibilit\xE0 di un fattore o nuove norme: un produttore di auto pensa gi\xE0 al 2035, quando le auto saranno solo elettriche, o all\u2019idrogeno.",keywords:["tecnologi","risposte","esterne","normativ","2035"]}],cards:[{id:"u3-c1",front:"Prodotto marginale P\u2019",back:"\u0394PT / \u0394L: quanto aumenta il prodotto con un\u2019unit\xE0 in pi\xF9 di input variabile."},{id:"u3-c2",front:"Prodotto medio PM",back:"PT / L."},{id:"u3-c3",front:"Legge dei rendimenti decrescenti",back:"Con capitale dato, da un certo punto PM e P\u2019 del fattore variabile diminuiscono."},{id:"u3-c4",front:"P\u2019 e PM si incrociano\u2026",back:"nel punto di massimo del PM."},{id:"u3-c5",front:"Costo opportunit\xE0",back:"Costo esplicito + implicito: tutto ci\xF2 a cui si rinuncia."},{id:"u3-c6",front:"Valore aggiunto",back:"Profitto economico: valore della produzione \u2212 costo di tutti i fattori."},{id:"u3-c7",front:"CMT",back:"CT / Q = CMF + CMV."},{id:"u3-c8",front:"C\u2019 (costo marginale)",back:"\u0394CT / \u0394Q: costo di un\u2019unit\xE0 in pi\xF9."},{id:"u3-c9",front:"C\u2019 incrocia il CMT\u2026",back:"nel minimo del CMT (capacit\xE0 ottimale di breve)."},{id:"u3-c10",front:"Minimo costo nel lungo periodo",back:"P\u2019K / pK = P\u2019L / pL  \u21D4  P\u2019K / P\u2019L = pK / pL."},{id:"u3-c11",front:"Principio di sostituzione",back:"Le imprese usano di pi\xF9 il fattore meno costoso."},{id:"u3-c12",front:"CMLP",back:"Unica curva di costo medio di lungo periodo; a U per economie e diseconomie di scala."},{id:"u3-c13",front:"Economie di scala reali",back:"Indivisibilit\xE0, relazioni geometriche, specializzazione, produzione di massa."},{id:"u3-c14",front:"Economie di scala pecuniarie",back:"Finanziamenti migliori, sconti sugli acquisti, risparmi sui trasporti."},{id:"u3-c15",front:"Diseconomie di scala",back:"Costi di coordinamento e di motivazione."},{id:"u3-c16",front:"SEM",back:"Quantit\xE0 che minimizza il costo medio di lungo periodo."},{id:"u3-c17",front:"Indice delle economie di scala",back:"% di costo medio in pi\xF9 producendo 1/3 della SEM."},{id:"u3-c18",front:"Regola del massimo profitto",back:"R\u2019 = C\u2019 (vale per ogni struttura di mercato)."},{id:"u3-c19",front:"Curva R\u2019 con domanda lineare",back:"Parte dallo stesso punto della domanda e taglia l\u2019asse X a Q/2."},{id:"u3-c20",front:"Profitto \u03C0",back:"\u03C0 = (p \xD7 q) \u2212 (c \xD7 q)."}]},C0=hz;var yz={id:"u4",n:4,title:"Strutture di mercato",subtitle:"Concorrenza, monopolio, oligopolio",color:"#8B5CF6",colorDark:"#6D3FD8",lessons:[{id:"u4l1",title:"Barriere all\u2019entrata e all\u2019uscita",icon:"\u{1F6A7}",theory:[{title:"Struttura di mercato e potere di mercato",points:["La **struttura di mercato** \xE8 l\u2019insieme delle caratteristiche che determinano comportamento e performance di acquirenti e venditori: livello competitivo, differenze tra prodotti, barriere.","Quattro forme: **concorrenza perfetta**, **monopolio** e concorrenza imperfetta (**oligopolio** e **concorrenza monopolistica**).","**Potere di mercato**: capacit\xE0 di fissare un prezzo pi\xF9 alto dei propri costi medi e marginali."]},{title:"Barriere all\u2019entrata",points:["Sono extra costi o svantaggi che un **nuovo entrante** sopporta rispetto alle imprese gi\xE0 presenti (**incumbent**). Il costo del capannone non \xE8 una barriera: l\u2019hanno pagato tutti.","1. **Economie di scala**. 2. **Propriet\xE0 esclusiva dei fattori** (De Beers e il 90% delle miniere, il terreno panoramico in vetta). 3. **Differenziazione di prodotto** (Samsung contro l\u2019immagine dell\u2019iPhone).","4. **Costi di riconversione del cliente** (tastiera QWERTY). 5. **Esternalit\xE0 di rete** (Facebook; Apple incompatibile con Microsoft). 6. **Barriere legali** (brevetti, licenze dei taxi).","7. **Fabbisogno di capitali**: chi \xE8 gi\xE0 nel settore trova finanziamenti pi\xF9 facilmente. 8. **Altri vantaggi**: ubicazione, ostacoli linguistici, culturali, religiosi."]},{title:"Barriere all\u2019uscita",points:["Alti costi (opportunit\xE0) **non recuperabili** (sunk costs) per uscire dal mercato.","1. **Impianti specializzati** (la macchina costruita per gli abiti in metallo di Ferr\xE8). 2. **Costi fissi di uscita** per contratti di lavoro o fornitura (non il semplice licenziamento). 3. **Interdipendenze strategiche** (contratto quinquennale). 4. **Barriere emotive** (i nipoti di Ferrero). 5. **Ostacoli politici e sociali** (sindacati).","Le barriere all\u2019uscita rendono gli incumbent pi\xF9 aggressivi e li spingono a costruire barriere all\u2019entrata strategiche (prezzi predatori, prezzi limite)."]}],exercises:[{id:"u4-1-1",type:"mc",topic:"Barriere all\u2019entrata",q:"Cos\u2019\xE8 una barriera all\u2019entrata?",options:["Uno svantaggio del nuovo entrante rispetto agli incumbent","Qualsiasi costo necessario per avviare una nuova impresa","Il costo che un\u2019impresa sostiene per uscire dal mercato","Un costo che sostengono allo stesso modo tutte le imprese"],answer:0,explain:"\xC8 un vantaggio dell\u2019incumbent sul nuovo entrante."},{id:"u4-1-2",type:"tf",topic:"Barriere all\u2019entrata",q:"Il costo per costruire il capannone \xE8 una barriera all\u2019entrata.",answer:!1,explain:"Lo hanno sostenuto anche gli incumbent, quindi non crea uno svantaggio per chi entra."},{id:"u4-1-3",type:"match",topic:"Barriere all\u2019entrata",q:"Abbina ogni esempio alla barriera all\u2019entrata",pairs:[["De Beers e il 90% delle miniere","Propriet\xE0 esclusiva dei fattori"],["Tastiera QWERTY","Costi di riconversione del cliente"],["Facebook e gli amici gi\xE0 iscritti","Esternalit\xE0 di rete"],["Licenze dei taxi","Barriere legali"],["Samsung contro l\u2019immagine dell\u2019iPhone","Differenziazione di prodotto"]],explain:"Sono gli esempi del docente per ciascuna barriera."},{id:"u4-1-4",type:"mc",topic:"Esternalit\xE0 di rete",q:"Domani inventi un social pi\xF9 bello di Facebook. Perch\xE9 rischia di non avere successo?",options:["Perch\xE9 il suo valore dipende da quanti altri utenti lo usano","Perch\xE9 per aprire un social serve una licenza pubblica","Per le economie di scala dei server di Facebook","Per i costi di uscita sostenuti da Facebook"],answer:0,explain:"Esternalit\xE0 di rete: il valore di un prodotto cresce con il numero di utenti."},{id:"u4-1-5",type:"mc",topic:"Barriere all\u2019uscita",q:"Quale di questi \xE8 una barriera all\u2019uscita?",options:["Un impianto specializzato con alti costi di riconversione","Vendere il fabbricato quando si chiude l\u2019attivit\xE0","Licenziare i dipendenti con il normale preavviso","Pagare le ultime forniture di materie prime"],answer:0,explain:"Vendere il fabbricato o licenziare sono costi comuni a tutti. L\u2019impianto per gli abiti di Ferr\xE8 \xE8 difficile da rivendere."},{id:"u4-1-6",type:"match",topic:"Barriere all\u2019uscita",q:"Abbina ogni barriera all\u2019uscita al suo esempio",pairs:[["Barriere emotive","I nipoti di Ferrero"],["Ostacoli politici e sociali","Sindacati che protestano per la chiusura"],["Interdipendenze strategiche","Contratto di 5 anni con Ferr\xE8"],["Costi fissi di uscita","Clausole di buonuscita altissime"]],explain:"Sono tutti costi non recuperabili che frenano l\u2019uscita."},{id:"u4-1-7",type:"tf",topic:"Barriere all\u2019uscita",q:"Le barriere all\u2019uscita possono agire come barriere all\u2019entrata.",answer:!0,explain:"Rendono gli incumbent pi\xF9 aggressivi: costruiscono barriere strategiche come prezzi predatori o prezzi limite."},{id:"u4-1-8",type:"mc",topic:"Potere di mercato",q:"Il potere di mercato \xE8\u2026",options:["la capacit\xE0 di fissare un prezzo pi\xF9 alto dei propri costi medi e marginali","la quota di mercato pi\xF9 alta tra le imprese del settore","la capacit\xE0 di produrre di pi\xF9 a parit\xE0 di costi","il numero di clienti fedeli che l\u2019impresa riesce a mantenere"],answer:0,explain:"Cambia a seconda della struttura di mercato."},{id:"u4-1-9",type:"mc",topic:"Fabbisogno di capitali",q:"Il fabbisogno di capitali \xE8 una barriera perch\xE9\u2026",options:["le imprese nuove trovano finanziamenti con pi\xF9 difficolt\xE0 di chi \xE8 gi\xE0 nel settore","tutte le imprese devono comunque fare un investimento iniziale","per gli incumbent il capitale \xE8 gratuito","le banche non prestano mai denaro alle imprese del settore"],answer:0,explain:"Non \xE8 l\u2019investimento iniziale in s\xE9 (lo fanno tutti), ma il diverso accesso al credito."}]},{id:"u4l2",title:"Concorrenza perfetta",icon:"\u{1F33D}",theory:[{title:"Le 5 caratteristiche",points:["Quasi inesistente nella realt\xE0, ma \xE8 l\u2019**ottimo teorico** (massimo benessere complessivo) e il **termine di paragone** per le altre strutture.","1. Tanti consumatori e tante piccole imprese, tutte **price-taker** (il mais: nessuno influenza il prezzo, anche se produce quantit\xE0 diverse).","2. Prodotto **standardizzato**. 3. **Simmetria tecnologica**: tutti hanno accesso alle stesse tecnologie. 4. **Informazione perfetta** degli acquirenti. 5. **Nessuna barriera** all\u2019entrata o all\u2019uscita.","Devono valere **tutte e cinque** insieme."]},{title:"La singola impresa",points:["Fronteggia una **domanda orizzontale** al prezzo di mercato: P = R\u2019 = ricavo medio.","Offre dove **R\u2019 = C\u2019**. La sua curva di offerta coincide con la curva del **C\u2019 sopra il minimo del CMT**; sotto quel prezzo non produce (\xE8 sull\u2019asse Y).","**Breve periodo**: se P > CMT ci sono **extraprofitti** (P \u2212 CM per unit\xE0); se P < CMT perdite. Non \xE8 equilibrio di lungo.","**Lungo periodo**: gli extraprofitti attirano nuove imprese, il prezzo scende fino al **minimo del CMT**. Profitti **normali** (nulli): si coprono tutti i costi opportunit\xE0.","Solo in concorrenza perfetta la condizione di massimo profitto si scrive **C\u2019 = P**, perch\xE9 P = R\u2019."]}],exercises:[{id:"u4-2-1",type:"mc",topic:"Caratteristiche",q:"Perch\xE9 si studia la concorrenza perfetta se nella realt\xE0 quasi non esiste?",options:["\xC8 l\u2019ottimo teorico e il termine di paragone per le altre","Perch\xE9 \xE8 la struttura di mercato pi\xF9 diffusa nella realt\xE0","Perch\xE9 \xE8 quella che massimizza il surplus del produttore","Perch\xE9 ha barriere all\u2019entrata forti che la rendono stabile"],answer:0,explain:"Massimizza la somma dei surplus: per i neoclassici \xE8 la struttura ideale."},{id:"u4-2-2",type:"order",topic:"Caratteristiche",q:"Metti in ordine le 5 caratteristiche come negli appunti",items:["Tante piccole imprese price-taker","Prodotto standardizzato","Simmetria tecnologica","Informazione perfetta","Nessuna barriera all\u2019entrata o all\u2019uscita"],explain:"Ne basta una mancante e non \xE8 pi\xF9 concorrenza perfetta."},{id:"u4-2-3",type:"tf",topic:"Price-taker",q:"In concorrenza perfetta tutte le imprese producono la stessa quantit\xE0.",answer:!1,explain:"Ognuno pu\xF2 avere ettari diversi: il punto \xE8 che nessuno \xE8 abbastanza grande da influenzare il prezzo."},{id:"u4-2-4",type:"mc",topic:"Domanda della singola impresa",q:"Com\u2019\xE8 la curva di domanda che fronteggia la singola impresa in concorrenza perfetta?",options:["Orizzontale al prezzo di mercato","Discendente come quella di mercato","Verticale","Crescente"],answer:0,explain:"L\u2019impresa \xE8 price-taker: pu\xF2 solo scegliere quanto offrire a quel prezzo. Per questo P = R\u2019."},{id:"u4-2-5",type:"mc",topic:"Curva di offerta",q:"La curva di offerta della singola impresa in concorrenza perfetta coincide con\u2026",options:["la curva del C\u2019 per prezzi sopra il minimo del CMT","la curva del costo medio totale in tutti i suoi punti","la curva di domanda orizzontale al prezzo di mercato","l\u2019asse delle quantit\xE0, perch\xE9 l\u2019impresa \xE8 price-taker"],answer:0,explain:"\xC8 una spezzata: sull\u2019asse Y per prezzi sotto il minimo del CMT, poi lungo il C\u2019."},{id:"u4-2-6",type:"mc",topic:"Equilibrio di breve",q:"Nel breve periodo P \xE8 maggiore del CMT nel punto R\u2019 = C\u2019. Cosa ottiene l\u2019impresa?",options:["Extraprofitti, che per\xF2 attirano nuove imprese","Profitti nulli, perch\xE9 copre solo i costi opportunit\xE0","Perdite, perch\xE9 \xE8 price-taker","Un equilibrio di lungo periodo stabile"],answer:0,explain:"Con extraprofitti entrano altre imprese, l\u2019offerta aumenta e il prezzo scende."},{id:"u4-2-7",type:"hotspot",topic:"Equilibrio di lungo",scene:"conc-perfetta-lp",q:"Tocca il punto di equilibrio di lungo periodo dell\u2019impresa in concorrenza perfetta.",answer:"eq",explain:"P = R\u2019 incrocia il C\u2019 esattamente nel minimo del CMT: profitti normali."},{id:"u4-2-8",type:"fill",topic:"Equilibrio di lungo",text:"Nel lungo periodo in concorrenza perfetta il prezzo \xE8 uguale al ___ del costo medio totale e i profitti sono ___.",answers:["minimo","normali"],extra:["massimo","extra","negativi"],explain:"Profitti normali (nulli) significa che si coprono tutti i costi opportunit\xE0: non si lavora gratis."},{id:"u4-2-9",type:"mc",topic:"Condizione di massimo profitto",q:"In quale struttura di mercato la condizione di massimo profitto si pu\xF2 scrivere C\u2019 = P?",options:["Solo in concorrenza perfetta","In tutte le strutture di mercato","Solo in monopolio","Solo in oligopolio"],answer:0,explain:"La regola generale \xE8 R\u2019 = C\u2019. Solo in concorrenza perfetta P = R\u2019, quindi C\u2019 = P."},{id:"u4-2-10",type:"tf",topic:"Profitti normali",q:"Profitti nulli in concorrenza perfetta significa che l\u2019impresa lavora gratis.",answer:!1,explain:"Il profitto economico nullo copre gi\xE0 tutti i costi opportunit\xE0, compresa la remunerazione dell\u2019imprenditore."}]},{id:"u4l3",title:"Monopolio",icon:"\u{1F451}",theory:[{title:"Caratteristiche e prezzo",points:["Un\u2019unica impresa offre il bene (**impresa e settore coincidono**); barriere elevatissime (**mercato non contendibile**); tanti consumatori.","La domanda di mercato \xE8 la domanda dell\u2019impresa: discendente. Il monopolista \xE8 **price-maker** ma non fissa prezzi stellari, perch\xE9 nessuno comprerebbe.","Sceglie la quantit\xE0 dove **R\u2019 = C\u2019** e la proietta sulla **curva di domanda** per trovare il prezzo. La differenza tra prezzo e costo medio \xE8 **extraprofitto**.","**Perdita secca**: benessere perso che non va n\xE9 ai consumatori n\xE9 ai produttori. Prezzo pi\xF9 alto e quantit\xE0 pi\xF9 bassa della concorrenza perfetta."]},{title:"Tipi di monopolio e intervento pubblico",points:["**Legale**: autorizzazione del governo, brevetto o copyright (temporaneo). **Tecnologico**: vantaggio tecnologico (Intel) o controllo esclusivo di risorse (De Beers). **Naturale**: economie di scala cos\xEC forti che un\u2019impresa sola produce a costi minori di due o pi\xF9.","**Subadditivit\xE0 dei costi**: produrre tutto insieme costa meno della somma dei costi per produrne le frazioni.","Lo Stato pu\xF2: **A** stimolare la concorrenza (antitrust che divide l\u2019impresa); **B** regolare il prezzo (prezzo massimo, ma non conosce i costi); **C** trasformare il monopolio in impresa pubblica (Trenitalia).","**Rent creation**: diventare monopolista innovando. **Rent seeking**: spendere per ottenere il monopolio dal potere pubblico, ad esempio corrompendo il funzionario (Stretto di Messina)."]}],exercises:[{id:"u4-3-1",type:"mc",topic:"Monopolio",q:"Come determina prezzo e quantit\xE0 il monopolista?",options:["Sceglie Q dove R\u2019 = C\u2019 e legge il prezzo sulla curva di domanda","Sceglie il prezzo pi\xF9 alto che la domanda pu\xF2 sopportare","Fissa il prezzo uguale al costo marginale, come in concorrenza","Produce la quantit\xE0 massima e poi alza il prezzo"],answer:0,explain:"La quantit\xE0 si proietta sulla curva di domanda: l\xEC c\u2019\xE8 il prezzo che i consumatori pagano."},{id:"u4-3-2",type:"hotspot",topic:"Monopolio",scene:"monopolio",q:"Tocca il punto che indica prezzo e quantit\xE0 di monopolio.",answer:"pm",explain:"\xC8 sulla curva di domanda, in corrispondenza della quantit\xE0 dove R\u2019 = C\u2019."},{id:"u4-3-3",type:"hotspot",topic:"Perdita secca",scene:"monopolio",q:"Tocca l\u2019area della perdita secca generata dal monopolio.",answer:"dwl",explain:"\xC8 il triangolo tra domanda e C\u2019, dalla quantit\xE0 di monopolio a quella di concorrenza: benessere che non va a nessuno."},{id:"u4-3-4",type:"tf",topic:"Monopolio",q:"Siccome \xE8 price-maker, il monopolista fissa prezzi altissimi a piacere.",answer:!1,explain:"Con prezzi troppo alti nessuno comprerebbe: deve trovare la giusta combinazione prezzo-quantit\xE0.",profNote:"Sotto un grafico gli appunti annotano che R\u2019 = C\u2019 \u201Cdovrebbe coincidere con il minimo della curva di costo medio\u201D. Non \xE8 cos\xEC: in monopolio il punto R\u2019 = C\u2019 non deve cadere nel minimo del CM. Solo nell\u2019equilibrio di lungo periodo della concorrenza perfetta il prezzo coincide con il minimo del CMT."},{id:"u4-3-5",type:"match",topic:"Tipi di monopolio",q:"Abbina ogni monopolio al suo tipo",pairs:[["Brevetto su un farmaco","Legale"],["Intel, la prima a produrre chip","Tecnologico"],["De Beers e le miniere","Tecnologico (risorse naturali)"],["Rete idrica con forti economie di scala","Naturale"]],explain:"Il monopolio naturale nasce da economie di scala cos\xEC forti che un\u2019impresa sola \xE8 pi\xF9 efficiente."},{id:"u4-3-6",type:"mc",topic:"Monopolio naturale",q:"Cosa dice il principio di subadditivit\xE0 dei costi?",options:["Produrre tutto insieme costa meno della somma dei costi per produrne le frazioni","Il costo marginale resta costante qualunque sia la quantit\xE0","I costi fissi diventano nulli quando l\u2019impresa \xE8 molto grande","Due imprese producono insieme a costi minori di una sola"],answer:0,explain:"\xC8 ci\xF2 che giustifica il monopolio naturale: una sola grande impresa \xE8 pi\xF9 efficiente di tante piccole."},{id:"u4-3-7",type:"match",topic:"Intervento statale",q:"Abbina ogni intervento pubblico al suo esempio",pairs:[["Stimolare la concorrenza","L\u2019antitrust divide l\u2019impresa in 10"],["Regolare il comportamento","Prezzo massimo sul treno Bologna-Ferrara"],["Impresa pubblica","Trenitalia"]],explain:"Il limite del prezzo massimo \xE8 che lo Stato non conosce la curva dei costi del monopolista."},{id:"u4-3-8",type:"mc",topic:"Rent seeking",q:"Un\u2019impresa corrompe il funzionario per vincere l\u2019appalto del Ponte sullo Stretto. \xC8\u2026",options:["rent seeking","rent creation","concorrenza perfetta","monopolio naturale"],answer:0,explain:"Non cerca di essere la migliore ma di ottenere il monopolio dal potere pubblico. La rent creation invece passa dall\u2019innovazione."},{id:"u4-3-9",type:"mc",topic:"Perdita secca",q:"Perch\xE9 i neoclassici sono contrari al monopolio?",options:["Genera una perdita secca: risorse usate in modo inefficiente","Perch\xE9 il monopolista fa profitti nulli e non investe","Perch\xE9 il prezzo di monopolio \xE8 troppo basso per coprire i costi","Perch\xE9 il monopolista produce una quantit\xE0 troppo alta"],answer:0,explain:"Rispetto alla concorrenza perfetta il sistema produce meno ricchezza; parte del surplus dei consumatori passa all\u2019impresa."},{id:"u4-3-10",type:"fill",topic:"Monopolio",text:"Nel monopolio il mercato \xE8 non ___, perch\xE9 le barriere all\u2019ingresso sono elevatissime; il monopolista \xE8 price-___.",answers:["contendibile","maker"],extra:["taker","concentrato"],explain:"Mercato contendibile = barriere molto basse. Il monopolista fissa il prezzo."}]},{id:"u4l4",title:"Cournot e Stackelberg",icon:"\u265F\uFE0F",theory:[{title:"L\u2019oligopolio",points:["Poche imprese con prodotti simili ma non uguali. \u201CPoche\u201D non \xE8 un numero: conta l\u2019**interdipendenza**, cio\xE8 sapere che le proprie scelte provocano reazioni dei rivali.","**Variazioni congetturali**: le ipotesi che ogni impresa fa sulle reazioni dei rivali. \xC8 come giocare a scacchi.","Dilemma tra vantaggi della competizione e della **collusione** (accordo, implicito o esplicito, per ridurre la concorrenza).","Modelli non collusivi: **Cournot** e **Stackelberg** (si decide l\u2019output), **Bertrand** (si decide il prezzo)."]},{title:"Il duopolio di Cournot",points:["Ipotesi: 2 imprese, output identico, potere di mercato, barriere insormontabili, **C\u2019 = 0**, domanda lineare, massimo profitto, **variazione congetturale nulla** (ognuno pensa che l\u2019altro non reagir\xE0).","Mercato = 1. Round 1: A fa il monopolista \u2192 **1/2**; B serve met\xE0 del residuo \u2192 **1/4**.","Round 2: A \u2192 (1 \u2212 1/4)/2 = **3/8**; B \u2192 (1 \u2212 3/8)/2 = **5/16**. Round 3: A \u2192 **11/32**; B \u2192 **21/64**.","Equilibrio di **Cournot-Nash**: **1/3 e 1/3** (totale 2/3). Nessuno ha incentivo a cambiare dato l\u2019output dell\u2019altro. \xC8 l\u2019incrocio delle **funzioni di reazione**.","Pro: matematica in economia, equilibrio tra monopolio e concorrenza, termine di paragone. Contro: congettura nulla irrealistica, nessun apprendimento, ignora la collusione."]},{title:"Il duopolio di Stackelberg",points:["Come Cournot, ma la congettura nulla cade per **una** impresa: il **leader** conosce la funzione di reazione del follower (vantaggio del pioniere).","Un solo round: il leader produce **1/2** come un monopolista e il follower si adegua sulla sua funzione di reazione (**1/4**). Punto Sa se il leader \xE8 A, Sb se \xE8 B.","Se **entrambi** vogliono fare i leader si va nel punto **P-W**: disequilibrio, sovrapproduzione, il prezzo crolla finch\xE9 uno riduce l\u2019output."]}],exercises:[{id:"u4-4-1",type:"mc",topic:"Oligopolio",q:"Cosa caratterizza davvero un oligopolio?",options:["L\u2019interdipendenza tra le scelte delle imprese","Avere esattamente da 3 a 5 imprese nel mercato","Produrre un bene perfettamente identico tra le imprese","L\u2019assenza di barriere all\u2019entrata e all\u2019uscita"],answer:0,explain:"\u201CPoche\u201D non \xE8 una soglia numerica: \xE8 un gruppo in cui pi\xF9 o meno ci si conosce tutti."},{id:"u4-4-2",type:"mc",topic:"Variazioni congetturali",q:"Cosa sono le variazioni congetturali?",options:["Le ipotesi che un\u2019impresa fa sulle reazioni dei rivali","Le variazioni del prezzo di mercato nel tempo","Gli spostamenti della curva di domanda","Gli errori di previsione dei manager"],answer:0,explain:"\u201CSe aumento l\u2019output del 20%, il rivale cosa far\xE0?\u201D"},{id:"u4-4-3",type:"num",topic:"Cournot",q:"Cournot, mercato = 1. Al primo round B produce 1/4. Quanto produce A al secondo round? (frazione o decimale)",answer:.375,tol:.001,shown:"3/8 (0,375)",explain:"Il mercato residuo di A \xE8 1 \u2212 1/4 = 3/4. Come un monopolista ne produce la met\xE0: 3/8 = 0,375."},{id:"u4-4-4",type:"num",topic:"Cournot",q:"A al secondo round produce 3/8. Quanto produce B al secondo round?",answer:.3125,tol:.001,shown:"5/16 (0,3125)",explain:"Mercato residuo di B: 1 \u2212 3/8 = 5/8. Ne produce met\xE0: 5/16 = 0,3125."},{id:"u4-4-5",type:"order",topic:"Cournot",q:"Ordina le quantit\xE0 prodotte da A nei round del modello di Cournot",items:["1/2","3/8","11/32","1/3 (equilibrio)"],explain:"A produce sempre di meno, B sempre di pi\xF9, fino a 1/3 ciascuno."},{id:"u4-4-6",type:"num",topic:"Cournot",q:"All\u2019equilibrio di Cournot-Nash, quanto producono le due imprese in totale? (mercato = 1)",answer:.6667,tol:.005,shown:"2/3 (circa 0,667)",explain:"1/3 + 1/3 = 2/3: pi\xF9 del monopolio (1/2), meno della concorrenza perfetta (1)."},{id:"u4-4-7",type:"hotspot",topic:"Funzioni di reazione",scene:"cournot",q:"Tocca l\u2019equilibrio di Cournot-Nash.",answer:"cn",explain:"\xC8 l\u2019incrocio delle due funzioni di reazione: (1/3, 1/3)."},{id:"u4-4-8",type:"hotspot",topic:"Stackelberg",scene:"cournot",q:"A \xE8 leader alla Stackelberg. Tocca il punto di equilibrio.",answer:"sa",explain:"A produce 1/2 e B reagisce sulla propria funzione di reazione FRB: punto Sa (1/2, 1/4)."},{id:"u4-4-9",type:"hotspot",topic:"Stackelberg",scene:"cournot",q:"Entrambe le imprese vogliono fare le leader. Tocca il punto di disequilibrio.",answer:"pw",explain:"Punto P-W: entrambe producono 1/2, il mercato non assorbe tutto e il prezzo crolla."},{id:"u4-4-10",type:"mc",topic:"Cournot",q:"Qual \xE8 la principale critica al modello di Cournot?",options:["La congettura nulla \xE8 irrealistica: nessuno impara","Non usa strumenti matematici per descrivere le scelte","Non arriva a nessun punto di equilibrio","Suppone costi marginali altissimi per entrambe le imprese"],answer:0,explain:"A ogni round l\u2019ipotesi si rivela falsa, perch\xE9 l\u2019altra impresa reagisce. Inoltre ignora la collusione."},{id:"u4-4-11",type:"tf",topic:"Stackelberg",q:"Nel modello di Stackelberg il gioco ha un solo round: il leader decide e il follower si adegua.",answer:!0,explain:"Il leader non reagisce pi\xF9, perch\xE9 sa che cambiando output l\u2019altro aumenterebbe e si finirebbe verso Cournot."},{id:"u4-4-12",type:"mc",topic:"Stackelberg",q:"Come si interpreta il vantaggio informativo del leader di Stackelberg?",options:["Come vantaggio del pioniere","Come un monopolio legale concesso dallo Stato","Come un accordo di collusione con il follower","Come un effetto delle esternalit\xE0 di rete"],answer:0,explain:"Spiega perch\xE9 in alcuni mercati ci sono leader con alte quote e follower con quote pi\xF9 basse."}]},{id:"u4l5",title:"Bertrand, cartelli e giochi",icon:"\u{1F3B2}",theory:[{title:"Il duopolio di Bertrand",points:["Le imprese fissano il **prezzo**, non l\u2019output. Imprese identiche (stesso C\u2019 orizzontale), prodotto omogeneo, informazione perfetta, nessun costo di transazione per i clienti.","A fissa il prezzo di monopolio; B lo abbassa di poco e ruba tutti i clienti; A fa lo stesso\u2026","Si arriva a **P = C\u2019**: prezzo e quantit\xE0 di concorrenza perfetta, ognuno produce **met\xE0 di Qc**. Bastano due imprese per avere un risultato concorrenziale.","Da qui la critica: bisogna considerare i modelli **collusivi**."]},{title:"Cartelli e collusione",points:["Un **cartello** \xE8 un accordo formale o informale per tenere prezzi pi\xF9 alti o quantit\xE0 pi\xF9 basse, simil-monopolio. \xC8 **illegale**.","Pi\xF9 probabile se: poche imprese; imprese simili (costi, quote, prodotto); ordini piccoli e frequenti; l\u2019accordo non aumenta la concorrenza; ci sono agenti di vendita comuni o associazioni; le punizioni attese sono basse; si possono prevenire le deviazioni (quote fisse, clausola \u201Cnazione privilegiata\u201D).","**Scartellare**: non rispettare l\u2019accordo. **OPEC**: negli anni \u201970 i produttori tagliano la quantit\xE0 e guadagnano di pi\xF9 vendendo meno.","Senza accordo c\u2019\xE8 un **effetto quantit\xE0** (pi\xF9 output, pi\xF9 profitto) e un **effetto prezzo** (pi\xF9 output abbassa il prezzo di tutte le unit\xE0)."]},{title:"Dilemma del prigioniero ed equilibrio di Nash",points:["Gigi e Toni interrogati separatamente: se uno confessa e l\u2019altro no, chi confessa esce e l\u2019altro fa 20 anni; se nessuno confessa 1 anno a testa; se confessano entrambi 5 anni.","**Confessare \xE8 la strategia dominante**: conviene qualunque cosa faccia l\u2019altro. Esito: entrambi confessano, anche se tacere sarebbe meglio per tutti e due.","**Equilibrio di Nash**: ogni giocatore fa la scelta migliore qualunque sia l\u2019azione degli altri.","Ajinomoto e ADM: con 30.000 t ciascuno 180 milioni a testa; chi produce 40.000 mentre l\u2019altro resta a 30.000 fa 200 e l\u2019altro 150; con 40.000 entrambi 160. Si finisce a 40.000: i cartelli tendono ad autodistruggersi."]}],exercises:[{id:"u4-5-1",type:"mc",topic:"Bertrand",q:"Nel modello di Bertrand le imprese decidono\u2026",options:["il prezzo","la quantit\xE0","il numero di impianti","la pubblicit\xE0"],answer:0,explain:"Cournot e Stackelberg decidono l\u2019output, Bertrand il prezzo."},{id:"u4-5-2",type:"mc",topic:"Bertrand",q:"A quale equilibrio arriva il modello di Bertrand?",options:["P = C\u2019: prezzo e quantit\xE0 di concorrenza perfetta, divise a met\xE0","Al prezzo di monopolio, diviso tra le due imprese","All\u2019equilibrio di Cournot-Nash con 1/3 a testa","A un cartello stabile tra le due imprese"],answer:0,explain:"Ognuno riduce il prezzo per rubare i clienti finch\xE9 il profitto copre solo i costi. qA = qB = Qc/2."},{id:"u4-5-3",type:"tf",topic:"Bertrand",q:"Nel modello di Bertrand l\u2019impresa con il prezzo leggermente pi\xF9 basso conquista tutti i clienti.",answer:!0,explain:"Prodotto omogeneo, informazione perfetta e nessun costo di transazione per i clienti."},{id:"u4-5-4",type:"mc",topic:"Cartelli",q:"Quale condizione rende pi\xF9 probabile che un cartello si formi e venga rispettato?",options:["Poche imprese simili per costi, quote e prodotto","Molte imprese, molto diverse per costi e quote","Ordini grandi e rari","Punizioni attese dall\u2019antitrust molto alte"],answer:0,explain:"Con ordini grandi si tende a scartellare; con punizioni alte conviene meno colludere."},{id:"u4-5-5",type:"tf",topic:"Cartelli",q:"Le imprese piccole all\u2019interno di un cartello hanno pi\xF9 incentivo a scartellare delle grandi.",answer:!0,explain:"\xC8 uno dei motivi per cui il cartello regge meglio se le imprese sono simili anche per quote di mercato."},{id:"u4-5-6",type:"mc",topic:"OPEC",q:"Cosa fece l\u2019OPEC durante la crisi energetica degli anni \u201970?",options:["Tagli\xF2 la quantit\xE0 e i produttori guadagnarono di pi\xF9 vendendo meno","Aument\xF2 la produzione per abbassare il prezzo del petrolio","Fiss\xF2 il prezzo uguale al costo marginale di estrazione","Si sciolse subito perch\xE9 i paesi non si fidavano"],answer:0,explain:"\xC8 un cartello: riducendo l\u2019output si ottiene una situazione simil-monopolistica."},{id:"u4-5-7",type:"mc",topic:"Dilemma del prigioniero",q:"Nel dilemma di Gigi e Toni, qual \xE8 la strategia dominante?",options:["Confessare","Tacere","Dipende dal torto subito","Non esiste"],answer:0,explain:"Se l\u2019altro confessa conviene confessare (5 anni invece di 20); se tace conviene confessare (esco invece di 1 anno)."},{id:"u4-5-8",type:"num",topic:"Dilemma del prigioniero",q:"All\u2019equilibrio di Nash del dilemma, quanti anni di prigione fa ciascuno dei due?",answer:5,tol:0,unit:"anni",explain:"Confessano entrambi: 5 anni a testa, peggio dell\u2019anno a testa che otterrebbero colludendo."},{id:"u4-5-9",type:"mc",topic:"Equilibrio di Nash",q:"L\u2019equilibrio di Nash \xE8\u2026",options:["ognuno fa la scelta migliore qualunque cosa facciano gli altri","il risultato migliore possibile per tutti i giocatori","l\u2019accordo di cartello che massimizza il profitto congiunto","il prezzo di concorrenza perfetta raggiunto con due imprese"],answer:0,explain:"Non \xE8 necessariamente l\u2019esito migliore collettivamente: nel dilemma \xE8 peggiore della cooperazione."},{id:"u4-5-10",type:"num",topic:"Ajinomoto e ADM",q:"Ajinomoto e ADM producono entrambe 40.000 tonnellate. Quanti milioni di profitto fa ciascuna?",answer:160,tol:0,unit:"milioni \u20AC",explain:"Matrice: 30/30 = 180 e 180; 40/30 = 200 per chi devia e 150 per l\u2019altra; 40/40 = 160 e 160.",profNote:"Gli appunti scrivono che se entrambi alzano la quantit\xE0 \u201Cabbiamo un profitto ancora pi\xF9 alto\u201D. Dalla matrice \xE8 il contrario: con 40.000 t a testa si fanno 160 milioni, meno dei 180 dell\u2019accordo. Proprio per questo \xE8 un dilemma del prigioniero."},{id:"u4-5-11",type:"mc",topic:"Ajinomoto e ADM",q:"Perch\xE9, secondo gli appunti, gli economisti non si preoccupano troppo dei cartelli?",options:["La tentazione di scartellare \xE8 forte e spesso si autodistruggono","Perch\xE9 i cartelli sono legali in quasi tutti i paesi","Perch\xE9 i cartelli fanno abbassare i prezzi","Perch\xE9 nella realt\xE0 i cartelli non esistono"],answer:0,explain:"Prima o poi qualcuno devia. Alcuni cartelli per\xF2 durano e l\u2019antitrust li vieta per legge."},{id:"u4-5-12",type:"match",topic:"Oligopolio",q:"Abbina ogni modello alla variabile scelta o al risultato",pairs:[["Cournot","Output, 1/3 ciascuno"],["Stackelberg","Leader 1/2, follower 1/4"],["Bertrand","Prezzo, P = C\u2019"],["Cartello","Simil-monopolio"]],explain:"Ricorda che con C\u2019 = 0 e mercato = 1 il monopolio produce 1/2."}]},{id:"u4l6",title:"Concorrenza monopolistica",icon:"\u{1F9C0}",theory:[{title:"Pi\xF9 simile alla concorrenza perfetta",points:["Nonostante il nome \xE8 **pi\xF9 vicina alla concorrenza perfetta** che al monopolio: niente barriere, informazione fluida, offerta frammentata.","I prodotti sono simili ma **non identici**: per caratteristiche (olio di oliva e di girasole) o per **posizione geografica**.","Mozzarella Granarolo: 4 \u20AC sotto casa da Antonio, 2 \u20AC all\u2019Ipercoop. In pigiama compro da Antonio: decido in base al costo opportunit\xE0. Ma a 25 \u20AC andrei alla Coop."]},{title:"L\u2019equilibrio",points:["Si massimizza sempre con **R\u2019 = C\u2019** e si fissa il prezzo sulla domanda decrescente, come un monopolista, sfruttando il piccolo vantaggio (i clienti vicini).","In equilibrio la curva di **CMT \xE8 tangente alla curva di domanda**: P = CMT, quindi **profitti nulli** come in concorrenza perfetta.","Ma la tangenza **non \xE8 nel minimo** del CMT: c\u2019\xE8 **capacit\xE0 produttiva in eccesso**. Questo spiega le strategie aggressive per aumentare la quota di mercato.","Il piccolo triangolo di perdita secca \xE8 considerato tollerabile: \xE8 il prezzo da pagare per avere beni diversi."]}],exercises:[{id:"u4-6-1",type:"mc",topic:"Concorrenza monopolistica",q:"La concorrenza monopolistica \xE8 pi\xF9 simile\u2026",options:["alla concorrenza perfetta","al monopolio","all\u2019oligopolio collusivo","al monopolio naturale"],answer:0,explain:"Nessuna barriera, informazione fluida, offerta frammentata. Solo il prodotto non \xE8 identico."},{id:"u4-6-2",type:"mc",topic:"Differenziazione",q:"Perch\xE9 compro la mozzarella da Antonio a 4 \u20AC invece che alla Coop a 2 \u20AC?",options:["Il costo opportunit\xE0 di andare alla Coop (auto, strada, fila) \xE8 pi\xF9 alto","Perch\xE9 quella di Antonio \xE8 una mozzarella di marca diversa","Perch\xE9 il consumatore \xE8 irrazionale quando ha fretta","Perch\xE9 Antonio \xE8 un monopolista legale del quartiere"],answer:0,explain:"Lo stesso prodotto si differenzia per posizione geografica."},{id:"u4-6-3",type:"tf",topic:"Differenziazione",q:"Se da Antonio la mozzarella costasse 25 \u20AC la comprerei comunque l\xEC.",answer:!1,explain:"L\u2019alternativa esiste: Antonio ha un margine, ma non pu\xF2 essere l\u2019unico. Il prezzo non pu\xF2 salire troppo."},{id:"u4-6-4",type:"hotspot",topic:"Equilibrio",scene:"conc-monopolistica",q:"Tocca il punto di equilibrio di lungo periodo in concorrenza monopolistica.",answer:"tan",explain:"\xC8 il punto in cui la curva di CMT \xE8 tangente alla domanda, sopra la quantit\xE0 dove R\u2019 = C\u2019."},{id:"u4-6-5",type:"mc",topic:"Equilibrio",q:"Come si riconosce graficamente la concorrenza monopolistica in equilibrio?",options:["La curva di CMT \xE8 tangente alla curva di domanda","Il prezzo \xE8 orizzontale e tocca il minimo del CMT","R\u2019 = C\u2019 cade esattamente nel minimo del CMT","La curva di domanda \xE8 verticale e rigida"],answer:0,explain:"Prezzo uguale al costo medio (profitti nulli), ma non nel minimo del CMT."},{id:"u4-6-6",type:"fill",topic:"Equilibrio",text:"In equilibrio le imprese in concorrenza monopolistica hanno profitti ___ ma capacit\xE0 produttiva in ___.",answers:["nulli","eccesso"],extra:["alti","difetto"],explain:"La tangenza non \xE8 nel minimo del CMT: potrebbero produrre di pi\xF9 a costo medio pi\xF9 basso."},{id:"u4-6-7",type:"mc",topic:"Profitti",q:"Perch\xE9 in concorrenza monopolistica non ci sono extraprofitti nel lungo periodo?",options:["Perch\xE9 senza barriere entrano nuove imprese","Perch\xE9 lo Stato fissa un prezzo massimo per ogni prodotto","Perch\xE9 il costo marginale \xE8 zero per tutte le imprese","Perch\xE9 le imprese si accordano per non farsi concorrenza"],answer:0,explain:"L\u2019assenza di barriere azzera gli extraprofitti come in concorrenza perfetta."},{id:"u4-6-8",type:"tf",topic:"Perdita secca",q:"In concorrenza monopolistica la piccola perdita secca \xE8 considerata tollerabile.",answer:!0,explain:"\xC8 il prezzo che si paga per avere beni diversi tra loro."},{id:"u4-6-9",type:"mc",topic:"Strutture a confronto",figure:"conc-perfetta-lp",q:"Quale struttura di mercato \xE8 rappresentata nel grafico?",options:["Concorrenza perfetta in equilibrio di lungo periodo","Monopolio con prezzo fissato sulla domanda","Concorrenza monopolistica in equilibrio","Oligopolio di Cournot con due imprese"],answer:0,explain:"Prezzo orizzontale (P = R\u2019) che tocca il CMT nel suo minimo, dove passa anche il C\u2019."}]},{id:"u4l7",title:"Concentrazione e S-C-P",icon:"\u{1F4CA}",theory:[{title:"Il mercato rilevante",points:["Prima di misurare la concentrazione bisogna **definire il mercato**.","**Geografico**: due localit\xE0 sono nello stesso mercato se un aumento di prezzo in una fa aumentare significativamente la domanda nell\u2019altra. Bar a Ferrara e a Modena: no. Negozio a Ferrara e uno in Malesia online: s\xEC.","**Prodotto**: un mercato include i **sostituti stretti**. D\xE9collet\xE9 rossa e azzurra s\xEC; borsa D&G e borsa qualsiasi no (bisogni diversi). Si usa l\u2019**elasticit\xE0 incrociata**: zero = mercati diversi, positiva e significativa = stesso mercato.","**Test SSNIP** (monopolista ipotetico): se un ipotetico monopolista alza il prezzo del 5-10% e i profitti salgono, quello \xE8 un mercato; se i clienti passano a un altro prodotto o area, il mercato va allargato.","**Errore del cellophane** (USA, 1956): la Du Pont fu assolta perch\xE9 nel mercato venne inclusa anche la carta. In realt\xE0 aveva il monopolio del cellophane."]},{title:"Misure di concentrazione",points:["**CN** = somma delle quote delle prime n imprese. Pro: pochi dati, facile. Contro: non dice cosa succede dopo le prime n.","**HH** (Herfindahl-Hirschman) = somma dei **quadrati** delle quote di tutte le imprese. Il quadrato fa pesare di pi\xF9 le grandi. Massimo **1** (monopolio), minimo **1/N**.","Determinanti: economie di scala, barriere all\u2019entrata, capacit\xE0 specifiche dell\u2019impresa, **ciclo di vita del prodotto** (alta in introduzione, cala nello sviluppo, stabile in maturit\xE0, risale nel declino)."],example:"Quote 0,50; 0,20; 0,15; 0,10; 0,05. C2 = 0,70. HH = 0,25 + 0,04 + 0,0225 + 0,01 + 0,0025 = 0,325."},{title:"Paradigma Struttura-Comportamenti-Performance",points:["Nasce dall\u2019insoddisfazione per la visione neoclassica: \xE8 un approccio **empirico** che lega le caratteristiche del mercato alla performance delle imprese.","Domanda e offerta determinano la **struttura** (numero e dimensione di imprese e acquirenti, barriere); la struttura influenza i **comportamenti** (prezzi, pubblicit\xE0, design, marchio), che influenzano la **performance**, che non \xE8 solo il profitto.","Le formulazioni successive aggiungono un **feedback**: chi ha performance migliori cambia domanda, offerta e struttura (Apple). Il governo pu\xF2 intervenire su ciascun blocco."]}],exercises:[{id:"u4-7-1",type:"mc",topic:"Mercato geografico",q:"Un bar a Ferrara e uno a Modena sono nello stesso mercato?",options:["No: se a Modena il caff\xE8 costa meno, lo bevo comunque a Ferrara","S\xEC: sono entrambi bar e vendono lo stesso caff\xE8","S\xEC: sono nella stessa regione e collegati dall\u2019autostrada","Dipende solo dal numero di bar presenti nelle due citt\xE0"],answer:0,explain:"Un aumento di prezzo in una localit\xE0 non sposta la domanda verso l\u2019altra."},{id:"u4-7-2",type:"mc",topic:"Mercato del prodotto",q:"Una borsa D&G da 3.100 \u20AC e una borsa qualsiasi sono nello stesso mercato?",options:["No: soddisfano bisogni diversi (status e trasporto di oggetti)","S\xEC: sono entrambe borse e quindi sostituti stretti","S\xEC, ma solo se hanno lo stesso prezzo di vendita","Dipende dal colore e dal materiale delle due borse"],answer:0,explain:"Un mercato include solo i sostituti stretti."},{id:"u4-7-3",type:"mc",topic:"Mercato del prodotto",q:"Che strumento si usa per capire se pane pugliese e coppie ferraresi sono nello stesso mercato?",options:["L\u2019elasticit\xE0 incrociata","L\u2019elasticit\xE0 al reddito","L\u2019indice HH","Il prodotto marginale"],answer:0,explain:"Se \xE8 positiva e significativa (pi\xF9 costa il pugliese, pi\xF9 coppie compro), sono nello stesso mercato."},{id:"u4-7-4",type:"mc",topic:"SSNIP",q:"Nel test SSNIP, di quanto aumenta i prezzi il monopolista ipotetico?",options:["Tra il 5 e il 10%","Del 50%","Dell\u20191%","Raddoppia il prezzo"],answer:0,explain:"Small but Significant Non-transitory Increase in Price. Se i profitti salgono, quel prodotto o area \xE8 un mercato."},{id:"u4-7-5",type:"mc",topic:"Errore del cellophane",q:"In cosa consiste l\u2019errore del cellophane?",options:["La Du Pont fu assolta per un mercato definito troppo ampio","La Du Pont fu condannata anche se il cellophane aveva molti sostituti","Il cellophane si rivel\xF2 un bene inferiore e la domanda croll\xF2","Il mercato fu definito troppo stretto, escludendo la carta"],answer:0,explain:"In realt\xE0 i clienti preferivano il cellophane anche quando il prezzo saliva: era un monopolio non riconosciuto."},{id:"u4-7-6",type:"num",topic:"Indice HH",q:"Quote di mercato: 0,50; 0,20; 0,15; 0,10; 0,05. Calcola l\u2019indice HH (tre decimali).",answer:.325,tol:.001,explain:"0,25 + 0,04 + 0,0225 + 0,01 + 0,0025 = 0,325."},{id:"u4-7-7",type:"num
